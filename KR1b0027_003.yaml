body:
  text: 書集傳纂疏卷三元陳櫟撰朱子訂定蔡氏集傳商書契始封商湯因以為有天下之號書凡十七篇纂疏史記帝嚳生契為唐虞司徒封於商賜姓子氏十三世生湯在位十三年夀百嵗國號商盤庚遷殷以後號殷湯誓湯號也或曰諡湯名履姓子氏夏桀暴虐湯往征之亳衆憚於征役故湯諭以弔伐之意蓋師興之時而誓於亳都者也今文古文皆有纂疏湯武固是反之但細觀其書湯反之之功恐更細密如湯誓與牧誓數桀紂之罪辭氣亦不同史記但書湯放桀而死書武王則曰斬紂頭懸之白旗又曰湯有慙德武王亦無此意王曰格爾衆庶悉聽朕言非台小子敢行稱亂有夏多罪天命殛之王曰者史臣追述之稱也格至台我稱舉也以人事言之則臣伐君可謂亂矣以天命言之則所謂天吏非稱亂也纂疏張氏曰天命殛之豈諄諄然命之乎天以天下之心為心古之論天者多以民心卜之為林氏曰非天吏而伐有罪猶不為士師而擅殺人也天吏而不伐有罪猶為士師而故縱罪人也今爾有衆汝曰我后不恤我衆舍我穡事而割正夏豫惟聞汝衆言夏氏有罪豫畏上帝不敢不正穡刈穫也割斷也亳邑之民安於湯之德政桀之虐熖所不及故不知夏氏之罪而憚伐桀之勞反謂湯不恤亳邑之衆舍我刈穫之事而斷正有夏湯言我亦聞汝衆論如此然夏桀暴虐天命殛之我畏上帝不敢不往正其罪也纂疏吕氏曰曰舍我穡事湯之伐桀不因民願乎曰亳民之不願而夏民之願也愚謂湯之興順乎天而應乎人此一莭見商民以一己為心湯則以上天為心蓋是時夏之天命己絶湯所以順乎天也今汝其曰夏罪其如台夏王率遏衆力率割夏邑有衆率怠弗協曰時日曷喪豫及汝皆亡夏德苦茲今朕必往遏絶也割劓割夏邑之割時是也湯又舉商衆言桀雖暴虐其如我何湯又應之曰夏王率為重役以窮民力嚴刑以殘民生民厭夏德亦率皆怠於奉上不和於國疾視其君指日而曰是日何時而亡乎若亡則吾寧與之俱亡蓋苦桀之虐而欲其亡之甚也桀之惡德如此今我之所以必往也桀嘗自言吾有天下如天之有日日亡吾乃亡耳故民因以日目之纂疏吕氏曰夏罪其如台是夏民在塗炭而商民自在春風和氣中也愚謂此一莭見商民以一國為心湯則以天下為心蓋是時夏之人心已離湯所以應乎人也爾尚輔豫一人致天之罰豫其大賚汝爾無不信朕不食言爾不從誓言豫則孥戮汝罔有攸赦賚與也食言言已出而反吞之也禹之征苖止曰爾尚一乃心力其克有勳至啓則曰用命賞于祖不用命戮于社豫則孥戮汝此又益以朕不食言罔有攸赦亦可以觀世變矣纂疏愚謂天生民而立之君使司牧之今桀虐其民民欲其速亡如此人心所歸即天命所屬人心所離即天命所棄也天命湯伐之湯敢違天乎湯之誓師拳拳惟以天言曰天命殛之曰豫畏上帝曰致天之罰非湯伐之天伐之也湯曰豫畏上帝不敢不正武王曰豫弗順天厥罪惟均其心一也堯舜之授受禹啓之傳繼湯武之征伐事雖不同其順乎天適乎時合乎義一而已矣仲虺之誥仲虺臣名奚仲之後為湯左相誥告也周禮士師以五戒先後刑罰一曰誓用之於軍旅二曰誥用之於會同以喻衆也此但告湯而亦謂之誥者唐孔氏謂仲虺亦必對衆而言蓋非特釋湯之慙而且以曉其臣民衆庶也古文有今文無纂疏問仲虺之誥似未見其釋湯慙德處曰正是解他云若苖有莠若粟有秕他緣何道這幾句蓋謂湯若不除桀則桀必殺湯如説推亡固存處自是説伐桀至德日新以下乃是勉湯又如天乃錫王勇智他特地説他勇智兩字便可見尚書多不可曉固難理會然這般處古人如何説得恁地好如今人做時文相似成湯放桀于南巢惟有慙德曰豫恐來世以台為口實武功成故曰成湯南巢地名廬江六縣有居巢城桀奔于此因以放之也湯之伐桀雖順天應人然承堯舜禹授受之後於心終有所不安故愧其德之不古若而又恐天下後世藉以為口實也陳氏曰堯舜以天下讓後世好名之士猶有不知而慕之者湯武征伐而得天下後世嗜利之人安得不以為口實哉此湯之所以恐也歟纂疏鄭氏曰必往之師以救生人口實之慙以慮後世吕氏曰此心之慙此誥之釋皆不可少也愚謂觀湯之慙湯之本心見矣蓋以居萬世君臣之始變也仲虺釋其慙始則美之乂慮其愧心既釋驕心或生故終復警之大臣之引君當道如此仲虺乃作誥曰嗚呼惟天生民有欲無主乃亂惟天生聰明時乂有夏昏德民墜塗炭天乃錫王勇智表正萬邦纘禹舊服茲率厥典奉若天命仲虺恐湯憂愧不已乃作誥以解釋其意歎息言民生有耳目口鼻愛惡之欲無主則爭且亂矣天生聰明所以為之主而治其爭亂者也墜陷也塗泥炭火也桀為民主而反行昏亂陷民於塗炭既失其所以為主矣然民不可以無主也故天錫湯以勇智之德勇足以有為智足以有謀非勇智則不能成天下之大業也表正者表正於此而影直於彼也天錫湯以勇智者所以使其表正萬邦而繼禹舊所服行也此但率循其典常以奉順乎天而已天者典常之理所自出而典常者禹之所服行者也湯革夏而纘舊服武革商而政由舊孔子所謂百世可知者正以是也林氏曰齊宣王問孟子曰湯放桀武王伐紂有諸孟子曰賊仁者謂之賊賊義者謂之殘殘賊之人謂之一夫聞誅一夫紂矣未聞弒君也夫立之君者懼民之殘賊而無以主之為之主而自殘賊焉則君之實喪矣非一夫而何孟子之言則仲虺之意也纂疏王氏曰經言智仁勇或言仁智勇未見先勇者蓋成大功定大業必以智勇智之所以行者勇也故先勇後智吕氏曰以湯勇智如此惟循常行之理而已真氏曰湯之伐桀自謂不幸而處變故有慙德仲虺解之曰此特循常道以順天命而已蓋變而不失其正即所謂常也陳氏傳良曰非但釋湯之慙亦進德戒滿之書愚謂凡湯之表正纘率乃所以奉若天命也何慙之有此以天之生湯者釋之以見湯之順乎天也禹有典則貽子孫纘禹舊服即云茲率厥典典指為禹之典章亦通孔氏云循其典法祖宗之服行典章不肖之子孫失墜之而異伐之聖賢興復之往往而然夏王有罪矯誣上天以布命于下帝用不臧式商受命用爽厥師矯與矯制之矯同誣罔臧善式用爽明師衆也天以形體言帝以主宰言桀知民心不從矯詐誣枉託天以惑其衆天用不善其所為用使有商受命用使昭明其衆庶也王氏曰夏有昏德則衆從而昏商有明德則衆從而眀吳氏曰用爽厥師續下文簡賢附勢意不相貫疑有脫誤簡賢附勢實繁有徒肇我邦于有夏若苖之有莠若粟之有秕小大戰戰罔不懼于非辜矧豫之德言足聽聞簡略繁多肇始也戰戰恐懼貌言簡賢附勢之人同惡相濟實多徒衆肇我邦于有夏為桀所惡欲見剪除如苖之有莠如粟之有秕鋤治簸揚有必不相容之勢商衆小大震恐無不懼陷于非罪况湯之德言則足人之聽聞尤桀所忌疾者乎以苗粟喻桀以莠秕喻湯特言其不容於桀而迹之危如此史記言桀囚湯於夏臺湯之危屢矣無道而惡有道勢之必至也纂疏陳氏曰德言令聞也惟王不邇聲色不殖貨利德懋懋官功懋懋賞用人惟己改過不吝克寬克仁彰信兆民邇近殖聚也不近聲色不聚貨利若未足以盡湯之德然此本原之地非純乎天德而無一毫人欲之私者不能也本原澄徹然後用人處已而莫不各得其當懋茂也繁多之意與時乃功懋哉之義同言人之懋於德者則懋之以官人之懋於功者則懋之以賞用人惟己而人之有善者無不客改過不吝而已之不善者無不改不忌能於人不吝過於己合併為公私意不立非聖人其孰能之湯之用人處己者如此而於臨民之際是以能寬能仁謂之能者寬而不失於縱仁而不失於柔易曰寬以居之仁以行之君德也君德昭著而孚信於天下矣湯之德足人聽聞者如此纂疏葛氏曰君子小人之進退係於君心之正邪君心惑於聲色則便辟之臣進貪於貨利則聚斂之臣進有功德者官賞何由及之不邇不殖乃懋德懋功之根本也孔氏曰勉於德者則勉之以官愚謂用人惟己用人惟出於己也惟不邇不殖則君心清明權自已出否則以色貨進者得撓其權矣寬居仁行之君德乃德言足聽聞之實也六經言仁自克寬克仁始遂開萬世言仁之端仁以心德之體言則仁為體寬為用以愛之用言則寬以容人仁以愛人皆用也德莫大於仁湯之克仁實自不邇殖之無私欲始德懋至兆民根本皆自不邇不殖來乃葛伯仇餉初征自葛東征西夷怨南征北狄怨曰奚獨後豫攸徂之民室家相慶曰徯豫后后來其蘇民之戴商厥惟舊哉葛國名伯爵也餉饋也仇餉與餉者為仇也葛伯不祀湯使問之曰無以供粢盛湯使亳衆往耕老弱饋餉葛伯殺其童子湯遂征之湯征自葛始也奚何徯待也蘇復生也西夷北狄言逺者如此則近者可知也湯師之未加者則怨望其來曰何獨後豫其所往伐者則妻孥相慶曰待我后久矣后來我其復生乎他國之民皆以湯為我君而望其來者如此天下之愛戴歸往於商者非一日矣商業之興蓋不在於鳴條之役也吕氏曰夏商之際君臣易位天下之大變然觀其征伐之時唐虞都俞揖遜氣象依然若存蓋堯舜禹湯以道相傳世雖降而道不降也纂疏吕氏曰後世師之所至荆棘生焉湯師所至民皆欣欣蓋弔民伐罪布其寬仁如旱餘時雨所至則蘇也愚謂民之戴商如此何慙之有此以民之歸湯者釋之以見湯之應乎人也佑賢輔德顯忠遂良兼弱攻昧取亂侮亡推亡固存邦乃其昌前既釋湯之慙此下因以勸勉之也諸侯之賢德者佑之輔之忠良者顯之遂之所以善善也侮説文曰傷也諸侯之弱者兼之昧者攻之亂者取之亡者傷之所以惡惡也言善則由大以及小言惡則由小以及大推亡者兼攻取侮也固存者佑輔顯遂也推彼之所以亡固我之所以存邦國乃其昌矣纂疏林氏曰天之生物必因其材而篤焉栽者培之傾者覆之天道之自然也佑輔顯遂為善者必為人所助也兼攻取侮為不善者必為人所侵也聖人因常理以應世有亡之道則推而亡之傾覆之義也有存之道則輔而固之栽培之義也桀有亡道湯因其將亡而推之何容心哉德日新萬邦惟懷志自滿九族乃離王懋昭大德建中于民以義制事以禮制心垂裕後昆豫聞曰能自得師者王謂人莫已若者亡好問則裕自用則小德日新者日新其德而不自已也志自滿者反是湯之盤銘曰苟日新日日新又日新其廣日新之義歟德日新則萬邦雖廣而無不懷志自滿則九族雖親而亦離萬邦舉逺以見近也九族舉親以見踈也王其勉眀大德立中道於天下中者天下之所同有也然非君建之則民不能以自中而禮義者所以建中者也義者心之裁制禮者理之節文以義制事則事得其宜以禮制心則心得其正內外合德而中道立矣如此則非特有以建中於民而垂諸後世者亦綽乎有餘裕矣然是道也必學焉而後至故又舉古人之言以為隆師好問則德尊而業廣自賢自用者反是謂之自得師者真知已之不足人之有餘委心聽順而無拂逆之謂也孟子曰湯之於伊尹學焉而後臣之故不勞而王其湯之所以自得者歟仲虺言懷諸侯之道推而至於修德檢身又推而至於能自得師夫自天子至於庶人未有捨師而能成者雖生知之聖亦必有師焉後世之不如古非特世道之降抑亦師道之不明也仲虺之論遡流而源要其極而歸諸能自得師之一語其可為帝王之大法也歟纂疏問禮義本諸人心中人以下為氣稟物欲所拘蔽須以禮義自治若湯尚何須以義制事以禮制心曰湯武反之也是有些子不那底了但他能恁地所以為湯若不恁地便是惟聖罔念作狂聖人雖説生知安行便只是常常恁地不已所以不可及若有一息不恁地便也是凡人了問舜由仁義行便是不操而自存否曰這都難説舜只是不似衆人恁地著心自是操此是內外交相養之法事在外義由內制心在內禮由外作唐氏曰聖人德貴於日新故繼以懋昭大德以義以禮所以日新其德也范氏祖禹曰神宗在東宫王陶講志自滿九族乃離神宗言九族乃離微子之去是也陳氏大猷曰德不大則梏於偏如夷清惠和各有偏之弊何以建中湯德本大又欲其懋昭之然後能建中以範斯民所謂皇建其有極也以義制事則行於外者合宜乃大德之所自行中之用也以禮制心則存於內者合理乃大德之所自出中之本也禮義之澤傳之無窮所以垂裕於後嗣也愚謂德與中皆當兼體用而言德即人所得於天以具衆理而應萬事者也大德云者全體大用無非大也懋勉以昭明之則全體呈露妙用顯行矣由是而建中道之標凖使民之罔中者皆惟我之中則不偏不倚無過不及是中體用無不備矣然禮義德也即昭德建中之要也動而以義制事即義以方外之謂能義以方外則此德應萬事之大用以行而此中無過不及之用在是矣靜而以禮制心即敬以直內之謂能敬以直內則此德具衆理之全體以立而此中不偏不倚之體在是矣所謂垂裕固禮義之餘用也亦即昭德建中之餘用也非昭德專以建中於民而禮義專以垂裕於後也陳氏經曰自得師如自明自強不因乎人尊德樂道出於中心之自然也當味自字謂人莫已若與自用則小承志自滿而言以為戒也嗚呼慎厥終惟其始殖有禮覆昏暴欽崇天道永保天命上文既勸勉之於是歎息言謹其終之道惟於其始圖之始之不謹而能謹終者未之有也伊尹亦言謹終于始事雖不同而理則一也欽崇者敬畏尊奉之意有禮者封殖之昏暴者覆亡之天之道也欽崇乎天道則永保其天命矣案仲虺之誥其大意有三先言天立君之意桀逆天命而天之命湯者不可辭次言湯德足以得民而民之歸湯者非一日末言為君艱難之道人心離合之機天道福善禍淫之可畏以明今之受夏非以利己乃有無窮之恤以深慰湯而釋其慙仲虺之忠愛可謂至矣然湯之所慙恐來世以為口實者仲虺終不敢謂無也君臣之分其可畏如此哉纂疏陳氏大猷曰仲虺慮君恃功業而驕故欲其謹終惟在如其始耳非方戒其謹始也王氏十朋曰殖禮覆暴即上文佑輔取侮之事或曰湯豈昏暴者亦虞廷以傲虐戒舜之意愚謂推亡固存與殖禮覆暴同一栽培傾覆之理特有人已之分推亡固存欲湯審此理以施之人殖禮覆暴欲湯審此理而謹諸已也湯誥湯伐夏歸亳諸侯率職來朝湯作誥以與天下更始今文無古文有王歸自克夏至于亳誕告萬方誔大也亳湯所都在宋州穀熟縣王曰嗟爾萬方有衆明聽豫一人誥惟皇上帝降衷于下民若有恆性克綏厥猷惟后皇大衷中若順也天之降命而具仁義禮智信之理無所偏倚所謂衷也人之稟命而得仁義禮智信之理與心俱生所謂性也猷道也由其理之自然而有仁義禮智信之行所謂道也以降衷而言則無有偏倚順其自然固有常性矣以稟受而言則不無清濁純雜之異故必待君師之職而後能使之安於其道也故曰克綏厥猷惟后夫天生民有欲以情言也上帝降衷於下民以性言也仲虺即情以言人之欲成湯原性以明人之善聖賢之論互相發明然其意則皆言君道之係於天下者如此之重也纂疏降衷孔氏以為降善無意思衷不是善只是中與民受天地之中一般衷字是箇無過不及恰好底道理天之生物箇箇有一精當恰好底道理此與程子所謂天然自有之中劉子所謂民受天地之中相似有物有則則字却似衷字衷只是中今人言折衷者蓋以是為凖則而取正也詩書所説便是有箇人在上恁地分付如帝乃震怒之類然這箇衷只是理如此天下莫尊於理故以帝名之降衷便是箇主宰意如惟皇上帝降衷于下民天道福善禍淫却自分明有箇人在裏主宰相似左氏曰始終衷皆舉之又曰衷甲以見看此衷字義本是衷甲以見之義為其在衷而當中也然中字大槩因無過不及而立名如六藝折衷於夫子蓋是折兩頭而取其中之義以衷為善却説得未親切自天而言謂之降衷自人受此中而言謂之性如云天所賦為命人所受為性命便是那降字上帝降衷于民此據天所賦於物而言若有恆性此據民所受而言克綏厥猷惟后猷即道也道者性之發用處能安其道者惟后也孔氏曰衷善也順人有常之性能安立其道教則惟為君之道林氏曰天能降衷于民不能使民保其常性而勿失故立之君而付以立教之任師曠曰天生民而立之君使司牧之勿使失性謂勿使失其所降之衷也民既有降衷之性至於順其固有之性以安其所謂道者是乃君之事吕氏曰上帝降衷天命之謂性也若有恆性率性之謂道也克綏厥猷修道之謂教也真氏曰成湯此言可謂知君師之職矣天能與人以至善之性而不能使之全其性能使人全其性者君師之任也天之降於人者初無智愚之間人受於天清濁純駁隨其所稟有不同焉必賴君師順其有常之性而開導之性本至善因而教焉是之謂順使其本惡而強教以善是逆之也非順也觀若之一言人性之善可知矣猷即率性之道也以體言曰性以用言曰道順其性使安其道非君不能何謂安父安於慈子安於孝之類知其當然而不可易與其自然而不容已然後為安湯有天下之初即以此自任厥後秉彛受中之言相繼而發至於孔孟性善之理益明而開萬世性學之源則自湯始又曰蔡氏説若有恆性與諸説異恐未安愚按六經言性實始於此中庸言命性道教其淵源蓋出於此諸家解若有恆性一句俱屬下文以為皆君之事蔡氏獨屬之上文以為人性自然之天降衷之初順其自然本有此恆性也特氣稟不齊率性而行之或不能安於其道耳若字本輕説克字方重説天賦人受順其自然本有恆性此時君不必用力於其間也至於修道之教使人各安其道方有賴於君焉諸解以惟后對惟皇上帝作兩股説蔡氏以帝降民性后綏作三股説豈民本無恆性必待君順其恆性而後方有此性耶此章蔡説最優真氏議之過矣夏王滅德作威以敷虐于爾萬方百姓爾萬方百姓罹其凶害弗忍荼毒並告無辜于上下神祇天道福善禍淫降災于夏以彰厥罪言桀無有仁愛但為殺戮天下被其凶害如荼之苦如毒之螫不可堪忍稱寃於天地鬼神以冀其拯已屈原口人窮則反本故勞苦倦極未嘗不呼天也天之道善者福之淫者禍之桀既淫虐故天降災以明其罪意當時必有災異之事如周語所謂伊洛竭而夏亡之類纂疏福善禍淫自是道理當如此問或有不如此者何也曰福善禍淫常理也不如此是失其常理天莫之為而為天亦何嘗有意只是理自是如此且如冬寒夏熱此是常理當如此若冬熱夏寒便是失其常理近年徑山嘗六七月雨雪肆台小子將天命明威弗敢赦敢用玄牡敢昭告于上天神后請罪有夏聿求元聖與之勠力以與爾有衆請命肆故也故我小子奉將天命明威不敢赦桀之罪也玄牡夏尚黑未變其禮也神后后土也聿遂也元聖伊尹也上天孚佑下民罪人黜伏天命弗僭賁若草木兆民允殖孚允皆信也僭差也賁文之著也殖生也上天信佑下民故夏桀竄亡而屈服天命無所僭差燦然若草木之敷榮兆民信乎其生殖矣纂疏愚謂天命弗僭賁若草木如語譬諸草木區以别矣之意兆民允殖與罪人黜伏相應罪人黜伏則兆民信生殖可見天命之弗僭差如草木之燦然栽培傾覆皆其自取耳俾豫一人輯寧爾邦家茲朕未知獲戾于上下栗栗危懼若將隕于深淵輯和戾罪隕墜也天使我輯寧爾邦家其付豫之重恐不足以當之未知已得罪于天地與否驚恐憂畏若將墜於深淵蓋責愈重則憂愈大也凡我造邦無從匪彞無即慆淫各守爾典以承天休夏命已黜湯命維新侯邦雖舊悉與更始故曰造邦彝法即就慆慢也匪彝指法度言慆淫指逸樂言典常也各守其典常之道以承天之休命也爾有善朕弗敢蔽罪當朕躬弗敢自赦惟簡在上帝之心其爾萬方有罪在豫一人豫一人有罪無以爾萬方簡閲也人有善不敢以不達已有罪不敢以自恕簡閲一聽於天然天以天下付之我則民之有罪實君所為君之有罪非民所致非特聖人厚於責已而薄於責人是乃理之所在君道當然也纂疏問簡閲也曰善與罪天皆知之如天檢點數過相似爾之有善也在帝心我之有惡也在帝心林氏曰罪在朕躬非必己身有可指之罪也蓋天降衷于民而以克綏厥猷付之一人為君者必使天下之人皆不失其降衷之性以安厥猷方無負於天之所付若民有罪是為君者教之不至所以自棄於愚不肖之地而莫能返非民之罪乃君之罪所以曰罪在朕躬也民有罪則君致之君有罪乃君自取夫以一人身臨四海而天下人之罪皆歸其身必使天下人皆無罪然後為能盡君之職而無負於天之所付論至此則獲戾上下亦豈難哉此所以危懼若將殞也湯誥一書多兢業之意愚謂此一節所以繳結篇首降衷有性綏猷之言林氏説得之深味所言成湯可謂知君師之職矣嗚呼尚克時忱乃亦有終忱信也歎息言庶幾能於是而忱信焉乃亦有終也吳氏曰此兼人已而言纂疏愚謂湯又歎息言尚能相與於是盡誠方亦可以有終否則未保其所終也曰尚曰乃亦皆不敢必之辭蓋兢業不敢忽之意不特湯自謂當如此欲諸侯皆如此也此篇見湯明命性之理知君師之道監夏之所以亡而凛凜於今之所以興且戒諸侯以相與盡守邦圖終之道真帝王之格言聖學之淵源也論語摘其要語自豫小子履至罪在朕躬凡十句但略於書耳伊訓訓導也太甲嗣位伊尹作書訓導之史録為篇今文無古文有纂疏商書幾篇最分曉可玩伊訓太甲等篇又好看似説命蓋髙宗資質髙傅説所説細了難看伊尹與太甲説雖粗却切於學者之身太甲也不是昏愚的人但欲敗度縱敗禮耳伊尹書及説命大抵分明易曉今人觀書且看那分明底難曉者且置之縱使曉得亦不濟事陳氏經曰此篇於欲縱未萌之初先警之惟元祀十有二月乙丑伊尹祠于先王奉嗣王祗見厥祖侯甸羣后咸在百官總已以聽冢宰伊尹乃明言烈祖之成德以訓于王夏曰嵗商曰祀周曰年一也元祀者太甲即位之元年十二月者商以建丑為正故以十二月為正也乙丑日也不繫以朔者非朔日也三代雖正朔不同然皆以寅月起數蓋朝覲會同班歷授時則以正朔行事至於紀月之數則皆以寅為首也伊姓尹字也伊尹名摰祠者告祭於廟也先王湯也冢長也禮有冢子冢婦之名周人亦謂之冢宰古者王宅憂祠祭則冢宰攝而告廟又攝而臨羣臣太甲服仲壬之喪伊尹祠於先王奉太甲以即位改元之事祗見厥祖則攝而告廟也侯服甸服之羣后咸在百官總已之職以聽冢宰則攝而臨羣臣也烈功也商頌曰衎我烈祖太甲即位改元伊尹於祠告先王之際明言湯之成德以訓太甲此史官敘事之始辭也或曰孔氏言湯崩踰月太甲即位則十二月者湯崩之年建子之月也豈改正朔而不改月數乎曰此孔氏惑於序書之文也太甲繼仲壬之後服仲壬之喪而孔氏曰湯崩奠殯而告固已誤矣至於改正朔而不改月數則於經史尤可考周建子矣而詩言四月維夏六月徂暑則寅月起數周未嘗改也秦建亥矣而史記始皇三十一年十二月更名臘曰嘉平夫臘必建丑月也秦以亥正則臘為三月云十二月者則寅月起數秦未嘗改也至三十七年書十月癸丑始皇出遊十一月行至雲夢繼書七月丙寅始皇崩九月葬酈山先書十月十一月而繼書七月九月者知其以十月為正朔而寅月起數未嘗改也且秦史制書謂改年始朝賀皆自十月朔夫秦繼周者也若改月數則周之十月為建酉月矣安在其為建亥乎漢初史氏所書舊例也漢仍秦正亦書曰元年冬十月則正朔改而月數不改亦已明矣且經曰元祀十有二月乙丑則是以十二月為正朔而改元何疑乎惟其以正朔行事也故後乎此者復正厥辟亦以十二月朔奉嗣王歸于亳蓋祠告復政皆重事也故皆以正朔行之孔氏不得其説而意湯崩踰月太甲即位奠殯而告是以崩年改元矣蘇氏曰崩年改元亂世事也不容在伊尹而有之不可以不辨又案孔氏以為湯崩吳氏曰殯有朝夕之奠何為而致祠主喪者不離於殯側何待於祗見蓋太甲之為嗣王嗣仲壬而王也太甲太丁之子仲壬其叔父也嗣叔父而王而為之服三年之喪為之後者為之子也太甲既即位於仲壬之柩前方居憂於仲壬之殯側伊尹乃至商之祖廟遍祠商之先王而以立太甲告之不言太甲祠而言伊尹喪三年不祭也奉太甲遍見商之先王而獨言祗見厥祖者雖遍見先王而尤致意於湯也亦猶周公金縢之册雖遍告三王而獨眷眷於文王也湯既已祔於廟則是此書初不廢外丙仲壬之事但此書本為伊尹稱湯以訓太甲故不及外丙仲壬之事爾餘見書序纂疏孟子集注趙氏曰外丙立二年仲壬立四年程氏曰古謂嵗為年外丙方二嵗仲壬方四嵗二説未知孰是問先生兩存趙程之説曰此類且當闕之不可深究問二年四年之説如何曰書序恐經師所作亦無證不可考成湯太甲年次尤不可考不必妄為之説讀書求義理以為反身自修之具此等殊非所急也問湯方在殯宫太甲於朝夕奠常在如何伊尹因祠而見之曰此與顧命康王之誥所載冕服事同意者古人自有一件人君居喪之禮但今不存無以考據蓋天子諸侯既有天下國家事體恐難與常人一般行喪禮或曰序言太甲元年序周人所作故稱年書言惟元祀書商史所作故稱祀此元祀非即位之年乃即位之次年先王崩崩年即位踰年改元以崩年之十二月為後王元年之首月蓋以正朔行事也胡氏安國曰嗣世必於初喪緣臣民之心曠年不可無君也踰年然後改元緣始終之義一年不二君也陳氏大猷曰祠祭也先王商先祖如詩言玄王也喪三年不祭不以凶服入宗廟故太甲不親祠而尹攝祠若湯則開國之祖太甲嘗逮事故奉王親見之也吕氏曰當居喪之始而訓之乘其初心之虛也後雖昏迷而克終訓之之早故耳愚案蔡氏力主不改月數之説孟子與春秋左氏傳則不然矣詳見泰誓上曰嗚呼古有夏先后方懋厥德罔有天災山川鬼神亦莫不寧暨鳥獸魚鱉咸若于其子孫弗率皇天降災假手于我有命造攻自鳴條朕哉自亳詩曰殷監不逺在夏后之世商之所宜監者莫近於夏故首以夏事告之也率循假借也有命有天命者謂湯也桀不率循先王之道故天降災借手于我成湯以誅之夏之先后方其懋德則天之眷命如此及其子孫弗率而覆亡之禍又如此太甲不知率循成湯之德則夏桀覆亡之禍亦可監矣哉始也鳴條夏所宅也亳湯所宅也言造可攻之釁者由桀積惡於鳴條而湯德之修則始於亳都也纂疏陳氏大猷曰方者方見其進而未見其止日新而未可量也人君為天地鬼神萬物之主而德者天地鬼神萬物之理所謂致中和天地位焉萬物育焉是也吕氏曰夏先后懋德如此宜可慿藉桀才弗率天即降災感應之速反覆手耳惟我商王布昭聖武代虐以寬兆民允懷布昭敷著也聖武猶易所謂神武而不殺者湯之德威敷著于天下代桀之虐以吾之寬故天下之民信而懷之也今王嗣厥德罔不在初立愛惟親立敬惟長始于家邦終于四海初即位之初言始不可以不謹也謹始之道孝悌而已孝悌者人心之所同非必人人教詔之立植也立愛敬於此而形愛敬於彼親吾親以及人之親長吾長以及人之長始于家達于國終而措之天下矣孔子曰立愛自親始教民睦也立敬自長始教民順也嗚呼先王肇修人紀從諌弗咈先民時若居上克明為下克忠與人不求備檢身若不及以至于有萬邦茲惟艱哉人紀三綱五常孝敬之實也上文欲太甲立其愛敬故此言成湯之所修人紀者如下文所云也綱常之理未嘗泯沒桀廢棄之而湯始修復之也咈逆也先民猶前輩舊德也從諫不逆先民是順非誠於樂善者不能也居上克明言能盡臨下之道為下克忠言能盡事上之心吕氏曰湯之克忠最為難看湯放桀以臣易君豈可為忠不知湯之心最忠者也天命未去人心未離事桀之心曷嘗斯須替哉與人之善不求其備檢身之誠有若不及其處上下人已之間又如此是以德日以盛業日以廣天命歸之人心戴之由七十里而至于有萬邦也積纍之勤茲亦難矣伊尹前既言夏失天下之易此又言湯得天下之難太甲可不思所以繼之哉纂疏湯工夫全在敬字上看來大假是一箇修飭底人故當時説他做工夫處亦説得大假地著如禹克勤克儉之類却是大綱説到湯便説檢身若不及張氏曰父子兄弟君臣夫婦長幼朋友有禮義以相維謂之人紀傳曰禮義以為紀又曰紀散而衆亂賈逵曰先民古賢人也陳氏經曰湯以肇修人紀為一身之任吾身有一毫之不盡則於人紀必有一毫之虧於是不自足其足從諫求之今未已也又求之古又欲兼天下之善修人紀之道不得不然也愚謂人綱與人紀對莫大於三綱故曰人綱小者為紀綱之紀也修如修道之謂教之修品節修理之也欲太甲立愛立敬厚於人倫故以湯之修人紀繼之湯以修人紀自任於身吾身有未盡則於人紀必有虧凡於今古之善與處上下人已之間各盡其當然者皆修人紀之實也敷求哲人俾輔于爾後嗣敷廣也廣求賢哲使輔爾後嗣也纂疏孫氏曰敷求求之非一方也如云立賢無方陳氏經曰湯得天下也甚難故其廣天下也甚逺宜求賢以遺後人也制官刑警于有位曰敢有恆舞于宫酣歌于室時謂巫風敢有殉于貨色恆于遊畋時謂淫風敢有侮聖言逆忠直逺耆德比頑童時謂亂風惟茲三風十愆卿士有一于身家必喪邦君有一于身國必亡臣下不匡其刑墨具訓于蒙士官刑官府之刑也巫風者常歌常舞若巫覡然也淫過也過而無度也比昵也倒置悖理曰亂好人之所惡惡人之所好也風風化也三風愆之綱也十愆風之目也卿士諸侯十有其一已喪其家亡其國矣墨墨刑也臣下而不能匡正其君則以墨刑加之具詳悉也童蒙始學之士則詳悉以是訓之欲其入官而知所以正諫也異時太甲欲敗度縱敗禮伊尹先見其微故拳拳及此劉侍講曰墨即叔向所謂夏書昏墨賊殺臯陶之刑貪以敗官為墨纂疏臣下不匡之刑蓋施於邦君大夫之喪國亡家者君臣一體不得不然如漢廢昌邑王而誅其羣臣太祖下嶺南亦誅其亂臣龔澄樞李托之類是也吕氏曰前六愆因後四愆而生唐孔氏曰巫風二淫風四亂風四為愆十史氏仲午曰意當時太甲左右必有以歌舞貨色等惑其君者尹未明指其人姑以先王所制官刑警之後遂營桐宫不使狎于弗順焉真氏曰殉如殉葬之殉以其身陷貨色中死而不顧是也臣下所以不匡以貪官固位故也不諌之罪與貪墨同使知不獨貪賄有罪貪官不諌亦有刑也薛氏曰臣下不匡遽入墨辟無乃過乎置臣所以正主也視主入喪亡而不救其可貸乎重其刑使知進而諌未必死退而不諌必受刑則雖中不欲諫亦不得不諌也愚謂湯警有位之官刑為後嗣慮至矣三風十愆以戒卿士邦君而舉以訓太甲者意謂卿士諸侯犯此已足喪家亡國况天子乎微意見矣况不匡刑墨警臣下者欲其以是警天子也太甲他時之欲縱尸於此時已窺見其幾微故預為之戒前章述湯德以勉其善此述湯刑以防其失勉其善在啓發其愛敬之良心防其失在禁遏其欲縱之私心也嗚呼嗣王祗厥身念哉聖謨洋洋嘉言孔彰惟上帝不常作善降之百祥作不善降之百殃爾惟德罔小萬邦惟慶爾惟不德罔大墜厥宗歎息言太甲當以三風十愆之訓敬之於身念而勿忘也謨謂其謀言謂其訓洋大孔甚也言其謀訓大明不可忽也不常者去就無定也為善則降之百祥為惡則降之百殃各以類應也勿以小善而不為萬邦之慶積於小勿以小惡而為之厥宗之墜不在大蓋善必積而後成惡雖小而可懼此總結上文而又以天命人事禍福申戒之也纂疏孫氏曰聖謨嘉言即指三風十愆之戒也張氏曰不敬其身必納此身於風愆矣能敬其身則能如夏后之懋德繼先王以嗣德作善之祥惟德之慶皆自敬其身出敬立則百善從也陳氏經曰既戒以祖訓又戒以天君所當畏惟天惟祖宗耳王氏十朋曰善祥惡殃不常乃所以為常也真氏曰愆雖十能敬則十者俱泯不敬則十者俱生一敬字乃治三風砭十愆之藥石也篇將終又深歎聖言之彰明與天命之難保以警動君心真社稷之臣歟愚謂此篇尹訓太甲於即位之初始終以興亡寓勸戒夏以懋德興桀以弗率亡初意明矣繼以湯以聖武興而欲太甲以愛敬之良心嗣厥德勸之也繼言湯以艱難興而防太甲以欲縱之私心敗厥德戒之也末章作善之降祥爾德之惟慶勸之保其所以興作不善之降殃不德之墜宗戒之陷於所以亡而提綱挈領則在祗厥身之一言能祗敬具身則嗣祖德而興不祗敬其身則背祖德而亡言言忠愛蓋已豫為太甲憂矣但猶包涵未明言之未如太甲篇之痛切耳太甲上商史録伊尹告戒節次及太甲往復之辭故三篇相屬成文其間或附史臣之語以貫篇意若史家紀傳之所載也唐孔氏曰伊訓肆命徂后太甲咸有一德皆是告戒太甲不可皆名伊訓故隨事立稱也林氏曰此篇亦訓體今文無古文有纂疏伊尹之言極痛切遂感發得太甲如此伊尹之志公天下以為心而無一毫之私者也或曰上篇作於未遷桐宫之先後二篇作於自桐宫歸亳之後惟嗣王不惠于阿衡惠順也阿倚衡平也阿衡商之官名言天下之所倚平也亦曰保衡或曰伊尹之號史氏録伊尹之書先此以發之纂疏王氏曰阿大陵之有曲者保其君如阿平其國如衡蘇氏曰阿衡尹之號猶太公尚父其號也伊尹作書曰先王顧諟天之明命以承上下神祇社稷宗廟罔不祗肅天監厥德用集大命撫綏萬方惟尹躬克左右厥辟宅師肆嗣王丕承基緒顧常目在之也諟古是字明命者上天顯然之理而命之我者在天為明命在人為明德伊尹言成湯常目在是天之明命以奉天地神祇社稷宗廟無不敬肅故天視其德用集大命以有天下撫安萬邦我又身能左右成湯以居民衆故嗣王得以大承其基業也纂疏顧謂常目在之古注此語最好非謂有一物常在目前可見也只是常存此心知得有這道理光明不昧方其靜坐未接物也此理固湛然清明及其遇事而應接也此理亦隨處發見只要人常提撕省察念念不忘存養久之則是理愈明雖欲忘之而不可得矣常目在之常見得有此理子常見得孝父常見得慈今人多鶻鶻突突一似無這箇明命若常見其在前則凛凛然不敢放肆真氏曰湯惟顧天之明命故天監湯之厥德曰顧曰監可見天人之交至近而非逺也愚謂此言太甲今日之有天下由先王明德以得天命伊尹身任重以輔先王也有先王創業之祖與尹開國之大臣是以嗣王得承此大業今日豈可忘先王而不念忽尹言而不從哉惟尹躬光見于西邑夏自周有終相亦惟終其後嗣王罔克有終相亦罔終嗣王戒哉祗爾厥辟辟不辟忝厥祖夏都安邑在亳之西故曰西邑夏周忠信也國語曰忠信為周施氏曰作偽心勞日拙則缺露而不周忠信則無偽故能周而無缺夏之先王以忠信有終故其輔相者亦能有終其後夏桀不能有終故其輔相者亦不能有終嗣王其以夏桀為戒哉當敬爾所以為君之道君而不君則忝辱成湯矣太甲之意必謂伊尹足以任天下之重我雖縱欲未必遽至危亡故伊尹以相亦罔終之言深折其私而破其所恃也纂疏問古注以忠信訓周恐未安曰自周二字本不可曉吕氏曰自周如周于德之周謂君道周備無虧缺也愚案既以桀之無終戒之又以不敬而不君戒之無終則有纍於相臣不君則有辱於乃祖仍是以先王與尹躬警之也王惟庸罔念聞庸常也太甲惟若尋常於伊尹之言無所念聽此史氏之言纂疏問諸家於庸字絶句竊謂只作一句讀以庸訓用如王庸作書以告如何曰六字一句真氏曰辟不辟之言殆甚於漢人所謂帝不諦者漢君怒而誅之太甲雖無所念聽然不聞其怒也所以卒於思庸歟伊尹乃言曰先王昧爽丕顯坐以待旦旁求俊彥啓迪後人無越厥命以自覆昧晦爽明也昧爽云者欲明未明之時也丕大也顯亦明也先王於昧爽之時洗濯澡雪大明其德坐以待旦而行之也旁求者求之非一方也彥美士也言湯孜孜為善不遑寧處如此而又旁求俊彥之士以開導子孫太甲毋顛越其命以自取覆亡也慎乃儉德惟懷永圖太甲欲敗度縱敗禮蓋奢侈失之而無長逺之慮者伊尹言當謹其儉約之德惟懷永久之謀以約失之者鮮矣此太甲受病之處故伊尹特言之纂疏真氏曰此太甲不惠時也故訓之如此儉則心小而為慮逺侈則心大而為謀踈是時太甲方以欲敗度縱敗禮心為二者所蔽若浮雲之翳日月未知斯言之為忠也一旦處仁遷義而本心復明然後知受病之源端在於此愚謂永圖即前所謂有終也若虞機張往省括于度則釋欽厥止率乃祖攸行惟朕以懌萬世有辭虞虞人也機弩牙也括矢括也度法度射者之所凖望者也釋發也言若虞人之射弩機既張必往察其括之合於法度然後發之則發無不中矣欽者肅恭收斂止見虞書率循也欽厥止者所以立本率乃祖者所以致用所謂省括于度則釋也王能如是則動無過舉近可以慰恱尹心逺可以有舉於後世矣安汝止者聖君之事生而知者也欽厥止者賢君之事學而知者也纂疏唐孔氏曰括矢末也陳氏大猷曰言欲永終當謹始發也萬事莫不有度君所以為度在敬汝所當止如君止於仁子止於孝之類萬世有辭所謂永圖也愚謂商人尚敬敬不特商一代之家法實萬世相傳之心法湯所以聖敬也太甲所以欲縱不敬也故尹之訓拳拳於敬罔不祗肅湯之敬也欽厥止率祖攸行勉太甲盡敬以法先王也萬世譽之即有終于永圖也曰有終曰永圖曰萬世有辭勸之也曰罔克有終曰自覆戒之也此章仍是以先王始之以尹躬結之王能謹慎欽敬而有終先王之望尹躬之幸也王不謹慎欽敬而自覆非先王之望尹躬之責不盡也尹本自任以天下之重又受先王託孤之重任故告戒之辭節節提起先王而以尹躬相關係對言之忠誠懇切可謂極矣王未克變不能變其舊習也此亦史氏之言伊尹曰茲乃不義習與性成豫弗狎于弗順營于桐宫密邇先王其訓無俾世迷狎習也弗順者不順義理之人也桐成湯墓陵之地伊尹指太甲所為乃不義之事習惡而性成者也我不可使其狎習不順義理之人於是營宫于桐使親近成湯之墓朝夕哀思興起其善以是訓之無使終身迷惑而不悟也纂疏陳氏經曰性本無惡特習為不義為習所勝若與性俱成賈誼曰少成若天性習慣如自然王徂桐宫居憂克終允德徂往允信也有諸已之謂信實有其德於身也凡人之不善必有從臾以導其為非者太甲桐宫之居伊尹欲使其密邇先王陵墓以興發其善心又絶其比昵之黨而革其污染此其所以克終允德也次篇伊尹言嗣王克終厥德又曰允德協于下故史氏言克終允德結此篇以發次篇之意纂疏愚謂伊尹此舉蓋處君臣之變者身任先王託孤之重深軫宗社顛覆之憂知太甲之性不過中人平日誘以為惡之近習必多而輔以善之大臣尹之外無聞焉孤忠不能勝引誘之衆徒言不能開迷惑之久遂營桐宫以居之如見先王之在前而無羣小之在側善心油然以生而污習脫然以除此不言之教逹變之權惟自任以天下之重如尹之開國元老大忠至公者能之而非泛然之大臣所敢為也又案千古性學開端於若有恆性之一言其次則習與性成之言也恆性以天地之性言與性成以氣質之性言孟子性善之論本恆性而言也孔子性近習逺之論自習與性成而發也若有恆性本有善而無惡惟習於惡而後性流於惡其既流也性若成矣然能謹所習而習於善則善反之而天地之性存焉此太甲所以終允德也天地之性氣質之性雖至橫渠張氏始剖判言之已肇端於湯尹言性之初矣董氏鼎曰伊尹初述侮聖言逆忠直逺耆德比頑童之戒太甲猶不惠阿衡狎于弗順亂風尚存焉非尹果敢逹權為遷桐之舉使人動心忍性增益不能嗚呼危哉太甲中惟三祀十有二月朔伊尹以冕服奉嗣王歸于亳太甲終喪明年之正朔也冕冠也唐孔氏曰周禮天子六冕備物盡文惟衮冕耳此蓋衮冕之服義或然也奉迎也喪既除以衮冕吉服奉迎以歸也作書曰民非后罔克胥匡以生后非民罔以辟四方皇天眷佑有商俾嗣王克終厥德實萬世無疆之休民非君則不能相正以生君非民則誰與為君者言民固不可無君而君尤不可失民也太甲改過之初伊尹首發此義其喜懼之意深矣夫太甲不義有若性成一旦翻然改悟是豈人力所至蓋天命眷商隂誘其衷故嗣王能終其德也向也湯緒幾墜今其自是有永豈不為萬世無疆之休乎纂疏林氏曰太甲克終伊尹力也而歸之天者君子能致人於悔過遷善之地不能必其人有悔過遷善之心尹嘗五就桀矣即其感悟太甲者觀之於桀必盡其忠誠而桀終不改則太甲悔悟庸非天乎湯宜有餘慶故太甲為之孫始皇宜有餘殃故扶蘇為之子天也陳氏經曰若人事不盡而一切諉之天書不作桐宫不營而謂太甲不明天實為之則非聖賢以人合天以義合命之道矣吕氏曰使太甲不改事將若何今既克終喜慰何如哉玩味實字可見愚謂克終允德即前篇望其有終者也萬世無疆之休即前篇望其萬世有辭者也前願之而未得今得遂其所願向也湯緒幾覆今也祚可靈長先王之望遂矣伊尹之責塞矣烏得不因其遷善之一初而許與期望之於悠久哉王拜手稽首曰豫小子不明于德自砥不類欲敗度縱敗禮以速戾于厥躬天作孽猶可違自作孽不可逭既往背師保之訓弗克于厥初尚賴匡救之德圖惟厥終拜手首至手也稽首首至地也太甲致敬於師保其禮如此不類猶不肖也多欲則興作而亂法度縱肆則放蕩而隳禮儀度就事言之也禮就身言之也速召之急也戾罪孽災逭逃也既往已往也已往既不信伊尹之言不能謹之于始庶幾正救之力以圖惟其終也當太甲不惠阿衡之時伊尹之言惟恐太甲不聽及太甲改過之後太甲之心惟恐伊尹不言夫太甲固困而知之者然昔之迷今之復昔之晦今之明如日月昏蝕一復其舊而光采炫耀萬景俱新湯武不可及已豈居成王之下乎纂疏愚謂伊尹雖謂太甲克終厥德太甲不敢自保方賴伊尹正救以圖終焉伊尹拜手稽首曰修厥身允德協于下惟明后伊尹致敬以復太甲也修身則無敗度敗禮之事允德則有誠身誠意之實德成於上協和于下惟明后然也纂疏愚謂惟明后與不明于德相應太甲自謂不明于德尹遂以修身協下而為明后許與期望之修身本諸身也允德協下徴諸庶民也誠實之德孚於人心修身之驗也先王子惠困窮民服厥命罔有不恱並其有邦厥鄰乃曰徯我后后來無罰此言湯德所以協下者困窮之民若已子而惠愛之惠之若子則心之愛者誠矣未有誠而不動者也故民服其命無有不得其歡心當時諸侯並湯而有國者其鄰國之民乃以湯為我君曰待我君我君來其無罰乎言除其邪虐湯之得民心也如此即仲虺后來其蘇之事王懋乃德視乃烈祖無時豫怠湯之盤銘曰苟日新日日新又日新湯之所以懋其德者如此太甲亦當勉於其德視烈祖之所為不可頃刻而逸豫怠惰也奉先思孝接下思恭視逺惟明聽德惟聰朕承王之休無斁思孝則不敢違其祖思恭則不敢忽其臣惟亦思也思明則所視者逺而不蔽於淺近思聰則所聽者德而不惑於憸邪此懋德之所從事者太甲能是則我承王之美而無所厭斁也纂疏視聽是物聰明是則視不為惡色所蔽為明聽不為姦人所欺為聰陳氏大猷曰孝恭聰明懋德之目人君修德必就受病處藥之太甲前日覆湯典刑不惠阿衡由不思孝思恭也既立不明背棄師訓由視溺於近聽惑於邪也今盡此四者病去而德成矣尹恥君不及堯舜太甲德成尹責始盡是承王美於無窮也愚謂伊尹提起先王子惠而勉以視乃厥祖然後以朕承王休結之仍是以先王尹躬對言以警動期望之也訓惟為思似不必然太甲下伊尹申誥于王曰嗚呼惟天無親克敬惟親民罔常懷懷于有仁鬼神無常享享于克誠天位艱哉申誥重誥也天之所親民之所懷鬼神之所享皆不常也惟克敬有仁克誠而後天親之民懷之鬼神享之也曰敬曰仁曰誠者各因所主而言天謂之敬者天者理之所在動靜語默不可有一毫之慢民謂之仁者民非元后何戴鰥寡孤獨皆人君所當恤鬼神謂之誠者不誠無物誠立於此而後神格於彼三者所當盡如此人君居天之位其可易而為之哉分而言之則三合而言之一德而已太甲遷善未幾而伊尹以是告之其才固有大過人者歟纂疏真氏曰敬仁誠並言始於此三者堯舜禹湯之正傳也吕氏曰君必上得天心下得民心幽得鬼神之心始可以當天位天位所以惟艱也德惟治否德亂與治同道罔不興與亂同事罔不亡終始慎厥與惟明明后德者合敬仁誠之稱也有是德則治無是德則亂治固古人有行之者矣亂亦古人有行之者也與古之治者同道則無不興與古之亂者同事則無不亡治而謂之道者蓋治因時制宜或損或益事未必同而道則同也亂而謂之事者亡國喪家不過貨色逰畋作威殺戮等事事同道無不同也治亂之分顧所與如何耳始而與治固可以興終而與亂則亡亦至矣謹其所與終始如一惟明明之君為然也上篇言惟明后此篇言惟明明后蓋明其所已明而進乎前者矣纂疏真氏曰道指全體而言如堯舜之仁湯武之義是也事指一事而言如太康畋逰桀紂暴虐之類是也必同道乃興宋襄以不禽二毛自比文王不知一事之同而他事之不副其能興乎苟同事必亡三風十愆或有其一無不亡者興之難而亡之易如此斯天位所以艱歟夏氏曰終始與治同道而不與亂同事愚謂此因賴匡救圖厥終之言而進圖終之道也圖終在常不變其始而已終始慎其所與則不特初心之明而為明后且悠久常保此初心之明而為明明后矣尹慮太甲怨艾於初而轉移於終故言此先王惟時懋敬厥德克配上帝今王嗣有令緒尚監茲哉敬即克敬惟親之敬舉其一以包其二也成湯勉敬其德德與天合故克配上帝今王嗣有令緒庶幾其監視此也纂疏愚謂此欲太甲與湯之治同道也若升髙必自下若陟遐必自邇此告以進德之序也中庸論君子之道亦謂譬如行逺必自邇譬如登髙必自卑進德修業之喻未有如此之切者吕氏曰自此乃伊尹畫一以告太甲也纂疏愚謂觀法先王豈一蹴能至自下自邇欲其希聖進德之有序也無輕民事惟難無安厥位惟危無毋通毋輕民事而思其難毋安君位而思其危慎終于始人情孰不欲善終者特安於縱欲以為今日姑若是而他日固改之也然始而不善而能善其終者寡矣桐宫之事往已今其即政臨民亦事之一初也有言逆于汝心必求諸道有言遜于汝志必求諸非道鯁直之言人所難受巽順之言人所易從於其所難受者必求諸道不可遽以逆于心而拒之於其所易從者必求諸非道不可遽以遜于志而聽之以上五事蓋欲太甲矯乎情之偏也纂疏林氏曰欲謹其終必於其始謹之愚謂前言終始慎厥與則慎終為重此言慎終于始則謹始為重固當謹終而常如其始圖終尤當先善其始也陳氏大猷曰忘其言之逆順而揆諸道之當否合道則逆者乃所以為遜非道則遜者乃所以為逆前日欲縱之時尹之言固嘗逆心而臣下之言固嘗有遜志者矣故復以為戒嗚呼弗慮胡獲弗為胡成一人元良萬邦以貞胡何也弗慮何得欲其謹思之也弗為何成欲其篤行之也元大良善貞正也一人者萬邦之儀表一人元良則萬邦以正矣君罔以辨言亂舊政臣罔以寵利居成功邦其永孚于休弗思弗為安於縱弛先王之法廢矣能思能為作其聰明先王之法亂矣亂之為害甚於廢也成功非寵利之所可居者至是太甲德已進伊尹有退休之志矣此咸有一德之所以繼作也君臣各盡其道邦國永信其休美也吳氏曰上篇稱嗣王不惠于阿衡必其言有與伊尹違背者辨言亂政或太甲所失在此罔以寵利居成功己之所自處者已素定矣下語既非泛論則上語必有為而發也纂疏林氏曰自古受託孤之寄者進退之際可謂至難為幼主者類多血氣未定志向未堅苟未能離師傅而不返則吾退而小人乘間以進必將以辨言亂舊政而貽國家之禍矣所以伊尹明告太甲而遂示以引身求退之意焉愚案老氏曰功成而不居蔡澤曰四時之序功成者去伊尹聖之任者也耕莘之初天下何與於我自幡然從湯以後則以身任責不容釋矣不幸湯崩主少不明幾覆商祚身任託孤愈不容釋矣大不得已置君于桐不容不犯臣子之至難非可諉其責於他人也觀其告戒拳拳言言忠愛必以先王尹躬對言幸而太甲悔過修德遂亟復政於君欲奉身而退尹至是上無負於先王次無負於太甲下無負於天下以身任重可以釋矣由其任重恐恐不勝之身而復還其耕莘囂囂自得之身其欣幸當如何哉此而不退寧無貪戀寵利之疑置君于桐大不獲已之本心誰白之者尹可謂自任之重自處之審矣使湯有太甲為之孫而無伊尹為之佐其不一再傳而覆者幾希尚何六百年之敢望哉董氏鼎曰伊尹作書以訓太甲方其未悟惟恐無以善始及其既悟又恐無以善終先憂而喜後喜而憂拳拳忠愛言有盡而意無窮也咸有一德伊尹致仕而去恐太甲德不純一及任用非人故作此篇亦訓體也史氏取其篇中咸有一德四字以為篇目今文無古文有纂疏愚謂一德二字實此篇之綱領伊尹既復政厥辟將告歸乃陳戒于德伊尹已還政太甲將告老而歸私邑以一德陳戒其君此史氏本序曰嗚呼天難諶命靡常常厥德保厥位厥德靡常九有以亡諶信也天之難信以其命之不常也然天命雖不常而常於有德者君德有常則天命亦常而保厥位矣君德不常則天命亦不常而九有以亡矣九有九州也纂疏愚謂一者無雜無息一可以包常常則一之無間斷者也惟純而不雜所以久而不息夏王弗克庸德慢神虐民皇天弗保監于萬方啓迪有命眷求一德俾作神主惟尹躬暨湯咸有一德克享天心受天明命以有九有之師爰革夏正上文言天命無常惟有德則可常於是引桀之所以失天命湯之所以得天命者證之一德純一之德不雜不息之義即上文所謂常德也神主百神之主享當也湯之君臣皆有一德故能上當天心受天明命而有天下於是改夏建寅之正而為建丑正也纂疏庸常也或曰用也張氏曰君為神民之主詩曰百神爾主矣言神主則民主可知多方曰天惟時求民主言民主則神主可知愚謂臣當先君後已善則稱君今日尹躬暨湯則臣先君曰咸有一德則臣儕於君何也蓋元聖之在湯學焉而後臣天生齊聖之湯又生元聖之尹君臣同德聖聖相逢非泛然君臣比也又何區區形迹之嫌哉林氏曰革正朔古未嘗有蓋始於湯而武王因之仲舒謂舜紹堯改正朔未詳是否非天私我有商惟天佑于一德非商求于下民惟民歸于一德上言一德故得天得民此言天佑民歸皆以一德之故蓋反覆言之德惟一動罔不吉德二三動罔不凶惟吉凶不僭在人惟天降災祥在德二三則雜矣德之純則無往而不吉德而雜則無往而不凶僭差也惟吉凶不差在人者惟天之降災祥在德故也纂疏陳氏大猷曰德純乎天理本一而已人欲之私間之一者始二三矣吕氏曰一則動皆合理故無不吉二三則動皆悖理故凶林氏曰降於天者為災祥受於人者為吉凶愚謂在人在德不過分天人平説吉凶不差在人何如吉人則吉凶人則凶天降災祥在德何如德一則祥德二三則災今嗣王新服厥命惟新厥德終始惟一時乃日新太甲新服天子之命德亦當新然新德之要在於有常而已終始有常而無間斷是乃所以日新也纂疏終始惟一時乃日新這箇道理須是常接續不已方是日新才有間斷便不可張氏曰此告太甲以繼湯之一德也太甲即位已久此自復位時言既新服受天命其德亦當俱新陳氏大猷曰終始惟一此言修德之當一也愚謂太甲復位之初自怨自艾始能自新矣終或間斷則非日新也湯之盤銘曰苟日新日日新又日新其自警如此仲虺之誥曰德日新初歸自夏即聞此於仲虺盤銘之辭必得諸此是日新乃太甲乃祖之家學也尹以湯之日新望太甲必以湯之一德勉太甲故時乃日新必先之以終始惟一焉視湯之銘又加精密任官惟賢材左右惟其人臣為上為德為下為民其難其慎惟和惟一賢者有德之稱材者能也左右者輔弼大臣非賢材之稱可盡故曰惟其人夫人臣之職為上為德左右厥辟也為下為民所以宅師也不曰君而曰德者兼君道而言也臣職所係其重如此是必其難其慎難者難於任用慎者慎於聽察所以防小人也惟和惟一和者可否相濟一者終始如一所以任君子也纂疏問左右何所指曰只是指親近之臣問四為字當作如何音曰並去聲為上者輔其德而不阿其意之所欲為下者利於民而不徇已之所安如逢君之惡也是為上而非為德為妻妾之奉也是為下而非為民曰然論其難其慎曰君臣上下相與甚難張氏曰尹欲堯舜其君為上為德可知欲堯舜其民為下為民可知陳氏大猷曰君欲日新其德或不克終者由小人蠱之則不間斷於己亦間斷於人故又告以用人之道所以貴於用有德有能而必得其人者臣職在於致君澤民為上則欲輔成君德為下則欲澤潤生民所係之重如此任用之際其難之而不易慎之而不忽協和而無乖專一而不二此言用人之當一也愚案左右作近習説接下二句不來語録想非定説蔡傳得之王置諸其左右相成王為左右豈皆近習乎三公官不必備亦曰惟其人蓋其選至重必其人足以當之者可也德無常師主善為師善無常主協于克一上文言用人因推取人為善之要無常者不可執一之謂師法協合也德者善之總稱善者德之實行一者其本原統會者也德兼衆善不主於善則無以得一本萬殊之理善原於一不協于一則無以達萬殊一本之妙謂之克一者能一之謂也博而求之於不一之善約而會之於至一之理此聖學始終條理之序與夫子所謂一貫者幾矣太甲至是而得與聞焉亦異乎常人之改過者歟張氏曰虞書精一數語之外惟此為精密纂疏問或言主善人而為師苦仲尼無常師之意如何曰非也橫渠説德主天下之善善原天下之一最好四句三假一假緊似一假德且大體説有吉德有凶德然必主于善始為吉耳善亦且是大假説或在此為善在彼為不善在彼為善在此為不善或在前日則不善而今日則為善惟須協於克一是乃為善謂以此心揆度彼善耳故橫渠言原則若善之原於一耳蓋善因一而後定也德以事言善以理言一以心言大抵此萹只是幾箇一字上有精神協字雖訓合字却是以此合彼之合非己相合之合與禮記協於分藝書協時月正日之協同義蓋若揆度嘇驗之意耳張敬夫謂虞書精一四句與此為尚書語之最精密者而虞書為尤精於天下之德無一定之師惟善是從凡有善皆可師也於天下之善無一定之主惟一其心則其所取者無不善矣協猶齊也如所謂協時月協字難説只是箇比對裁斷之意如何知得善不善須是自身主宰得定始得蓋有主宰則是非善惡瞭然於心目間合于此者便是不合者便不是橫渠云德主天下之善善原天下之一説得極好蓋從一中流出者無有不善南軒云自危微數語外惟此四句好但舜大聖人言語渾淪伊尹之言較露鋒鋩些這説得也好一者善之原也善無常主如言前日之受非也協于克一如言皆是也蓋均是善但易地有不同者故無常主必是合于一乃為至善一者純於理而無二三之謂一則無私欲而純乎義理矣夏氏曰學未有得不可拘一定之見學既有得不可忘一貫之理德既無常師善不敢拘凡主於善者皆師之泛觀博取也善雖無常主吾不敢泛必即夫一者而合之反觀約盡也陳氏大猷曰有專一之一終始惟一是也有統一之一協于克一是也尹既言惟一之旨復明協一之義德之所在初無常師凡主於善者皆所當師博而取之也善有萬端亦無常主必協合統會于能一之地一以貫之也愚謂理之一本萬殊處擇之貴乎精理之萬殊一本處融之貴乎一德無常師主善為師精以得之也即所謂惟精也善無常主協于克一一以貫之也即所謂惟一也南軒謂精一數語外惟此最為精密伊尹此言即自惟精惟一充廣之也伊尹樂堯舜之道今復摘其授受微旨以告太甲其欲使君堯舜之心至老而不變也蓋如此俾萬姓咸曰大哉王言又曰一哉王心克綏先王之祿永砥蒸民之生人君惟其心之一故其發諸言也大萬姓見其言之大故能知其心之一感應之理自然而然以見人心之不可欺而誠之不可掩也祿者先王所守之天祿也蒸衆也天祿安民生厚一德之效驗也纂疏陳氏大猷曰人心孚感若有使之者此一德之驗綏祿砥民此一德之效嗚呼七世之廟可以觀德萬夫之長可以觀政天子七廟三昭三穆與太祖之廟七七廟親盡則遷必有德之主則不祧毁故曰七世之廟可以觀德天子居萬民之上必政教有以深服乎人而後萬民恱服故曰萬夫之長可以觀政伊尹歎息言德政修否見於後世服乎當時有不可掩者如此后非民罔使民非后罔事無自廣以狹人匹夫匹婦不獲自盡民主罔與成厥功罔使罔事即上篇民非后罔克胥匡以生后非民罔以辟四方之意申言君民之相須者如此欲太甲不敢忽也無母同伊尹又言君民之使事雖有貴賤不同至於取人為善則初無貴賤之間蓋天以一理賦之於人散為萬善人君合天下之萬善而後理之一者可全也苟自大而狹人匹夫匹婦有一不得自盡於上則一善不備而民主亦無以成厥功矣伊尹於篇終致其警戒之意而言外之旨則又推廣其所謂一者如此蓋道體之純全聖功之極致也嘗因是言之以為精粹無雜者一也終始無間者一也該括萬善者一也一者通古今逹上下萬化之原萬事之幹語其理則無二語其運則無息語其體則并包而無所遺也咸有一德之書而三者之義悉備前乎伏犧堯舜禹湯後乎文武周公孔子同一揆也纂疏愚謂觀德觀政欲太甲致謹於修德行政之際也德即一德政即德之見於行事者又謂一德雖全矜心當戒一善或遺即一德有虧何以有成功哉此一節言君民相須及不可使匹夫婦不獲自盡其與舜命禹以精一而末及於衆非后后非衆四海困窮天祿永終者亦有合焉伊尹樂堯舜之道而有得豈不信哉盤庚上盤庚陽甲之弟自祖乙都耿圮於河水盤庚欲遷于殷而大家世族安土重遷胥動浮言小民雖蕩析離居亦惑於利害不適有居盤庚喻以遷都之利不遷之害上中二篇未遷時言下篇既遷後言王氏曰上篇告羣臣中篇告庶民下篇告百官族姓左傳謂盤庚之誥實誥體也三篇今文古文皆有但今文三篇合為一纂疏史記盤庚祖乙之曽孫也歷祖乙子祖辛祖辛子開甲開甲弟祖丁開甲子南庚祖丁子陽甲及盤庚凡七世都耿矣亳殷亳之殷地殷亳之别名在河南耿在河北吳氏曰説者言某篇告臣某篇告民臣民並集之時不當呼臣與言而使民不與聞又呼民與言而使臣不與聞特事之係乎臣者主臣言之係乎民者主民言之臣民皆欲其盡曉也林氏曰臣民傲上從康常情所不堪今諄復懇到曉以利害不啻慈母之於子非優遊不斷不能奮其剛決也從容開喻使其曉然恱從以共享安利所以為王者之政也又曰耿沃饒易富而苦蕩析離居遷亳乃小民之利而巨室所不欲故為浮言以搖民情此三篇所由作也盤庚遷于殷民不適有居率籲衆戚出矢言殷在河南偃師適往籲呼矢誓也史臣言盤庚欲遷于殷民不肯往適有居盤庚率呼衆憂之人出誓言以喻之如下文所云也周氏曰商人稱殷自盤庚始自此以前惟稱商自盤庚遷都之後於是殷商兼稱或只稱殷也曰我王來既爰宅于茲重我民無盡劉不能胥匡以生卜稽曰其如台曰盤庚之言也劉殺也盤庚言我先王祖乙來都於耿固重我民之生非欲盡致之死也民適不幸蕩析離居不能相救以生稽之於卜亦曰此地無若我何言耿不可居決當遷也纂疏愚案既爰宅于茲以下疑有闕文茲指耿邑當有述水患之語然後繼以重我民無盡劉方近人情其如台疑命龜之辭此句上下亦必有闕文林氏曰古者遷國必卜綿詩曰爰契我龜衛遷楚邱亦曰降觀于桑卜云其吉是也先王有服恪謹天命茲猶不常寧不常厥邑于今五邦今不承于古罔知天之斷命矧曰其克從先王之烈服事也先王有事恪謹天命不敢違越先王猶不敢常安不常其邑于今五遷厥邦矣今不承先王而遷且不知上天之斷絶我命况謂其能從先王之大烈乎詳此言則先王遷徙亦必有稽卜之事仲丁河亶甲篇逸不可考矣五邦漢孔氏謂湯遷亳仲丁遷囂河亶甲居相祖乙居耿并盤庚遷殷為五邦然以下文今不承于古文勢考之則盤庚之前當自有五遷史記言祖乙遷邢或祖乙兩遷也纂疏陳氏曰罔知斷命猶言未知死所若顛木之有由蘖天其永我命于茲新邑紹復先王之大業底綏四方顛仆也由古文作甹木生條也顛木譬耿由蘖譬殷也言今自耿遷殷若已仆之木而復生也天其將永我國家之命於殷以繼復先王之大業而致安四方乎纂疏古文尚書由作㽕説文云木生條也引書有㽕枿蘖韻本作􅤁今作枿書由蘖孟萌蘖皆作蘖郭璞曰晉衛之間曰枿馬云顛木而肄生曰枿魏氏了翁曰由字左傳杜注木再萌芽謂之由故曰楚其復由又昭八年今在析木之津猶將復由薛氏曰不遷故罔知天之短命則遷乃天欲永我命也不遷故不克從先王之烈則遷乃紹復先王之業也陳氏經曰命在天而曰恪謹天命天其永命何也古人以當然之理為命不以或然之數為命使盤庚不遷而苟安於耿民不聊生國將滅亡而歸之命可乎陳氏大猷曰京師為諸夏本國都定則四方安矣承天命復祖業綏四方三者圖遷之本意故史述于篇首盤庚斆于民由乃在位以常舊服正法度曰無或敢伏小人之攸針王命衆悉至于庭斆教服事針規也耿地潟鹵墊隘而有沃饒之利故小民苦于蕩析離居而巨室則總於貨寶惟不利於小民而利於巨室故巨室不恱而胥動浮言小民眩於利害亦相與咨怨間有能審利害之實而欲遷者則又往往為在位者之所排擊阻難不能自逹於上盤庚知其然故其教民必自在位始而其所以教在位者亦非作為一切之法以整齊之惟舉先王舊常遷都之事以正其法度而已然所以正法度者亦非有他焉惟曰使在位之臣無或敢伏小人之所針規焉耳蓋小民患潟鹵墊隘有欲遷而以言針規其上者汝毋得遏絶而使不得自達也衆者臣民咸在也史氏將述下文盤庚之訓語故先發此纂疏陳氏大猷曰法度如朝市室廬之營建道路頓宿之部分去舊即新之區畫之類遵故事則人情不駭達針言則人情不壅此遷都之大綱也愚謂浮言惑衆由在位者始今茲教民以遷所以亦必由在位始王命衆悉至于庭一句當屬下文王若曰格汝衆豫告汝訓汝猷黜乃心無傲從康若曰者非盡當時之言大意若此也汝猷黜乃心者謀去汝之私心也無與毋同毋得傲上之命從已之安蓋傲上則不肯遷從康則不能遷二者所當黜之私心也此雖盤庚對衆之辭實為羣臣而發以斆民由在位故也纂疏王氏曰凡言若曰或臣述上旨而代作非其自言或史撮大意刪潤之非其本言陳氏經曰傲上者違王命而不肯從從康者懷苟安而無逺慮羣臣所以不肯遷病根在此二者故直指其病戒之陳氏梅叟曰戒羣臣汲汲於治其心耳黜乃心再見於首篇肩心申嚴於終篇不宣乃心恐迂乃心不暨豫同心有戕在乃心各設中于乃心又條見於中篇而歷告朕志敷心腹腎腸無非開心諭之也古我先王亦惟圖任舊人共政王播告之修不匿厥指王用丕欽罔有逸言民用丕變今汝聒聒起信險膚豫弗知乃所訟逸過也盤庚言先王亦惟謀任舊人共政王播告之修則奉承于內而不能隱匿其指意故王用大敬之宣化于外又無過言以惑衆聽故民用大變今爾在內則伏小人之攸針在外則不和吉言于百姓譊譊多言凡起信於民者皆險陂膚淺之説我不曉汝所言果何謂也詳此所謂舊人者世臣舊家之人非謂老成人也蓋沮遷都者皆世臣舊家之人下文人惟求舊一章可見纂疏王氏曰訟爭辨也愚謂民用丕變以前謂先王時世家舊人能使上敬下化如此下文責今世家不能然也非豫自荒茲德惟汝含德不惕豫一人豫若觀火豫亦拙謀作乃逸荒廢也逸過失也盤庚言非我輕易遷徙自荒廢此德惟汝不宣布德意不畏懼於我我視汝情明若觀火我亦拙謀不能制命而成汝過失也纂疏愚謂含德掩晦遮蔽不能宣上德意也與不匿厥指正相反不惕一人傲上也作乃安逸從康也若網在綱有條而不紊若農服田力穡乃亦有秋紊亂也綱舉則目張喻下從上小從大申前無傲之戒勤於田畝則有秋成之望喻今雖遷徙勞苦而有永建乃家之利申前從康之戒汝克黜乃心施實德于民至于婚友丕乃敢大言汝有積德蘇氏曰商之世家大族造言以害遷者欲以苟恱小民為德也故告之曰是何德之有汝曷不去汝私心施實德于民與汝婚姻僚友乎勞而有功此實德也汝能勞而有功則汝乃敢大言曰我有積德曰積德云者亦指世家大族而言申前汝猷黜乃心之戒纂疏蕭氏曰不欲遷者徒為順民之虛名遷則為安民之實德夏氏曰先王時汝祖父率民以遷今汝又率民遷是世有積德及人也陳氏大猷曰此章總告以利下二章分告以害愚謂前言猷黜乃心此言克黜乃心是前所謀為之者今真能為之矣所以贊其決也乃不畏戎毒于逺邇惰農自安不昏作勞不服田畝越其罔有黍稷戎大昏強也汝不畏沱溺大害於逺近而憚勞不遷如怠惰之農不強力為勞苦之事不事田畝安冇黍稷之可望乎此章再以農喻申言從康之害纂疏唐孔氏曰惰農對上服田力穡而反言之林氏曰此篇文勢大抵反覆辨論皆相顧成文既曰若農服田至有秋又曰惰農自安至罔有黍稷既曰豫若觀火又曰若火之燎于原文雖渙散而意則相屬以是知盤庚之言雖佶屈聱牙不可遽曉然反覆求之於人情甚近也汝不和吉言于百姓惟汝自生毒乃敗禍姦宄以自災于厥身乃既先惡于民乃奉其恫汝悔身何及相時憸民猶胥顧于針言其發有逸口矧豫制乃短長之命汝曷弗告朕而胥動以浮言恐沈于衆若火之燎于原不可嚮邇其猶可撲滅則惟汝衆自作弗靖非豫有咎吉好也先惡為惡之先也奉承恫痛相視也憸民小民也逸口過言也逸口尚可畏況我制爾生殺之命可不畏乎恐謂恐動之以禍患沈謂沈陷之於罪惡不可嚮邇其猶可撲滅者言其勢熖雖盛而殄滅之不難也靖安咎過也則惟爾衆自為不安非我有過也此章反復辨論申言傲上之害纂疏林氏曰先不樂遷民亦從之是謂先惡陳氏大猷曰恫痛不急去而奉養之猶安其危利其災也既先惡于始又護疾於今後雖悔之何及矣張氏曰毒曰自生禍敗曰自災非自外來皆汝自取遲任有言曰人惟求舊器非求舊惟新遲任古之賢人蘇氏曰人舊則習器舊則敝當常使舊人用新器也今案盤庚所引其意在人惟求舊一句而所謂求舊者非謂老人但謂求人於世臣舊家云爾詳下文意可見若以舊人為老人又何侮老成人之冇纂疏張氏曰器惟新但以證人求舊耳古我先王暨乃祖乃父胥及逸勤豫敢動用非罰世選爾勞豫不掩爾善茲豫大享于先王爾祖其從與享之作福作災豫亦不敢動用非德胥相也敢不敢也非罰非所當罰也世非一世也勞勞于王家也掩蔽也言先王及乃祖乃父相與同其勞逸我豈敢動用非罰以加汝乎世簡爾勞不蔽爾善茲我大享于先王爾祖亦以功而配食於廟先王與爾祖父臨之在上質之在旁作福作災皆簡在先王與爾祖父之心我亦豈敢動用非德以加汝乎纂疏陳氏大猷曰配對也大勳勞者方得配享如周禮司勳有功者祭于大蒸孫氏曰胥及逸勤則曰乃祖乃父此與享只曰乃祖蓋逸勤不止一人配享非有功之祖不與也張氏曰罰以討罪不當罪則為非罰賞以彰德不稱德則為非德愚謂此以世臣與國同休戚感動之乃申圖任舊人之意謂汝從我遷我固不敢用非罰加汝執迷不遷亦不敢用非德福汝又承上撲滅之言以起意而以威恐之以賞勸之也豫告汝于難若射之有志汝無侮老成人無弱孤有幼各長于厥居勉出乃力聽豫一人之作猷難言謀遷徙之難也蓋遷都固非易事而又當時臣民傲上從康不肯遷徙然我志決遷若射者之必于中有不容但已者弱少之也意當時老成孤幼皆有言當遷者故戒其老成者不可侮孤幼者不可少之也爾臣各謀長逺其居勉出汝力以聽我一人遷徙之謀也纂疏或曰謀遷固難然如射必志于中有志者事竟成則不沮於難矣有又通孤與幼也孔氏曰不用老成之言而遷是侮之不遷則孤幼受害是弱之無有逺邇用罪伐厥死用德彰厥善邦之臧惟汝衆邦之不臧惟豫一人有佚罰用罪猶言為惡用德猶言為善也伐猶誅也言無有逺近親踈凡伐死彰善惟視汝為惡為善如何爾邦之善惟汝衆用德之故邦之不善惟我一人失罰其所當罰也纂疏曽氏曰用罪如言用罰用德如曰用賞陳氏曰死者刑之重舉重故言死凡爾衆其惟致告自今至于後日各恭爾事齊乃位度乃口罰及爾身弗可悔致告者使各相告戒也自今以往各敬汝事整齊汝位法度汝言不然罰及汝身不可悔也纂疏吕氏曰三書反復折難須於包容處看其德量委曲訓誥處看其恩意規畫纖悉處看其措置林氏曰使驅以刑而迫之遷誰敢違之今其言乃若有所甚畏者蓋今之遷惟欲聚民所欲耳苟以勢驅失人心雖能強之遷而民已離矣故寧為優遊不忍之辭開諭其心使知吾之本意既不失民之心亦不害吾之遷此盤庚所以為仁也陳氏大猷曰世主之懦者惟徇人事所當為慮拂人情而輒沮果者惟徇己事苟當為遽拂人情而不恤皆非也盤庚內不失己外不失人所以兩全歟盤庚中盤庚作惟涉河以民遷乃話民之弗率誕告用亶其有衆咸造勿褻在王庭盤庚乃登進厥民作起而將遷之辭殷在河南故涉河誕大亶誠也咸造皆至也勿褻戒其毋得褻慢也此史氏之言蘇氏曰民之弗率不以政令齊之而以話言曉之盤庚之仁也纂疏吕氏曰王庭乃道路行宫如周禮掌次是也班次臣在前民在後故升進民於前而告之曰明聽朕言無荒失朕命荒廢也嗚呼古我前后罔不惟民之承保后胥戚鮮以不浮于天時承敬也蘇氏曰古謂過為浮浮之言勝也后既無不惟民之敬故民亦保后相與憂其憂雖有天時之災鮮不以人力勝之也林氏曰憂民之憂者民亦憂具憂罔不惟民之承憂民之憂也保后胥戚民亦憂其憂也纂疏愚謂承順也何必訓敬殷降大虐先王不懷厥攸作視民利用遷汝曷弗念我古后之聞承汝俾汝惟喜康共非汝有咎比干罰先王以天降大虐不敢安居其所興作視民利當遷而已爾民何不念我以所聞先王之事凡我所以敬汝使汝者惟喜與汝同安爾非為汝有罪比于罰而謫遷汝也豫若籲懷茲新邑亦惟汝故以丕從厥志我所以招呼懷來于此新邑者亦惟以爾民蕩析離居之故欲承汝俾汝康共以大從爾志也或曰盤庚遷都民咨胥怨而此以為丕從厥志何也蘇氏曰古之所謂從衆者非從其口之所不樂而從其心之所不言而同然者夫趨利而避害捨危而就安民心同然也殷亳之遷實斯民所利特其一時為浮言搖動怨咨不樂使其即安危利害之實而反求其心則固其所大欲者矣今豫將試以汝遷安定厥邦汝不憂朕心之攸困乃咸大不宣乃心欽念以忱動豫一人爾惟自鞠自苦若乘舟汝弗濟臭厥載爾忱不屬惟胥以沈不其或稽自怒曷瘳上文言先王惟民之承而民亦保后胥戚今我亦惟汝故安定厥邦而汝乃不憂我心之所困乃皆不宣布腹心欽念以誠感動於我爾徒為此紛紛自取窮苦譬乘舟不以時濟必敗壞其所資今汝從上之誠間斷不屬安能有濟惟相與以及沉溺而已詩曰其何能淑載胥及溺正此意也利害若此爾民而罔或稽察焉是雖怨疾忿怒何損於困苦乎纂疏袁氏曰王涉河故指舟為喻汝不謀長以思乃災汝誕勸憂今其有今罔後汝何生在上汝不為長久之謀以思其不遷之災是汝大以憂而自勸也孟子曰安其危而利其災樂其所以亡勸憂之謂也有今猶言有今日也罔後猶言無後日也上天也今其有今罔後是天斷棄汝命汝有何生理於天乎下文言迓續乃命于天蓋相首尾之辭纂疏蘇氏曰勸憂猶言樂禍陳氏大猷曰死則魄降在下生則在世上汝有何生理在世上乎今豫命汝一無起穢以自臭恐人倚乃身迂乃心爾民當一心以聽上無起穢惡以自臭敗恐浮言之人倚汝之身迂汝之心使汝邪僻而無中正之見也豫迓續乃命于天豫豈汝威用奉畜汝衆我之所以遷都者正以迎續汝命于天豫豈以威脅汝哉用以奉養汝衆而已豫念我先神后之勞爾先豫丕克羞爾用懷爾然神后先王也羞養也即上文畜養之意言我思念我先神后之勞爾先人我大克羞養爾者用懷念爾故也失于政陳于茲髙后丕乃崇降罪疾曰曷虐朕民陳久崇大也耿圮而不遷以病我民是失政而久于此也髙后湯也湯必大降罪疾于我曰何謂而虐害我民蓋人君不能為民圖安是亦虐之也汝萬民乃不生生暨豫一人猷同心先后丕降與汝罪疾曰曷不暨朕幼孫有比故有爽德自上其罰汝汝罔能迪樂生興事則其生也厚是謂生生先后泛言商之先王也幼孫盤庚自稱之辭比同事也爽失也言汝民不能樂生興事與我同心以遷我先后大降罪疾于汝曰汝何不與朕幼小之孫同遷乎故汝有失德自上其罰汝汝無道以自免也古我先后既勞乃祖乃父汝共作我畜民汝有戕則在乃心我先后綏乃祖乃父乃祖乃父乃斷棄汝不救乃死既勞乃祖乃父者申言勞爾先也汝共作我畜民者汝皆為我所畜之民也戕害也綏懷來之意謂汝有戕害在汝之心我先后固已知之懷來汝祖汝父汝祖汝父亦斷棄汝不救汝死也茲豫有亂政同位具乃貝玉乃祖乃父丕乃告我髙后曰作丕刑于朕孫迪髙后丕乃崇降弗祥亂治也具多取而兼有之謂言若我治政之臣所與共天位者不以民生為念而務富貝玉者其祖父亦告我成湯作丕刑于其子孫啓成湯丕乃崇降弗祥而不赦也此章先儒皆以為責臣之辭然詳其文勢曰茲豫有亂政同位則亦對民庶責臣之辭非直為羣臣言也案上四章言君有罪民有罪臣有罪我髙后與爾民臣祖父一以義斷之無所赦也王氏曰先王設教因俗之善而導之反俗之惡而禁之方盤庚時商俗衰士大夫棄義即利故盤庚以具貝玉為戒此反其俗之惡而禁之者也自成周以上莫不事死如事生事亡如事存故其俗皆嚴鬼神以經考之商俗為甚故盤庚特稱先后與臣民之祖父崇降罪疾為告此因其俗之善而導之者也纂疏問盤庚言其先王與其臣祖父若真有物在其上降災降罰與之周旋從事於日用間者竊謂此亦大槩言理之所在質諸鬼神而無疑耳而殷人之俗尚鬼故以其深信者導之夫豈亦真有一物邪曰鬼神之理聖人蓋難言之謂真有一物固不可謂非有物亦不可若未能曉然見得且缺之可也嗚呼今豫告汝不易永敬大恤無胥絶逺汝分猷念以相從各設中于乃心告汝下易即上篇告汝于難之意大恤大憂也今我告汝以遷都之難汝當永敬我之所大憂念者君民一心然後可以有濟苟相絶逺而誠不屬則殆矣分猷者分君之所圖而共圖之分念者分君之所念而其念之相從相與也中者極至之理各以極至之理存于心則知遷徙之議為不可易而不為浮言橫議之所動搖也纂疏愚謂告汝者一定不易矣永敬我所大憂者汝當以君之心為心也中者人心同然之理何待於設正緣羣臣徇於私情之一偏則中之理亡矣汝不當偏為已計當分汝所謀所念以從上各設中理于心則明見利害自有不偏之凖在於胸中不至於偏私矣不設中于心則人將倚汝身迂汝心也乃有不吉不迪顛越不恭暫遇姦宄我乃劓殄滅之無遺育無俾易種于茲新邑乃有不善不道之人顛隕踰越不恭上命者及暫時所遇為姦為宄劫掠行道者我小則加以劓大則殄滅之無有遺育毋使移其種于此新邑也遷徙道路間關恐姦人乘隙生變故嚴明號令以告敕之往哉生生今豫將試以汝遷永建乃家往哉往新邑也方遷徙之時又懷舊土之念而未見新居之樂故再以生生勉之振起其怠惰而作其趨事也試用也今我將用汝遷永立乃家為子孫無窮之業也纂疏愚謂生生生養不窮之道也末二句應前今豫將試以汝遷安定厥邦前以邦言此以乃家言互文見意民惟邦本本固邦寧必民家永建而後邦國永定也盤庚下盤庚既遷奠厥攸居乃正厥位綏爰有衆盤庚既遷新邑定其所居正君臣上下之位慰勞臣民遷徙之勞以安有衆之情也此史氏之言纂疏林氏曰孔謂正郊廟朝社之位非也乃正臣民之位整朝儀而撫諭之耳曰無戲怠懋建大命曰盤庚之言也大命非常之命也遷國之初臣民上下正當勤勞盡瘁趨事赴功以為國家無窮之計故盤庚以無戲怠戒之以建大命勉之纂疏愚謂戲即傲上怠即從康乃其故習未遷則憚以為難既遷則苟以為足未必不謂不必更勉自可以永命矣命雖在天建之在我必懋勉始能建大命必無戲怠始能懋勉故首矯其舊習而新其精神也今豫其敷心腹腎腸歷告爾百姓于朕志罔罪爾衆爾無共怒協比讒言豫一人歷盡也百姓畿內民庶百官族姓亦在其中纂疏愚謂朕志下文所言是也意前日浮言之徒必有唱為事定後有罪責之説故以此釋衆疑而絶讒謗也古我先王將多于前功適于山用降我凶德嘉績于朕邦古我先王湯也適于山往于亳也契始居亳其後屢遷成湯欲多于前人之功故復往居亳案立政三亳鄭氏曰東成臯南轘轅西降谷以亳依山故曰適于山也降下也依山地髙水下而無河圮之患故曰用下我凶德嘉績美功也纂疏王氏炎曰自此至用宏茲賁言所以遷之意以諭臣民也自邦伯師長至篇終既遷之後言欲為之意以望羣臣也此所謂朕志也今我民用蕩析離居罔有定極爾謂朕曷震動萬民以遷今耿為河水圯壞沉溺墊隘民用蕩析離居無有定止將陷於凶德而莫之救爾謂我何故震動萬民以遷也肆上帝將復我髙祖之德亂越我家朕及篤敬恭承民命用永地于新邑乃上天將復我成湯之德而治及我國家我與一二篤敬之臣敬承民命用長居于此新邑也肆豫沖人非廢厥謀弔由靈各非敢違卜用宏茲賁沖童弔至由用靈善也宏賁皆大也言我非廢爾衆謀乃至用爾衆謀之善者指當時臣民有審利害之時以為當遷者言也爾衆亦非敢固違我卜亦惟欲宏大此大業爾言爾衆亦非有他意也蓋盤庚於既遷之後申彼此之情釋疑懼之意明吾前日之用謀略彼既往之傲惰委曲忠厚之意藹然於言辭之表大事以定大業以興成湯之澤於是而益永盤庚其賢矣哉纂疏陳氏傅良曰我與汝皆非私意各惟卜是用以求宏大賁飾之事耳賁去聲愚案多于前功以下朱子本疑之弔由靈宏茲賁等語尤難曉姑存舊説而已嗚呼邦伯師長百執事之人尚皆隱哉隱痛也盤庚復歎息言爾諸侯公卿百執事之人庶幾皆有所隱痛於心哉豫其懋簡相爾念敬我衆相爾雅曰導也我懋勉簡擇導汝以念敬我之民衆也朕不肩好貨敢恭生生鞠人謀人之保居敘欽肩任敢勇也鞠人謀人未詳或日鞠養也我不任好賄之人惟勇於敬民以其生生為念使鞠人謀人之保居者吾則敘而用之欽而禮之也今我既羞告爾于朕志若否罔有弗欽羞進也若者如我之意即敢恭生生之謂否者非我之意即不肩好貨之謂二者爾當深念無有不敬我所言也無總于貨寶生生自庸無毋同總聚也庸民功也此則直戒其所不可為勉其所當為也式敷民德永肩一心式敬也敬布為民之德永任一心欲其久而不替也盤庚篇終戒勉之意一節嚴於一節而終以無窮期之盤庚其賢矣哉蘇氏曰民不恱而猶為之先王未之有也祖乙圯于耿盤庚不得不遷然使先王處之則動民而民不懼勞民而民不怨盤庚德之衰也其所以信於民者未至故紛紛如此然民怨謀逆命而盤庚終不怒引咎自責益開衆言反覆告諭以口舌代斧鉞忠厚之至此殷之所以不亡而復興也後之君子厲民以自用者皆以盤庚藉口豫不可以不論纂疏愚謂前告衆民後告羣臣言庶幾皆有惻隱之仁心哉新遷之民生理未復尤當視之如傷惻隱以愛之我其懋簡相爾爾當念我衆而不忘敬我衆而不忽也好貨之人不能念敬我衆者也我則不肩任之敢於恭以生民生而安養人者能念敬我衆者也我則敘欽之今我既進告爾以朕志之所順與否敢恭所順者好貨所否者也汝當無不敬我言也敬我之所否而無總貨寶申不肩好貨之戒也敬我之師若而以生生自用申敢恭生生之訓也爾其用敷為民之德而永肩一心焉此篇始曰歷告百姓于朕志終曰羞告爾于朕志若否始告民以朕志者以釋其疑懼之情也終告臣以朕志者欲其審好惡之辨也前日羣臣唱浮言以惑民者傲上從康其病證也具乃貝玉其病根也今雖已遷而病證猶未退病根猶未除故始曰無戲怠以革傲上從康之病證終日不肩好貨無總貨寶使除具乃貝玉之病根然後上能敬君命下能仁民生而永建國家無窮之基矣先王動民而民不懼勞民而民不怨是遷也民懼而怨至費三篇之語言固見商德之衰矣然以口舌代斧鉞化違慢為順從拔蕩析置衽席慈祥惻怛不吝三篇之語言亦見盤庚之賢歟蔡氏自庸訓為民功式訓敬盍更審之説命上説命記髙宗命傅説之言命之日以下是也猶蔡仲之命微子之命後世命官制詞其原蓋出於此上篇記得説命相之辭中篇記説為相進戒之辭下篇記説論學之辭總謂之命者髙宗命説實三篇之綱領故總稱之今文無古文有纂疏問傳説版築亦讀書否曰不讀書如何有説命三篇之文王宅憂亮隂三祀既免喪其惟弗言羣臣咸諫于王曰嗚呼知之曰眀哲明哲實作則天子惟君萬邦百官承式王言惟作命不言臣下罔攸稟令亮一作諒隂古作暗案喪服四制髙宗諒隂三年鄭氏注云諒古作梁楣謂之梁暗讀如鶉䳺之䳺暗謂廬也即倚廬之廬儀禮剪屏柱楣鄭氏謂柱楣所謂梁暗是也宅憂亮隂言宅憂於梁暗也先儒以亮隂為信默不言則於亮隂三年不言為語復而不可解矣君薨百官總已聽於冢宰居憂亮隂不言禮之常也髙宗喪父小乙惟既免喪而猶弗言羣臣以其過於禮也故咸諫之歎息言有先知之德者謂之明哲明哲實為法於天下今天子君臨萬邦百官皆奉承法式王言則為命不言則臣下無所稟令矣纂疏語注曰諒隂天子居喪之名未詳其義諒隂梁暗未詳古制定如何不敢輒為之説王庸作書以誥曰以台正于四方台恐德弗類茲故弗言恭默思道夢帝賚豫良弼其代豫言庸用也髙宗用作書告喻羣臣以不言之意言以我表正四方任大責重恐德不類于前人故不敢輕易發言而恭敬淵默以思治道夢帝與我賢輔其將代我言矣蓋髙宗恭默思道之心純一不二與天無間故夢寐之間帝賚良弼其念慮所孚精神所格非偶然而得者也纂疏髙宗夢傅説分明有箇傅説在那裏髙宗却不知所以夢見亦是朕兆先見者如此髙宗夢傳説據此則是真有箇天帝與髙宗對曰吾賚汝以良弼今人但以主宰説帝謂無形象恐也不得若世間所謂玉皇大帝恐亦不可畢竟此理如何皆莫能答伊川曰髙宗至誠思得賢相寤寐不忘故兆朕先見於夢如常人夢寐間事有先見者多矣亦何足怪問髙宗往求説邪説來入夢邪曰譬懸鏡於此有物必照非鏡往照物亦非物來入鏡大抵人心虛靈善不善必先知之范祖禹曰中庸云誠則形揚雄云人心其神矣乎髙宗之夢誠之形而心之神也張氏文蔚曰誠心求賢寤寐不忘此心足以合上天生賢之心矣上天之心得不應髙宗求賢之心陳氏經曰至誠之道可以前知嵩前有董五經隱者也伊川聞其名將往造焉至中途遇一老人負茶果問曰君非程先生乎先生欲來信息甚大尹子問於伊川伊川曰靜則自明觀此則夢説之事不誣矣然此不可以常情拘常事論也有髙宗有傅説則可否則以私意用人若漢文以夢得鄧通光武以讖用王梁豈足慿哉乃審厥象俾以形旁求于天下説築傅巖之野惟肖審詳也詳所夢之人繪其形象旁求于天下旁求者求之非一方也築居也今言所居猶謂之卜築傅巖在虞虢之間肖似也與所夢之形相似纂疏史記時説為胥靡於傅險漢書音義胥相也靡隨也古者相隨坐輕刑之名愚謂孟子云傅説舉於版築之間賈誼曰傅説胥靡乃相武丁事迹顯然不宜他説爰立作相王置諸其左右於是立以為相案史記髙宗得説與之語果聖人乃舉以為相書不言省文也未接語而遽命相亦無此理置諸左右蓋以冢宰兼師保也荀卿曰學莫便乎近其人置諸左右者近其人以學也史臣將記髙宗命説之辭先敘事始如此纂疏愚謂置左右不徒相之而必親近之也蔡氏謂以冢宰兼師保其據君奭小序召公保周公師相王為左右之語乎命之曰朝夕納誨以輔台德此下命説之辭朝夕納誨者無時不進善言也孟子曰人不足與適也政不足與間也惟大人為能格君心之非髙宗既相説處之以師傅之職而又命之朝夕納誨以輔台德可謂知所本矣吕氏曰髙宗見道明故知頃刻不可無賢人之言若金用汝作礪若濟巨川用汝作舟楫若歲大旱用汝作霖雨三日雨為霖髙宗託物以喻望説納誨之切三語雖若一意然一節深一節也纂疏王氏曰作礪使成已舟楫使濟難霖雨使澤民林氏非之啓乃心沃朕心啓間也沃灌溉也啓乃心者間其心而無隱沃朕心者溉我心而厭飫也纂疏陳氏大猷曰相業莫大於輔德輔德莫切於格心惟以心格心開誠心以盡忠益必有如江海之浸膏澤之潤者矣若藥弗瞑眩厥疾弗瘳若跣弗視地厥足用傷方言曰飲藥而毒海岱之間謂之瞑眩廖愈也弗瞑眩喻臣之言不苦口也弗視地喻我之行無所見也纂疏孔氏曰跣必視地足乃無害言欲使為己視聽陳氏經曰受苦口之言免妄行之害皆有望於説惟暨乃僚罔不同心以匡乃辟俾率先王迪我髙后以康兆民匡正率循也先王商先哲王也説既作相總百官則卿士而下皆其僚屬髙宗欲傅説暨其僚屬同心正救使循先王之道蹈成湯之迹以安天下之民也嗚呼欽豫時命其惟有終敬我是命其思有終也是命上文所命者纂疏愚謂即相亦惟終之意不必訓惟為思説復于王曰惟木從繩則正后從諫則聖后克聖臣不命其承疇敢不祗若王之休命答欽豫時命之語木從繩喻后從諫明諫之決不可不受也然髙宗當求受言於己不必責進言於臣君果從諫臣雖不命猶且承之況命之如此誰敢不敬順其美命乎纂疏愚謂主聖臣直導人使諫在德不在言君有聖德則有從諫之實雖不命亦諫能為江海何憂百川之不歸君無聖德必無從諫之實雖命之亦不諫如器既滿水將焉入髙宗以納誨輔德為命知命相之大本説以從諫克聖復命尤知致君之大本也説命中惟説命總百官説受命總百官冢宰之職也乃進于王曰嗚呼明王奉若天道建邦設都樹后王君公承以大夫師長不惟逸豫惟以亂民后王天子也君公諸侯也治亂曰亂明王奉順天道建邦設都立天子諸侯承以大夫師長制為君臣上下之權以尊臨卑以下奉上非為一人逸豫之計而已也惟欲以治民焉耳纂疏愚謂説初見髙宗王篇所言只及從諫至此乃詳及為君立政之道自此以下至事神則難乃其進諫之綱領條目也惟天聰明惟聖時憲惟臣欽若惟民從乂天之聰明無所不聞無所不見無他公而已矣人君法天之聰明一出於公則臣敬順而民亦從治矣纂疏葉氏曰憲天聰明而臣若民從奉若天道孰大於此吕氏曰髙宗已造明哲之地故説欲擴充其明哲必憲天之聰明而後已也陳氏大猷曰始告以從諫則聖欲其取人為善也此告以惟聖憲天敬其與天合德也取人為善固可成聖必與天合德始可言聖善責雖者矣陳氏經曰君不違乎天臣民心均此天理自不違乎君惟口起羞惟甲胄起戎惟衣裳在笥惟干戈省厥躬王惟戒茲允茲克明乃罔不休言語所以文身也輕出則有起羞之患甲胄所以衛身也輕動則有起戎之憂二者所以為己當慮其患於人也衣裳所以命有德必謹於在笥者戒其有所輕豫干戈所以討有罪必嚴於省躬者戒其有所輕動二者所以加人當審其用於己也王惟戒此四者信此而能明焉則政治無不休美矣纂疏口能起羞如歸與石郎謀反是也甲胄所以禦戎然亦能興戎如秦築長城以禦胡而致勝廣之亂衣裳賞也在笥猶言在箱篋中甚言其取之易如云爵者上之所擅出於口而無窮惟其豫之之易故必審其人果賢邪果有功邪則賞不妄矣干戈刑人之具然須省察自家真箇是否恐或因怒而妄刑人或慮施之不審而無辜者被害則刑之施當矣蓋衣裳之豫在我而必審其人之賢否干戈施之於人而必審自已之是非也口非欲起羞而出言不當則反足以起羞甲胄本以禦戎而出謀不當則反足以起戎衣裳在笥易以豫人則不可不謹干戈討人之罪則因以省躬四句皆是審底意吕氏曰此憲天聰明之條目也人加於我者不可不防我加於人者不可不謹四者皆聰明之發用也王氏炎日此所戒恐聰明蔽於私而不與天相似也克明則庶幾於天之聰明矣陳氏大猷曰信於此能明其所當用則無不休美而無起羞以下之患矣惟治亂在庶官官不及私昵惟其能爵罔及惡德惟其賢庶官治亂之原也庶官得其人則治不得其人則亂王制曰論定而後官之任官而後爵之六卿百執事所謂官也公卿大夫士所謂爵也官以任事故曰能爵以命德故曰賢惟賢惟能所以治也私昵惡德所以亂也案古者公侯伯子男爵之於侯國公卿大夫士爵之於朝廷此言庶官則爵為公卿大夫士也吳氏曰惡德猶凶德也人君當用吉士凶德之人雖有過人之才爵亦不可及也纂疏吕氏曰官爵及私惡是蔽於私意非憲天聰明矣董氏鼎曰自惟口起羞至乃罔不休聰明之見於修己者自惟治亂至惟其賢聰明之見於用人者也慮善以動動惟厥時善當乎理也時時措之宜也慮固欲其當乎理然動非其時猶無益也聖人酬酢斯世亦其時而已纂疏王氏曰事固有善而非時所宜者善如裘葛之良時如寒暑之時時非葛裘雖良何施惟未動審於慮善將動審於時宜然後事順理而當其可矣不顧可否于時而動非聰明也有其善喪厥善矜其能喪厥功自有其善則已不加勉而德虧矣自矜其能則人不效力而功隳矣惟事事乃其有備有備無患惟事其事乃其有備有備故無患也張氏曰修車馬備器械事乎兵事則兵有其備故外侮不能為之憂簡稼器修稼政事乎農事則農有其備故水旱不能為之害所謂事事有備無患者如此無啓寵納侮無恥過作非毋開寵幸而納人之侮毋恥過誤而遂已之非過誤出於偶然作非出於冇意纂疏愚謂啓寵納侮即女子小人近之不孫之意開寵幸之門而來羣侮非侮我者之罪開之者之罪也過未至於惡恥過遂非則為惡矣本只無心之過反成有心之惡惟厥攸居政事惟醇居止而安之義安於義理之所止也義理出於勉強則猶二也義理安於自然則一矣一故政事醇而不雜也纂疏愚案惟其所居諸説皆欠通必有闕誤黷于祭祀時謂弗欽禮煩則亂事神則難祭不欲黷黷則不敬禮不欲煩煩則擾亂皆非所以交鬼神之道也商俗尚鬼髙宗或未能脫於流俗事神之禮必有過焉祖己戒其祀無豐昵傅説蓋因其失而正之也纂疏伊傅之言雖為告君而發然人人皆可玩味無不切於己者陳氏經曰黷祀將以為欽反所以為不欽黷煩皆以為善而為之而乃陷於不善非禮之禮也以此事神則難是苟難也君子行不貴苟難或曰矜伐非聰明也不防患非聰明也啓寵吝過非聰明也事神則難以上皆憲天聰明之事事事物物皆有天然之理惟聰明者能盡之苟有一毫私意非憲天之聰明矣此篇以憲天聰明為綱王曰旨哉説乃言惟服乃不良于言豫罔聞于行旨美也古人於飲食之美者必以旨言之蓋有味其言也服行也髙宗贊美説之所言謂可服行使汝不善于言則我無所聞而行之也蘇氏曰説之言譬如藥石雖散而不一然一言一藥皆足以治天下之公患所謂古之立言者説拜稽首曰非知之艱行之惟艱王忱不艱允協于先王成德惟説不言有厥咎髙宗方味説之所言而説以為得於耳者非難行於身者為難王忱信之亦不為難信可合成湯之成德説於是而猶有所不言則有其罪矣上篇言后克聖臣不命其承所以廣其從諫之量而將告以為治之要也此篇言允協先王成德惟説不言有厥咎所以責其躬行之實將進其為學之説也皆引而不發之義纂疏南軒云非知之艱行之惟艱此特傳説告髙宗耳蓋髙宗舊學草盤於義理知之亦多故使得這説若常人則須以致知為先也此等議論儘好案南軒答朱子曰孔子觀上世之化曰大哉知乎雖堯舜之民比屋可封亦能使之由之而已知者聖凡之分也豈可云易乎哉傅説之告髙宗髙宗蓋知之者恭默思道夢賚良弼非知之明哲者有此乎故君奭言在武丁時則有若甘盤而未及乎傅説蓋發髙宗之知者甘盤也説故告以雖已知之此非難也貴於實行之耳此為己知者言也若未能知之而告以知之非艱則説為失言矣陳氏經曰未知則知之為難既知則行之為難髙宗明哲如此不患不知患行之不力耳知而不行是亦徒知以至誠行之不見其難矣真氏曰忱誠也以誠為主何患於行中篇節目雖煩要歸只在王忱不艱一句愚謂説意謂王能行而説不言則咎在説説已言而王不行則咎在王不在説也上篇復君以從諫此則責君以行言必實見於行而後始不為徒從也又案忱誠也誠以力行也知對行言古所未發自傅説始發之而後致知力行為萬世為學之法程説命下纂疏碧梧馬氏曰前篇訪以政事故説以政事對此篇訪以學故説以學對王曰來汝説台小子舊學于甘盤既乃遁于荒野入宅于河自河徂亳暨厥終罔顯甘盤臣名君奭言在武丁時則有若甘盤遁退也髙宗言我小子舊學于日盤已而退于荒野後乂入居于河自河往亳遷徙不常歷敘其廢學之因而歎其學終無所顯明也無逸言髙宗舊勞于外爰暨小人與此相應國語亦謂武丁入于河自河徂亳唐孔氏曰髙宗為王子時其父小乙欲其知民之艱苦故使居民間也蘇氏謂甘盤遁于荒野以台小子語脈推之非是纂疏語録東坡解作甘盤遁荒野據某看只是髙宗自言觀上文豫小子可見但不知髙宗因甚遁于荒野今亦不敢斷但據文義疑是如此據暨厥終罔顯只是尋甘盤不見然髙宗舊勞于外亦是嘗在民間來蘇氏曰甘盤遁去不知所終武丁無所卒業學者徒見書云髙宗時舊勞于外不知小乙使知艱難耳決非荒野之遁也愚案遁荒野或以為武丁或以為甘盤真氏大學衍義仍用蘇説兼君奭云在武丁時則有若甘盤是武丁即位初佐之者猶甘盤也林氏曰想自免喪而遁去況下文爾交修豫罔豫棄蓋恐説亦效甘盤棄之而遁也以此見蘇説亦宜存之爾惟訓于朕志若作酒醴爾惟麴蘖若作和羹爾惟鹽梅爾交修豫罔豫棄豫惟克邁乃訓心之所之謂之志邁行也范氏曰酒非麴蘖不成羹非鹽梅不和人君雖有美質必得賢人輔導乃能成德作酒者麴多則太苦蘖多則太甘麴蘖得中然後成酒作羹者鹽過則鹹梅過則酸鹽梅得中然後成羹臣之於君當以柔濟剛以可濟否左右規正以成其德故曰爾交修豫爾無我棄我能行爾之言也孔氏曰交者非一之義纂疏陳氏大猷曰訓志猶云格心蘇氏曰麴蘖鹽梅和而不同也林氏曰交修者綱柔可否相濟以輔豫之不逮也陳氏經曰中篇説謂患髙宗之不能行不患臣之不能言此篇髙宗謂患説之不能言不患我之不能行愚謂此髙宗因説行之惟艱之言而許之以能行其言也説曰王人求多聞時惟建事學于古訓乃有獲事不師古以克永世匪説攸聞求多聞者資之人學古訓者反之己古訓者古先聖王之訓載修身治天下之道二典三謨之類是也説稱王而告之曰人求多聞者是惟立事然必學古訓深識義理然後有得不師古訓而能長治久安者非説所間甚言無此理也林氏曰傅説稱王而告之與禹稱舜曰帝光天之下文勢正同纂疏經籍古人言學字方自説命始有王氏肅曰王人猶君人吕氏曰學問之博貴有實用建立大經彌綸大化皆建事也所謂有用之學否則所聞雖多亦奚以為真氏曰大學之道自格物致知推而治國平天下此求多聞建事之意也古者學與事為一故精義所以致用利用所以崇德本末非二致也後世學與事為二求道者以政事為粗迹任事者以講學為空言不知天下未嘗有無理之事無事之理老莊言理不及事是有無事之理也管商言事不及理是有無理之事也味説之言則古先聖王之正傳可識矣王氏曰求多聞而不為古訓是式則是非無所考正而所聞愈惑矣惟學遜志務時敏厥修乃來允懷于茲道積于厥躬遜謙抑也務專力也時敏者無時而不敏也遜其志如有所不能敏于學如有所不及虛以受人勤以勵已則其所修如泉始逹源源乎其來矣茲此也篤信而深念乎此則道積于身不可以一二計矣夫修之來來之積其學之得於己者如此纂疏遜志者遜順其志捺下這志入那事中子細低心下意與他理會若髙氣不伏不能入細理會得則其修亦不來矣既遜其志又須時敏若似做不做或作或輟亦不濟事須是遜志又時敏則厥修乃來為學之道只此二端而已又戒以允懷于茲二者則道乃積于厥躬積者來得件數多也遜志是卑遜其志放退一著寬廣以求之不忒恁地迫窄遜志是小著這心去順那事理自然見得易曰君子以虛受人有人來問事略不虛心一味氣盈色滿當面與他説全不聽得自古未有人説學字自傅説説起他這數句水潑不入直是説得密愚謂驕與怠最害於學驕則志盈善不可入怠則志惰功不可進學不謙卑退遜則無以為入門一於謙退而不務時敏則又不能進步遜則不驕敏則不怠遜而濟以敏厥修所以來也道我所固冇非自外來來云者如斯仁至矣之謂也退遜者每不能敏速易有當仁而讓之失敏速者又不能持久易有進鋭退速之患果能允信懷念于此而後來者方積也積云者如由有諸己之信而進於充實之美也陳氏經曰信道不篤則所修雖來亦不堅凝惟篤信不忘則來者方凝聚不散來如日知其所無積如月無忘其所能也惟斆學半念終始典于學厥德修罔覺斆教也言教人居學之半蓋道積厥躬者體之立斆學于人者用之行兼體用合內外而後聖學可全也始之自學學也終之教人亦學也一念終始常在于學無少間斷則德之所修有不知其然而然者矣或曰受教亦曰斆斆於為學之道半之半須自得此説極為新巧但古人論學語皆平正的實此章句數非一不應中間一語獨爾險巧此蓋後世釋教機權而誤以論聖賢之學也纂疏惟斆學半蓋已學既成居於人上則須教人自學學也教人亦學也初學得者是半既學而推以教人與之講説已亦因此溫得此假文義是斆之功亦半也念終始典于學始之所以學者學也終之所以教人者亦學也自學教人無非是學自始至終日日如此忽不自知其德之修也僴録蔡傳實本此録或舉葛氏云傅説與王言我教你者只是一半那一半要你自去行取故謂之終始先生曰近見喻子才跋某人説命解亦引此説吕伯恭説亦然某舊為同安簿學中一士子作書義如此説見他説得云新巧大喜之先説王人求多聞云云後面説監于先王云皆是平正實語不應中間翻空一句如此深險如斆得一半不成那一半掉放冷處教他自得此語全似禪語五通仙人問佛六通如何是那一通那一通便是妙處且如學記引此句亦只依古注吕氏曰師只教得一半此一半又在學者自理會如師舉一隅學者以三隅反師告諸往學者當以來者自悟聖人教人引而不發上一半固賴提指之功下一半必自用立可也説言及此恐髙宗全倚之耳真氏曰斆之與學各居其半我之所教僅能半之髙宗於此尤當自力曰終始不曰始終學無止法也上言道之積下言德之修以理之共由言之謂之道以理之自得言之謂之德吕氏斆學半之説未見其為竒險姑並存之愚案惟斆學半只當守學記教學相長之説監于先王成憲其永無愆憲法愆過也言德雖造於罔覺而法必監于先王先王成法者子孫之所當守者也孟子言遵先王之法而過者未之有也亦此意纂疏愚案監先王為學之成法説雖巧終不如蔡説平實惟説式克欽承旁招俊乂列于庶位式用也言髙宗之德苟至於無愆則説用能敬承其意廣求俊乂列于衆職蓋進賢雖大臣之責然髙宗之德未至則雖欲進賢有不可得者纂疏彭氏曰大臣以己事君不若以天下之賢事君陳氏大猷曰君莫大於務學以進德相莫大於為君以求賢王曰嗚呼説四海之內咸仰朕德時乃風風教也天下皆仰我德是汝之教也股肱惟人良臣惟聖手足傋而成人良臣輔而君聖髙宗初以舟楫霖雨為喻繼以麴蘖鹽梅為喻至此又以股肱惟人為喻其所造益深所望益切矣纂疏愚謂髙宗潛默之久一旦舉説相之風聲所動四海仰德然非輔君成聖則無以慰人心之仰德説告君以從諫則聖惟聖時憲是臣以聖期待其君今髙宗語説以良臣惟聖是君亦以聖自期待矣昔先正保衡作我先王乃曰豫弗克俾厥后惟堯舜其心愧恥若撻于市一夫不獲則曰時豫之辜佑我烈祖格于皇天爾尚明保豫罔俾阿衡專美有商先正先世長官之臣保安也保衡猶阿衡作興起也撻于市恥之甚也不獲不得其所也髙宗舉伊尹之言謂其自任如此故能輔我成湯功格于皇天爾庶幾明以輔我無使伊尹專美于我商家也傅説以成湯望髙宗故曰協于先王成德監于先王成憲髙宗以伊尹望傅説故曰罔俾阿衡專美有商纂疏周子曰伊尹恥其君不及堯舜一夫不獲則曰時豫之辜學者當志伊尹之所志真氏曰學者口不可一日不誦此言心不可一日不存此念惟后非賢不乂惟賢非后不食其爾克紹乃辟于先王永綏民説拜稽首曰敢對揚天子之休命君非賢臣不與共治賢非其君不與共食言君臣相遇之難如此克者責望必能之辭敢者自信無慊之辭對者對以己揚者揚于衆休命上文髙宗所命也至是髙宗以成湯自期傅説以伊尹自任君臣相勉勵如此異時髙宗為商令王傅説為商賢佐果無愧於成湯伊尹也宜哉髙宗肜日髙宗肜祭有雊雉之異祖己訓王史氏以為篇亦訓體也不言訓者以既有髙宗之訓故只以篇首四字為題今文古文皆有纂疏後漢髙堂隆曰太戊有桑榖生朝武丁有雊雉升鼎皆因災恐懼側身修行故號曰中宗髙宗興也勃焉髙宗肜日越有雊雉肜祭明日乂祭之名殷曰肜周曰繹雊鳴也於肜日有雊雉之異蓋祭稱廟也序言湯廟者非是纂疏陳氏曰祭之明日以禮享尸行事之有司助祭之賓客皆與焉然謂之又祭而不謂之享者以尸猶有鬼神之道也祖己曰惟先格王正厥事格正也猶格其非心之格詳下文髙宗祀豐于昵昵者稱廟也豐于昵失禮之正故有雊雉之異祖己自言當先格王之非心然後正其所失之事惟天監民以下格王之言王司敬民以下正事之言也纂疏孔光曰上天聰明苟無其事變不虛生書曰惟先格王正厥事言變異之來起事有不正也王氏曰祖考罔非天嗣祀有典不可豐殺訓之使改所謂正厥事愚案諸家不過謂當先格君而改正其事似不必言先格王非心而後正其事分為兩截工夫乃訓于王曰惟天監下民典厥義降年有永有不永非天夭民民中絶命典主也義者理之當然行而宜之之謂言天監視下民其禍福豫奪惟主義如何爾降年有永有不永者義則永不義則不永非天夭折其民民自以非義而中絶其命也意髙宗之祀必有祈年請命之事如漢武帝五畤祀之類祖己言永年之道不在禱祠在於所行義與不義而已禱祠非永年之道也言民而不言君者不敢斥也民有不若德不聽罪天既孚命正厥德乃曰其如台不若德不順於德不聽罪不服其罪謂不改過也孚命者以妖孽為符信而譴告之也言民不順德不服罪天既以妖孽為符信而譴告之欲其恐懼修省以正德民乃曰孽祥其如我何則天必誅絶之矣祖己意謂髙宗當因雊雉以自省不可謂適然而自恕夫數祭豐昵徼福于神不若德也瀆於祭祀傅説嘗以進戒意或吝改不聽罪也雊雉之異是天既孚命正厥德矣其可謂妖孽其如我何耶嗚呼王司敬民罔非天胤典祀無豐于昵司主胤嗣也王之職主於敬民而已徼福於神非王之事也況祖宗莫非天之嗣主祀其可獨豐于昵廟乎纂疏孔氏曰昵近也豐于近廟馬氏曰昵考也謂禰廟陳氏經曰為雊雉訓王而書不及雉本以訓王而辭屢及民末始指王而言辭不迫而意獨至矣吕氏曰災異有二失道之君與天隔絶災異之應常遲賢君與天貫通災異之應常速髙宗恭默夢帝精神素與天通又聰明憲天修德又與天合故於祀事過豐飛雉隨即應之此雖過於厚亦過也精誠積久天既賚之過失微形天遽警之固見天之警君無私亦見天之愛君甚速也黷于祭祀禮煩則亂説已知髙宗之偏在此旨哉惟艱領略警省深矣而此心終難除氣質偏厚尚難變乃知行之果惟艱也此篇為雊雉作而進戒之言不及災異獨指大公之道示之非祖己諷諫不敢直言蓋髙宗聰明從諫不待深言也西伯戡黎西伯文王也名昌姓姬氏戡勝也黎國名在上黨壺關之地案史記文王脫羑里之囚獻洛西之地紂賜弓矢鈇鉞使得專征伐為西伯文王既受命黎為不道於是舉兵伐而勝之祖伊知周德日盛既已戡黎紂惡不悛勢必及殷故恐懼奔告于王庶幾王之改之也史録其言以為此篇誥體也今文古文皆有或日西伯武王也史記嘗載紂使膠鬲觀兵膠鬲問之曰西伯曷為而來則武王亦繼文王為西伯矣纂疏黎在漢上黨郡壺關紂都朝歌上黨在朝歌之西黎近畿之國也西伯既戡黎祖伊恐奔告于王下文無及戡黎之事史氏特標此篇首以見祖伊告王之因地祖姓伊名祖己後也奔告自其邑奔走來告紂也曰天子天既訖我殷命格人元龜罔敢知吉非先王不相我後人惟王淫戲用自絶祖伊將言天訖殷命故先呼天子以感動之訖絶也格人猶言至人也格人元龜皆能先知吉凶者言天既已絶我殷命格人元龜皆無敢知其吉者甚言凶禍之必至也非先王在天之靈不佑我後人我後人淫戲用自絶于天耳纂疏西伯戡黎便是這箇事難判斷觀戡黎大故逼近紂都了豈有臣子而敢稱兵於天子之都乎看來文王只是不伐紂耳其他事亦都做了如伐崇戡黎之類退之云臣罪當誅兮天王聖明伊川以為此説出文王心來嘗疑這箇説得來太過據當日事勢觀之恐不如此若説文王終守臣節何故伐崇侯虎只是後人因孔子以服事殷一句遂委曲回護箇文王説教好看殊不知孔子只是説文王不伐紂耳嘗見雜説云紂殺九侯鄂侯爭之強辨之疾併醢鄂侯西伯聞之竊歎崇侯虎譛之曰西伯欲叛紂囚之羑里西伯歎曰父有不慈子不可以不孝君有不明臣不可以不忠豈有君而可叛者乎諸侯聞之以西伯能敬上而恤下也遂相率歸之看來只這般説得平問西伯舊説多指文王惟陳少南吕伯恭薛季隆以為武王吳才老亦曰戡黎恐是伐紂時事二説執是答曰此等無證據可且缺之故天棄我不有康食不虞天性不迪率典康安虞度也典常法也紂自絶於天故天棄殷不冇康食飢饉薦臻也不虞天性民失常心也不迪率典廢壞常法也纂疏孔氏曰宗廟不有安食夏氏曰言不得安食所謂雖有粟吾得而食諸無一飯之安也愚案詩云自天降康豐年穰穰豐穰為降康則不有康食為天降飢饉明矣書之言性此第三見蓋謂所受於天之性為私欲所昏蔽而不能自省察也惟不自省察其天性是以不蹈迪率循乎典常凡此皆謂紂也今我民罔弗欲喪曰天曷不降威大命不摰今王其如台大命非常之命摰至也史記云大命胡不至民苦紂虐無不欲殷之亡曰天曷不降威於殷而受大命者何不至乎今王其無如我何言紂不復能君長我也上章言天棄殷此章言民棄殷祖伊之言可謂痛切明著矣王曰嗚呼我生不有命在天紂歎息謂民雖欲亡我我之生獨不有命在天乎祖伊反曰嗚呼乃罪多參在上乃能責命于天紂既無改過之意祖伊退而言曰爾罪衆多參列在上乃能責其命於天耶吕氏曰責命於天惟與天同德者方可纂疏吕氏曰責命于天必大人與天合德如孔子謂天生德於豫天未喪斯文桓魋匡人其如豫何是也殷之即喪指乃功不無戮于爾邦功事也言殷即喪亡矣指汝所為之事其能免戮于商邦乎蘇氏曰祖伊之諫盡言不諱漢唐中主所不能容者紂雖不改而終不怒祖伊得全則後世人主有不如紂者多矣愚讀是篇而知周德之至也祖伊以西伯戡黎不利於殷故奔告于紂意必及西伯戡黎不利於殷之語而入以告后出以語人未嘗有一毫及周者是知周家初無利天下之心其戡黎也義之所當伐也使紂遷善改過則周將終守臣節矣祖伊殷之賢臣也知周之興必不利於殷又知殷之亡初無與於周故因戡黎告紂反覆乎天命民情之可畏而略無及周者文武公天下之心於是可見纂疏孔氏曰商之就亡指汝事功所致氏葉氏曰凡事積而成者皆曰功王十朋曰指乃功與府辜功之功同辜功猶言罪狀吕氏曰伊反於家亦無咎周之辭大凡作事黨及親姻以為是未必是仇敵亦是之則是可知矣於此知周之盛德愚謂即喪即日喪亡也指乃功此汝之事功當屬上句微子微國名子爵也微子名啓帝乙長子紂之庶母兄也微子痛殷之將亡謀於箕子比干史鏦其問答之語亦誥體也以篇首有微子二字因以名篇今文古文皆有纂疏孔氏曰微圻內國名唐孔氏曰鄭玄謂微箕俱在圻內吕氏曰天下有道君子相與公議於朝各盡致君之道天下無道則相與私議於家各盡致身之道微子與二師宗室大臣與社稷為存亡當紂之時無所致力不得已謀各行其志以不失其義欲知三仁之心此篇可見陳氏經曰賢人君子忠孝之心不見於安平無事之際每見於悲傷惻怛之時張氏震曰比干獨志於死故不復有言微子若曰父師少師殷其弗或亂正四方我祖砥遂陳于上我用沉酗于酒用亂敗厥德于下父師太師三公箕子也少師孤卿比干也弗或者不能或如此也亂治也言紂無道無望其能治正天下也砥致陳列也我祖成湯致功陳列于上而子孫沉酗于酒敗亂其德于下沉酗言我而不言紂者過則歸己猶不忍斥言之也纂疏司馬彪注莊子云箕子名胥餘不知所本王肅云箕子紂諸父家語云比干紂諸父孔氏曰遂成也湯致遂其功陳列于上釋文以酒為凶曰酗吕氏曰沉酗紂自為微子歸之我者蓋以君為體視同己過以商家體統言之故總而言我亦不忍斥言紂也如五子之歌曰萬姓仇豫愚謂敗于下對陳于上言祖在上如彼子孫在下如此忝厥祖甚矣殷罔不小大好草竊姦宄卿士師師非度凡有辜罪乃罔恆獲小民方興相為敵讎今殷其淪喪若涉大水其無津涯殷遂喪越至于今殷之人民無小無大皆好草竊姦宄上而卿士亦皆相師非法上下容隱几有冒法之人無有得其罪者小民無所畏懼強陵弱衆暴寡方起讎怨爭鬬侵奪綱紀蕩然淪喪之形茫無畔岸若涉大水無有津涯殷之喪亡乃至於今日乎微子上陳祖烈下述喪亂哀怨痛切言有盡而意無窮數千載之下猶使人傷感悲憤後世人主觀此亦可深監矣纂疏孔氏曰草野竊盜愚謂有罪罔常獲紂為逋逃主如楚無宇之閽逃入王宫執法者不能得之也越及也曰父師少師我其發出狂吾家耄遜于荒今爾無指告豫顛隮若之何其曰者微子更端之辭也何其語辭言紂發出顛狂暴虐無道我家老成之人皆逃遁于荒野危亡之勢如此今爾無所指示告我以顛隕隮墮之事將若之何哉蓋微子憂危之甚特更端以問救亂之䇿言我而不言紂者亦上章我用沉酗之義纂疏孔氏曰我念商亡發疾生狂在家耄亂欲遁荒野言愁悶汝無指意告我商邦隕墜如之何其救之吕氏曰欲遁荒野使耳目不聞見紂所為張氏曰此微子有去之之意陳氏經曰老成皆遁留者父師少師耳鄭氏曰其語助辭齊魯間聲讀如姬記曰何居義與此同父師若曰王子天毒降災荒殷邦方興沉酗于酒此下箕子之答也王子微子也自紂言之則紂無道故天降災自天下言之則紂之無道亦天之數箕子歸之天者以見其忠厚敬君之意與小旻詩言旻天疾威敷于下土意同方興者言其方興而未艾也此答微子沉酗于酒之語而有甚之之意下同纂疏王氏炎曰自此以下箕子以其意剖析微子之言而答之孔氏曰比干不見明心同省文愚謂紂之惡皆原於酒若天使然乃無所歸咎之辭惟紂方興沉酗故下民亦方興為讎乃罔畏畏咈其耉長舊有位人乃罔畏畏者不畏其所當畏也孔子曰君子有三畏畏天命畏大人畏聖人之言咈逆也耉長老成之人也紂惟不畏其所當畏故老成舊有位者紂皆咈逆而棄逐之即武王所謂播棄黎老者此答微子發狂耄遜之語以上文特發問端故此先答之今殷民乃攘竊神祗之犧牷牲用以容將食無災色純曰犧體完曰牷牛羊豕曰牲犧牲牲祭祀天地之物禮之最重者猶為商民攘竊而去有司用相容隱將而食之且無災禍豈特草竊姦宄而已哉此答微子革竊姦宄之語纂疏孔氏曰器實曰用唐孔氏曰犧牷牲皆為爼實則用當為簠簋之實謂黍稷稻粱息齋余氏曰周禮小宗伯掌五禮之禁令與其用等注云用等牲器尊卑之差是牲與器皆可謂之用也春秋僖十九年邾子執鄫子用之謂之牲也然則犧牷牲用之用乃一物而異名耳若以用字屬下句兩句皆不成文降監殷民用乂讎斂召敵讎不怠罪合于一多瘠罔詔讎斂若仇敵掊斂之也不怠力行而不息也詔告也下視殷民凡上所用以治之者無非讎斂之事夫上以讎而斂下則下必為敵以讎上下之敵讎實上之讎斂以召之而紂方且召敵讎不怠君臣上下同惡相濟合而為一故民多飢莩而無所告也此答微子小民相為敵讎之語商今其有災我興受其敗商其淪喪我罔為臣僕詔王子出迪我舊云刻子王子弗出我乃顛隮商今其有災我出當其禍敗商若淪喪我斷無臣僕他人之理詔告也告微子以去為道蓋商祀不可無人微子去則可以存商祀也刻害也箕子舊以微子長且賢勤帝乙立之帝乙不從卒立紂紂必忌之是我前日所言適以害子子若不去則禍必不免我商家宗祀始隕墜而無所托矣箕子自言其義決不可去而微子之義決不可不去也此答微子淪喪顛隮之語纂疏愚謂箕子自言我罔為臣僕其後終不臣周不負斯言矣發狂耄遜以為微子自謂亦通蓋微子本有欲去之意故箕子於此贊其決去前後文尤相照應自靖人自獻于先王我不顧行遁上文既答微子所言至此則告以彼此去就之義靖安也各安其義之所當盡以自達其志於先王使無愧於神明而已如我則不復顧行遁也案此篇微子謀於箕子比干箕子答如上文而比干獨無所言者得非比干安於義之當死而無復言歟孔子曰殷有三仁焉三仁之行雖不同而皆出乎天理之正各得其心之所安故孔子皆許之以仁而所謂自靖者即此也又案左傳楚克許許男面縛銜璧衰絰輿櫬以見楚子楚子問諸逢伯逢伯曰昔武王克商微子啓如是武王親釋其縳受其璧而袚之焚其櫬禮而命之然則微子適周乃在克商之後而此所謂去者特去其位而逃遁於外耳論微子之去者當詳於是纂疏董銖問比干初心豈欲徒死以沽名所以諫者庶幾言行而紂改耳紂不改而言益切故紂殺之比干不得而逃死也箕子初心亦豈欲隱晦以苟全其生亦猶比干冀諫行而紂改耳紂不改而囚之偶不死耳紂囚之而不置之死則箕子豈欲自經溝瀆而為匹夫之諒哉故因佯狂為奴蓋亦未欲即死庶幾彌縫其失而冀萬有一之開悟耳諫行而紂改者二子之本心諫不行而或死或囚二子所遇之不同耳使紂而囚比干意比干亦未敢即死使紂而殺箕子箕子敢求全哉至於箕子為微子計意謂吾舊所云足以害子紂本疑吾二人子若起諫紂則紂益生疑非惟不從害必先及子而并我危矣死不足惜未有毫髮益於紂而遽死可惜也東萊謂人先有疑心則雖盡忠與言而未必聽蓋疑心先入而為之主故也故微子不可留義當逃去萬有一全宗祀可也三子制行不同各出於至誠惻怛之心無所為而為之並稱三仁或以此歟先生答曰此説得之史記亦説箕子諫而見囚也三仁之心只欲紂改過而圖存比干之殺身蓋非得已箕子亦偶未見殺耳非有意於為奴也事勢既爾微子亦只得全身以存宗祀皆理不得不然使其失有殺身強諫之心則亦不得為仁人矣箕子比干都是一樣心箕子偶然不衝著紂之怒不殺他然見比干恁地死若更死諫無益於國徒使君有殺諫臣之名他處此最難微子去却易比干一向諫死又却索性箕子在半上落下最是難處被他監繫在那裏不免佯狂所以易中特説箕子之明夷可見其難處故曰利艱貞晦其明也內難而能正其志箕子以之他外雖狂心則定也張氏庭堅曰君子之去就死生其志在於天下國家而不在於一身故其死者非沽名生者非懼禍引身以去者非忘君也故微子得奉先之孝比干盡事君之節箕子全愛君之仁微子自獻以其孝箕子比干自獻以其忠然書載箕子微子之言而比干不與焉蓋人臣之義莫易明於死節莫難明於去國而屈辱用晦者尤所難辨也家氏養正曰自靖各處其所安也安則仁矣宜夫子稱其仁張氏曰三仁之志各有所在微子自謀存宗祀以獻于先王比干自謀死諌以獻于先王箕子自謀俟君悔過以獻于先王後世以死生為重古人以義禮為重後世志慮淺狹故見死為髙節古人志慮廣大故以死為常事或去或死或生初無髙下義之所在三人各安之矣愚謂我以不去為義之所安微子則以去為義之所安也反之吾心而果安則獻之先王而無愧對越先王之心不外乎吾心而已若比干則死其心之所安歟箕子又謂若我則留而不去不復顧慮行遁矣附李白比干廟碑昔殷王毒痛公獨死之非捐生之難處死之難故不可死而死是輕其生非孝也可死而不死是重其死非忠也周武以三分之業有諸侯之師實其十亂之謀總其一心之衆當公之存也乃戢彼西土及公之喪也乃渡于孟津公存而殷存公喪而殷喪興亡兩繫豈不重歟夫子稱殷有三仁豈無微旨敢頌之曰存其身存其宗亦仁矣存其名存其祀亦仁矣亡其身圖其國亦仁矣若進死者退生者狂狷之士將奔走之褒生者貶死者宴安之人將置力焉故同歸諸仁各順其志栁子厚箕子碑當其周時未至殷祀未殄比干已死微子已去向使紂惡未稔而自斃武庚念亂以圖存國無其人誰與興理是固人事之或然者也然則先生隱忍而為此其有志於斯乎書集傳纂疏卷三
