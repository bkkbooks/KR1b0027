body:
  text: 書集傳纂疏卷一元陳櫟撰朱子訂定蔡氏集傳虞書虞舜氏因以為有天下之號也書凡五篇堯典雖紀唐堯之事然本虞史所作故曰虞書其舜典以下夏史所作當曰夏書春秋傳亦多引為夏書此云虞書或以為孔子所定也堯典堯唐帝名説文曰典從册在丌上尊閣之也此篇以簡册載堯之事故名曰堯典後世以其所載之事可為常法故又訓為常也今文古文皆有纂疏吕氏曰二典如易之有乾坤字丌巨基反愚按丌即今板閣形也典册在丌上在六書為象形曰若稽古帝堯曰放勳欽明文思安安允恭克讓光被四表格于上下曰粵越通古文作粵曰若者發語辭周書越若來三月亦此例也稽考也史臣將敘堯事故先言考古之帝堯者其德如下文所云也曰者猶言其説如此也放至也猶孟子言放乎四海是也勳功也言堯之功大而無所不至也欽恭敬也明通明也敬體而明用也文文章也思意思也文著見而思深逺也安安無所勉強也言其德性之美皆出於自然而非勉強所謂性之者也允信克能也常人德非性有物欲害之故有強為恭而不實欲為讓而不能者惟堯性之是以信恭而能讓也光顯被及表外格至上天下地也言其德之盛如此故其所及之逺如此也蓋放勳者總言堯之德業也欽明文思安安本其德性而言也允恭克讓以其行實而言也至於被四表格上下則放勳之所極也孔子曰惟天為大惟堯則之故書敘帝王之德莫盛於堯而其贊堯之德莫備於此且又首以欽之一字為言此書中開卷第一義也讀者深味而有得焉則一經之全體不外是矣其可忽哉纂疏朱子語録曰曰若稽古帝堯是作書者敘起元城引古文粵若其説是德堯是初頭第一箇聖人堯典是第一篇典籍説堯之都未下别字欽是第一箇字聖賢千言萬語大事小事莫不本於敬敬敬是徹上徹下工夫做到聖人田地也只放下這箇不得如堯舜也只是一箇敬頌堯之德獨將欽字為首欽敬是箇本領能敬便能明惟明故文理詳察粲然可觀而意思自是深逺問思字曰作去聲讀為是明安安只是重疊字若小心翼翼成性存存言堯之欽文思皆出於自然不勉強也在吕氏祖謙曰散而在外則為文欽明之發見也藴而內則為思欽明之潛蓄也文思表裏之謂陳氏經曰安安安之至也如云存存與吕氏大臨曰格極其所至也其德之盛上下天地同流也克明俊德以親九族九族既睦平章百姓百姓昭明協和萬邦黎民於變時雍明明之也俊大也堯之大德上文所稱是也九族髙祖至玄孫之親舉近以該逺五服異姓之親亦在其中也睦親而和也平均章明也百姓畿內民庶也昭明皆能自明其德也萬邦天下諸侯之國也黎黑也民首皆黑故曰黎民於歎美辭變變惡為善也時是雍和也此言堯推其德自身而家而國而天下所謂放勳者也纂疏語録克明俊德只是説堯之德與文王克明德同問古注作明俊德之人曰看文勢不見有用人意氏九族且從古注族問九族謂上至髙祖下至玄孫林謂如此只是一九族者父族四母族三妻族二是否曰父族謂本族姑之夫姊妹之夫女子之夫家母族謂母之本族母族與姨母之家妻族則妻之本族與其母族是也上殺下殺旁殺只看所畫宗族圖可見九族以三族言者較大平章百姓只是近處百姓黎民合天下民言之典謨中百姓只是説民如罔咈百姓之類若國語説百姓則多説百官族姓是百姓昭明乃三綱五常皆分曉及與他分别善惡辨與非孔氏曰上自髙祖下至玄孫凡九族馬鄭同夏侯氏曰父族四母族三妻族二歐陽同唐孔氏曰喪服小記云親親以三為五以五為九上殺下殺旁殺而親畢矣睦即親章即明雍即和也變文以類相對耳王氏曰親親之也睦交相親也唐氏曰睦者親之應昭明者平章之應時雍者協和之應直陳氏大猷曰於如於穆之於神化之妙難以形容與言變者氣象不侔矣也真氏德秀曰欽明文思者衆德之目俊德即其總名明俊德者修身之事其下即齊家治國平天下之事北帝者為治之序也先言堯自明己德後言平章百姓百姓昭明言新民而民亦明其德也大學以明明德為新民之本與修身齊家治國平天下之序蓋本之堯典也堯典其大學之宗祖歟愚按大學曰克明俊德皆自明也孔注之非可見以修齊治平論此章始於司馬公稽古録朱子從之真氏又揭此章冠大學衍義一書且以為大學之宗祖至論也克明俊德者明此德之全體大用也以親九族至時雍皆推此德之大用舉天地間盡在泰和中矣傳謂堯推其德自身而家國天下所謂放勳者也即指此為放勳帝德之所推即功勳之所至豈功自功德自德哉九族傳本孔氏而併該夏侯氏也乃命羲和欽若昊天歷象日月星辰敬授人時乃者繼事之辭羲氏和氏主歷象授時之官若順也昊廣大之意歷所以紀數之書象所以觀天之器如下篇璣衡之屬是也日陽精一日而繞地一周月隂精一月而與日一會星二十八宿衆星為經金木水火土五星為緯皆是也辰以日月所會分周天之度為十二次也人時謂耕穫之候凡民事早晚之所關也其説詳見下文纂疏語録羲和即是那四子或謂有羲伯和伯共六人未必是歷歷是古來一件大事故炎帝以鳥名官首曰鳯鳥氏正也嵗月日時既定則百工之事可考其成見厯是書象是器無歷無以知三辰之所在無象無以三辰之所在孔氏曰重黎之後羲氏和氏世掌天地四時之官又吕刑注重即羲黎即和馬融曰羲氏掌天和氏掌地四子掌四時楚語曰顓頊命南正重司天以屬神火正黎司地以屬民堯復育重黎之後不忘舊者使復典之揚雄曰羲近重和近黎月唐孔氏曰日月所會之辰正月會亥其辰為陬訾二戌為降婁三月酉為大梁四月申為實沈五月未為鶉首六月午為鶉火七月巳為鶉尾八月辰為夀星九月卯為大火十月寅為析木十一月丑為星紀十二月子為玄枵舉人所見曰星論日月所會曰辰會愚按正月建寅寅與亥合二月建卯卯與戌合辰所與月建合他倣此之吕氏曰作歷之前欽若昊天是先天而天弗違作歷後敬授人時是後天而奉天時皆以欽敬為主莫程子曰事之最大最先在推測天道治歷明時萬事不本於此修齊治平治之道也順時治歷創制立度治之法也司王氏曰少昊命官鳯鳥氏司歷玄鳥氏司分伯趙氏至青鳥氏司啓丹鳥氏司閉位五鳩五雉九扈之上重歷官如此堯世步占曰欽敬寅最為謹嚴及夏羲和合為一其官已略至周太史正嵗年以下大夫為之馮相氏掌日月星辰以中士為之其官益輕蓋創始造端推測天度非上智不能及成法已具有司守之亦可步占始重終輕其勢然也兩愚謂重黎自掌天地神歷羲和自掌四時作歷當是官紛紛之説不足泥四子先總命之繼分命之末又總命之雖分方與時其實通掌如今太史院春官正雖分四時實通兼云分命羲仲宅嵎夷曰㿩谷寅賔出日平秩東作日中星鳥以殷仲春厥民析鳥獸孳尾此下四節言歷既成而分職以頒布且考驗之恐其推步之或差也或曰上文所命蓋羲伯和伯此乃分命其仲叔未詳是否也宅居也嵎夷即禹貢嵎夷既略者也曰㿩谷者取日出之義羲仲所居官次之名蓋官在國都而測候之所則在於嵎夷東表之地也寅敬也賔禮接之如賔客也亦帝嚳歷日月而迎送之意出日方出之日蓋以春分之旦朝方出之日而識其初出之景也平均秩序作起也東作春月嵗功方興所當作起之事也蓋以歷之節氣早晚均次其先後之宜以授有司也日中者春分之刻於夏永冬短為適中也晝夜皆五十刻舉晝以見夜故曰日星鳥南方朱鳥七宿唐一行推以鶉火為春分昏之中星也殷中也春分陽之中也析分散也先時冬寒民聚於隩至是則以民之散處而驗其氣之溫也乳化曰孳交接曰尾以物之生育而驗其氣之和也纂疏語録古字宅度通用宅嵎夷之類恐只是四方度其日影以作歷耳如唐時尚使人去四方觀望賔出日是推測日出時候餞納日是推測日入時候如土圭之法是也暘谷南交昧谷幽都是測日景之處宅度也古書度字有作宅字者東作南訛西成朔易皆節候也東作如立春至雨水節之類寅賔求之日星鳥求之夜析因夷隩非使民如此民自如此因者因其析後之事夷者萬物收成民皆優逸之意孳尾至氄毛亦是鳥獸自然如此如今歷書記鳴鳩拂羽等事物平秩東作之類只如今穀雨芒種節候耳林氏依萬作之作説即此意東作是言萬物皆作物皆有發動之意與南訛西成一類非是令民耕作楚詞注在地之位一定不易在天之象運轉不停惟天之鳥星加地之午位乃與地合得天運之正治王氏曰分命使分隂陽而治之也申命使繼二仲而之也氏孔氏曰暘明也日出於谷而天下明故曰暘谷宅蘇曰測候日景以定分至必驗之四極之地非常也春唐孔氏曰居治東方之官官在帝都而遙統領之以位在東因治於東方其實主四方春政林氏曰東作謂萬物發生於東非全取農作之意曽云春為陽中萬物以生秋為隂中萬物以成且引詩薇亦作止老子萬物並作為證可補先儒之失鄭孫氏曰仲春陽中故舉日仲秋隂中故舉宵永嘉氏曰二十八宿環列四方隨天運轉角亢至箕東宿也斗女至璧北宿也奎婁至參西宿也井鬼至軫南宿也四方有定星而星無定居各以時見於南方天形北傾故北極居天之中而常在人北二十八宿常半隱半見分至日初昏時必於南方考之惟仲春四方之星各居其位火東鳥南昴西虛北至仲夏則鳥轉而西火轉而南虛轉而東昴轉而北至仲秋則火轉而西虛轉而南昴轉而東鳥轉而北至仲冬則虛轉而西昴轉而南鳥轉而東火轉而北來嵗仲春則鳥又轉而南矣考中星以定四時法簡而明唐孔氏曰星鳥總舉七宿以象言星火以次言蓋指房心虛昴以宿言互相通也可張氏曰南言星鳥則東之蒼龍北之玄武西之白虎知東言大火則南之鶉火西之大梁北之玄枵可知西言虛北言昴則東之房南之星可知皆互見也愚按諸家皆以分命申命四節為作歷時事姑以羲仲言使待春分之旦識出日之景然後作春歷何及乎惟詩傳以為歷既成而審驗考訂之方為可通蓋乃命之初既按歷象成法以作歷至此又恐或戾於法而審驗之以謹後來之歷此敬重之至也古必以季冬頒來嵗之朔豈必待分至而後觀日景乎申命羲叔宅南交平秩南訛敬致日永星火以正仲夏厥民因鳥獸希革申重也南交南方交趾之地陳氏曰南交下當有曰明都三字訛化也謂夏月時物長盛所當變化之事也史記索隱作南為謂所當為之事也敬致周禮所謂冬夏致日蓋以夏至之日中祠日而識其景如所謂日至之景尺有五寸謂之地中者也永長也日永晝六十刻也星火東方蒼龍七宿火謂大火夏至昏之中星也正者夏至陽之極午為正陽位也因析而又析以氣愈熱而民愈散處也希革鳥獸毛希而革易也纂疏語録致日乃考日中之景如土圭之法寅賔賔其出寅餞餞其入敬致致其中北方不説者北方無日故也劉氏敞曰本言宅南曰交趾傳寫脫二字耳日林氏曰敬致猶周官冬夏致日左傳日官居卿以砥前天文志云日有黃道黃道北至東井去北極近南至牽牛去北極逺夏至至東井近極故晷短立八尺之表而晷景長一尺五寸八分冬至至牽牛逺極故晷長立八尺之表而晷景長一丈三尺一寸三分晷景者所以知日之南北也春秋分日至婁角去極中而晷中立八尺之表而晷景長七尺三寸六分此日去極逺近之差晷景長短之制也分命和仲宅西曰昧谷寅餞納日平秩西成宵中星虛以殷仲秋厥民夷鳥獸毛毨西謂西極之地也曰昧谷者以日所入而名也餞禮送行者之名納日方納之日也蓋以秋分之莫夕方納之日而識其景也西成秋月物成之時所當成就之事也宵夜也宵中者秋分夜之刻於夏冬為適中也晝夜亦各五十刻舉夜以見日故曰宵星虛北方玄武七宿之虛星秋分昏之中星也亦曰殷者秋分隂之中也夷平也暑退而人氣平也毛毨鳥獸毛落更生潤澤鮮好也纂疏孔氏曰日入於谷而天下冥故曰昧谷昧谷曰西則嵎夷東可知申命和叔宅朔方曰幽都平在朔易日短星昴以正仲冬厥民隩鳥獸氄毛朔方北荒之地謂之朔者朔之為言蘇也萬物至此死而復蘇猶月之晦而有朔也日行至是則淪於地中萬象幽暗故曰幽都在察也朔易冬月嵗事已畢除舊更新所當改易之事也日短晝四十刻也星昴西方白虎七宿之昴宿冬至昏之中星也亦曰正者冬至隂之極子為正隂之位也隩室之內也氣寒而民聚於內也氄毛鳥獸生耎毳細毛以自溫也蓋既命羲和造歷制器而又分方與時使各驗其實以審夫推步之差聖人之敬天勤民其謹如是是以術不違天而政不失時也又按此冬至日在虛昏中昴今冬至日在斗昏中璧中星不同者蓋天有三百六十五度四分度之一嵗有三百六十五日四分日之一天度四分之一而有餘嵗日四分之一而不足故天度常平運而舒日道常內轉而縮天漸差而四嵗漸差而東此嵗差之由唐一行所謂嵗差者是也古歷簡易未立差法但隨時占候修改以與天合至東晉虞喜始以天為天以嵗為嵗乃立差以追其變約以五十年退一度何承天以為太過乃倍其年而又反不及至隋劉焯取二家中數七十五年為近之然亦未為精密也因附著於此纂疏語録朔易亦是時侯嵗一改易於此有終而復始之意今造歷者無定法只是趕趂天之行度以求合或過則損不及則益所以多差意古歷書必有一定之法而今亡矣三代而下造歷者紛紛莫有定法愈精密而愈多差由不得古人一定之法故也季通嘗言天之運無常日月星辰積氣皆動物也其行度疾徐或過不及自是不齊使我之法能運乎天而不為天所運則其疏密遲速或過不及之間不出乎我此虛寬之大數總有差忒皆可推而不失矣何者以我之有定而律彼之無定自無差也又言非是天運無定乃是行度如此其行之差處亦是常度但後之造歷者為數窄狹而不足以盡之耳此唐孔氏曰改易者謹蓋藏行積聚詩云曰為改嵗入室處釋宫云西南隅謂之隩室中隱隩處也王氏曰北方以位言則日月星辰之象皆伏而不見以時言則草木歸根昆蟲皆有隱伏意故曰幽都孫氏覺曰在者存而有察意朔者終而有始意嵗吕氏曰北方終其隂而復始其陽故曰朔方既成今之終又慮來嵗之始故曰朔易終而復始天地生生不窮之道艮終始萬物之意也胡氏旦曰孔訓隩為室是音烏到反故疏引爾雅西南隅為隩陸音於六反馬融云暖也是民就隩暖處也顧氏臨曰月令仲春日在奎仲夏在東井仲秋在角仲冬在斗與書不同蓋天道三十年小變百年中變五百年大變故曰羲農之歷不可用於堯舜之時堯舜之歷不可用於夏商之際時愚按詩傳謂今冬至日在斗昏璧中所謂今者文公也今日又不同矣近嵗方氏回當至元十八年辛巳作山經序有曰今冬至日在箕九度昏室中由此觀之豈可不用嵗差法隨時治歷以與天合哉又豈可執經膠泥以求與古合哉帝曰咨汝羲暨和期三百有六旬有六日以閏月定四時成嵗允釐百工庶績咸熙咨嗟也嗟嘆而告之也暨及也期猶周也允信釐治工官庶衆績功咸皆熙廣也天體至圓周圍三百六十五度四分度之一繞地左旋常一日一周而過一度日麗天而少遲故日行一日亦繞地一周而在天為不及一度積三百六十五日九百四十分日之二百三十五而與天會是一嵗日行之數也月麗天而尤遲一日常不及天十三度十九分度之七積二十九日九百四十分日之四百九十九而與日會十二會得全日三百四十八餘分之積又五千九百八十八如日法九百四十而一得六不盡三百四十八通計得日三百五十四九百四十分日之三百四十八是一嵗月行之數也嵗有十二月月有三十日三百六十者一嵗之常數也故日與天會而多五日九百四十分日之二百三十五者為氣盈月與日會而少五日九百四十分日之五百九十二者為朔虛合氣盈朔虛而閏生焉故一嵗閏率則十日九百四十分日之八百二十七三嵗一閏則三十二日九百四十分日之六百單一五嵗再閏則五十四日九百四十分日之三百七十五十有九嵗七閏則氣朔分齊是為一章也故三年而不置閏則春之一月人於夏而時漸不定矣子之一月入於丑而嵗漸不成矣積之之久至於三失閏則春皆入夏而時全不定矣十二失閏子皆入丑嵗全不成矣其名實乖戾寒暑反易農桑庶務皆失其時故必以此餘日置閏月於其間然後四時不差而嵗功得成以此信治百官而衆功皆廣也纂疏語録天道左旋日月亦只左旋但天行健一日一夜而周常差過一度日月違天而退日是一日退一度月是一日退十三度有竒周天三百六十五度四分度之一每嵗只有三百六十日餘了五日四分日之一又除小月計六日所以置閏所餘六日為氣盈所少六日為朔虛如何見得天有三百六十五度甚麼人去量來只是天行得過處為度天之過處便是日之退處問周天之度是自然之數是強分曰天左旋一晝一夜行一周而又過了一度以其行過處一日作一度三百六十五度四分度之一方是一周只將南北表看今日恁時看有甚星在表處明日恁時看這星又差逺或别是一星了天道與日月五星皆是左旋天道日一周天而常過一度日一日一周天起度端終度端故比天道常不及一度月行不及天十三度十九分度之七今人却云月行速日行遲此錯説也但歷家以右旋為説取其易見日月之度耳義剛言伯靜云天是一日一周日則不及一度非天過一度也先生曰此説不是若云天一日一周則四時中星如何不同如此則日日一般却如何紀嵗把甚麼時節做定限若以天為不過而日不及一度則趲來趲去將次午時便打三更矣因取禮記月令疏指其中説早晚不同及更行一度兩處曰此説得甚分明其他歷書都不如此説蓋非不曉但是説滑了口後信口説習而不察更不去子細檢點而今若就天裏看時只是行得三百六十五度四分度之一若把天外來説則是一日過了一度季通嘗有言論日月則天裏論天則在太虛空裏若去太虛空裏觀那天自是日月滚得不在舊時處又曰天無體只二十八宿便是體且如日月皆從角起天亦從角起日則一日運一周依舊只在那角上天則一周了又過角些子日日纍上去則一年便是與日會橫渠説日月皆是左旋蓋天行甚健一日一夜周三百六十五度四分度之一又進過一度日行速健次於天一日一夜周三百六十五度四分度之一正恰好被天進一度則日為退一度二日天進二度則日為退二度積至三百六十五日四分日之一則天所進過之度又恰周得本數而日所退之度亦恰退盡本數遂與天會而成一年是謂一年一周天月行遲一日一夜行三百六十五度四分度之一不盡比天為退了十三度有竒至二十九日半強恰與天相值在恰好處是為一月一周天進數為順天而左退數為逆天而右歷家以進數難算只以退數算之故謂之右行且曰日行遲月行速也此問經星左旋緯星與日月右旋是否曰今諸家是如説橫渠説天左旋日月亦左旋極是只恐人不曉所以詩傳只載舊説歷家只算所退之度却云日行一度月行十三度有竒此乃截法故有日月五星右行之説其實非右行也橫渠云天左旋處其中者順之少遲則反右矣此説最好砥問日如何反行得遲於月曰正是月遲歷家是將退度數為進底度數且如月生於西一夜一夜漸漸向東便可見月退處如日比天行遲一度月比天行遲十三度有竒歷家若此説則算著那相去度數多今只以其相近處言故易算季通云西域有九執歷却是順算問何以推月之大小曰前月大則後月初二日月生明前月小則後月初三日月生明中氣只在本月若趲得中氣在月盡後月便當置閏孔氏曰匝四時曰期未盈三嵗足得一月則置閏焉以定四時之節氣成一嵗之歷象唐孔氏曰四分日之一入六日內舉全數言之十日九百四十分日之八百二十七為每嵗之實餘正十一日弱也毅齋沈氏曰天行速每日過一度進而與日會以成一期月行遲每日不及日十三度有竒退而與日會以成一月吳氏亨夀曰嵗無定日閏有定法期者一嵗之足日嵗者一嵗之省日閏者補三嵗之省日湊為三嵗之足日也天與人不相接曷從而量之天有三百六十五度四分度之一為周天之數人間有二百六十五日四分日之一為周嵗之數所不可知者天之度所可知者人間之日步日之法必一千四百六十一日然後日景復初即此而四分之則為四期足日之數故因周嵗有三百六十五日四分日之一所以知周天有三百六十五度四分度之一不然果何從而界天為幾度畫度為幾分哉因日以知度因嵗以知天此不易之論也陳氏普曰天繞地左旋東出西入一日一周而少過之日者天之精與天左旋日適一周以天之過而日少不及焉天日進而日日退也日非退也以天之進而見其退耳歷家謂日月右旋者蓋不計天之進而但以日月之退為右旋以背而為面也然苟不計天之進則是四時昏旦中星常不移矣無是理也説略見隋書歷志文公以為橫渠首發之蓋隋書之説略後人未有述之而橫渠首得其説耳積三百六十五日四分日之一而天與日復相遇於初進初退之地而為一年夫天日者氣數之始其每日之進退既有常則故一日之進退遂為一度三百六十五日四分日之一進退一周而周天之數遂為三百六十五度四分度之一而凡天之東西南北縱橫參伍與夫星辰逺近之相去月與五星之行皆以其度為度焉度數也則也天本無度以與日離合而成天日東西行其周布本東西而縱橫南北皆以其度為數見日者數之本日數既定而在天在地無非其度也月行遲常以二十七日于一十六分日之三百一十七而與天會二十九日九百四十分日之四百九十九而與日會一月一周天者以與日會言也其實二十七日有竒而周天又二日有竒始與日會文公注十月之交以為月二十九日有竒而周天又逐及於日而與日會蓋未詳也其不及天日之度於日之不及天既多十餘倍則其與天日會者自速十餘倍此日之所以嵗周而月之所以月周也日一年與天一會月一年與天十三會與日十二會其與天會者無所用故古今少道之天以日為天故與天會而為嵗功月於氣無與故其與天會者一無所用而僅以與日會者紀乎二十四氣之行日月每三十餘會而一閏兩閏之間謂十五十六會也但以晦朔弦望為度則漸違乎氣以晦朔弦望為度而閏以追之則雖暫違而常扳以及之日月一會二十九日半有竒二氣之日常在其內每三十餘會則中氣必出一會之外入再會之初而其月惟一氣在其月之中於此置閏天不用之而人用之也人用之者以望前半月終前月望後半月起後月終前月則月無久違而及日起後月則日有餘裕而待月農桑之候常不失序而人與天常不相違矣十九年七閏則日月二百三十五會與天日一十九會平等而無少不及故為一章也置金氏燧曰氣盈而不置閏則晦朔弦望差朔虛而不閏則春夏秋冬差氣盈不閏則立春為正月一日驚蟄為二月一日隨節氣而為月纍纍皆然當朔不朔當晦不晦安得合初一十五初八二十三之晦朔弦望乎朔虛不閏則只以三箇月為春三箇月為夏隨十二月為一嵗纍纍皆然而春非春秋非秋夏不熱冬不寒矣經三十三箇月則氣盈朔虛之數積及一月便合置閏閏所以消其盈而息其虛也大略經三十三箇月則消息停當氣節推移自然月內無中氣而為閏焉玉齋胡氏方平曰氣盈朔虛之數一嵗共計十日八百二十七分皆日之所以行而月之所不及者聖人於此置閏大槩以天與日會三百六十五日有竒者為主而為月置閏每嵗還以十日八百二十七分補月行不及日之數焉十九嵗七閏是積十九箇十日八百二十七分總計二百單六日六百七十三分至此則氣朔分齊其年冬至定在十一月朔是為至朔同日而成一章也五嵗再閏而五嵗餘數只有五十四日有竒實無再閏蓋聖賢言閏有舉成數者有舉實數者氣盈六日朔虛六日而再閏言於五嵗內者聖經舉成數也氣盈五日二百三十五分朔虛五日五百九十二分而再閏在六嵗內者賢傳舉實數也聖人惟言成數學者必究實數始可與言閏矣又曰欲知日行速月行遲其迹有易見者日月會於晦朔之間初一日晚最好看起日才西墜微茫之月亦隨之而墜矣至初二便相隔微濶初三生明後相去漸逺一日逺一日至十五日月望是日行進而逺至半天月行退而不及亦逺半天自十六至月晦日行全逺盡一天月行全不及亦盡一天矣即語録所謂日進盡本數月退盡本數而復相會也東董氏鼎曰天與日月之行自地面而觀其運行則皆升西沒繞地而左旋自天度而考其次舍則日月五星獨以漸而東為逆天而右轉蓋由其行不及天而次舍日以退然舍雖退而行未嘗不進也退雖逆而進未嘗不順也於天雖逆而右轉於地未嘗不順而左旋也儒家論天道則云順而左旋歷家紀天度則云日月五星逆而右轉然次舍雖逆趨向則順以天度考雖成右轉自地面觀仍是左旋明於天與地之説則知左旋右轉雖異而實同矣終愚謂分命申命四節舉正於中也以閏一節歸餘於也必於無中氣而置閏月以歸餘於終始可定中氣於四仲月而舉正於中四分度之一者周天全度外零度有一度四分中之一分也以配周嵗全日外零日亦有一日九百四十分中四分之一分該二百三十五分所謂四分日之一也月二十九日零四百九十九分而與日會四百九十九分乃六時三刻弱也十二會得十二箇二十九日餘分之積五千六百四十分以日法算之當得六日而得六者得六日也零者尚有三百四十八分撥入來嵗中三百四十八日加六日是一嵗通三百五十四日此一嵗小嵗之數也然經云期三百有六旬有六日者此一嵗大嵗之數也小嵗大嵗説本正義蓋今年立春至來年立春二十四氣全數該三百六十五日零二十五刻二十五刻即四分日之一亦以當一日舉成數而言故曰期三百有六旬有六日也二氣為一月必三十日零五時二刻始交後月節氣合二十四氣該三百六十五日零二十五刻此氣盈之溢數也十二月有六小盡者此朔虛之虧數也每一月三十日外添五時二刻者為多五日二十五刻故分屬之十二月中十二箇五時該五日十二箇二刻該二十四刻外僅剩一刻耳氣盈朔虛四字須勘破一年二十四氣以三百六十日言外多五日有竒是以氣言則盈而多也有餘也是為氣盈一年十二朔以三百六十日言內少五日有竒是以朔言則虛而少也不足也是為朔虛盈虛與易中消息盈虛同氣盈朔虛之積挨到無中氣之月即置閏閏月前半月追補前月節氣後半月預借後月節氣氣候先後只爭半月不至太過亦不至太不及然後四時定而嵗功成節氣之有餘與小盡之不足二者並行而不相悖因此有餘不足而置閏於其間以處之三者參合而交相成萬世不能易之法也正吕氏曰釐工熙績二句乃史紀堯因治歷明時而官立功非堯言也帝曰疇咨若時登庸放齊曰胤子朱啓明帝曰吁嚚訟可乎此下至鯀績用弗成皆為禪舜張本也疇誰咨訪問也若順庸用也堯言誰為我訪問能順時為治之人而登用之乎放齊臣名胤嗣也胤子朱堯之嗣子丹朱也啓開也言其性開明可登用也吁者歎其不然之辭嚚謂口不道忠信之言訟爭辨也朱蓋以其開明之才用之於不善故嚚訟禹所謂傲虐是也此見堯之至公至明深知其子之惡而不以一人病天下也或曰胤國子爵堯時諸侯也夏書有胤侯周書有胤之舞衣今亦未見其必不然姑存於此云纂疏語録自疇咨若時至篇末皆為禪位設也一舉而放齊舉朱再舉而歡兜舉共工三舉而四嶽舉鯀皆不得其人故卒以天下授舜問先稱朱啓明後又説他嚚訟如何曰今暗昧底人解健訟否惟是啓明方解嚚訟啓孔氏曰誰能順是事者將登用之吕氏曰君子因明以為善小人因啓明以為惡朱蓋有才而不善用之云愚謂溺愛者不明堯深知子之惡至明也史記載堯終不以天下之病而利一人至公也帝曰疇咨若豫采歡兜曰都共工方鳩僝功帝曰吁靜言庸違象恭滔天采事也都歎美之辭也歡兜臣名共工官名蓋古之世官族也方且鳩聚僝見也言共工方且鳩聚而見其功也靜言庸違者靜則能言用則違背也象恭貌恭而心不然也滔天二字未詳與下文相似疑有舛誤上章言順時此言順事職任大小可見纂疏語録方鳩僝功語未可曉此篇出於伏生便有此等處亦未灼然知僝功為見功且依古注説愚謂四凶之二堯已燭其同惡未及罪之舜受禪長惡不悛故卒誅之也帝曰咨四嶽湯湯洪水方割蕩蕩懷山襄陵浩浩滔天下民其咨有能俾乂僉曰於鯀哉帝曰吁咈哉方命圯族嶽曰異哉試可乃已帝曰往欽哉九載績用弗成四嶽官名一人而總四嶽諸侯之事也湯湯水盛貌洪大也孟子曰水逆行謂之洚水洚水者洪水也蓋水涌出而未泄故泛濫而逆流也割害也蕩蕩廣貌懷包其四面也襄駕出其上也大阜曰陵浩浩大貌滔漫也極言其大勢若漫天也俾使乂治也言有能任此責者使之治水也僉衆共之辭四嶽與其所領諸侯之在朝者同辭而對也於歎美辭鯀崇伯名歎其美而薦之也咈者甚不然之之辭方命者逆命而不行也王氏曰圓則行方則止方命猶今言廢閣詔令也蓋鯀之為人悻戾自用不從上令也圯敗族類也言與衆不和傷人害物鯀之不可用者以此也楚辭言鯀悻直是其方命圯族之證也嶽曰四嶽之獨言也異義未詳疑是已廢而復強舉之之意試可乃已者蓋廷臣未有能於鯀者不若姑試用之取其可以治水而已言無預他事不必求其備也堯於是遣之往治水而戒以欽哉蓋任大事不可以不敬聖人之戒辭約而意盡也載年也九載三考功用不成故黜之纂疏語録四嶽管領十二牧者通九官十二牧為二十二人則四嶽為一人矣堯欲巽以位不成是與四人問堯既知鯀如何又用之曰鯀也是有才智想只執拗自是所以楚辭説鯀悻直以亡身他治水必有不依道理處弄了八九年無收殺故舜殛之非孔氏曰異己也言餘人盡已惟鯀可試惟吕氏曰鯀無才恃才而不順理不能行所無事耳欽可治其病鯀不能用也堯時天下皆君子惟此三小人故書之乃春秋常事不書之意陳氏大猷曰祭法云禹能修鯀之功鯀非無功但不成耳共陳氏經曰聖人觀人觀其心術不觀其才朱之啓明之僝功鯀之試可其才豈無所長心術不正才適足為為惡之資耳帝曰咨四嶽朕在位七十載汝能庸命巽朕位嶽曰否德忝帝位曰明明揚側陋師錫帝曰有鰥在下曰虞舜帝曰俞豫聞如何嶽曰瞽子父頑母嚚象傲克諧以孝蒸蒸乂不格姦帝曰我其試哉女于時觀厥刑于二女釐降二女于媯汭嬪于虞帝曰欽哉朕古人自稱之通號吳氏曰巽遜古通用言汝四嶽能用我之命而可遜以此位乎蓋丹朱既不肖羣臣又多不稱故欲舉以授人而先之四嶽也否不通忝辱也明明上明謂明顯之下明謂已在顯位者揚舉也側陋微賤之人也言惟德是舉不拘貴賤也師衆錫與也四嶽羣臣諸侯同辭以對也鰥無妻之名虞氏舜名也俞應許之辭豫聞者我亦嘗聞是人也如何者復問其德之詳也嶽曰四嶽獨對也瞽無目之名言舜乃瞽者之子也舜父號瞽叟心不則德義之經為頑母舜後母也象舜異母弟名傲驕慢也諧和蒸進也言舜不幸遭此而能和以孝使之進進以善自治而不至於大為姦惡也女以女與人也時是刑法也二女堯二女娥皇女英也此堯言其將試舜之意也莊子所謂二女事之以觀其內是也蓋夫婦之間隱微之際正始之道所繫尤重故觀人者於此為尤切也釐理降下也媯水名在今河中府河東縣出歷山入河爾雅曰水北曰汭亦小水入大水之名蓋兩水合流之內也故從水從內蓋舜所居之地嬪婦也虞舜氏也史言堯治裝下嫁二女於媯水之北使為舜婦於虞氏之家也欽哉堯戒二女之辭即禮所謂往之女家必敬必戒者況以天子之女嫁於匹夫尤不可不深戒之也纂疏語録我其試哉至於二女皆堯言釐降至於虞乃史官之辭帝曰欽哉是堯戒二女之辭如所謂往之女家必敬必戒是也若如此看不解亦自分明釐訓治釐降只是經理二女下降時事天孔氏曰以女妻舜以治家觀治國起周子曰家難而下易家親而天下疏也家人離必於婦人故暌次家人以二女同居而志不同行也堯所以釐降二女于媯汭舜可禪乎吾兹試矣是治天下觀於家治家觀身而已矣蒸張氏曰刑謂以身儀之如詩刑于寡妻曽氏鞏曰如蒸之浮浮之蒸盛德上達化而熟之使不自知也不吕氏曰蒸蒸有熏灌意如甑炊物薪然不繼則氣息騰蒸蒸之功間斷不能熟物火既不歇自然蒸蒸以至於熟舜處頑嚚傲之間彼為惡之力日日不已非孝誠熏灌工夫源源力量安能勝之舜已居父母兄弟之至難堯又置之天下尤難之地平常俯育易分仰事之力况頑嚚傲之間以驕貴之二女處之此天下之至難舜無難焉使惡者不至於惡而貴者忘其為貴非至聖孰能之堯典一篇始終莫非欽敬始曰欽明終曰欽哉中曰允恭欽若敬授寅賔寅餞敬致往欽諄諄言之尤一書之綱領不但一篇之綱領也陳氏大猷曰舜自處頑嚚傲之間而盡其道固難使二女處焉而盡其道尤難使非化二女與已同德安能如此二女其亦舜之儔歟舜典今文古文皆有今文合於堯典篇無篇首二十八字唐孔氏曰東晉梅賾上孔傳闕舜典自乃命以位以上二十八字世所不傳多用王范之注補之而皆以慎徽五典以下為舜典之初至齊蕭鸞建武四年姚方興大航頭得孔氏傳古文舜典乃上之事未施行而方興以罪致戮至隋開皇初購求遺典始得之今按古文孔傳尚書有曰若稽古以下二十八字伏生以舜典合於堯典只以慎徽五典以上接帝曰欽哉之下而無此二十八字梅賾既失孔傳舜典故亦不知有此二十八字而慎徽五典以下則固具於伏生之書故傳者用王范之注以補之至姚方興乃得古文孔傳舜典於是始知有此二十八字或者由此乃謂古文舜典一篇皆盡亡失至是方全得之遂疑其偽蓋過論也纂疏程子曰舜典篇末載舜死是夏時所作可知與堯典虞時所作同曰若稽古帝舜曰重華協于帝濬哲文明溫恭允塞玄德升聞乃命以位華光華也協合也帝謂堯也濬深哲智也溫和粹也塞實也玄幽潛也升上也言堯既有光華而舜又有光華可合於堯因言其目則深沉而有智文理而光明和粹而恭敬誠信而篤實有此四者幽潛之德上聞於堯堯乃命之以職位也纂疏語録濬哲至允塞細分是八德合而言只是四事如玄德難曉書傳中無言玄者今避諱以玄為元甚非玄黃之玄本黑色孔氏曰舜有深智文明溫恭之德信充塞上下之程子曰此八事也凡論聖人必取其德之煥發者稱隨其所取不必同也故稱堯曰欽明文思稱文王曰徽柔懿恭稱孔子曰溫良恭儉讓譬論玉之美或取其色之溫潤或取其質之堅正或取其聲之清越舉其一則知其為寶矣同陳氏經曰重華協帝如明兩作離聖人繼出不約而自內形之外則濬哲之發所以為文明由外本乎內則溫恭之實所以為允塞王氏炎曰濬哲存於內發於外則為文明溫恭形於外根於內則為塞實此則光華之所從生者也愚謂舜德之光華與堯德之光華重故曰重華舜繼堯曰重華如武繼文曰重光濬哲至允塞之盛德自其光輝莫掩言之則曰重華自其幽潛未見言之則曰玄德幽潛之中光華出焉此與暗然而日章同意慎徽五典五典克從納于百揆百揆時敘賔于四門四門穆穆納于大麓烈風雷雨弗迷徽美也五典五常也父子有親君臣有義夫婦有别長幼有序朋友有信是也從順也左氏所謂無違教也此蓋使為司徒之官也揆度也百揆者揆度庶政之官惟唐虞有之猶周之冢宰也時序以時而敘左氏所謂無廢事也四門四方之門古者以賔禮親邦國諸侯各以方至而使主焉故曰賔穆穆和之至也左氏所謂無凶人也此蓋又兼四嶽之官也麓山足也烈迅迷錯也史記曰堯使舜入山林川澤暴風雷雨舜行不迷蘇氏曰洪水為害堯使舜入山林相視原隰雷雨大至衆懼失常而舜不迷其度量有絶人者而天地鬼神亦或有以相之歟愚謂遇烈風雷雨非常之變而不震懼失常非固聰明誠智確乎不亂者不能也易震驚百里不喪匕鬯意為近之纂疏語録問納大麓恐是為山虞之官曰若此則其職益卑且合從史記説雖遇烈風雷雨弗迷其道也若主祭之説某不敢信若是舜主祭而乃有風雷之變豈是好事夏氏曰徽典以下即命以位之事敷意徽有在寬意吕氏曰慎徽二字當玩味慎有敬王氏曰大麓泰山之麓也後世封禪之説傅會於此主李氏曰孟子謂使主事而事治即典從以下是也使事而神享即納大麓而弗迷是也孟子之言書之義疏也斯吕氏曰此處與堯以親至時雍同有夫子立斯立道行綏斯來動斯和之意愚按主祭之説姑存之以備參考帝曰格汝舜詢事考言乃言底可績三載汝陟帝位舜讓于德弗嗣格來詢謀乃汝底致陟升也堯言詢舜所行之事而考其言則見汝之言致可有功於今三年矣汝宜升帝位也讓於德讓於有德之人也或曰謙遜自以其德不足為嗣也纂疏吕氏曰敷言試功此唐虞觀人之成法舜登庸之初非特歷試以事必當敷陳以言故堯於此美其言與實稱也正月上日受終于文祖上日朔日也葉氏曰上旬之日曽氏曰如上戊上辛上丁之類未詳孰是受終者堯於是終帝位之事而舜受之也文祖者堯始祖之廟未詳所指為何人也纂疏唐孔氏曰受堯終帝位之事於堯文德之祖廟王氏炎曰文祖堯所從受天下者也吕氏曰堯為天下得人其責塞矣故曰受終言受終則舜正始可知在璿璣玉衡以齊七政在察也美珠謂之璿璣機也以璿飾璣所以象天體之轉運也衡橫也謂衡簫也以玉為管橫而設之所以窺璣而齊七政之運行猶今之渾天儀也七政日月五星也七者運行於天有遲有速有順有逆猶人君之有政事也此言舜初攝位整理庶務首察璣衡以齊七政蓋曆象授時所當先也按渾天儀者天文志云言天體者三家一曰周髀二曰宣夜三曰渾天宣夜絶無師説不知其狀如何周髀之術以為天似覆盆蓋以斗極為中中髙而四邊下日月傍行繞之日近而見之為晝日逺而不見為夜蔡雍以為考驗天象多所違失渾天説曰天之形狀如鳥卵地居其中天包地外猶卯之裹黃圓如彈丸故曰渾天言其形體渾渾然也其術以為天半覆地上半在地下其天居地上見者一百八十二度半強地下亦然北極出地上三十六度南極入地下亦三十六度而嵩髙正當天之中極南五十五度當嵩髙之上又其南十二度為夏至之日道又其南二十四度為春秋分之日道又其南二十四度為冬至之日道南下去地三十一度而已是夏至日北去極六十七度春秋分去極九十一度冬至去極一百一十五度此其大率也其南北極持其兩端其天與日月星宿斜而回轉此必古有其法遭秦而滅至漢武帝時洛下閎始經營之鮮于妄人又量度之至宣帝時耿夀昌始鑄銅而為之象宋錢樂又鑄銅作渾天儀衡長八尺孔徑一寸璣徑八尺圓周二丈五尺強轉而望之以知日月星辰之所在即璿璣玉衡之遺法也歷代以來其法漸密本朝因之為儀三重其在外者曰六合儀平置黑單環上刻十二辰八千四隅在地之位以準地面而定四方側立黑雙環背刻去極度數以中分天脊直跨地平使其半入地下而結於其子午以為天經斜倚赤單環背刻赤道度數以平分天腹橫繞天經亦使半出地上半入地下而結於其卯酉以為天緯三環表裏相結不動其天經之環則南北二極皆為圓軸虛中而內向以挈三辰四遊之環以其上下四方於是可考故曰六合次其內曰三辰儀側立黑雙環亦刻去極度數外貫天經之軸內挈黃赤二道其赤道則為赤單環外依天緯亦刻宿度而結於黑雙環之卯酉其黃道則為黃單環亦刻宿度而又斜倚於赤道之腹以交結於卯酉而半入其內以為春分後之日軌半出其外以為秋分後之日軌又為白單環以承其交使不傾墊下設機輪以水激之使其日夜隨天東西運轉以象天行以其日月星辰於是可考故曰三辰其最在內者曰四遊儀亦為黑雙環如三辰儀之制以貫天經之軸其環之內則兩面當中各施直距外指兩軸而當其要中之內面又為小窽以受玉衡要中之小軸使衡既得隨環東西運轉又可隨處南北低昻以待占候者之仰窺焉以其東西南北無不周遍故曰四遊此其法之大略也沈括曰舊法規環一面刻周天度一面加銀丁蓋以夜候天晦不可目察則以手切之也古人以璿飾璣疑亦為此今太史局祕書省銅儀制極精緻亦以銅丁為之歷家之説又以北斗魁四星為璣杓三星為衡今詳經文簡質不應北斗二字乃用寓名恐未必然姑存其説以廣異聞纂疏語録孔注謂舜察天文齊七政以審已當天心與否未必然只是從新整理起此是最先當理會者想書正義璣衡處説天體極好先説箇天看得此亦可象天之形與日月星辰之運進退疾徐之度皆有分數而歷數大槩亦可知矣愚按正義傳已采之但略節林氏曰璣運轉衡下望之以步七政之軌度時數轉璣窺衡兩不差焉故曰以齊其有不齊乃陵歷鬭食盈縮犯守者也璣之所見皆軌度時數之當然不如璣則為異矣日月五星其災祥與政事相應故曰七政陳氏經曰七者在天之政也君為天與日月星辰之主君有缺政則日月薄蝕星辰變動安得而齊意與欽若歷象同顔真氏曰舜初攝察璣衡以揆七政如人子事親候伺色惟恐少咈於親心此舜事天之敬也唐孔氏曰説文璿美玉也玉是大名璿其别稱璣衡俱飾以玉史之立文猶左氏瓊辨玉纓虞喜云宣明也夜幽也幽明之數其術兼之故曰宣夜髀音俾股也股者表也其治始於包羲周人志之故曰周髀蔡雍云即蓋天也渾天者以為地在其中天周其外日月初登於天後入於地晝則日在地上夜則日入地下太史所用候臺銅儀則其法也宋太史丞錢樂鑄銅儀傳於齊梁周平江陵器遷長安今在太史肆類于上帝禋于六宗望于山川遍于羣神肆遂也類禋望皆祭名周禮肆師類造於上帝注云郊祀者祭昊天之常祭非常祀而祭告於天其禮常依郊祀為之故曰類如泰誓武王伐商王制言天子將出皆云類於上帝是也禋精意以享之謂宗尊也所尊祭者其祀有六祭法曰埋少牢於泰昭祭時也相近於坎壇祭寒暑也王宫祭日也夜明祭月也幽宗祭星也雩宗祭水旱也山川名山大川五嶽四瀆之屬望而祭之故曰望遍周遍也羣神謂丘陵墳衍古昔聖賢之類言受終觀象之後即祭祀上下神祇以攝位告也纂疏語録六宗古注説得自好鄭氏宗讀為禜即祭法所謂祭時與寒暑日月星水旱者如此則先祭上帝次六宗次山川然後遍羣神次序皆順問張髦之説曰古昭穆不盡稱宗惟宗有德至唐廟盡稱宗不可為據王氏十朋曰肆遂也因前事而起後事之辭神鄭氏曰泰昭昭明也亦壇也時四時也亦謂隂陽之埋之者隂陽出入於地中也凡此以下皆祭用少牢相近讀為禳祈郤也求也寒於坎暑於壇王宫日壇夜明月壇宗讀為禜幽禜星壇雩禜水旱壇改蘇氏曰祭法所敘舜典之章句義疏也但鄭玄曲説宗為禜不可信耳輯五瑞既月乃日覲四嶽羣牧班瑞于羣后輯斂瑞信也公執桓圭侯執信圭伯執躬圭子執榖璧男執蒲璧五等諸侯執之以合符於天子而驗其信否也周禮天子執冒以朝諸侯鄭氏注云名玉以冒以德覆冒天下也諸侯始受命天子錫以圭圭頭斜鋭其冒下斜刻小大長短廣狹如之諸侯來朝天子以刻處冒其圭頭有不同者則辨其偽也既盡覲見四嶽四方之諸侯羣牧九州之牧伯也程子曰輯五瑞徴五等諸侯也此已上皆正月事至盡此月則四方諸侯有至者矣逺近不同來有先後故日日見之不如他朝會之同期於一日蓋欲以少接之則得盡其詢察禮意也班頒同羣后即侯牧也既見之後審知非偽則又頒還其瑞以與天下正始也纂疏語録問恐是王畿諸侯輯斂瑞玉是命圭合信如點檢牌印之屬曰不當指殺王畿如顧命太保率西方諸侯畢公率東方諸侯不數日諸侯皆至如此之速於陳氏大猷曰類帝而下見君受命天輯五瑞而下見臣受命於君嵗二月東巡守至于岱宗柴望秩于山川肆覲東后協時月正日同律度量衡修五禮五玉三帛二生一死贄如五器卒乃復五月南巡守至于南嶽如岱禮八月西巡守至于西嶽如初十有一月朔巡守至于北嶽如西禮歸格于藝祖用特孟子曰天子適諸侯曰巡守巡守者巡所守也嵗二月當巡守之年二月也岱宗泰山也柴燔柴以祀天也望望秩以祀山川也秩者其牲幣祝號之次第如五嶽視三公四瀆視諸侯其餘視伯子男者也東后東方之諸侯也時謂四時月謂月之大小日謂日之甲乙其法略見上篇諸侯之國其有不齊者則協而正之也律謂十二律黃鍾太蔟姑洗蕤賔夷則無射大吕夾鍾仲吕林鍾南吕應鍾也六為律六為吕凡十二管皆徑三分有竒空圍九分而黃鍾之長九寸大吕以下律吕相間以次而短至應鍾而極焉以之制樂而節聲音則長者聲下短者聲髙下者則重濁而舒遲上者則輕清而剽疾以之審度而度長短則九十分黃鍾之長一為一分而十分為寸十寸為尺十尺為丈十丈為引以之審量而量多少則黃鍾之管其容子榖秬黍中者一千二百以為籥而十籥為合十合為升十升為斗十斗為斛以之平衡而權輕重則黃鍾之籥所容千二百黍其重十二銖兩籥則二十四銖為兩十六兩為斤三十斤為鈞四鈞為石此黃鍾所以為萬事根本諸侯之國其有不一者則審而同之也時月之差由積日而成其法則先粗而後精度量衡受法於律其法則先本而後末故言正日在協時月之後同律在度量衡之先立言之敘蓋如此也五禮吉凶軍賔嘉也修之所以同天下之風俗五玉五等諸侯所執者即五瑞也三帛諸侯世子執纁公之孤執玄附庸之君執黃二生卿執羔大夫執雁一死士執雉五玉三帛二生一死所以為贄而見者此九字當在肆覲東后之下協時月正日之上誤脫在此言東后之覲皆執此贄也如五器劉侍講曰如同也五器即五禮之器也周禮六器六贄即舜之遺法也卒乃復者舉祀禮覲諸侯一正朔同制度修五禮如五器數事皆畢則不復東行而遂西向且轉而南行也故曰卒乃復南嶽衡山西嶽華山北嶽恆山二月東五月南八月西十一月北各以其時也格至也言至於其廟而祭告也藝祖疑即文祖或曰文祖藝祖之所自出未有所考也特特牲也謂一牛也古者君將出必告於祖禰歸又至其廟而告之孝子不忍死其親出告反面之義也王制曰歸格於祖禰鄭注曰祖下及禰皆一牛程子以為但言藝祖舉尊爾實皆告也但止就祖廟共用一牛不如時祭各設主於其廟也二説未知孰是今兩存之纂疏語録巡守亦非舜創此制蓋亦循襲將來黃帝紀亦云披山通道未嘗寧居注以柴字為句某謂當以柴望秩於山川為句漢郊祀志亦云巡協時月正日只是合同其時月日耳非作歷也每遇守凡事理會一遍問此假有錯簡卒乃復是事畢而歸非是以贄為復一年中遍四嶽否曰觀末後載歸格藝祖則是一年遍巡四嶽矣律四嶽惟衡山最逺唐虞時以潛山為南嶽林氏曰之十二又生於歷之十二前律厯志云推歷成律故同律度量衡必先協時月正日禮有因革損益故曰修陳氏經曰時月日正朔所自出律度量衡制度所自始五禮名分所由正非天子不議禮制度考文此所以大一統而無國異政之患也先言復自方嶽返也後言歸至帝都也春秋書公子遂如齊至黃乃復自彼返也書季子來歸至國都也歸而告至則出告可知其鄭氏曰羔取其羣而不失類雁取其候時而行雉取守介死不失節吕氏曰巡守而歸苟民物有一不得其所其見祖廟有愧必矣想舜歸格之時此心無愧對越在廟慰愜可知也陳氏大猷曰天下非一人所能獨治於是有封建諸侯不能保其常治於是有巡守巡守所以維持封建也嵗月易流人心易懈法度易弛上下易隔非時巡考察作新之豈能久而無弊哉吕氏曰自此以下至遏密八音以前皆史臣雜載舜攝位二十八年中事五載一巡守羣后四朝敷奏以言明試以功車服以庸五載之內天子巡守者一諸侯來朝者四蓋巡守之明年則東方諸侯來朝于天子之國又明年則南方之諸侯來朝又明年則西方之諸侯來朝又明年則北方之諸侯來朝又明年則天子復巡守是則天子諸侯雖有尊卑而一往一來禮無不答是以上下交通而逺近洽和也敷陳奏進也周禮曰民功曰庸程子曰敷奏以言者使各陳其為治之説言之善者則從而明考其功有功則賜車服以旌異之其言不善則亦有以告飭之也林氏曰天子巡守則有協時月日以下等事諸侯來朝則有敷奏以言以下等事纂疏語録巡守是去回禮一畨氏孔氏曰功成則賜車服以表顯其能用鄭曰巡守之年諸侯各朝于方嶽其間四年諸侯來朝于京師以庸表顯其才能可用也覲禮云天子賜侯氏以車服采菽云君子來朝何以豫之路車乘馬玄衮及黼皆庸以車服之證也肇十有二州封十有二山濬川肇始也十二州冀兖青徐荆揚豫梁雍幽并營也中古之地但為九州曰冀兖青徐荆揚豫梁雍禹治水作貢亦因其舊及舜即位以冀青地廣始分冀東恆山之地為并州其東北醫無閭之地為幽州又分青之東北遼東等處為營州而冀州止有河內之地今河東一路是也封表也封十二山者每州封表一山以為一州之鎮如職方氏言揚州其山鎮曰會稽之類濬川濬道十二州之川也然舜既分十有二州而至商時又但言九圍九有周禮職方氏亦止列為九州有揚荆豫青兖雍幽冀并而無徐梁營也則是為十二州蓋不甚久不知其自何時復合為九也吳氏曰此一節在禹治水之後其次序不當在四罪之先蓋史官汛記舜所行之大事初不計先後之序也纂疏語録仲默解書云禹即位後又并作九州先生曰也見不得但後面皆只説九圍九有不知甚時又復并作九州貢唐孔氏曰爾雅無梁青而有幽營孫炎以爾雅與禹職方皆不同疑是殷制以劉氏夏曰帝都冀冀北接狄而其域大分冀為幽并此二州捍狄所以壯帝畿之翼衛也二陳氏經曰禹貢之作乃在堯時至舜時分九州為十州吕氏曰禹治水嘗濬川今復濬之安不忘危也川不言十二川無小大皆濬也則愚按舜即位之初咨十有二牧後又曰州十有二師舜世分九州為十二州審矣左氏宣三年昔夏之方有德也貢金九牧則至夏禹之世又并十二州為九州亦審矣象以典刑流宥五刑鞭作官刑撲作教刑金作贖刑眚災肆赦怙終賊刑欽哉欽哉惟刑之恤哉象如天之垂象以示人而典者常也示人以常刑所謂墨劓剕宫大辟五刑之正也所以待夫元惡大憝殺人傷人穿窬淫放凡罪之不可宥者也流宥五刑者流遣之使逺去如下文流放竄殛之類也宥寬也所以待夫罪之稍輕雖入於五刑而情可矜法可疑與夫親貴勳勞而不可加以刑者則以此而寬之也鞭作官刑者木末垂革官府之刑也撲作教刑者夏楚二物學校之刑也皆以待夫罪之輕者金作贖刑者金黃金贖贖其罪也蓋罪之極輕雖入於鞭撲之刑而情法猶有可議者也此五句者從重入輕各有條理法之正也肆縱也眚災肆赦者眚謂過誤災謂不幸若人有如此而入於刑則又不待流宥金贖而直赦之也賊殺也怙終賊刑者怙謂有恃終謂再犯若人有如此而入於刑則雖當宥當贖亦不許其宥不聽其贖而必刑之也此二句者或由重而即輕或由輕而即重蓋用法之權衡所謂法外意也聖人立法制刑之本末此七言者大略盡之矣雖其輕重取舍陽舒隂慘之不同然欽哉欽哉惟刑之恤之意則未始不行乎其間也蓋其輕重毫釐之間各有攸當者乃天討不易之定理而欽恤之意行乎其間則可以見聖人好生之本心也據此經文則五行有流宥而無金贖周禮秋官亦無其文至吕刑乃有五等之罰疑穆王始制之非法之正也蓋當刑而贖則失之輕疑赦而贖則失之重且使富者幸免貧者受刑又非所以為平也纂疏語録象者如懸象魏之象或謂畫為五刑之狀亦可此假極有條理又輕重平實流以宥五刑贖以宥鞭撲如此乃平正精詳真舜之法也象者象其人所犯之罪而加以所犯之刑即墨至大辟之常刑也象以典刑一句乃五句之綱領諸刑之總括猶今之刑皆結於笞杖徒流絞斬也流宥五刑者犯此五刑而情輕可恕則流以宥之如五流有宅五宅三居是也鞭作官刑此官府之刑如今鞭撻吏人周禮治胥史鞭五百三百之類撲作教刑此學官之刑猶今之學舍檟楚侯明撻記之類是也金作贖刑謂鞭撲二刑之可恕者許用金以贖罪也如此解釋則五句之義豈不粲然明白象以典刑之輕者有流以宥之鞭撲之刑之輕者有金以贖之流宥所以寬五刑贖所以寬鞭撲聖人斟酌損益低昻輕重莫不合天理人心之當然而無毫釐杪忽之差所謂既竭心思繼以不忍人之政者如何説聖人専意教化刑非所急聖人固以教化為急若有犯者須以此刑治之豈得置而不用贖五刑起周穆王古贖刑贖鞭撲耳夫既已殺傷人又使得以金贖則有財者皆可殺傷人無辜被害者何大不幸也且殺人者安居鄉里彼孝子順孫豈肯安於此乎所以屏之逺方彼此兩全之也宥象以典刑者畫象而示民以五等肉刑之常法也流五刑者放之於逺以寬犯此肉刑而情輕之人也鞭作至教刑者官府學校之刑以馭夫罪之小而未麗於五刑者也金作贖刑者使入金而免其罪以贖犯鞭撲之刑而情之又輕者也此五者刑之法也眚災肆赦者言不幸而觸罪者則肆而赦之怙終賊刑者言有恃而不改者則賊而刑之此二者法外之意猶今律令之名例也欽哉至恤哉者則聖人畏刑之心閔死者不可復生刑者不可復續惟恐察之有不審刑之有不當雖已得其情猶矜其不教無知而抵冒至此也詳此數言聖人制刑之意可見而其輕重淺深出入取舍之際亦已審矣雖其重者或至誅斬斷割而不少貸然本其所以至此則其施於人者已先有如是之酷是以聖人不忍被酷者銜寃負痛而為是以報之雖情甚慘而語其實則為適得其宜雖以不忍之心畏刑之甚而不得赦也惟情之輕者乃得於此施其不忍嚴刑之意而有以宥之然亦必投之逺方以禦魑魅蓋以此等所犯非殺傷人則必或淫或盜情雖輕而罪實重若使既免於刑又得還鄉復為平民則被害者之寡妻弱子將何面目見之而此幸免之人了無所傷又將遂其惡而不悔所以必流以宥之也若鞭撲之刑雖刑至輕而情之輕者亦許入金以贖而不忍輒以真刑加之意亦仁矣然流専以宥肉刑而不下及於鞭撲贖専以宥鞭撲而不上及於肉刑輕重之間又未嘗不致詳也至於過誤必赦故犯必誅則又權衡乎五者之內欽欽恤刑之旨則常貫通乎七者之中此聖人制刑明辟之意所以雖或至於殺人而其反覆表裏至精至密之妙一一皆從廣大虛明心中流出而非私智之所為也或者乃謂上古惟有肉刑舜之為流贖鞭撲乃不忍而始為輕刑則是自堯以上雖犯鞭撲之刑者亦使從墨劓之坐而舜乃不忍於殺傷凶賊而反忍於見殺傷之良民也聖人之心其不如是之偏倚失正明矣又謂周穆五刑皆贖為能復舜之舊者則亦不察夫舜之贖初不上及於五刑又不察穆之法亦必疑而後贖也且漢宣之世張敞以兵食不繼建入榖贖罪之法初未嘗及殺傷與盜也蕭望之等猶以為如此則富者得生貧者獨死恐開利路以傷治化曽謂帝世之隆而以是為得哉若穆王之事殆必由巡遊財匱末年無以為計為此權宜之術以自豐又託於輕刑之説以干譽夫子存之蓋以示戒焉耳右象刑説辨鄭景望輕刑論多有人解欽恤為寬恤之恤如被殺者不令償命死者何辜乃矜恤之恤耳問五刑吳才老説是五典之刑如所謂不孝不弟之刑曰此是亂説人有罪合用五刑如何不用流共工于幽洲放歡兜于崇山竄三苗于三危殛鯀于羽山四罪而天下咸服流遣之逺去如水之流也放置之於此不得他適也竄則驅逐禁錮之殛則拘囚困苦之隨其罪之輕重而異法也共工歡兜鯀事見上篇三苗國名在江南荆揚之間恃險為亂者也幽洲北裔之地水中可居曰洲崇山南裔之山在今澧州三危西裔之地即雍之所謂三危既宅者羽山東裔之山即徐之蒙羽其藝者服者天下皆服其用刑之當罪也程子曰舜之誅四凶怒在四凶舜何與焉蓋因是人有可怒之事而怒之聖人之心本無怒也聖人以天下之怒為怒故天下咸服之春秋傳所記四凶之名與此不同説者以窮竒為共工渾敦為歡兜叨餮為三苗檮杌為鯀不知其果然否也纂疏語録崇山或云在今澧州慈利縣殛鯀羽山想偶在彼而殛之殛非殺也殛死如言貶死未四凶緣堯舉舜遜之位故不服而抵罪在堯時其罪彰孫氏覺曰放重於流竄重於放殛重於竄禹林氏曰四罪當在洪水未平前巡守肇十二州富在平水後史因言舜恤刑遂舉四凶事繫于下耳世徒見四凶得罪不在堯世遂謂堯不能去不知舜去四凶乃在歷試之時實受堯命如禹居攝時亦受舜命征苗也同王氏炎曰四罪所謂流宥五刑也四人得罪先後不史因言舜用刑故比事屬辭書之二十有八載帝乃殂落百姓如喪考妣三載四海遏密八音殂落死也死者魂氣歸於天故曰殂體魄歸於地故曰落喪為之服也遏絶密靜也八音金石絲竹匏土革木也言堯聖德廣大恩澤隆厚故四海之民思慕之深至於如此也儀禮圻內之民為天子齊衰三月圻外之民無服今應服三月者如喪考妣應無服者遏密八音堯十六即位在位七十載又試舜三載老不聽政二十八載乃崩在位通計百單一年纂疏語録林氏解殂落云魂殂魄落説得好便是魂升于天魄降于地底意此唐孔氏曰堯夀百十六嵗注六誤為七王氏炎曰言天下哀慕之情非言喪服之禮也月正元日舜格于文祖月正正月也元日朔日也漢孔氏曰舜服堯喪三年畢將即政故復至文祖廟告蘇氏曰受終告攝此告即位也然春秋國君皆以遭喪之明年正月即位於廟而改元孔氏云喪畢之明年不知何所據也詢于四嶽闢四門明四目達四聰詢謀闢開也舜既告廟即位乃謀治于四嶽之官開四方之門以來天下之賢俊廣四方之視聽以決天下之壅蔽纂疏語録問注言廣視聽於四方曰亦是以天下之目為目以天下之耳為耳之意唐孔氏曰明四方之目使為已逺視四方逹四方之聰使為已逺聽四方也恐逺方有所壅塞令為已悉聞見之牧陳氏大猷曰舜初攝位則覲嶽牧初即位復詢嶽咨蓋內外之要識莫先焉愚謂自此至亮天功紀舜初即位事四嶽總四方諸侯故以闢賢路廣視聽詢之闢四門有以天下為一家之氣象焉明四目逹四聰有以天下為一身之精神焉咨十有二牧曰食哉惟時柔逺能邇惇德允元而難任人蠻夷率服牧養民之官十二牧十二州之牧也王政以食為首農事以時為先舜言足食之道惟在於不違農時也柔者寬而撫之也能者擾而習之也逺近之勢如此先其略而後其詳也惇厚允信也德有德之人也元仁厚之人也難拒絶也任古文作壬包藏凶惡之人也言當厚有德信仁人而拒姦惡也凡此五者處之各得其宜則不特中國順治雖蠻夷之國亦相率而服從矣纂疏語録柔逺説得輕能邇是奈何得他使帖服之意善孔氏曰柔安言能安逺乃能安近厚行德信使足長任佞難拒也近者相能蘇氏曰能如不相能之能懷柔逺者使與吕氏曰難非特去之常有戒懼之意吳氏曰任古文作壬以孔壬觀之可見夷愚謂重民食一逺近親君子逺小人則內治舉而外服欲州牧以是為國而率諸侯也舜曰咨四嶽有能奮庸熙帝之載使宅百揆亮采惠疇僉曰伯禹作司空帝曰俞咨禹汝平水土惟時懋哉禹拜稽首讓于稷契暨臯陶帝曰俞汝往哉奮起熙廣載事亮明惠順疇類也一説亮相也舜言有能奮起事功以廣帝堯之事者使居百揆之位以明亮庶事而順成庶類也僉衆也四嶽所領四方諸侯有在朝者也禹姒姓崇伯鯀之子也平水土者司空之職時是懋勉也指百揆之事以勉之也蓋四嶽及諸侯言伯禹見作司空可宅百揆帝然其舉而咨禹使仍作司空而兼行百揆之事録其舊績而勉其新功也以司空兼百揆如周以六卿兼三公後世以他官平章事知政事亦此類也稽首首至地稷田正官稷名棄姓姬氏封于邰契臣名姓子氏封於商稷契皆帝嚳之子暨及也臯陶亦臣名俞者然其舉也汝往哉者不聽其讓也此章稱舜曰此下方稱帝曰者以見堯老舜攝堯在時舜未嘗稱帝此後舜方真即帝位而稱帝也纂疏林氏曰書於名分之際最嚴蓋恐涉於疑似而起後世之論也如舜攝疑其稱帝故於命禹稱舜曰以見前此未嘗稱帝也周公攝政疑其稱王故於多方言周公曰王若曰以見公雖攝而號令皆成王之命也後世尚有言舜南面堯北面及周公負黼扆以朝諸侯者吕氏曰當時紹堯極治何用奮迅激昻蓋天下之治不進則退必常存奮起之心乃有日新不窮之理雖極治之時此意不可忘也官唐孔氏曰禹代父鯀為崇伯故稱伯禹命孫氏曰九咨而後命遜而後受者新命也不咨而不遜而受者皆申舊命也和劉氏向曰舜命九官濟濟相遜之至也帝曰棄黎民阻飢汝后稷播時百榖阻厄后君也有爵土之稱播布也榖非一種故曰百榖此因禹之讓而申命之使仍舊職以終其事也纂疏唐孔氏曰阻飢謂往者洪水時稷五榖之長故以名主榖官孔氏曰播百榖美其前功以勉之使葉氏曰史記言稷少好耕農民皆法之堯舉為農師教民棄之為稷堯時已然舜以舊官申命之耳帝曰契百姓不親五品不遜汝作司徒敬敷五教在寬親相親睦也五品父子君臣夫婦長幼朋友五者之名位等級也遜順也司徒掌教之官敷布也五教父子有親君臣有義夫婦有别長幼有敘朋友有信以五者當然之理而為教令也敬敬其事也聖賢之於事雖無所不敬而此又事之大者故特以敬言之寬裕以待之也蓋五者之理出於人心之本然非有強而後能者自其拘於氣質之偏溺於物欲之蔽始有昧於其理而不相親愛不相遜順者於是因禹之讓又申命契仍為司徒使之敬以敷教而又寬裕以待之使之優柔浸漬以漸而入則其天性之真自然呈露不能自已而無無恥之患矣孟子所引堯言勞來匡直輔翼使自得之又從而振德之亦此意也纂疏語録問堯德化如此久何故至舜猶曰不親不遜曰也只是怕恁地在寬只是不急迫慢慢地養他唐孔氏曰命稷而後命契富而後教之序也謂陳氏經曰教以敬為主而以寬濟之敬匡之直之之寬使自得之之謂無陳氏大猷曰教以敬為主又慮失之迫故在寬寬得失之縱弛乎曰主於敬而行之以寬自不至于縱弛矣柔愚謂施教之道敬寬不可缺一敬有嚴謹意寬有優意敬而不寬失也迫切寬不本於敬失也縱弛穆王命君牙曰敬明乃訓曰𢎞敷五典得敬寬之意朱子教學者曰嚴立課程寬著意思亦此意歟帝曰臯陶蠻夷猾夏寇賊姦宄汝作士五刑有服五服三就五流有宅五宅三居惟明克允猾亂夏明而大也曽氏曰中國文明之地故曰華夏四時之夏疑亦取此義也劫人曰寇殺人曰賊在外曰姦在內曰宄士理官也服服其罪也吕刑所謂上服下服是也三就孔氏以為大罪于原野大夫于朝士于市不知何據竊恐惟大辟棄之於市宫辟則下蠶室餘刑亦就屏處蓋非死刑不欲使風中其瘡誤而至死聖人之仁也五流五等象刑之當宥者也五宅三居者流雖有五而宅之但為三等之居如列爵惟五分土惟三也孔氏以為大罪居於四裔次則九州之外次則千里之外雖亦未見其所據然大槩當略近之此亦因禹之讓而申命之又戒以必當致其明察乃能使刑當其罪而人無不信服也纂疏語録問猾夏是有苗否曰也不専指此但官為此而設三就只是當從古注宅只訓居曰王氏十朋曰命臯次於契刑所以弼教也離陳氏經易卦言用刑者如噬嗑賁旅其象皆取於用刑在明可知矣不明不足以得人情不允不足以當人罪夏氏曰舜命契教以一言曰寬命臯教以一言曰明簡而易守也略陳氏大猷曰帝世詳於化而略於政王者詳於政而於化虞兵刑之官合為一而禮樂分為二周禮樂之官合為一而兵刑分為二帝曰疇若豫工僉曰垂哉帝曰俞咨垂汝共工垂拜稽首讓于殳斨暨伯與帝曰俞往哉汝諧若順其理而治之也曲禮六工有土工金工石工木工獸工草工周禮有攻木之工攻金之工攻皮之工設色之工摶埴之工皆是也帝問誰能順治豫百工之事者垂臣名有巧思莊子曰攦工垂之指即此也殳斨伯與三臣名也殳以積竹為兵建兵車者斨方銎斧也古人多以其所能為名殳斨豈能為二器者歟往哉汝諧者往哉汝和其職也纂疏張氏曰守法信度因聖人制作而持之此之謂若愚謂垂順物理之自然而為之行所無事之大智大巧耳非若後世器械技巧咸精其能作為淫巧以蕩上心之比也攦吕計反帝曰疇若豫上下草木鳥獸僉曰益哉帝曰俞咨益汝作朕虞益拜稽首讓于朱虎熊羆帝曰俞往哉汝諧上下山林澤藪也虞掌山澤之官周禮分為虞衡屬於夏官朱虎熊羆四臣名也髙辛氏之子有曰伯虎仲熊意以獸為名者亦以其能服是獸而得名歟史記曰朱虎熊羆為伯益之佐前殳斨伯與當亦為垂之佐也纂疏語録孟子説益烈山澤是使之除障翳驅禽獸耳至舜命之作虞然後使養育草木鳥獸也孔氏曰若謂順施政教取之有時用之有節曰林氏曰益向掌火為禹之佐至此方正為虞張氏聖人以萬物為一體故曰豫草木鳥獸獺祭魚然後漁入澤梁未蟄不以火田皆若之之事然益之烈而焚周公之驅而寧亦若也蓋居山澤順也交中國非順也非以姑息為若陳氏大猷曰餘官有告戒之辭工虞獨無若字已該之矣帝曰咨四嶽有能典朕三禮僉曰伯夷帝曰俞咨伯汝作秩宗夙夜惟寅直哉惟清伯拜稽首讓于夔龍帝曰俞往欽哉典主也三禮祀天神享人鬼祭地祗之禮也伯夷臣名薑姓秩敘也宗祖廟也秩宗主敘次百神之官而専以秩宗名之者蓋以宗廟為主也周禮亦謂之宗伯而都家皆有宗人之官以掌祭祀之事亦此意也夙早寅敬畏也直者心無私曲之謂人能敬以直內不使少有私曲則其心潔清而無物欲之汚可以交於神明矣夔龍二臣名纂疏語録惟寅故直惟直故清禮是見成制度寅直清所以行其禮也如葉氏曰天秩之禮天下莫不宗焉故曰秩宗或曰宗宗主天秩之禮此官實主之陳氏經曰夙夜者自早至暮無時而不寅亦無時而不直清也此時之心即天神地祇人鬼之心愚謂九官惟百揆秩宗咨四嶽而命重可知矣心者神明之舍所以交神明之本也敬則能直內直內則清明在躬敬其本而直清敬之驗也禮敬而已既戒以寅尤勉以欽丁寧至矣帝曰夔命汝典樂教胄子直而溫寬而栗剛而無虐簡而無傲詩言志歌永言聲依永律和聲八音克諧無相奪倫神人以和夔曰於豫擊石拊石百獸率舞胄長也自天子至卿大夫之適子也栗莊敬也上二無字與毋同凡人直者必不足於溫故欲其溫寬者必不足於栗故欲其栗所以慮其偏而輔翼之也剛者必至於虐故欲其無虐簡者必至於傲故欲其無傲所以防其過而戒禁之也教胄子者欲其如此而其所以教之之具則又専在於樂如周禮大司樂掌成均之法以教國子弟而孔子亦曰興於詩成於樂蓋所以蕩滌邪穢斟酌飽滿動蕩血脈流通精神養其中和之德而救其氣質之偏者也心之所之謂之志心有所之必形於言故曰詩言志既形於言則必有長短之節故曰歌永言既有長短則必有髙下清濁之殊故曰聲依永聲者宫商角徴羽也大抵歌聲長而濁者為宫以漸而清且短則為商為角為徵為羽所謂聲依永也既有長短清濁則又必以十二律和之乃能成文而不亂假令黃鍾為宫則太蔟為商姑洗為角林鍾為徴南吕為羽蓋以三分損益隔八相生而得之餘律皆然即禮運所謂五聲六律十二管還相為宫所謂律和聲也人聲既和乃以其聲被之八音而為樂則無不諧協而不相侵亂失其倫次可以奏之朝廷薦之郊廟而神人以和矣聖人作樂以養性情育人材事神祇和上下其體用功效廣大深切乃如此今皆不復見矣可勝嘆哉夔曰以下蘇氏曰舜方命九官濟濟相讓無緣夔於此獨言其功此益稷之文簡編脫誤復見於此纂疏語録直寬本自是好但濟以溫栗則盡善剛簡微覺有弊故戒以無虐無傲所以防其失也所以特與分明欲見防其失者専為剛簡而設不蒙上直寬二句直寬但曰而溫而栗至剛簡則曰無虐無傲觀其立言之意自可見問欲養其德性只是詩言志至律和聲曰然諷誦歌詠之間足以和其心氣但上面三句抑揚髙下尚且由人到律和聲處直是不可走作所以詠歌之際深足以養人情性至如播之金石被之管絃非是不和終不若人聲自然故孟嘉有言絲不如竹竹不如肉謂漸近自然八音克諧至以和此是言祭祀燕享時事又是一節古以樂教胄子緣和平中正古人詩只一兩句歌便衍得來長宫商角徴羽五聲依所歌而發却用律以和之如黃鍾為宫則太簇為商之類不可亂其倫序也詩古人作詩只是説他心下所存事説出來人便將他來歌其聲之清濁長短各依他作詩之語言却將律來調和其聲今人却先安排下腔調子然後做言語去合腔子豈不是倒了却是永依聲也古人是以樂去就他詩後世是以詩去就他樂如何解興起得人詩之作本言志而已方其詩也未有歌也及其歌也未有樂也以聲依永以律和聲則樂乃為詩而作非詩為樂而作也詩出乎志者也樂出乎詩者也詩者其本而樂者其末也賔道夫問若以黃鍾為宫便是太蔟為商姑洗為角㽔為變徴林鍾為徴南吕為羽應鍾為變宫若以大吕為宫便是夾鍾為商中吕為角林鍾為變徴夷則為徴無射為羽黃鍾為變宫其餘旋相為宫周而復始若言相生之法則以律生吕便是下生以吕生律則為上生自黃鍾下生林鍾林鍾上生太蔟太蔟下生南吕南吕上生姑洗姑洗下生應鍾應鍾上生㽔賔㽔賔本當下生今却復上生大吕大吕下生夷則夷則上生夾鍾夾鍾下生無射無射上生中吕相生之道至是窮矣遂復變而上生黃鍾再生之黃鍾不及九寸只是八寸有餘然黃鍾君象也非諸宫之所能役故虛其正而不復用所用只再生之變者就再生之變又缺其半所缺其半者蓋若大吕為宫黃鍾為變宫時黃鍾管最長所以只得用其半聲而餘宫亦皆倣此先生曰然宫商角徴羽與變宫變徴皆是數之相生自然如此非人力所能加損此其所以為妙樂律自黃鍾至仲吕皆屬陽自㽔賔至應鍾皆屬隂此是一箇大隂陽黃鍾為陽大吕為隂太蔟為陽夾鍾為隂每一陽間一隂又是一箇小隂陽破律管只以九寸為準則上生下生三分損一益一如竹矣管有短長則聲有清濁黃鍾管九寸最長應鍾管最短長者聲濁短者聲清十二律旋相為宫宫為君商為臣樂中最忌臣陵君故有四清聲清聲者減正律之半如應鍾為宫其聲最短而清或㽔賔為商則商聲髙如宫聲是為臣陵君不可用遂用㽔賔減半律為清聲以應之雖減半律然只是此律故亦自能相應也如方響鐵有十六片乃是十二律外添四清聲也通典載此一項甚詳禮夏氏曰直溫以下周禮所謂樂德詩言志至和聲周所謂樂語也以林氏曰作樂必本之情性稽之度數本之情性樂所生稽之度數樂所以成永言以上本之情性也形之於樂洪纎髙下不可無法必稽之度數聲依永律和聲是也陳氏經曰直溫以下德之中和也言志以下樂之中和也將教以中和之德必教以中和之樂和聲八音之分單出者為聲雜比者為音薛氏曰八音克諧翕如純如無相奪倫皎如也帝陳氏大猷曰諧是衆音和協倫是各音條理愚謂者立教始見於命契命夔大學序所謂司徒之職典樂之官所由設正謂此也歌永言言之不足而永歌之也聲依永者宫商角徴羽五聲依傍於永言之歌而見也律和聲者又以十二律而和此五聲也黃鍾為宫則某為商某為角及三分損益隔八相生宜為圖以明之陽律生隂吕曰下生三分長而損一隂吕生陽律曰上生三分長而益一皆是左旋隔八管而相生黃鍾為第一宫其長九寸隔八下生林鍾為徴三分損一其長六寸林鍾隔八上生太蔟為商三分益一其長八寸惟此三者長皆全寸而無餘分餘管則餘分之數細碎難言矣太蔟下生南吕為羽南吕上生姑洗為角林鍾為第二宫宫生徴徴生商商生羽羽生角以下皆倣此以至中吕為第十二宫上生黃鍾為徴下生林鍾為商上生太蔟為羽下生南吕為角十二宫各有五聲凡六十聲宫徴商羽角隔八相生之序也由宫聲之濁而長以漸而清且短之序則為宫商角徴羽假令黃鍾為宫則相去一管而太蔟為商又相去一管而姑洗為角又相去二管而林鍾為徴又相去一管而南吕為羽羽距黃鍾之宫又相去二管焉相去一管則音節和相去二管則音節逺故角徴之間近徴收一聲比徴稍下曰變徴羽宫之間近宫收一聲少髙於宫曰變宫所以齊五聲之不及也詳見律曆志律吕新書等樂之功用其感神人之和如此則其教胄子而陶寫其性情流通其精神養其中和之德而救其氣質之偏宜哉帝曰龍朕堲讒説殄行震驚朕師命汝作納言夙夜出納朕命惟允堲疾殄絶也殄行者謂傷絶善人之事也師衆也謂其言之不正而能變亂黑白以駭衆聽也納言官名命令政教必使審之既允而後出則讒説不得行而矯偽無所託矣敷奏復逆必使審之既允而後入則邪僻無自進而功緒有所稽矣周之內史漢之尚書魏晉以來所謂中書門下者皆此職也纂疏語録殄行是傷人之行納言如今之門下審覆可納言之官如漢侍中今給事中朝廷誥令先過後省以封駁陳氏經曰讒人無世無之雖唐虞極治而巧言孔壬猶所可畏豈可謂此時遂無此事孔氏曰出納朕命聽下言納於上受上言宣於下於愚謂欲其審君命之當否當者出之否者納之惟在允當如後世批敕之官庶於朕命二字明順宣胡氏一挂曰出納朕命如詩出納王命謹審之善者出否者繳納如後世封還詞頭在我者既允信何憂讒説得入哉次王氏曰百揆百官之首故先命禹養民治之先務故命稷富然後教故次命契刑以弼教故次命臯工立成器以為天下利人治之末故次命垂如此治人亦備矣然後及動植故次命益民物如此隆禮樂之時也故次命夷夔禮先樂後故先夷後夔樂作則治功成矣賢萃功成苟讒説得行則賢者不安前功遂墮故未命龍所以防讒間衛羣賢以成其終猶命十二牧而終以難任人夫子答為邦而終以逺佞人也帝曰咨汝二十有二人欽哉惟時亮天功二十二人四嶽九官十二牧也周官言內有百揆四嶽外有州牧侯伯蓋百揆者所以統庶官而四嶽者所以統十二牧也既分命之又總告之使之各敬其職以相天事也曽氏曰舜命九官新命者六人命伯禹命伯夷咨四嶽而命者也命垂命益泛咨而命者也命夔命龍因人之讓不咨而命者也夫知道而後可宅百揆知禮而後可典三禮知道知禮非人人所能也故必咨於四嶽若豫工若上下草木鳥獸則非此之比故泛咨而已禮樂命令其體雖不若百揆之大然其事理精微亦非百工庶物之可比伯夷既以四嶽之舉而當秩宗之任則其所讓之人必其中於典樂納言之選可知故不咨而命之也若稷契臯陶之不咨者申命其舊職而已又按此以平水土若百工各為一官而周制同領於司空此以士一官兼兵刑之事而周禮分為夏秋兩官蓋帝王之法隨時制宜所謂損益可知者如此纂疏孔氏曰各敬其職惟是乃能信立天下之功陳氏大猷曰皆當敬以趨時以輔相顯明天之功二十二人職雖不同其為天之事則一故提其綱總戒之愚謂益嘉言見於書者多禹臯之亞也觀禹薦益可見掌火掌山澤隆古之才何施不可也王氏炎曰詢嶽咨牧命九官雖非一日之言然總命在後則必皆在即位之初矣嶽牧治外九官治內其後不過行考績黜陟之法垂拱以臨之自此至陟方凡五十年不復見施為之迹舜無為而治此亦可見三載考績三考黜陟幽明庶績咸熙分北三苗考核實也三考九載也九載則人之賢否事之得失可見於是陟其明而黜其幽賞罰明信人人力於事功此所以庶績咸熙也北猶背也其善者留其不善者竄徙之使分背而去也此言舜命二十二人之後立此考績黜陟之法以時舉行而卒言其效如此也按三苗見於經者如典謨益稷禹貢吕刑詳矣蓋其負固不服乍臣乍叛舜攝位而竄逐之禹治水之時三危已宅而舊都猶頑不即工禹攝位之後帝命徂征而猶逆命及禹班師而後來格於是乃得考其善惡而分北之也吕刑之言遏絶則通其本末而言不可以先後論也纂疏唐孔氏曰此以下史述舜事拘陳氏大猷曰人情太寬則肆太嚴則故考績於三載時加警䇿以作其怠黜陟於九載期之久逺以要其成不肆不拘所以為善成周冡宰嵗終受會詔廢置三嵗計治行誅賞隨時之義也民夏氏曰北一音如字三苗國在南遷北之如周遷頑此不與上文相連過王氏炎曰害治者不三苗分北之而已舜生三十徴庸三十在位五十載陟方乃死徴召也陟方猶言升遐也韓子曰竹書紀年帝王之沒皆曰陟陟升也謂升天也書曰殷禮陟配天言以道終其德協天也故書紀舜之沒云陟其下言方乃死者所以釋陟為死也地之勢東南下如言舜巡守而死宜言下方不得言陟方也按此得之但不當以陟為句絶耳方猶云徂乎方之方陟方乃死猶言徂落而死也舜生三十年堯方召用歷試三年居攝二十八年通三十年乃即帝位又五十年而崩蓋於篇末總敘其始終也史記言舜巡守崩於蒼梧之野孟子言舜卒於鳴條未知孰是今零陵九疑有舜冡云纂疏語録舜生三十徴庸數句只依古注點自好三孔氏曰三十徴庸三十在位服喪三年其一在十之數為天子五十年凡夀百一十二嵗辰即位至禹十七年死通一百一十年經世書舜丙司馬氏光詩虞舜在倦勤薦禹為天子豈有復南巡迢迢渡湘水黜愚謂史於舜即位初惟載咨嶽牧命九官即以九載陟繼之篇末總敘舜一生始終結之中間幾五十年無事可見何也孔子曰舜有臣五人而天下治無為而治者其舜也與舜惟得聖賢之臣以共為故終身可恭已而無為也陟方猶言升天一方董氏鼎曰舜重華協帝與堯合德而夫子稱大哉堯之為君君哉舜也不無小異者堯為治無迹蕩蕩難名故謂之大舜責成臣下已若無與故謂之君今於舜典可見自徽典至汝陟帝位是堯試舜三年內事為司徒百揆四嶽未為君時也自受終至遏密是攝位二十八年內事不過以百揆代堯行天子事亦未為君也自格文祖然後即帝位始稱帝舜之君道乃可見舜方攝時巡四嶽朝諸侯封山濬川考禮正刑汲汲不少暇至即位之後惟責成於嶽牧九官舜不過執黜陟之權以激勵之外此不復以身親焉五十年間有天下而若不與非得為君之道而然歟攝政以前可見臣道之勞即位以後可見君道之逸乾知太始坤作成物君臣之道一乾坤也夫子以君哉稱之非優堯而劣舜也大禹謨謨謀也林氏曰虞史既述二典其所載有未備者於是又敘其君臣之間嘉言善政以為大禹臯陶謨益稷三篇所以備二典之未備者今文無古文有纂疏孔氏曰禹稱大大其功名陳氏大猷曰序言禹成厥功指禹之實也書大禹謨以此書多禹之謨也禹之功多見於謨之所述舜愚謂諸臣惟禹稱大者堯曰大哉堯之為君曰大舜有大焉舜繼堯稱大舜禹繼舜故亦稱大禹三聖相承皆以大稱豈諸臣比哉曰若稽古大禹曰文命敷于四海祗承于帝命教祗敬也帝謂舜也文命敷於四海者即禹貢所謂東漸西被朔南暨聲教訖於四海者是也史臣言禹既已布其文教於四海矣於是陳其謨以敬承於舜如下文所云也文命史記以為禹名蘇氏曰以文命為禹名則敷于四海者為何事耶纂疏孔氏曰外布文德教命內則敬承堯舜謨林氏曰祇承于帝當與下文曰字相繼讀陳以敬承于帝舜謨即克艱以下是也蔡傳實用林説曰后克艱厥后臣克艱厥臣政乃乂黎民敏德曰以下即禹祗承于帝之言也艱難也孔子曰為君難為臣不易即此意也乃者難辭也敏速也禹言君而不敢易其為君之道臣而不敢易其為臣之職夙夜祗懼各務盡其所當為者則其政事乃能修治而無邪慝下民自然觀感速化於善而有不容己者矣纂疏語録自克艱至來王只是一時説話也陳氏大猷曰君臣克艱乃政化之本原禹謨之綱領忽其艱則玩畏其艱則沮徒以為艱而不克盡其艱則畏而沮與忽而玩者均耳故不徒曰艱而必曰克也愚謂後世言政不及化政乂而民敏德政非徒政政即化也此其功用皆本原於共政君臣精神心術中君臣克艱憂勤戒懼有未易以言語形容者人知政乂而感民敏德之不易則知君臣克艱之所以不易者矣帝曰俞允若兹嘉言罔攸伏野無遺賢萬邦咸寧稽于衆舍己從人不虐無告不廢困窮惟帝時克嘉善攸所也舜然禹之言以為信能如此則必有以廣延衆論悉致羣賢而天下之民咸被其澤無不得其所矣然非忘私順理愛民好士之至無以及此而惟堯能之非常人所及也蓋為謙辭以對而不敢自謂其必能舜之克艱於此亦可見矣程子曰舍己從人最為難事己者我之所有雖痛舍之猶懼守己者固而從人者輕也纂疏蘇氏曰無告天民之窮者困窮士之不遇者陳氏經曰言罔伏至咸寧此時堯若可以自足而猶稽衆從人不虐不廢堯之心不自足也使自以為足安足以為堯哉夫子以博施濟衆安百姓為堯舜猶病此足以形容堯之心矣程子曰苟謂吾治已足則便不是聖人即此意為吕氏曰舜於克艱工夫深矣故聞禹言有當於心以信如此也嘉言以下舉堯克艱之道以證之堯之時克克此艱也若真氏曰知為君之難易真知而能盡其道難故曰允兹惟帝時克世主謂言已用而不必求言不知伏於下者之難逹也賢已得而不必求賢不知遺於野者之難進也惟堯一以難視之故能使言不伏賢不遺而萬邦安雖然堯猶慮其難也方且稽衆以求事理之當舍己以從人情之公易虐廢者不虐廢之皆自克艱一念為之也兹愚謂舜惟本有克艱之心故深信禹克艱之謨允若深信其當如此也惟帝時克以克艱歸之堯惟堯能如此謙言己未能如此也公孫丑問浩氣孟子曰難言也程子謂觀此一言則孟子實有是氣可知今觀舜斯言則舜真能克艱亦可知矣王氏曰舜后也故但言堯克艱事今按定公問一言興邦孔子對以君難臣不易下文惟及君而不及臣意亦類此益曰都帝德廣運乃聖乃神乃武乃文皇天眷命奄有四海為天下君廣者大而無外運者行之不息大而能運則變化不測故自其大而化之而言則謂之聖自其聖而不可知而言則謂之神自其威之可畏而言則謂之武自其英華發外而言則謂之文眷顧奄盡也堯之初起不見於經傳稱其自唐侯特起為帝觀益之言理或然也或曰舜之所謂帝者堯也羣臣之言帝者舜也如帝德罔愆帝其念哉之類皆謂舜也蓋益因舜尊堯而遂美舜之德以勸之言不特堯能如此帝亦當然也今按此説所引比類固為甚明但益之語接連上句惟帝時克之下未應遽舍堯而譽舜又徒極口以稱其美而不見其有勸勉規戒之意恐唐虞之際未遽有此諛佞之風也依舊説贊堯為是纂疏語録都美辭也都君子之居鄙野人之居故古謂野為鄙美為都命孔氏曰益因舜言又美堯也言堯有此德故為天所所以勉舜薛氏曰聖神武文即廣運之所發聖陳氏大猷曰廣如天之無不覆運如天之行健不息伸如天之造化不測武文如天之春生秋殺聖神自妙於無迹者言之武文自顯於可見者言之知天德則知帝德矣真氏曰廣運而與天同德故能受天命益勉舜全在廣運二字也愚謂美舜之説出橫渠傳辨之當矣廣聖德之全體運聖德之大用也聖神全體之不可見者武文大用之可見者也其可見者即不可見者之發見呈露者也禹曰惠迪吉從逆凶惟影響惠順迪道也逆反道者也惠迪從逆猶言順善從惡也禹言天道可畏吉凶之應於善惡猶影響之出於形聲也以見不可不艱者以此而終上文之意纂疏語録書中迪字或解為道或解為行欵只是順字此以逆對迪可見益曰吁戒哉警戒無虞罔失法度罔遊于逸罔淫于樂任賢勿二去邪勿疑疑謀勿成百志維熙罔違道以干百姓之譽罔咈百姓以從己之欲無怠無荒四夷來王先吁後戒欲使聽者精審也警與警同虞度罔勿也法度法則制度也淫過也當四方無可虞度之時法度易至廢弛故戒其失墜逸樂易至縱恣故戒其遊淫言此三者所當謹畏也任賢以小人間之謂之二去邪不能果斷謂之疑謀圖為也有所圖為揆之於理而未安者則不復成就之也百志猶易所謂百慮也咈逆也九州之外世一見曰王帝於是八者朝夕戒懼無怠於心無荒於事則治道益隆四夷之逺莫不歸往中土之民服從可知今按益言八者亦有次第蓋人君能守法度不縱逸樂則心正身修義理昭著而於人之賢否孰為可任孰為可去事之是非孰為可疑孰為不可疑皆有以審其幾微絶其蔽惑故方寸之間光輝明白而於天下之事孰為道義之正而不可違孰為民心之公而不可咈皆有以處之不失其理而毫髮私意不入於其間此其懲戒之深旨所以推廣大禹克艱惠迪之謨也苟無其本而是非取舍決於一己之私乃欲斷而行之無所疑惑則其為害反有不可勝言者矣可不戒哉纂疏語録當無虞時易至失法度遊逸淫樂故當戒其如此既知戒此則當任賢至勿成如此方能罔違道至從己之欲也無聖賢言語自有箇血脈貫在裏如此一假先説警戒虞蓋制治未亂保邦未危自未有可虞之時必警必戒能如此則不至失法度遊逸淫樂矣若無警戒底心欲不失法度不遊逸淫樂不可得也既能如此然後可以知得賢者邪者謀可疑無可疑者若是自家身心顛倒便會以不賢為賢以邪為正所當疑者亦不知矣何以任之去之勿成之哉蓋此三句便是上面有三句了方會恁地又如此然後方能罔違道以求名罔咈民以從欲蓋於賢否疑有所未明則何者為道何者為非道何者是百姓所欲何者非百姓所欲哉吕氏曰此益又言克艱之目也主陳氏大猷曰多事之際常情猶知警戒無事之時明猶或玩弛自罔失法度至無怠荒皆無虞時所當警戒者人心警戒則強立而清明清明則軌則嚴逸樂戢是非辨此心卓然立於事物之表足以宰制事物而事聽命於心人心玩弛則頽放而昏塞昏塞則法度廢嗜欲肆邪正亂此心隤然屈於事物之下而事物反役乎此心矣戒林氏曰無怠荒所謂不倦以終之也舜大聖人益所猶如此可見聖賢兢業之誠矣克愚謂自克艱至此五節文意相連實一時之言禹以艱告舜舜不自居歸時克於堯故益因言廣運以下以美堯禹又申其未盡之藴以迪吉逆凶戒舜故益因盡言畫一以戒舜知此則以廣運一節為美舜者其非明矣禹曰於帝念哉德惟善政政在養民水火金木土榖惟修正德利用厚生惟和九功惟敘九敘惟歌戒之用休董之用威勸之以九歌俾勿壞益言警戒之道禹歎而美之謂帝當深念益之所言也且德非徒善而已惟當有以善其政政非徒法而已在乎有以養其民下文六府三事即養民之政也水火金木土榖惟修者水克火火克金金克木木克土而生五榖或相制以泄其過或相助以補其不足而六者無不修矣正德者父慈子孝兄友弟恭夫義婦聽所以正民之德也利用者工作什器商通貨財之類所以利民之用也厚生者衣帛食肉不飢不寒之類所以厚民之生也六者既修民生始遂不可以逸居而無教故為之惇典敷教以正其德通工易事以利其用制節謹度以厚其生使皆當其理而無所乖則無不和矣九功合六與三也敘者言九者各順其理而不汨陳以亂其常也歌者以九功之敘而詠之歌也言九者既已修和各由其理民享其利莫不歌詠而樂其生也然始勤終怠者人情之常恐安養既久怠心必生則已成之功不能保其久而不廢故當有以激勵之如下文所云也董督也威古文作畏其勤於是者則戒喻而休美之其怠於是者則督責而懲戒之然又以事之出於勉強者不能久故復即其前日歌詠之言協之律吕播之聲音用之鄉人用之邦國以勸相之使其歡欣鼓舞趨事赴功不能自已而前日之成功得以久存而不壞此周禮所謂九德之歌九韶之舞而太史公所謂佚能思初安能惟始沐浴膏澤而歌詠勤苦者也葛氏曰洪範五行水火木金土而已榖本在木行之數禹以其為民食之急故别而附之也纂疏語録水如隄防灌溉金如五兵田器火如出納火禁焚萊木如斧斤以時之類皆惟修之義古人設官掌此六府蓋為民惜此物不使妄用歌問戒董勸九歌曰正是匡之直之輔之翼之之意九只是九功之敘可歌想那時田野自有此歌今不可得見是九功惟敘止勸以九歌此便是作韶樂之本韶樂只和而已功以九敘故韶以九成所謂九德之歌九韶之舞也為唐孔氏曰此言五行與洪範之次不同洪範以生數次此以相克為次陳氏曰五行相克正洛書之序此亦禹則洛書之一端也王氏曰政莫要於養民六府養民之具也正德所以養其心利用厚生所以養其身溝澮之導瀦之蓄井之汲水之修也鑽燧有變焚萊有禁火之修也産於地取之有時鎔範而成之金之修也植於山林斬之有時掄材而取之木之修也辨肥瘠相髙下以植萬物土之修也播種有宜耨穫有節榖之修也水以制火火以煉金金以治木木以墾土土以生榖此六府之序無恆産則無恆心六府修然後可以正民德先富而後教也以正德為先三事之序也織紝而衣耒耜而耕釡甑而㸑資六府以利用也老有奉幼有長鰥寡廢疾皆有養資六府以厚生也六府出於天地而修之在人三事行於天下而和之在人也吕氏曰正德以利用厚生所謂日用飲食遍為爾德德不正雖有粟吾得而食諸張氏九成曰戒用休若周禮大比興賢能明其有功者屬其治地者之類董用威如周禮宅不毛者有里布田不耕者出屋粟與鄉八刑糾萬民之類使陳氏經曰人情始勤終怠安能保其不壞故戒以休知勤者有休美則心有所慕董以威使知怠者有刑威則心有所畏然畏慕有時而忘不若使心有所樂樂則無時而忘故勸以九歌感動於自然非有勉強矯拂將樂事勸功而忘其勞斯可使九功永久不壞也吳氏曰勸以九歌如周禮州正趨其稼事里宰趨其耕耨籥章吹豳雅豳頌與夫為春酒殺羔羊及百日之蠟一日之澤乃古遺制之猶存者成吕氏曰俾字宜詳味消息盈虛者天理之常輔相財者君道之大九功既敘盛也戒董勸俾勿至於壞使之盛而不衰也俾云者財成輔相以贊消息盈虛聖人無窮之心也帝曰俞地平天成六府三事允治萬世永賴時乃功水土治曰平言水土既平而萬物得以成遂也六府即水火金木土榖也六者財用之所自出故曰府三事正德利用厚生也三者人事之所當為故曰事舜因禹言養民之政而推其功以美之也纂疏林氏曰天施地生水患地不得生天雖施之亦無自而成今地既平天之功始成經王氏炎曰謂之府天地之藏其出不窮者也陳氏曰府者天府事者人事六吕氏曰雖歷萬世之逺不能外天地以有生外府三事以為治是禹之功與天地相終始也帝曰格汝禹朕宅帝位三十有三載耄期倦于勤汝惟不怠總朕師九十曰耄百年曰期舜至是年已九十三矣總率也舜自言既老血氣已衰故倦於勤勞之事汝當勉力不怠而總率我衆也蓋命之攝位之事堯命舜曰陟帝位舜命禹曰總朕師者蓋堯欲使舜真宅帝位舜讓弗嗣後惟居攝亦若是而已禹曰朕德罔克民不依臯陶邁種德德乃降黎民懷之帝念哉念兹在兹釋兹在兹名言兹在兹允出兹在兹惟帝念功邁勇往力行之意種布降下也禹自言其德不能勝任民不依歸惟臯陶勇往力行以布其德德下及於民而民懷服之帝當思念之而不忘也兹指臯陶也禹遂言念之而不忘固在於臯陶舍之而他求亦惟在於臯陶名言於口固在於臯陶誠發於心亦惟在於臯陶也蓋反覆思之而卒無有易於臯陶者惟帝深念其功而使之攝位也纂疏語録念兹在兹釋兹在兹用舍皆在此人名言兹在兹允出兹在兹語默皆在此人人舜命禹宅揆禹讓稷契臯陶今不及稷契意至是二已不存矣穫蘇氏曰種德如農之種植衆人之種德也近朝種暮臯之種德也逺沛然如時雨之降民被其澤懷之宜也臯張氏震曰禹所遜獨臯者孟子論道之傳亦曰若禹則見而知之又曰舜以不得禹臯為已憂書稱三聖稽古獨以臯繼之揚雄論絶德亦曰舜以孝禹以功臯以謨可見禹之外未有能先臯者也陳氏經曰臯所掌者刑德安在至威之中至愛存焉慈祥惻怛之寓雖刑也而實種德也帝曰臯陶惟兹臣庶罔或干豫正汝作士明于五刑以弼五教期于豫治刑期于無刑民協于中時乃功懋哉干犯正政弼輔也聖人之治以德為化民之本而刑特以輔其所不及而已期者先事取必之謂舜言惟此臣庶無或有干犯我之政者以爾為士師之官能明五刑以輔五品之教而期我以至於治其始雖不免於用刑而實所以期至於無刑之地故民亦皆能協於中道初無有過不及之差則刑果無所施矣凡此皆汝之功也懋勉也蓋不聽禹之讓而稱臯陶之美以勸勉之也纂疏唐孔氏曰無有干犯我正道者教林氏曰刑非期於刑人以輔吾之不及而已出教則入刑出刑則入教使民趨教而刑為無用此聖人本心也臯能體此意而行之使天下知有契之教不知有臯之刑蓋百官以無曠為能惟士不然必使民皆不犯官若虛設始為能其官也陳氏經曰明刑以弼教非特期至於治又期於無刑焉弼教以刑民猶有所畏而為善也無刑而協中則無所畏而為善矣出刑則入於中中可以兼正罔干豫正趨中之漸也陳氏大猷曰明五刑智也法守也期無刑仁也法外意也協于中不犯正不待論也中則無不正矣臯陶曰帝德罔愆臨下以簡御衆以寬罰弗及嗣賞延于世宥過無大刑故無小罪疑惟輕功疑惟重與其殺不辜寧失不經好生之德洽于民心兹用不犯于有司愆過也簡者不煩之謂上煩密則下無所容御者急促則衆擾亂嗣世皆謂子孫然嗣親而世疏也延逺及也父子罪不相及而賞則逺延于世其善善長而惡惡短如此過者不識而誤犯也故者知之而故犯也過誤所犯雖大必宥不忌故犯雖小必刑即上篇所謂眚災肆赦怙終賊刑者也罪已定矣而於法之中有疑其可重可輕者則從輕以罰之功已定矣而于法之中有疑其可輕可重者則從重以賞之辜罪經常也謂法可以殺可以無殺殺之則恐陷于非辜不殺之恐失于輕縱二者皆非聖人至公至平之意而殺不辜者尤聖人之所不忍也故與其殺之而害彼之生寧姑全之而自受失刑之責此其仁愛忠厚之至皆所謂好生之德也蓋聖人之法有盡而心則無窮故其用刑行賞或有所疑則常屈法以申恩而不使執法之意有以勝其好生之德此其本心所以無壅遏而得行於常法之外及其流衍洋溢漸涵浸漬有以入于民心則天下之人無不愛慕感悅興起于善而自不犯于有司也臯陶以舜美其功故言此以歸功于其上蓋不敢當其褒美之意而自謂己功也纂疏語録觀帝德罔愆以下便見聖人之心涵育發生真與天地同德而物或自逆於理以干天誅則夫輕重取舍之間亦自有決然不易之理其宥過非私恩其刑故非私怒罪疑惟輕非姑息功疑惟重非過豫如天地四時之運寒涼肅殺常居其半而涵育發生之心未嘗不流行乎其間此所以好生德洽而自不犯有司非既抵罪而復縱舍之也罪疑惟輕豈有不疑而欲輕之之理王季海當國好出人死罪以積隂德奴佃殺主亦不至死孔氏曰刑疑附輕賞疑從重忠厚之至小吕氏曰自以簡下皆舜好生之德此章苟無刑故無一句好生之義不備故犯雖小必刑不事姑息而濟仁以義也見聖人好生不偏處過于姑息反所以害仁陳氏經曰帝德無所過皆中也簡寬以下忠厚仁恕無非所以為中大吳氏曰與其二句蓋設詞以形容好生之德陳氏猷曰天地之大德曰生聖人得天地生物之心以為心曰好生上好人之生人亦自好其生仁心之相感也愚謂舜以無刑為臯之功臯原所以無刑本帝好生之德而不敢以為己功舜欲遜禹禹欲遜臯禹臯時皆在帝前數章相聨皆對面語也帝曰俾豫從欲以治四方風動惟乃之休民不犯法而上不用刑者舜之所欲也汝能使我如所願欲以治教化四逹如風鼓動莫不靡然是乃汝之美也舜又申言以重歎美之纂疏吕氏曰臯之刑非徒刑乃德教也四方鼓動于德教中休孰大焉帝曰來禹降水警豫成允成功惟汝賢克勤于邦克儉于家不自滿假惟汝賢汝惟不矜天下莫與汝爭能汝惟不伐天下莫與汝爭功豫懋乃德嘉乃丕績天之厯數在汝躬汝終陟元后洚水洪水也古文作降孟子曰水逆行謂之洚水蓋山崩水渾下流淤塞故其逝者輒復反流而泛濫決溢洚洞無涯也其災所起雖在堯時然舜既攝位害猶未息故舜以為天警懼于己不敢以為非已之責而自寬也允信也禹奏言而能踐其言試功而能有其功所謂成允成功也禹能如此則既賢于人矣而又能勤于王事儉于私養此又禹之賢也有此二美而又能不矜其能不伐其功然其功能之實則自有不可掩者故舜于此復申命之必使攝位也懋楙古通用楙盛大之意丕大績功也懋乃德者禹有是德而我以為盛大嘉乃丕績者禹有是功而我以為嘉美也歷數者帝王相繼之次第猶嵗時氣節之先後汝有盛德大功故知歷數當歸於汝汝終當升此大君之位不可辭也是時舜方命禹以居攝未即天位故以終陟言也纂疏吕氏曰禹繼父治水人易疑之禹能使人信于未成功之先故功成於人已信之後人才立己便有物與我對對則必爭一矜伐其功能便有爭之理矜伐者爭之對也不矜不伐無我也無我則無對無對則無爭陳氏經曰能者忌之媒功者爭之府禹以不矜伐之心起天下不爭之心臣子所為初無分外之事事親若曽子者可也未嘗以曽子為過乎分外蓋以所當為之事能盡此者方能免責耳尚何矜伐之有如禹之事皆禹所當然故自不見其為功能也故王氏曰矜有執持意伐有夸大意能過天下而不矜天下愈服其能功髙天下而不伐故天下愈服其功惡愚案通厯曰禹不貴尺璧而重寸隂語曰禹菲飲食衣服克勤儉之實也人心惟危道心惟微惟精惟一允執厥中心者人之知覺主于中而應于外者也指其發于形氣者而言則謂之人心指其發于義理者而言則謂之道心人心易私而難公故危道心難明而易昧故微惟能精以察之而不雜形氣之私一以守之而純乎義理之正道心常為之主而人心聽命焉則危者安微者著動靜云為自無過不及之差而信能執其中矣堯之告舜但曰允執其中今舜命禹又推其所以而詳言之蓋古之聖人將以天下與人未嘗不以其治之之法并而傳之其見于經者如此後之人君其可不深思而敬守之哉纂疏朱子中庸章句序曰允執其中者堯之所以授舜也人心惟危至允執厥中者舜之所以授禹也堯之一言至矣盡矣而舜復益之以三言則所以明夫堯之一言必如是而後可庶幾也蓋常論之心之虛靈知覺一而已矣而以為有人心道心之異者則以其或生于形氣之私或原于性命之正而所以為知覺者不同是以或危殆而不安或微妙而難見耳然人莫不有是形故雖上智不能無人心亦莫不有是性故雖下愚不能無道心二者雜于方寸之間而不知所以治之則危者愈危微者愈微而天理之公卒無以勝夫人欲之私矣精則察夫二者之間而不雜也一則守其本心之正而不離也從事於斯無少間斷必使道心常為一身之主而人心每聽命焉則危者安微者著而動靜云為自無過不及之差矣夫堯舜禹天下之大聖也以天下相傳天下之大事也以天下之大聖行天下之大事而其授受之際丁寧反覆不過如此則天下之理豈有以加于此哉謂語録問程子曰人心人欲也曰人欲也未全是不好之危者危險欲墮未墮之間若無道心以御之則一向入於邪惡又不止於危也問聖人亦有人心亦危否曰聖人全是道心主宰故其人心自是不危是形氣是私有底物不比道公共危亦未便是不好只有箇不好底根本道心者人心之理惟微者有時發見些子有時又不見了惟聖人辨之精守得徹頭徹尾學者則須是擇善而固執之人只是此一箇心之靈其知覺從耳目之欲上去便是心知覺從義理上去便是道心自人心而收之便是道心自道心而放之便是人心人心如卒徒道心如將喜怒人心也喜過而不能禁怒甚而不能遏是皆為人心所使也須是喜所當喜怒所當怒乃是道心又如飢食渴飲須是飲食所當飲食乃是道心若飲盜泉之水食嗟來之食則人心勝而道心亡矣問人心可無否曰如何無得但以道心為主而人心聽命焉飢食渴飲人心也得飲食之正者道心也須是一心只在道心上少間那人心自降伏得不見了人心與道心為一恰似無了那人心相似只要道心純一道心都發見在那人心上道心雖先得之然被人心隔了一重故難見如清水之在濁水惟見其濁不見其清故微而難見人心只見那邊利害之私道心便見這邊道理之公有道心則人心為所節制人心皆道心也食道心為主則人心亦化而為道心矣如鄉黨所記飲衣服本是人心之發在聖人分上則渾是道心也須知將道心去用那人心方得聖人不以人心為主而以道心為主人心倚靠不得人心如船道心如柁任船則所在無定向若執定柁則去住在我人心未為悉皆邪惡危亦未為便至凶咎但既不主于理而主于形則其流為邪惡以致凶咎亦不難矣所以為危非若道心之必善而無惡有安而無傾有準的而可據依也故必致精一之功使公而無不善者常為一身萬事之主私而或不善者不得與焉則凡所云為不待擇於過不及之間而自然無不中矣人心是血氣和合做成嗜欲皆從此出故危道心是本來稟受得仁義禮智之心聖人以此二者對待而言正欲察之精而守之一察之精則兩箇界限分明一是専一守著箇道心不令人欲得以干犯惟這二者也須精去揀擇若揀得不精又便只是人心精是要揀得精惟一是要常守得固有初揀得精後來被物欲引從人心去所以又貴於惟一雖聖人不能無人心如飢食渴飲之類雖小人不能無道心如見孺子而怵惕皆是人心堯舜不能無道心桀紂不能無人欲易流故危道心即惻隱羞惡之心其端甚微精字是脈縫上見得分明一是守得徹頭徹尾如顔子擇中庸是精服膺勿失是一精一是舜教禹做工夫處此自堯舜以來未有他議論時先有此言聖人心法無以易此後來孔門教人先后次第皆宗之中庸擇善即惟精固執即惟一博學至明辨皆惟精篤行是惟一明善精也誠身一也格物致知非惟精不可能誠意則惟一矣學只是學此道理孟子以後失其傳亦只是失此若人心如此不好則須絶滅此身而後道心始明人心是有知覺嗜欲者此豈能無但為物誘而至於陷溺則為害耳道心則義理之心可為人心之主宰而人心據以為準者也如飢渴欲飲食人心也然必有義理存焉有可食有不可食如子路食于孔悝此不可食者當使人心每聽道心之區處方可耳然此道心却雜出於人心之間微而難見必須精之一之而後中可執去陸子靜云舜若以人心為全不好則須説不好使人之今止説危危者不可據以為安耳此言亦自是昧人心易得走從惡上去所以言危微是微妙亦是微精一是兩截工夫辨别了又須固守不辨别得固守箇甚麼辨别得了若不固守則不長逺問堯舜禹大聖人執字似亦大假喫力曰聖人固不思不勉然使聖人自有此意則罔念而作狂矣經言此類非一中只是箇恰好的道理允信也是真箇執得人心道心精一三句是執中以前事惟精是别得不雜惟一是守得不離惟精惟一所以能允執厥中説書傳所載多是説無過不及之中如中庸之中亦只無過不及但喜怒哀樂未發之中一處説中之體理所覺者心之理能覺者氣之靈理未知覺氣聚成形與氣合便能知覺虛靈是心之本體問生于形氣之私下私字何也曰飢飽寒暖之類皆生于吾之血氣形體而他人無與焉所謂私也亦未便是不好但不可一向徇之耳親真氏曰或疑形氣之私曰私猶言己之所獨耳如私私恩可謂之惡乎問六經曽有謂私非惡者否曰遂及我私言私其豵以惡言之可乎愚謂人心道心雜然發見惟在精以察之於人心中别其孰為道心復一以守之純乎道心而不搖奪於人心使察之不精則誤認人欲為天理矣守之不一則天理又將搖奪於人欲矣精一既至人心常聽命於道心人心之發皆道心也惟孔子之從心所欲足以證此心所欲人心也隨其心之所欲而自不踰于矩度非人心皆道心而自合于中乎非道心之外他有所謂中中即道心之流行於日用間而無過不及者也又案語録云虛靈是心之本體則可見知覺是心之發用所以中庸序云心之虛靈知覺一而已矣先兼體用言下云所以為知覺者不同單指心之用而言也無稽之言勿聽弗詢之謀勿庸無稽者不考于古弗詢者不咨于衆言之無據謀之自専是皆一人之私心必非天下之公論皆妨政害治之大者也言謂泛言勿聽可矣謀謂計事故又戒其勿用也上文既言存心出治之本此又告之以聽言處事之要內外相資而治道備矣纂疏陳氏經曰勿聽勿庸所以守護此中而勿失之可愛非君可畏非民衆非元后何戴后非衆罔與守邦欽哉慎乃有位敬修其可願四海困窮天祿永終惟口出好興戎朕言不再可愛非君乎可畏非民乎衆非君則何所奉戴君非民則誰與守邦欽哉言不可不敬也可願猶孟子所謂可欲凡可願欲者皆善也人君當謹其所居之位敬修其所可願欲者苟有一毫之不善生於心害於政則民不得其所者多矣四海之民至於困窮則君之天祿一絶而不復續豈不深可畏哉此又極言安危存亡之戒以深警之雖知其功德之盛必不至此然猶欲其戰戰兢兢無敢逸豫而謹之於毫釐之間此其所以為聖人之心也好善也戎兵也言發於口則有二者之分利害之幾可畏如此吾之命汝蓋已審矣豈復更有他説蓋欲禹受命而不復辭避也纂疏陳氏大猷曰人心惟危以下示心法傳道統也可愛非君以下示治法傳治統也愚案堯授舜舜授禹言有詳略而精微之理敬畏之心戒慎之辭一也堯傳舜曰天之厯數在爾躬允執其中四海困窮天祿永終舜之傳禹凡所得于堯之四句一一為禹言之中間增有十三句令義理益明警戒益至耳合堯曰禹謨而觀之可見矣禹曰枚卜功臣惟吉之從帝曰禹官占惟先蔽志昆命于元龜朕志先定詢謀僉同鬼神其依龜筮協從卜不習吉禹拜稽首固辭帝曰母惟汝諧枚卜歷卜之也帝之所言人事己盡禹不容復辭但請歷卜有功之臣而從其吉冀自有以當之者而已得遂其辭也官占掌占卜之官也蔽斷昆後龜卜筮蓍習重也帝言官占之法先斷其志之所向然後令之於龜今我志既先定而衆謀皆同鬼神依順而龜筮已協從矣又何用更枚卜乎况占卜之法不待重吉也固辭再辭也母者禁止之辭言惟汝可以諧此元后之位也纂疏王氏曰木幹曰枚枝曰條枚有條故數物曰枚數事曰條枚卜人人而卜之也蘇氏曰命龜令龜也後王氏十朋曰古以昆為兄兄為父後故訓昆為後與昆同夏氏曰卜汝已吉豈有更卜他人而重吉者習重也如習坎為重險人陳氏經曰人謀鬼謀雖欲其合大率以人謀為先就謀中又以己心為主正月朔旦受命于神宗率百官若帝之初神宗堯廟也蘇氏曰堯之所從受天下者曰文祖舜之所從受天下者曰神宗受天下於人必告於其人之所從受者禮曰有虞氏禘黃帝而郊嚳祖顓頊而宗堯則神宗為堯明矣正月朔旦禹受攝帝之命于神宗之廟總率百官其禮一如帝舜受終之初等事也帝曰咨禹惟時有苗弗率汝徂征禹乃會羣后誓于師曰濟濟有衆咸聽朕命蠢兹有苗昏迷不恭侮慢自賢反道敗德君子在野小人在位民棄不保天降之咎肆豫以爾衆士奉辭伐罪爾尚一乃心力其克有勳徂往也舜咨嗟言今天下惟是有苗之君不循教命汝往征之征正也往正其罪也會徴會也誓戒也軍旅曰誓有會有誓自唐虞時已然禮言商作誓周作會非也禹會諸侯之師而戒誓以征討之意濟濟和整衆盛之貌蠢動也蠢蠢然無知之貌昏暗迷惑也不恭不敬也言苗民昏迷不敬侮慢於人妄自尊大反戾正道敗壞常德用舍顛倒民怨天怒故我以爾衆士奉帝之辭罰苗之罪爾衆士庶幾同心同力乃能有功此上禹誓衆之辭也林氏曰堯老而舜攝者二十有八年舜老而禹攝者十有七年其居攝也代總萬機之政而堯舜之為天子蓋自若也故國有大事猶稟命焉禹征有苗蓋在夫居攝之後而稟命於舜禹不敢専也以征有苗推之則知舜之誅四凶亦必稟堯之命無疑纂疏陳氏曰時薄海內外皆迪有功弗率惟有苗耳三苗之君舜嘗竄之三苗之民又嘗分之至此而猶弗率故征之孫氏曰指其君長曰有苗兼君民言曰苗民以種類言曰三苗三旬苗民逆命益贊于禹曰惟德動天無逺弗屆滿招損謙受益時乃天道帝初于歷山往于田日號泣于旻天于父母負罪引慝祗載見瞽瞍夔夔齊栗瞽亦允若至諴感神矧兹有苗禹拜昌言曰俞班師振旅帝乃誕敷文德舞干羽于兩階七旬有苗格三旬三十日也以師臨之閲月苗頑猶不聽服也贊佐屆至也是時益蓋從禹出征以苗負固恃強未可威服故贊佐於禹以為惟德可以動天其感通之妙無逺不至蓋欲禹還兵而增修其德也滿損謙益即易所謂天道虧盈而益謙者帝舜也歷山在河中府河東縣仁覆閔下謂之旻日非一日也言舜耕歷山往于田之時以不獲順於父母之故而日號呼於旻天于其父母蓋怨慕之深也負罪自負其罪不敢以為父母之罪引慝自引其慝不敢以為父母之慝也祗敬載事也瞍長老之稱言舜敬其子職之事以見瞽瞍也齊莊敬也栗戰栗也夔夔莊敬戰栗之容也舜之敬畏小心而盡于事親者如此允信若順也言舜以誠孝感格雖瞽瞍頑愚亦且信順之即孟子所謂底豫也誠感物曰諴益又推極至誠之道以為神明亦且感格而况於苗民乎昌言盛德之言拜所以敬其言也班還振整也謂整旅以歸也或謂出曰班師入曰振旅謂班師於有苗之國而振旅于京師也誕大也文德文命德教也干楯羽翳也皆舞者所執也兩階賔主之階也七旬七十日也格至也言班師七旬而有苗來格也舜之文德非自禹班師而始敷苗之來格非以舞干羽而後至史臣以禹班師而歸弛其威武専尚德教干羽之舞雍容不迫有苗之至適當其時故作史者因即其實以形容有虞之德數千載之下猶可以是而想其一時氣象也纂疏語録舞干羽之事想只是置三苗於度外而自間暇之意吕氏曰苗民障蔽之深如春風既至而隂崖寒谷猶未發榮禹自會此理聞益之贊心領神受如曽子之唯即班師而還其從如響干羽舞階間暇自然非故為如此而有苗自格此如春風流暢寒谷草木終皆發榮也唐孔氏曰益贊禹修德而帝誕敷文德可見君臣同心武舞執干文舞執羽張氏曰帝之文德素敷至此又誕敷之優林氏曰此史臣形容舜禹盛德不用兵戈以服苗惟遊敷德而苗自至非謂班師而歸舞于兩階以是為敷文而冀苗之格也勉愚謂禹不滿假不矜伐如此益猶以滿損謙益言蓋以乾乾不息之誠也又三致其意謂天道之逺而德可感瞽瞍之頑而孝可若神明之幽而誠可格苗亦人耳豈有德之盛誠之至而不可動者宜其終不煩兵而自服也之董氏鼎曰禹有萬世永賴之功又有大關萬世君道謨非同列所得而先也况此篇所紀又有授受傳心一大事百聖道統萬世道學在焉安得不以繼二典而冠三謨哉前一截皆發明究竟克艱之旨後一截皆紀述授受之事前之綱領在克艱後之綱領在道心精一人君能得精一執中之傳則知性分內事即宇宙內事宇宙內事即職分內事而於克君道之艱自見其當然有不必勉而能然者矣臯陶謨今文古文皆有纂疏碧梧馬氏曰此篇首尾皆與禹問答而謂之謨者實陳於帝之前也故揚雄曰臯陶以智為帝謨曰若稽古臯陶曰允迪厥德謨明弼諧禹曰俞如何臯陶曰都慎厥身修思永惇敘九族庶明勵翼邇可逺在兹禹拜昌言曰俞稽古之下即記臯陶之言者謂考古臯陶之言如此也臯陶言為君而信蹈其德則臣之所謀者無不明所弼者無不諧也俞如何者禹然其言而復問其詳也都者臯陶美其問也慎者言不可不致其謹也身修則無言行之失思永則非淺近之謀厚敘九族則親親恩篤而家齊矣庶明勵翼則羣哲勉輔而國治矣邇近兹此也言近而可推之逺者在此道也蓋身修家齊國治而天下平矣臯陶此言所以推廣允迪謨明之義故禹復俞而然之也又案典謨皆稱稽古而下文所記則異典主記事故堯舜皆載其實謨主記言故禹臯陶則載其謨后克艱厥后臣克艱厥臣禹之謨也允迪厥德謨明弼諧臯陶之謨也然禹謨之上增文命敷于四海祗承于帝者禹受舜天下非盡臯陶比例立言輕重於此可見纂疏語録問允迪至弼諧是稱臯陶曰若稱臯陶則下句禹曰俞為何所俞耶此八字臯之言禹善而問之故臯復説下句解此八字之義或云此言臯之德諧字下别有臯之言今脫去未知是否下文謹身思永是允迪厥德意庶明勵翼是謨明弼諧意恐不是形容臯陶底語謨是為人主謀謨弼諧是人臣輔翼與之和合如同寅協恭必蘇氏曰虞世而謂禹臯為古者自今以上皆為古何異代春秋傳引虞書皆云夏書安知非作於夏時禹曰俞上當有缺文謨林氏曰迪啓迪也如迪上言臣欲允信以啓迪君德必貴明弼必貴諧臯與禹語於帝前欲與之以此事舜也於吕氏曰史言臯之為人有德而有言臯以謨聞實本德故指其所本以示人齊家治國平天下皆自修身出故慎於修身必思永長之理可久而後功用無窮也李氏舜臣曰臯謨發端曰慎厥身修一篇之要領也取人以身修身者知人以安民之本也陳氏曰九族宜厚厚之也有次序不至為夷子之二本也禹臯同列之際無非真情實意有合於心則都之俞之不合則吁之咈之善之在人猶在已故聞言而拜不為諂善之在己猶在人故自言而先曰都不為矜陳氏大猷曰治無二本邇可則逺在此矣王氏炎曰臯謨有三修身知人安民是也而修身為本邇者既可推之國與天下無不可者其本蓋在此也本焉在修身而已矣陳真氏大學衍義以克明俊德章為首此章次之謂臯謨首以謹修其身為言蓋人君一身天下國家之本慎之一言又修身之本也思永欲其悠久不息也為君孰不知身之當修然此心或放則能暫而不能久必也致其謹慎思悠久而不息然後謂之永否則朝勤夕怠乍作乍止矣後之主有初鮮終由不思永也慎則敬而不忽思永則久而不忘修身之道備矣然後以親親尊賢二者繼之九族必篤敘之使均被吾恩衆賢必勸勵之使樂為吾輔身為之本而二者又各盡其道則自家可推之國自國可推之天下其道在此而已中庸九經之序其亦祖於此歟言愚案允迪二句孔氏亦以為臯之言迪德之君則臣易入故謨易以明而弼易以諧臯欲君迪德以為己陳謨之地也程子家人傳曰正倫理篤恩義家人之道也惇者篤恩義敘者正倫理歟二字盡齊家之義臯陶曰都在知人在安民禹曰吁咸若時惟帝其難之知人則哲能官人安民則惠黎民懷之能哲而惠何憂乎歡兜何遷乎有苗何畏乎巧言令色孔壬臯陶因禹之俞而復推廣其未盡之旨數美其言謂在於知人在於安民二者而已知人智之事安民仁之事也禹曰吁者歎而未深然之辭也時是也帝謂堯也言既在知人又在安民二者兼舉雖帝堯亦難能之哲智之明也惠仁之愛也能哲而惠猶言能知人而安民也遷竄巧好令善孔大也好其言善其色而大包藏凶惡之人也言能哲而惠則智仁兩盡雖黨惡如歡兜者不足憂昏迷如有苗者不足遷與夫好言善色大包藏姦惡者不足畏是三者舉不足害吾之治極言仁智功用如此其大也或曰巧言令色孔壬共工也禹言三凶而不及鯀者為親者諱也知楊氏曰知人安民此臯陶一篇之體要也九德而下人之事也天敘有典而下安民之道也非知人而能安民者未之有也纂疏陳氏大猷曰君道在知人安民知人而後能安民又其序也帝陳氏曰咸若時謂悉如上所言皆如是也孔氏曰堯亦以知人安民為難張橫渠曰帝謂舜也未林氏曰舜既罪四凶惟恐又有如此之人復出為惡嘗忘憂畏也真氏曰孔壬古注以為甚佞介甫謂其包藏禍心蓋以壬為妊娠之妊胡氏非之謂此訓將以腹非罪人蔡氏仍祖其説不若從孔注為長惟愚謂此處言帝但當指舜與帝德廣運不同彼上文帝時克舜方美堯故益承其説美堯此禹臯言於舜前舍舜言堯何所因耶禹於克艱真知灼見知人安民之不易故吁以歎其難謂兼盡之雖舜猶難也其難之即猶病諸之意知人則必哲始能官人安民則必惠始黎民懷二者之難可知矣果能哲而且惠則哲以知人何憂兜之黨惡惠以安民何遷苗之害民知人視安民猶重故申言又何畏乎巧令孔壬至此則前所謂難今何憂何遷何畏不見其為難矣非禹深知克艱之理孰能發明至此臯陶曰都亦行有九德亦言其人有德乃言曰載采采禹曰何臯陶曰寬而栗柔而立願而恭亂而敬擾而毅直而溫簡而廉剛而塞強而義彰厥有常吉哉亦總也亦行有九德者總言德之見於行者其凡有九也亦言其人有德者總言其人之有德也載行采事也總言其人有德必言其行某事某事為可信驗也禹曰何者問其九德之目也寬而栗者寬𢎞而莊栗也柔而立者柔順而植立也願而恭者謹願而恭恪也亂治也亂而敬者有治才而敬畏也擾馴也擾而毅者馴擾而果毅也直而溫者徑直而溫和也簡而廉者簡易而亷隅也剛而塞者剛健而篤實也強而義者強勇而好義也而轉語辭也正言而反應者所以明其德之不偏皆指其成德之自然非以彼濟此之謂也彰著也成德著之於身而又始終有常其吉士矣哉纂疏語録載采采古語不可曉據文勢解之當云泛言人之行有此九德若言其人之有德當以事實言之古注謂必言其所行某事某事以為驗是也件九德分得細密十八種是好底氣質每兩一家鬬合將來九德凡舜論直溫寬栗及臯陶九德皆是反氣質之性德蘇氏曰論其人則曰斯人也有某德論其德則曰是也有某事載采采歷言之也橫流而濟曰亂才過人而可濟難亦曰亂亂臣十人是也才過人者每患恃才而不敬唐孔氏曰願者朴謹失於外儀故言恭治者輕物失於內心故言敬恭在貌敬在心剛是性強是志真氏曰九德指氣稟而言若天命之性則渾然全體無所偏也吉劉氏正一曰常人吉士一也立政曰庶常吉士則知士未始不有常德而常德所以為吉士也一説吉福也彰用常德則為天下福葉氏曰觀人不求其全而求其常常而不全不害為德德而不常皆矯偽耳𢎞愚謂人之德性本無不善而氣質所稟鮮有不偏寬者易失之縱緩故能莊栗乃成一德餘皆然也自寬至強皆稟賦之性自栗至義皆變化之功能以此九德觀人則一德之成不成衆德之全不全皆可知而知人之道盡矣氣質之性其意已根源於此但未説破耳日宣三德夙夜浚明有家日嚴祗敬六德亮采有邦翕受敷施九德咸事俊乂在官百僚師師百工惟時撫于五辰庶績其凝宣明也三德六德者九德之中有其三有其六也浚治也亮亦明也有家大夫也有邦諸侯也浚明亮采皆言家邦政事明治之義氣象則有小大之不同三德而為大夫六德而為諸侯以德之多寡職之大小槩言之也夫九德有其三必日宣而充廣之而使之益以著九德有其六尤必日嚴而祗敬之而使之益以謹也翕合也德之多寡雖不同人君惟能合而受之布而用之如此則九德之人咸事其事大而千人之俊小而百人之乂皆在官使以天下之才任天下之治唐虞之朝下無遺才而上無廢事者良以此也師師相師法也言百僚皆相師法而百工皆及時以趨事也百僚百工皆謂百官言其人之相師則曰百僚言其人之趨事則曰百工其實一也撫順也五辰四時也木火金水旺於四時而土則寄旺於四季也禮運曰播五行於四時者是也凝成也言百工趨時而衆功皆成也纂疏語録林氏謂大夫諸侯用此三德六德之人如孝經説諍臣之類蓋曰如是足矣非必以為限也浚葉氏曰臯既論知人之事因言官人之道夏氏曰濬通治而深之之謂之王氏曰日宣逹三德之賢使任有家日嚴祗敬六德賢使任有邦林氏曰百工之事各得其時故胡氏旦曰五行在地為物在天為時順其時而撫之仲春斬陽木仲夏斬隂木所以撫木辰季春出火季秋納火所以撫火辰司空相阪隰以撫土辰秋為徒杠春達溝渠以撫水辰又春德在木布德施惠順木辰也後放此君愚案日宣日嚴作賢者自修出古注蔡氏用之作人用人語録是之與翕受意協君之用賢當隨其德之小大而酌其任之小大有家視邦為小故三德而足有邦視家為大故六德而足朝廷視有邦尤大故全德全才受而用之俊乂即全德之全才也朝廷之治大關天人故於用九德詳言之而要其功用之極焉惟時訓理之是古注説書中惟時如食哉惟時惟時亮天功惟時惟幾皆天時也况撫五辰分配四時正與天時意脈相貫無教逸欲有邦兢兢業業一日二日萬幾無曠庶官天工人其代之無與母通禁止之辭教非必教令謂上行而下效也言天子當以勤儉率諸侯不可以逸欲導之也兢兢戒謹也業業危懼也幾微也易曰惟幾也故能成天下之務蓋禍患之幾藏於細微而非常人之所豫見及其著也則雖智者不能善其後故聖人於幾則兢業以圖之所謂圖難於其易為大於其細者此也一日二日者言其日之至淺萬幾者言其幾事之至多也蓋一日二日之間事幾之來且至萬焉是可一日而縱欲乎曠廢也言不可用非才而使庶官曠廢厥職也天工天之工也人君代天理物庶官所治無非天事苟一職之或曠則天工廢矣可不深戒哉纂疏通書曰動而未形有無之間者幾也解曰幾者理雖已萌事則未著萬孔氏曰不為逸豫貪欲之教是有國者之常當戒懼事之微位非其人為空官不可以天官私非其才惟陳氏大猷曰功成之後逸欲易生逸欲生治功墮矣戒逸欲而存兢業則此心清明剛健事之幾微無不洞燭否則此心昏惰何以察幾微而圖之天子能以一心審天下之幾不能以一身兼天下之務任之庶官而已非無其人之為曠非其人為曠也天下事無一不出於天天不自為人代為之一官曠一事缺矣天工人代一句結上文以生下文之意天敘有典敕我五典五惇哉天秩有禮自我五禮有庸哉同寅協恭和衷哉天命有德五服五章哉天討有罪五刑五用哉政事懋哉懋哉敘者君臣父子兄弟夫婦朋友之倫敘也秩者尊卑貴賤等級隆殺之品秩也敕正惇厚庸常也有庸馬本作五庸衷降衷之衷即所謂典禮也典禮雖天所敘秩然正之使敘倫而益厚用之使品秩而有常則在我而已故君臣當同其寅畏協其恭敬誠一無間融會流通而民彞物則各得其正所謂和衷也章顯也五服五等之服自九章以至一章是也言天命有德之人則五等之服以彰顯之天討有罪之人則五等之刑以懲戒之蓋爵賞刑罰乃人君之政事君主之臣用之當勉勉而不可怠者也楊氏曰典禮自天子出故言敕我自我若夫爵人於朝與衆共之刑人於市與衆棄之天子不得而私焉此其立言之異也纂疏語録許多典禮都是天敘天秩下了聖人因而敕正之因而用出去而已凡冠昏喪祭之禮與典章制度文物禮樂車旗衣服無一件是聖人自做底都是天做下了聖人只是依傍他天理行將去如推箇車子本自轉將去我只是略扶助之而已德之大者賞以服之大德之小者賞以服之小罪之大者罪以大底刑罪之小者罪以小底刑盡是天命天討聖人未嘗加一毫私意於其間只是奉行天法而已要五典五惇五禮五庸須是同寅協恭和𠂻要五服五章五刑五庸須是政事懋哉懋哉能陳氏大猷曰此下言安民之事人受天地之中以生者養之以福不能者敗以取禍故全是中者為德是不失天之所賦也故天命之君必體福善之天制九章至一章五等之服以章其德戾是中者為罪是失天之所賦也故天討之君必體禍淫之天用墨至大辟五等之刑以威其罪賞罰政事之大者當勉勉而不怠也典禮教化也所以盡感發之妙服刑政事也所以盡勸懲之方皆承天以從事而寅恭懋勉又四者之本也否則將失其當烏能與天無間哉至是則君師之道代天理民之責盡矣此盡發上文天工人代之意教孫氏曰典禮教也服刑政也教之而善則服以章之之不率則刑以懲之服蔡氏元度曰周禮司服公之服自衮冕而下如王之侯伯之服自鷩冕而下如公之服子男之服自毳冕而下如侯伯之服孤之服自希冕而下如子男之服卿大夫之服自玄冕而下如孤之服鄭氏注衮冕服九章一曰龍二曰山三曰華蟲四曰火五曰宗彞皆畫以為繢六曰藻七曰米八曰黼九曰黻皆絺以為繡衮之衣五章裳四章凡九也鷩以華蟲為首衣三章裳四章凡七也毳畫虎蜼謂宗彞也宗彞為首衣三章裳二章凡五也希刺粉米無畫衣一章裳二章凡三也玄者衣無文裳刺黻而已虞制雖未必盡同大略當然馬氏曰周天子與上公皆服九章然公有降龍無升龍别於天子者此耳愚謂典者人道之常天所次序本有此典也我謂君也五典五禮已解見舜典敕正自我即天敘之本然者而品節之然後有典别而為五典而五者皆惇厚也惇典如言厚人倫禮者天理之節文天所品秩本有此禮也自我即天秩之本然者而品節之然後有禮别而為五禮始用此五者於天下也蓋典禮本於天天命之性也雖有敘秩之次然猶在渾融之中典禮惇庸於君修道之教也理一者品節而為分殊於是渾然之有别為燦然之五惇於聖人而倫紀厚庸於聖人而禮教行然未嘗以一毫之人為求加於本然之天也吉凶軍賔嘉之五禮行於父子君臣夫婦長幼朋友人倫之中所以維持五典者也衷即典禮之具於人性者君臣同寅協恭以為惇典庸禮之本然後能和斯民降衷之性也同寅協恭與政事懋懋皆當合君臣説大者為政君所建立小者為事臣所奉行皆君臣同盡其責以終上文天工人代之意天聰明自我民聰明天明畏自我民明威達于上下敬哉有土威古文作畏二字通用明者顯其善畏者威其惡天之聰明非有視聽也因民之視聽以為聰明天之明畏非有好惡也因民之好惡以為明畏上下上天下民也敬心無所慢也有土有民社也言天人一理通逹無間民心所存即天理之所在而吾心之敬是又合天民而一之者也有天下者可不知所以敬之哉纂疏語録林氏謂聰明言視聽明畏言好惡如何曰林説是明畏言天之所明所畏所明如明明揚側陋之明所威如董之用威威用六極之意林氏曰馬本作天民威古文作民明畏威畏古字多通用聽唐孔氏曰天無心以民心為心即天視自我民視天自我民聽意陳氏曰有土之君敬而不忽乎民是即不忽乎天使知天之當嚴而以民為易虐是天民有二理也此安民之謨所以必推極於此歟也王氏炎曰君民而敬心不存則所以安民者必未盡真氏曰武夷胡氏嘗舉天敘至有土而曰臯陶之學極精粹臯陶曰朕言惠可底行禹曰俞乃言底可績臯陶曰豫未有知思曰贊贊襄哉思曰之曰當作日襄成也臯陶謂我所言順於理可致之於行禹然其言以為致之於行信可有功臯陶謙辭我未有所知言不敢計功也惟思日贊助於帝以成其治而已纂疏林氏曰左定十五年葬定公雨不克襄事注襄成也孔訓為上不及陳氏大猷曰贊而又贊贊之不已也益稷今文古文皆有但今文合於臯陶謨帝曰來禹汝亦昌言正與上篇末文勢接續古者簡册以竹為之而所編之簡不可以多故釐而二之非有意於其間也以下文禹稱益稷二人佐其成功因以名篇帝曰來禹汝亦昌言禹拜曰都帝豫何言豫思日孜孜臯陶曰吁如何禹曰洪水滔天浩浩懷山襄陵下民昏墊豫乘四載隨山刋木暨益奏庶鮮食豫決九川距四海濬畎澮距川暨稷播奏庶艱食鮮食懋遷有無化居蒸民乃粒萬邦作乂臯陶曰俞師汝昌言孜孜者勉力不怠之謂帝以臯陶既陳知人安民之謨因呼禹使陳其言禹拜而歎美謂臯陶之謨至矣我更何所言惟思日勉勉以務事功而已觀此則上篇禹臯陶答問者蓋相與言於帝舜之前也如何者臯陶問其孜孜者何如也禹言往者洪水泛溢上漫于天浩浩盛大包山上陵下民昏瞀墊溺困於水災如此之甚也四載水乘舟陸乘車泥乘輴山乘樏也輴史記作橇漢書作毳以板為之其狀如箕擲行泥上樏史記作橋漢書作梮以鐵為之其形似錐長半寸施之履下以上山不蹉跌也蓋禹治水之時乘此四載以跋履山川踐行險阻者隨循刋除也左傳云井堙木刋刋除木之義也蓋水涌不泄泛濫濔漫地之平者無非水也其可見者山耳故必循山伐木通蔽障開道路而後水工可興也奏進也血食曰鮮水土未平民未粒食與益進衆鳥獸魚鱉之肉於民使食以充飽也九川九州之川也距至濬深也周禮一畝之間廣尺深尺曰畎一同之間廣二尋深二仞曰澮畎澮之間有遂有溝有洫皆通田間水道以小注大言畎澮而不及遂溝洫者舉小大以包其餘也先決九川之水使各通于海次濬畎澮之水使各通于川也播布也謂布種五穀也艱難也水平播種之初民尚艱食也懋勉也懋勉其民徙有於無交易變化其所居積之貨也蒸衆也米食曰粒蓋水患悉平民得播種之利而山林川澤之貨又有無相通以濟匱乏然後庶民粒食萬邦興起治功也禹因孜孜之義述其治水本末先後之詳而警戒之意實存於其間蓋欲君臣上下相與勉力不怠以保其治於無窮而已師法也臯陶以其言為可師法也纂疏蘇氏曰禹曰俞何言亦猶臯之豫未有知也曰豫思日孜孜亦猶臯之思日贊贊襄也皆相因之辭愚謂舜禹好善之心皆無窮當時昌言滿前舜猶渴聞不倦方使禹亦如臯之昌言此舜好善無窮之心也禹聞此言歎美此心謂臯言已至我復何言讓善於人也思日孜孜力行不倦勉為善於已也此禹好善無窮之心也孟子曰禹聞善言則拜大舜有大焉善與人同舜禹之所以聖以此也禹因述治水之勞以寓警戒蓋欲君臣間常如洪水未平時因前日之已孜孜者而日益孜孜以保治於悠久非自稱其功而已他人以言為言禹述躬行以為言宜臯以其昌言為可師亦知其警戒之深意矣唐孔氏曰益為虞官烈山澤進民以鮮食水所獲也棄為稷官掌畎澮稼穡進民以艱食鮮食水退初種粒食及決水所獲也王氏曰大水決而有所歸小水濬而有所入治水之次第也禹吕氏曰禹用力如此艱難然後民乃粒食須看乃字不矜伐今自敘其功若矜伐者蓋艱難之念易忘平成之功難保今已平成昔之艱難不可忘也所思日孜孜正在此雖不曰謨乃謨之大者使自言其功而非有深意何以謂之昌言哉蔡氏元度曰水平之後人知禹功而已禹以益稷與有功故言暨益暨稷不自有其功而與益稷同功不矜不伐亦見於此董氏鼎曰播奏播言艱食奏言鮮食也丘輴音春樏音閭撬喬反挶音菊禹曰都帝慎乃在位帝曰俞禹曰安汝止惟幾惟康其弼直惟動丕應徯志以昭受上帝天其申命用休禹既歎美又特稱帝以告之所以起其聽也慎乃在位者謹其在天子之位也天位惟艱一念不謹或以貽四海之憂一日不謹或以致千百年之患帝深然之而禹又推其所以謹在位之意如下文所云也止者心之所止也人心之靈事事物物莫不各有至善之所而不可遷者人惟私欲之念動搖其中始有昧於理而不得其所止者安之云者順適乎道心之正而不陷於人欲之危動靜云為各得其當而無有止而不得其止者惟幾所以審其事之發惟康所以省其事之安即下文庶事康哉之義至於左右輔弼之臣又皆盡其繩愆紏繆之職內外交修無有不至若是則是惟無作作則天下無不丕應固有先意而徯我者以是昭受于天天豈不重命而用休美乎纂疏葉氏曰慎乃在位即禹謨慎乃有位君臣更相戒也禹之言即帝所與言宜帝俞之將真氏曰人之心靜而後能動定而後能應使其膠擾為物役之不暇何以宰萬物乎先儒謂心者人之北辰北辰惟居其所故能為二十八宿之綱維心惟安所止故能為萬事之樞紐徯夏氏曰安汝止而下皆慎在位之事動則大應天下望之志徯望於君欲其治安我耳丕應徯志猶言丕從厥志之人氏漸曰堯之安安不待有所止也舜於所止而安皆性焉安焉之聖安行者也太甲於所止而盡欽敬復焉執焉之賢勉行者也三言者聖賢之分量見矣愚謂安汝所當止靜也幾者動之微動者幾之著靜而知幾以圖康又得直臣弼之則下應人心上當天心矣訓丕應徯志夏説為當帝曰吁臣哉鄰哉鄰哉臣哉禹曰俞鄰左右輔弼也臣以人言鄰以職言帝深感上文弼直之語故曰吁臣哉鄰哉鄰哉臣哉反復歎詠以見弼直之義如此其重而不可忽禹即俞而然之也纂疏孔氏曰鄰近也君臣道近相須而成臣孫氏曰鄰指輔弼疑丞陳氏曰臣當與君親近故曰鄰相親近乃盡為臣之道故曰鄰臣反覆言之則張氏綱曰臣以分言鄰以情言一於分則離一於情褻鄒氏補之曰臣謹其分鄰忘其分也臣而鄰嚴不至苛鄰而臣和不至流一説鄰者親君如居有鄰也臣當如鄰以親君能如鄰以親君乃臣也皆指禹言帝曰臣作朕股肱耳目豫欲左右有民汝翼豫欲宣力四方汝為豫欲觀古人之象日月星辰山龍華蟲作會宗彝藻火粉米黼黻絺繡以五采彰施于五色作服汝明豫欲聞六律五聲八音在治忽以出納五言汝聽此言臣所以為鄰之義也君元首也君資臣以為助猶元首須股肱耳目以為用也下文翼為明聽即作股肱耳目之義左右者輔翼也猶孟子所謂輔之翼之使自得之也宣力者宣布其力也言我欲左右有民則資汝以為助欲宣力四方則資汝以有為也象像也日月以下物象是也易曰黃帝堯舜垂衣裳而天下治蓋取諸乾坤則上衣下裳之制創自黃帝而成於堯舜也日月星辰取其照臨也山取其鎮也龍取其變也華蟲雉取其文也會繪也宗彝虎蜼取其孝也藻水草取其潔也火取其明也粉米白米取其養也黼若斧形取其斷也黻為兩已相背取其辨也絺鄭氏讀為黹紩也紩以為繡也日也月也星辰也山也龍也華蟲也六者繪之於衣宗彝也藻也火也粉米也黼也黻也六者繡之於裳所謂十二章也衣之六章其序自上而下裳之六章其序自下而上采者青黃赤白黑也色者言施之於繒帛也繪於衣繡於裳皆雜施五采以為五色也汝明者汝當明其小大尊卑之差等也又案周制以日月星辰晝於旗冕服九章登龍於山登火於宗彞以龍山華蟲火宗彝五者繪於衣以藻粉黼黻四者繡於裳衮冕九章以龍為首鷩冕七章以華蟲為首毳冕五章以虎蜼為首蓋亦增損有虞之制而為之耳六律陽律也不言六吕者陽統隂也有律而後有聲有聲而後八音得以依據故六律五聲八音言之敘如此也在察也忽治之反也聲音之道與政通故審音以知樂審樂以知政而治之得失可知也五言者詩歌之協於五聲者也自上逹下謂之出自下逹上謂之納汝聽者言汝當審樂而察政治之得失者也纂疏語録義剛點作會作一句先生曰點得是問五言東萊云君臣民事物之言曰此是五聲所屬如宫亂則荒其君驕宫屬君最大羽屬物最小若商放緩便似宫聲出納五言恐是審樂知政之類如此説亦頗通之問五言林氏以為五聲之言古注以為仁義禮智信言孰是曰未詳當闕曰或曰臣當為我之身非但為鄰以親君而已王氏汝翼作肱汝為作股汝明作目汝聰作耳也司徒敷教豈非左右稷播種士明刑豈非宣力秩宗掌禮豈不制服夔典樂豈不察音然各治一官禹則總而治之故盡寄以股肱耳目夫孔氏曰天子服日月而下諸侯龍而下士服藻火大加粉米上得兼下下不得僣上作尊卑之服汝明其制不過十二天子服十二章象天數也唐孔氏曰天數陳氏曰古人之象謂古人作服所以取象之意日月以下皆是是鄭氏曰自日月以下所取義皆君德也服是服必有德當觀象而自省焉施陳氏大猷曰五采五種華采之物丹藍粉墨之類彰施其采以彰明之也五色采施之為青黃赤白黑也舜以臣鄰命禹見君臣之忘勢繼以作股肱耳目見君臣之忘形君臣猶一身也君猶心臣猶體臣作朕股肱耳目君以臣為體也汝翼為明聽以遂豫所欲臣以君為心也納采詩納之於上如命太師陳詩以觀民風工以納言是也出出詩播之樂章如關雎用之鄉邦時而揚之是也五言謂其詩詠之合五常者雖葉氏曰五言即五聲詩言志歌永言聲依永律和聲言也播於律之所和則為五聲雖聲也本於詩之所諷則為五言文之於音為出采之於下為納禮吕氏曰五言樂之成言者如三百篇之詩是也作服之大者六律聲音樂之大者治定功成制禮作樂之時也禮樂非可以虛文舉言禮樂必在左右宣力之後民氣和洽然後可興禮樂固有次第也鷩蜼余救以季二反似猴黹音只紩音直音鱉雉屬豫違汝弼汝無面從退有後言欽四鄰違戾也言我有違戾於道爾當明正其失爾無面諛以為是而背毁以為非不可不敬爾鄰之職也申結上文弼直鄰哉之義而深責之禹者如此纂疏王氏曰拂我而相之謂之弼故弼字或作拂責吕氏曰不獨命禹為股肱耳目至此舉一身是非之盡付之舜非有慊而畏人後言非容受未至而致人後言禹又非欺君而面是背非者聖人敬畏無已惟恐過之不聞言之不盡故求之之切如此孫氏曰聖人不以無違自處而以有違求弼不居其聖也林氏曰舜欲禹盡所言弼直之道也舜大聖人豈有違待於弼禹亦聖人豈肯面從後言而猶以為戒所以為聖陳氏大猷曰豫欲汝翼為明聽謂當將順也豫違汝弼謂不當苟順也四鄰之臣各有其職舜悉以責禹者禹百揆無所不統也孔氏曰四鄰四近前後左右之臣敕使敬其職唐孔氏曰鄭玄以四鄰為四近之臣左輔右弼前疑後丞惟伏生書傳有此言文王世子有師保疑丞此外經傳無此官惟冏命云左右前後有位之士夏氏曰既責禹以弼違又欲其敬同列近臣使同心弼我也王氏炎曰無面從於上不諂欽四鄰於下不瀆一説欽四鄰即中庸敬大臣之義闕愚案欽四鄰上下疑有文朱子已嘗疑之庶頑讒説若不在時侯以明之撻以記之書用識哉欲並生哉工以納言時而揚之格則承之庸之否則威之此因上文而慮庶頑讒説之不忠不直也讒説即舜所堲者時是也在是指忠直為言侯射侯也明者欲明其果頑愚讒説與否也蓋射所以觀德頑愚讒説之人其心不正則形乎四體布乎動靜其容體必不能比於禮其節奏必不能比於樂其中必不能多審如是則其為頑愚讒説也必矣周禮王大射則供虎侯熊侯豹侯諸侯供熊侯豹侯卿大夫供麋侯皆設其鵠又梓人為侯廣與崇方三分其廣而鵠居一焉應古制亦不相逺也撻撲也即撲作教刑者蓋懲之使記而不忘也識志也録其過惡以識于册如周制鄉黨之官以時書民之孝悌睦姻有學者也聖人不忍以頑愚讒説而遽棄之用此三者之教啓其憤發其悱使之遷善改過欲其並生于天地之間也工掌樂之官也格有恥且格之格謂改過也承薦也聖人於庶頑讒説之人既有以啓發其憤悱遷善之心而又命掌樂之官以其所納之言時而揚之以觀其改過與否如其改也則進之用之如其不改然後刑以威之以見聖人之教無所不極其至必不得已焉而後威之其不忍輕於棄人也如此此即龍之所典而此命伯禹總之也纂疏語録問否則威之一假上文説欽四鄰止欲並生哉多不可曉如命龍亦曰朕堲讒説皆言讒説想是當時有此制今不能知又不當杜撰説只得置之侯以明之撻以記之只是賞罰曰既是賞罰當别有施設如何只靠射豈有無狀之人才得中便為好人乎之陳氏曰典樂命夔堲讒命龍此又責之禹二人有司事法守也故各主其一禹百揆故無所不統官孔氏曰不在時所行不在於是而為非者當察之樂誦詩以納諫當是正其義而揚之周禮注畫布曰正棲皮曰鵠詩疏正鵠皆鳥名難中以中為雋故以名的吕氏曰撻記書識非絶之也存其過所以存其恥恥則善心生矣工掌詩之官納言采其詩也揚其詩以驗其從否也詩可見人真情春秋會盟賦詩一有不類即能知之恥陳氏大猷曰侯撻行於一時書識示於悠久使其愧而遷善改過以並生於天地間也欲或曰書用識其善惡書其孝友睦姻識其善也斐豹除丹書識其惡也愚謂射侯以禮教也既撻書以愧恥之於先納言以樂教也復時揚以感發之於後有恥且格欲與並生之心遂矣用之宜也否者終不格與並生之心不獲遂威之不容己也禹曰俞哉帝光天之下至於海隅蒼生萬邦黎獻共惟帝臣惟帝時舉敷納以言明庶以功車服以庸誰敢不讓敢不敬應帝不時敷同日奏罔功俞哉者蘇氏曰與春秋傳公曰諾哉意同口然而心不然之辭也隅角也蒼生者蒼蒼然而生視逺之義也獻賢也黎獻者黎民之賢者也共同時是也敷納者下陳而上納也明庶者明其衆庶也禹雖俞帝之言而有未盡然之意謂庶頑讒説加之以威不若明之以德使帝德光輝達於天下海隅蒼生之地莫不昭灼德之逺著如此則萬邦黎民之賢孰不感慕興起而皆有帝臣之願惟帝時舉而用之爾敷納以言而觀其藴明庶以功而考其成旌能命德以厚其報如此則誰敢不讓於善敢不精白一心敬應其上而庶頑讒説豈足慮乎帝不如是則今任用之臣逺近敷同率為誕慢日進於無功矣豈特庶頑讒説為可慮哉纂疏語録明庶恐庶字誤只是試字在林氏曰禹不盡然帝之言又廣帝意謂輔弼之責雖臣鄰然當廣延黎獻無止此也王氏十朋曰舜典所言以待諸侯此以待黎獻諸侯親天子故直言奏自下而奏上也舜方求賢故特言納下陳而上納也諸侯以黜陟為重故言試黎獻以多得為盛故言庶陳氏曰諸侯之功已著特使奏其言而試其功以驗其已然之效黎獻之功未著故受其言而明示衆庶以功使人皆見之以責其將然之效陳氏大猷曰納言以言揚明功以事舉也敷同猶普同無若丹朱傲惟慢遊是好傲虐是作罔晝夜額額罔水行舟朋淫于家用殄厥世豫創若時娶于塗山辛壬癸甲啓􅈱􅈱而泣豫弗子惟荒度土功弼成五服至于五千州十有二師外薄四海咸建五長各迪有功苗頑弗即工帝其念哉帝曰迪朕德時乃功惟敘臯陶方祗厥敘方施象刑惟明漢志堯處子朱於丹淵為諸侯丹朱之國名也額額不休息之狀罔水行舟如奡蕩舟之類朋淫者朋比小人而淫亂于家也殄絶也世者世堯之天下也丹朱不肖堯以天下與舜而不與朱故曰殄世程子曰夫聖莫聖於舜而禹之戒舜至曰無若丹朱好慢遊作傲虐且舜之不為慢遊傲虐雖愚者亦當知之豈以禹而不知乎蓋處崇髙之位所以警戒者當如是也創懲也禹自言懲丹朱之惡而不敢以慢遊也塗山國名在今夀春縣東北禹娶塗山氏之女也辛壬癸甲四日也禹娶塗山甫及四日即往治水也啓禹之子􅈱􅈱泣聲荒大也言娶妻生子皆有所不暇顧念惟以大相度平治水土之功為急也孟子言禹八年於外三過其門而不入是也五服甸侯綏要荒也言非特平治水土又因地域之逺近以輔成五服之制也疆理宇內乃人君之事非人臣之所當専者故曰弼成也五千者每服五百里五服之地東西南北相距五千里也十二師者每州立十二諸侯以為之師使之相牧以紏羣后也薄迫也九州之外迫于四海每方各建五人以為之長而統率之也聖人經理之制其詳內略外者如此即就也謂十二師五長內而侯牧外而蕃夷皆蹈行有功惟三苗頑慢不率不肯就工帝當憂念之也帝言四海之內蹈行我之德教者是汝功惟敘之故其頑而弗率者則臯陶方敬承汝之功敘方施象刑惟明矣曰明者言其刑罰當罪可以畏服乎人也上文禹之意欲舜弛其鞭撲之威益廣其文教之及而帝以禹之功敘既已如此而猶有頑不即工如苗民者是豈刑法之所可廢哉或者乃謂苗之凶頑六師征之猶且逆命豈臯陶象刑之所能致是未知聖人兵刑之敘與帝舜治苗之本末也帝之此言乃在禹未攝位之前非徂征後事蓋威以象刑而苗猶不服然後命禹征之征之不服以益之諫而又增修德教及其來格然後分背之舜之此言雖在三謨之末而實則禹未攝位之前也纂疏語録苗頑弗即工此是禹治水時調役他國人夫不動也後方征之治其罪而竄之竄之而後分北之今説者謂既格而又叛恐無此事三苗想如今之溪洞溪洞有一種謂之貓未必非三苗之後史説三苗左洞庭右彭蠡今湖南江西之界地亦甚闊矣馬氏曰隆古君臣告戒如此諂諛忌諱者可以戒矣以真氏曰舜大聖人安有可戒之事而益以怠荒戒臯逸欲戒禹以傲虐戒豈憂其有是而豫防之邪抑知其無是而姑為是言邪人心惟危自昔所畏雖聖主不敢忘操存之功大臣事聖主不敢廢規警之益也氏孔氏曰治水一州用三萬人九州二十七萬人吕曰每州各立一師十二州十二師如十二牧養民曰牧為一州師帥曰師王氏炎曰薄迫近也從京師外近四海此九州外也王制五國以為屬屬有長即五長也咸建內外皆建也九州之內有師有長九州之外無師有長詳內略外也舜夏氏曰洪水未平九功未敘人救死不贍何暇迪德謂今天下所以迪行吾德而各迪有功者實汝功惟敘之故臯方敬承汝功之敘又慮迪德者怠方明示象刑以警之則已迪德者益勉未迪德者益畏而勉矣此如九功惟敘而董之用威不容己也意陳氏經曰天下皆迪功弗即工特一有苗若不足介也聖人之心以為一物梗化則有不能忘之意傲愚謂朱之不肖蔽以一言曰傲而已慢遊淫虐皆自出罔晝夜額額凶人為不善惟日不足之意州十二師之説孔氏説非吕説差勝蔡氏云每方各建五人為長説本林氏王説較優禹欲帝不恃刑威之用而益廣明德之及以丹朱為帝戒復以己之懲朱繼之末言天下皆順而苗獨頑若以為不止庶頑之頑者欲帝念之也夔曰戛擊鳴球搏拊琴瑟以詠祖考來格虞賔在位羣后德讓下管鼗鼓合止柷敔笙鏞以間鳥獸蹌蹌簫韶九成鳯凰來儀戛擊考擊也鳴球玉磬名也搏至拊循也樂之始作升歌於堂上則堂上之樂惟取其聲之輕清者與人聲相比故曰以詠蓋戛擊鳴球搏拊琴瑟以合詠歌之聲也格神之格思之格虞賔丹朱也堯之後為賔於虞猶微子作賔於周也丹朱在位與助祭羣后以德相讓則人無不和可知矣下堂下之樂也管猶周禮所謂隂竹之管孤竹之管孫竹之管也鼗鼓如鼓而小有柄持而搖之則傍耳自擊柷敔郭璞云柷如漆桶方二尺四寸深一尺八寸中有椎柄連底撞之令左右擊敔狀如伏虎背上有二十七鉏鋙刻以籈櫟之籈長一尺以木為之始作也擊柷以合之及其將終也則櫟敔以止之蓋節樂之器也笙以匏為之列管於匏中又施簧於管端鏞大鐘也葉氏曰鐘與笙相應者曰笙鐘與歌相應者曰頌鐘頌或謂之鏞詩賁鼓維鏞是也其大射禮樂人宿縣於阼階東笙磬西面其南笙鐘西階之西頌磬東面其南頌鐘頌鐘即鏞鐘也上言以詠此言以間相對而言蓋與詠歌迭奏也鄉飲酒禮云歌鹿鳴笙南陔間歌魚麗笙由庚或其遺制也蹌蹌行動之貌言樂音不獨感神人至於鳥獸無知亦且相率而舞蹌蹌然也簫古文作簫舞者所執之物説文云樂名簫韶季札觀周樂見舞韶簫者則簫韶蓋舜樂之總名也今文作簫故先儒誤以簫管釋之九成者樂之九成也功以九敘故樂以九成九成猶周禮所謂九變也孔子曰樂者象成者也故曰成鳯凰羽族之靈者其雄為鳯其雌為凰來儀者來舞而有容儀也戛擊鳴球搏拊琴瑟以詠堂上之樂也下管鼗鼓合止柷敔笙鏞以間堂下之樂也唐孔氏曰樂之作也依上下而遞奏間合而後曲成祖考尊神故言於堂上之樂鳥獸微物故言於堂下之樂九成致鳯尊異靈瑞故别言之非堂上之樂獨致神格堂下之樂偏能舞獸也或曰笙之形如鳥翼鏞之虞為獸形故於笙鏞之間言鳥獸蹌蹌風俗通曰舜作簫笙以象鳯蓋因其形聲之似以狀其聲樂之和豈真有鳥獸鳯凰而蹌蹌來儀者乎曰是未知聲樂感通之妙也瓠巴鼓瑟而遊魚出聽伯牙鼓琴而六馬仰秣聲之致祥召物見於傳者多矣況舜之德致和於上夔之樂召和於下其格神人舞獸鳯豈足疑哉今案季札觀周樂見舞韶簫者曰德至矣盡矣如天之無不覆如地之無不載雖甚盛德蔑以加矣夫韶樂之奏幽而感神則祖考來格明而感人則羣后德讓微而感物則鳯儀獸舞原其所以能感召如此者皆由舜之德如天地之無不覆燾也其樂之傳歷千餘載孔子聞之於齊尚且三月不知肉味曰不圖為樂之至於斯則當時感召從可知矣又案此章夔言作樂之效其文自為一假不與上下文勢相屬蓋舜之在位五十餘年其與禹臯陶夔益相與答問者多矣史官取其尤彰明者以詔後世則是其所言者自有先後史官集而記之非其一日之言也諸儒之説自臯陶謨至此篇末皆謂文勢相屬故其説牽合不通今皆不取纂疏唐孔氏曰功成道洽禮備樂和史述夔言繼於後陳氏大猷曰戛亦擊也意其有輕重之異球擊能鳴故稱鳴球王氏炎曰磬輕為戛重為擊琴瑟重為搏輕為拊林氏曰揚雄長楊賦云戛滴鳴球注云戛滴拊擊也以是知鳴球可以戛擊古語云拊鳴琴又曰手撫五絃以是知琴瑟可以摶拊蓋升歌堂上取其聲之輕清者以與人聲相比也饗禮曰升歌清廟示德也下管象舞示事也燕禮曰升歌鹿鳴下管新宫蓋堂上之樂以歌為主堂下之樂以管為主其實相合以成别言則有堂上堂下之異合言則總名為簫韶為鄭氏曰琴五絃瑟二十四絃管如箎而六孔十二管笙夏氏曰以間與堂上之樂間作也炎陳氏經曰簫者細器作樂時小大之器皆備歌王氏曰凡樂以人聲為主歌於堂上者謂之登歌於堂下者謂之間歌以詠堂上之登歌也以間堂下之間歌也愚案此章夔言作樂之效乃史載之以終典謨蓋功成作樂帝者極治之盛也郊特牲曰歌者在上匏竹在下貴人聲也即此説以證此章與儀禮皆無不合古文簡質下之一字别管鼗等為堂下之樂顯見鳴球琴瑟為堂上之樂也戛擊之摶拊之以詠歌詩章所謂歌者在上也管鼗柷敔笙鏞皆堂下之樂管竹笙匏也皆在堂下以間者此衆樂與堂上之樂更代而間作也所謂匏竹在下也奏石絲以詠歌之時則堂下之樂不作奏匏竹等衆樂之時則堂上之樂不作以今奏樂例之亦如此耳今諸解徒見鄉飲酒禮燕禮並有間歌魚麗之文遂引以證此章林氏唱之其辭欠明若王氏炎則看儀禮疏率陳大猷復引儀禮分注其下改却本文尤非案儀禮鄉飲酒禮云工入升自西階北面坐小臣授瑟工歌鹿鳴四牡皇皇者華卒歌主人獻工笙入堂下北面立樂南陔白華華黍主人獻之乃間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀鄭注間代也謂一歌一吹歌歌詩吹吹笙也南陔等六題皆有聲無詞不可歌只可案其譜以吹笙故曰笙曰樂曰奏而不曰歌六題今見小雅乃元無詩詞小序妄云云耳燕禮大槩相似蓋間歌魚麗南有嘉魚南山有臺與笙由庚崇丘由儀相更替也與書之以間初不相干不過一間字同間代更替之義亦同耳雙溪謂堂上登歌堂下間歌直引間歌魚麗以解笙鏞以間謂以間即是間歌殊不知堂下安得有歌乎乍觀似可喜細考誤乃如此即儀禮注朱子詩傳參看則可見矣夔曰於豫擊石拊石百獸率舞庶尹允諧重擊曰擊輕擊曰拊石磬也有大磬有編磬有歌磬磬有大小故擊有輕重八音獨言石者蓋石音屬角最難諧和記曰磬以立辨夫樂以合為主而石聲獨立辨者以其難和也石聲既和則金絲竹匏土革木之聲無不和者矣詩曰既和且平依我磬聲則知言石者總樂之和而言之也或曰玉振之也者終條理之事故舉磬以終焉上言鳥獸此言百獸者考工記曰天下大獸五脂者膏者裸者羽者鱗者羽鱗總可謂之獸也百獸舞則物無不和可知矣尹正也庶尹者衆百官府之長也允諧者信皆和諧也庶尹諧則人無不和可知矣纂疏愚謂於音烏有禹曰於可證讀如字而連豫字者非序孫氏曰前先言祖考虞賔羣后後及鳥獸以貴賤為也此先言鳥獸後及庶尹以難易為序也又王氏炎曰八音以石為君而韶樂以球為首宜於此單言石也此又自為一節舜禹議論既載於前夔之作樂表治功之成故以其言次於後史比而書之夔上於樂者有舜之德不可無夔之樂以發之有夔之樂不可無舜之德以本之二者交致而天下之至和極矣帝庸作歌曰敕天之命惟時惟幾乃歌曰股肱喜哉元首起哉百工熙哉臯陶拜手稽首揚言曰念哉率作興事慎乃憲欽哉屢省乃成欽哉乃賡載歌曰元首明哉股肱良哉庶事康哉又歌曰元首叢脞哉股肱惰哉萬事墮哉帝拜曰俞往欽哉庸用也歌詩歌也敕戒敕也幾事之微也惟時者無時而不戒敕也惟幾者無事而不戒敕也蓋天命無常理亂安危相為倚伏今雖治定功成禮備樂和然頃刻謹畏之不存則怠荒之所自起毫髮幾微之不察則禍患之所自生不可不戒也此舜將欲作歌而先述其所以歌之意也股肱臣也元首君也人臣樂於趨事赴功則人君之治為之興起而百官之功皆廣也拜首稽首者首至手又至地也大言而疾曰揚率總率也臯陶言人君當總率羣臣以起事功又必謹其所守之法度蓋樂於興事者易至於紛更故深戒之也屢數也興事而數考其成則有課功核實之效而無誕慢欺蔽之失兩言欽哉者興事考成二者皆所當深敬而不可忽者也此臯陶將欲賡歌而先述其所以歌之意也賡續載成也續帝歌以成其義也臯陶言君明則臣良而衆事皆安所以勸之也叢脞煩碎也惰懈怠也墮傾圯也言君行臣職煩瑣細碎則臣下懈怠不肯任事而萬事廢壞所以戒之也舜作歌而責難於臣臯陶賡歌而責難於君君臣之相責難者如此有虞之治兹所以為不可及也歟帝拜者重其禮也重其禮然其言而曰汝等往治其職不可以不敬也林氏曰舜與臯陶之賡歌三百篇之權輿也學詩者當自此始纂疏陳氏曰用夔言功成樂作之意而寓之歌所以保治功也保治在敕天敕天之要在時幾人求天於天聖人求天於己人事之盡即天也不可失其時不可忽其微常存警敕天命可保矣乃歌之意謂吾欲敕天以謹時幾必賴股肱之助専責望於臣也賡歌之意専責望於君也君臣交警各盡其職則治功可保矣事真氏曰歌為敕天命作君臣唱和無一語及天修人所以敕天命也李氏把曰惟時無須臾之頃而不戒敕惟幾無細微之事而不戒敕也帝以有為望其臣臯以無為復其君陳氏大猷曰治至於功成作樂極矣然危亂之幾常兆於治安之極聖人安不忘危上下交相警戒故史既載韶樂復記歌詩歌詩亦樂之本也簫韶九成舜之治已極於至盛惟時惟幾舜之心方慮其至微治功已極聖心本無極也喜起熙帝欲振厲充廣也臯意謂無妄不可以復往極治不可以更加故因帝振厲充廣之意而欲其加謹慎省察之心凡所作興必謹守成憲而欽哉不可輕於有為也又必屢察已成而欽哉不可玩夫已為也於是賡歌謂君臣惟當明良而已不必過於喜起庶事惟底於康安而已不必過於熙廣乃所以凝泰和也君賴於臣故先股肱臣望乎君故先元首臯意未已也謂明非聰察之謂聰察則流於叢脞良非軟弱之謂軟弱則流於偷惰萬事將墮壞矣不過而失於激亦不怠而失於廢真可凝泰和而保天命矣往欽謂自此以往君臣無不敬也典謨皆以欽終之九成之韶敕天之歌非可以二觀虞韶不可得而聞帝歌猶可得而詠韶雖亡不亡者存焉世愚謂歌者和樂之發也當和樂之時不忘戒謹之意之歌功頌美者安知之序意在戒天命而謹時幾喜者喜於乘時圖幾也起者起而乘時圖幾也熙者共乘時圖幾之效驗也君臣若此庶可敕天命而永保之矣吕氏謂敕正天命之流行時頃幾微少有不敕則私欲間之與天命之流行不相似矣蓋以中庸維天之命解之失之太深非書之本旨也帝曰往欽哉蓋神會臯揚言兩欽哉之意矣舜臯皆以戒謹之敬發為詠歌之辭帝之欲戒敕天命此心也臯之欲慎憲省成亦此心也君臣心孚意契於欽敬中欽其百聖之心法治法歟歌之云乎豈徒頌詠而已也書集傳纂疏卷一
