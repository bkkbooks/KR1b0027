body:
  text: 書集傳纂疏卷四上元陳櫟撰朱子訂定蔡氏集傳周書周文王國號後武王因以為有天下之號書凡三十二篇泰誓上泰太同國語作大武王伐殷史録其誓師之言以其大㑹孟津編書者因以泰誓名之上篇未渡河作後二篇既渡河作今文無古文有案伏生二十八篇本無泰誓武帝時僞泰誓出與伏生全文書合為二十九篇孔壁書雖出而未傳於世故漢儒所引皆用僞泰誓如曰白魚入於王舟有火復於王屋流為烏太史公記周本紀亦載其語然僞泰誓雖知剽竊經傳所引而古書亦不能盡見故後漢馬融得疑其僞謂泰誓案其文若淺露吾又見書傳多矣所引泰誓而不在泰誓者甚多至晉孔壁古文書行而僞泰誓始廢吳氏曰湯武皆以兵受命然湯之辭裕武王之辭迫湯之數桀也恭武之數紂也傲學者不能無憾疑其書之晚出或非盡當時之本文也纂疏王氏炎曰古文太字只用大字今文遂以泰易大太者大之至故天子子曰太子卿曰太宰將渡河作第一誓已渡而次作第二誓將行作第三誓吳氏曰帝辛本紀稱紂書稱受或二字通用惟十有三年春大㑹於孟津十三年者武王即位之十三年也春者孟春建寅之月也孟津見禹貢按漢孔氏言虞芮質成為文王受命改元之年凡九年而文王崩武王立二年而觀兵三年而伐紂合為十有三年此皆惑於僞書泰誓之文而誤解九年大統未集與夫觀政于商之語也古者人君即位則稱元年以計其在位之久近常事也自秦惠文始改十四年為後元年漢文帝亦改十七年為後元年自後說春秋因以改元為重歐陽氏曰果重事歟西伯即位已改元年中間不宜改元而又改元至武王即位宜改元而反不改元乃上冒先君之元年并其居喪稱十一年及其滅商而得天下其事大于聼訟逺矣而又不改元由是言之謂文王受命改元武王冒文王之元年者皆妄也歐陽氏之辨極為明著但其曰十一年者亦惑於書序十一年之誤也詳見序篇又案漢孔氏以春為建子之月蓋謂三代改正朔必改月數改月數必以其正為四時之首序言一月戊午既以一月為建子之月而經又係之以春故遂以建子之月為春夫改正朔不改月數於太甲辨之詳矣而四時改易尤為無義冬不可以為春寒不可以為暖固不待辨而眀也或曰鄭氏箋詩維暮之春亦言周之季春於夏為孟春曰此漢儒承襲之誤耳且臣工詩言維暮之春亦又何求如何新畬於皇來牟將受厥眀蓋言暮春則當治其新畬矣今如何哉然牟麥將熟可以受上帝之明賜夫牟麥將熟則建辰之月夏正季春審矣鄭氏於詩且不得其義則其考之固不審也不然則商以季冬為春周以仲冬為春四時反逆皆不得其正豈三代聖人奉天之政乎纂疏歐公力以文王稱王為非東坡亦有一說但書云惟九年大統未集豫小子其承厥志却是有這一箇瑕痕問子丑寅之建正如何曰此三陽之月大抵世代更易須著如此更易一畨孔氏曰此周之孟春唐孔氏曰周之孟春謂建子之月林氏曰十三年春即序一月戊午也周以建子為正春秋書元年春王正月即此月也泰誓作時正朔未改此史官追録之愚案蔡氏主不改月之說遂謂併不改時殊不知月數於周而改春隨正而易證之春秋左傳孟子後漢書陳寵傳極為眀著成十年六月丙午晋侯使甸人獻麥六月乃夏四月也僖五年十二月丙子朔晉滅虢先是卜偃言克虢之期其九月十月之交乎丙子朔必是時也偃以夏正言而春秋以周正書可見十二月丙子為夏十月也僖五年春王正月辛亥朔日南至王正月冬至豈非夏十一月乎經有只書時者僖十年冬大雨雪蓋以酉戌月為冬也使夏時之冬而大雨雪何足以為異而記之襄二十八年春無冰蓋以子丑月為春也使夏時之春而無氷何足以為異而記之春秋祥瑞不録災異乃載惟夏時八九月而大雪不當嚴寒而嚴寒夏時十一十二月而無氷當嚴寒而不嚴寒故異而書之耳春搜夏苗秋獮冬狩四時田獵定名也桓四年春正月公狩于郎杜氏注曰冬獵曰狩周之春夏之冬也魯雖案夏時之冬而於子月行冬田之狩夫子只書曰春狩于郎此所謂春非周之春而何哀十四年春西狩獲麟亦然也定十三年夏大搜于比蒲魯雖案夏時之春而於卯辰月行春田之搜夫子只書曰夏搜于比蒲此所謂夏非周之夏而何次年又書五月大搜于比蒲亦然也陳寵傳說尤眀的曰天以為正周以為春注云今十一月也地以為正殷以為春注云今十二月人以為正夏以為春注云今正月孟子七八月之間旱等不待多言而眀是三代之正子丑寅三陽月皆可以春言也胡氏春秋傳不敢謂王正月為非子月而於春王正月之春字謂以夏時冠周月皆考之不審安有隔兩月而以夏時冠周月之理但得四時之正適冬寒春暖之宜則惟夏時為然夫子欲行夏時蓋答顔子使得為邦則宜如此耳豈可但知有夏正之春而不知有商正周正之春乎一陽二陽三陽之月皆可為春故三代迭用之以為嵗首以一日論子時既可為次日子月豈不可為次年觀此則三代皆不改月數與冬不可為春之說陷於一偏明矣以十三年春為孟春建寅之月其失同上詳辨見武成王曰嗟我友邦冡君越我御事庶士明聽誓王曰者史臣追稱之也友邦親之也冡君尊之也越及也御事治事者庶士衆士也告以伐商之意且欲其聽之審也惟天地萬物父母惟人萬物之靈亶聰明作元后元后作民父母亶誠實無妄之謂言聰明出於天性然也大哉乾元萬物資始至哉坤元萬物資生天地者萬物之父母也萬物之生惟人得其秀而靈具四端備萬善知覺獨異於物而聖人又得其最秀而最靈者天性聰明無待勉强其知先知其覺先覺首出庶物故能為大君於天下而天下之疲癃殘疾得其生鰥寡孤獨得其養舉萬民之衆無一而不得其所焉則元后者又所以為民之父母也夫天地生物而厚於人天地生人而厚於聖人其所以厚於聖人者亦惟欲其君長乎民而推天地父母斯民之心而已天之為民如此則任元后之責者可不知所以作民父母之義乎商紂失君民之道故武王發此是雖一時誓師之言而實萬世人君之所當體念也纂疏湯武征伐皆先自說一假義理氣質之性古人雖不曾說著考之經典却有此意如人惟萬物之靈亶聰明作元后天乃錫王勇智皆此意也陳氏經曰天地無所不生言萬物人在其中矣萬物莫不稟氣于天受形于地乾稱父坤稱母此天地所以為萬物一大父母也天地能生人而賦以至靈之性而人不能保此靈必得聰明之君以父母之斯人始得各全其靈聰明亦靈也聖人出類拔萃而為靈之靈者耳碧梧馬氏曰作民父母一語武王以之首泰誓箕子以之終皇極今商王受弗敬上天降災下民受紂名也言紂慢天虐民不知所以作民父母也慢天虐民之實即下文所云也沈湎冒色敢行暴虐罪人以族官人以世惟宫室臺榭陂池侈服以殘害于爾萬姓焚炙忠良刳剔孕婦皇天震怒命我文考肅將天威大勳未集沈湎溺於酒也冒色冒亂女色也族親族也一人有罪刑及親族也世子弟也官使不擇賢才惟因父兄而寵任子弟也土髙曰臺有木曰榭澤障曰陂停水曰池侈奢也焚炙炮烙刑之類刳剔割剝也皇甫謐云紂剖比干妻以視其胎未知何據紂虐害無道如此故皇天震怒命我文王敬將天威以除邪虐大功未集而文王崩愚謂大勳在文王時未嘗有意至紂惡貫盈武王伐之叙文王之辭不得不爾學者當言外得之纂疏文武本無伐紂之心而天與之人歸之其勢必誅紂而後已故有肅將天威大勳未集之語但紂罪未盈天命未絶故文王猶得以三分之二服事殷若使文王未崩十二三年紂惡不悛天命已絶則孟津之事文王亦豈得而辭哉以此見文武之心未嘗不同皆無私意視天與人而已因說文王事殷先生曰文王但做得從容不迫武王便去伐商太猛耳文王伐崇密戡黎等事又自顯然書說王季勤勞王家詩說大王剪商都是他子孫自說不成他子孫誣其祖父春秋分明說泰伯不從是不從甚底事若泰伯當武王之世也只是為諸侯但時措之宜聖人又有不得已處橫渠云商之中世都棄了西方之地不管他所以戎狄復進入中國太王所以遷于岐然岐下也只是箇荒凉之地太王自去立箇家計如此陳氏經曰泰誓只言文考至武成始追王稱文考文王肆豫小子發以爾友邦冡君觀政于商惟受罔有悛心乃夷居弗事上帝神祇遺厥先宗廟弗祀犧牲粢盛既于凶盜乃曰吾有民有命罔懲其侮肆放也觀政猶伊尹所謂萬夫之長可以觀政八百諸侯背商歸周則商政可知先儒以觀政為觀兵誤矣悛改也夷蹲踞也武王言故我小子以爾諸侯之向背觀政之得失于商今諸侯背叛既已如此而紂無有悔悟改過之心夷踞而居廢上帝百神宗廟之祀犧牲粢盛以為祭祀之備者皆盡于凶惡盜賊之人即箕子所謂攘竊神祗之犧牷牲者也受之慢神如此乃謂我有民社我有天命而無有懲戒其侮慢之意纂疏程子曰觀政之說必無此理如今日天命絶則今日便是獨夫豈容更留之三年今日天命未絶便是君也為臣子者敢以兵脅君乎孔氏曰夷居平居林氏曰如原壤夷俟之夷天佑下民作之君作之師惟其克相上帝寵綏四方有罪無罪豫曷敢有越厥志佑助寵愛也天助下民為之君以長之為之師以教之君師者惟其能左右上帝以寵安天下則夫有罪之當討無罪之當赦我何敢有過用其心乎言一聼于天而已纂疏天只生得你付得這道理與你又為之立君師以作成之使無一夫不遂其性所以謂之克相上帝蓋助上帝之所不及也自秦漢以來無人知眀德新民之事君道間有得其一二而師道則絶無矣陳氏經曰師道不盡則不足以盡君道矣武王之意謂紂既不能當君師之責則任君師獨不在我乎我當相天以討紂之有罪而綏定天下之無罪者所不得而私也同力度德同德度義受有臣億萬惟億萬心豫有臣三千惟一心度量度也德得也行道有得于身也義宜也制事逹時之宜也同力度德同德度義意古者兵志之詞武王舉以明伐商之必克也林氏曰左氏襄三十一年魯穆叔曰年鈞擇賢義鈞則卜昭二十六年王子朝曰年鈞以德德鈞以卜蓋亦舉古人之語文勢正與此同百萬曰億紂雖有億萬臣而有億萬心衆叛親離寡助之至力且不同况德與義乎纂疏林氏曰凡勝負之理力同則有德者勝德同則有義者勝度德校善惡也度義校曲直也十萬曰億十億曰兆介軒董氏曰行道有得于身身當作心朱子暮年榜公堂取據于德一條改有得于身為有得于心仍俾六經用此為通例愚案此謂百萬曰億洛誥中又謂十萬曰億韋昭注椘語云十萬曰億古數也秦改制始以萬萬為億今解尚書合主十萬為億之說百萬曰億未見所本商罪貫盈天命誅之豫弗順天厥罪惟鈞貫通盈滿也言紂積惡如此天命誅之今不誅紂是長惡也其罪豈不與紂鈞乎如律故縱者與同罪也纂疏唐孔氏曰紂之惡如繩貫物其貫已滿豫小子夙夜祗懼受命文考類于上帝宜于冢土以爾有衆砥天之罰砥致也冢土大社也祭社曰宜言縱紂不誅則罪與紂鈞故此言豫小子畏天之威早夜敬懼不敢自寧受命于文王之廟告于天神地祇以爾有衆致天之罰于商也王制曰天子將出類乎上帝宜乎社造乎禰受命文考即造乎禰也王制以神尊卑為序此先言受命文考者以伐紂之舉天本命之文王武王特禀文王之命以卒其伐功而已纂疏陳氏經曰紂之惡在不敬上天文王之德在肅將天威武王之德在夙夜祗懼敬與不敬聖狂分焉興亡判焉天矜于民民之所欲天必從之爾尚弼豫一人永清四海時哉弗可失天矜憐于民民有所欲天必從之今民欲亡紂如此則天意可知爾庶幾輔我一人除其邪穢永清四海是乃天人合應之時不可失也纂疏林氏曰堯授舜舜授禹天實與之則先舜不可失其與之之時湯放桀武王伐紂夫實奪之則湯武不可失其取之之時故韓獻子曰文王率商之叛國以事紂惟知時也禮運亦曰堯授舜舜授禹湯放桀武王伐紂時也陳氏經曰君源也民流也源清則流清四海本清紂汚濁之伯夷太公所以避之以待天下之清也去紂而除其穢惡則源清而天下清矣泰誓中纂疏林氏曰漢律厯志周師初發以殷之十一月戊子後三日得周正月辛卯朔至戊午渡孟津孟津去周九百里師行日三十里几三十一日渡河三日三誓師上篇不言日以中篇考當是丁巳日在河南將渡孟津時誓而後渡河也中篇是戊午既渡而次河北所誓下篇是戊午明日將趨商郊誓而後行也三令五申謹之至也惟戊午王次于河朔羣后以師畢㑹王乃狥師而誓次止狥循也河朔河北也戊午以武成考之是一月二十八日曰嗚呼西土有衆咸聽朕言周都豐鎬其地在西從武王渡河者皆西方諸侯故曰西土有衆我聞吉人為善惟日不足凶人為不善亦惟日不足今商王受力行無度播棄犁老昵比罪人淫酗肆虐臣下化之朋家作仇脅權相滅無辜籲天穢德彰聞惟日不足者言終日為之而猶為不足也將言紂力行無度故以古人語發之無度者無法度之事播放也犁黧通黑而黃也微子所謂耄遜于荒是也老成之臣所當親近者紂乃放棄之罪惡之人所當斥逐者紂乃親比之酗醉怒也肆縱也臣下亦化紂惡各立朋黨相為仇讐脅上權命以相誅滅流毒天下無辜之人呼天告寃腥穢之德顯聞于上吕氏曰為善至極則至治馨香為惡至極則穢德彰聞纂疏孔氏曰吉人竭日以行善凶人亦竭日以行惡行無法度竭日不足故曰力行惟天惠民惟辟奉天有夏桀弗克若天流毒下國天乃佑命成湯降黜夏命言天惠愛斯民君當奉承天意昔桀不能順天流毒下國故天命成湯降黜夏命惟受罪浮于桀剝喪元良賊虐諫輔謂已有天命謂敬不足行謂祭無益謂暴無傷厥監惟不逺在彼夏王天其以豫乂民朕夢協朕卜襲于休祥戎商必克浮過剝落喪去也古者去國為喪元良微子也諌輔比干也謂已有天命如答祖伊我生不有命在天之類下三句亦紂所嘗言者鑒視也其所鑒視初不在逺有夏多罪天既命湯黜其命矣今紂多罪天其以我乂民乎襲重也言我之夢協我之卜重有休祥之應知伐商而必勝之也此言天意有必克之理纂疏林氏曰戎大也如曰殪戎殷受有億兆夷人離心離德豫有亂臣十人同心同德雖有周親不如仁人夷平也夷人言其智識不相上下也治亂曰亂十人周公旦召公奭太公望畢公榮公太顛閎夭散宜生南宫括其一文母孔子曰有婦人焉九人而已劉侍讀以為子無臣母之義蓋邑姜也九臣治外邑姜治內言紂雖有夷人之多不如周治臣之少而盡忠也周至也紂雖有至親之臣不如周仁人之賢而可恃也此言人事有必克之理纂疏張氏曰言夷人見無復君臣上下之等也天視自我民視天聽自我民聽百姓有過在豫一人今朕必往過廣韻責也武王言天之視聽皆自乎民今民皆有責于我謂我不正商罪以民心而察天意則我之伐商斷必往矣蓋百姓畏紂之虐望周之深而責武王不即拯已于水火也如湯東面而征西夷怨南面而征北狄怨之意纂疏愚案百姓有過不過如萬方有罪耳不必訓為責以篇末考之此處疑有顛倒脫誤我武惟揚侵于之疆取彼凶殘我伐用張于湯有光揚舉侵入也凶殘紂也猶孟子謂之殘賊武王弔民伐罪于湯之心為益眀白于天下也自世俗觀之武王伐湯之子孫覆湯之宗社謂之湯讎可也然湯放桀武王伐紂皆公天下為心非有私于己者武之事質之湯而無愧湯之心驗之武而益顯是則伐商之舉豈不于湯為有光也哉纂疏愚案于湯有光乃武王之夸辭如功光祖宗云耳深一步說非本文意朂哉夫子罔或無畏寧執非敵百姓懍懍若崩厥角嗚呼乃一德一心立定厥功惟克永世朂勉也夫子將士也勉哉將士無或以紂為不足畏寧執心以為非我所敵也商民畏紂之虐懍懍若崩摧其頭角然言人心危懼如此汝當一德一心立定厥功以克永世也纂疏林氏曰考之孟子其字大抵略同而意㫖有不同疑彼此必有增損潤色蓋康誥伏生所傳泰誓孔壁續出其間必有不能曉而以意增損者故今此二篇與孟子所引不同者以此泰誓下時厥眀王乃大巡六師明誓衆士厥明戊午之明日也古者天子六軍大國三軍是時武王未備六軍牧誓叙三卿可見此曰六師者史臣之辭也王曰嗚呼我西土君子天有顯道厥類惟彰今商王受狎侮五常荒怠弗敬自絶于天結怨于民天有至顯之理其義類甚明至顯之理即典常之理也紂于君臣父子兄弟夫婦典常之道褻狎侮慢荒棄怠惰無所敬畏上自絶于天下結怨于民結怨者非一之謂下文自絶結怨之實也纂疏林氏曰越王伐吳以其私卒君子六千人為中軍則士卒亦可言君子張氏曰天道福善禍淫顯然甚明禍福之來各以類至其類亦甚彰陳氏經曰五常仁義禮智信愚案以顯道合五常言不如張氏說得正意諱子云積善積惡殃慶自各以其類至即此之謂斫朝涉之脛剖賢人之心作威殺戮毒痡四海崇信姦回放黜師保屏弃典刑囚奴正士郊社不修宗廟不享作竒技淫巧以悅婦人上帝弗順祝降時喪爾其孜孜奉豫一人恭行天罰斫斫也孔氏曰冬月見朝涉水者謂其脛耐寒斫而視之史記云比干强諫紂怒曰吾聞聖人心有七竅遂剖比干觀其心痡病也作刑威以殺戮為事毒病四海之人言其禍之所及者逺也回邪也正士箕子也郊所以祭天社所以祭地竒技謂竒異技能淫巧為過度之巧列女傳紂膏銅柱下加炭令有罪者行輒墮炭中妲己乃笑夫欲妲己之笑至為炮烙之刑則其竒技淫巧以悅之者宜無所不至矣祝斷也言紂于姦邪則尊信之師保則放逐之屏棄先王之法囚奴忠正之士輕廢奉祀之禮専意汚褻之行悖亂天常故天弗順而斷然降是喪亡也爾衆士其勉力不怠奉我一人而敬行天罰乎古人有言曰撫我則后虐我則讐獨夫受洪惟作威乃汝世讎樹德務滋除惡務本肆豫小子誕以爾衆士殄殱乃讎爾衆士其尚迪果毅以登乃辟功多有厚賞不迪有顯戮洪大也獨夫言天命已絶人心已去但一獨夫耳孟子曰殘賊之人謂之一夫武王引古人之言謂撫我則我之君也虐我則我之讐也今獨夫受大作威虐以殘􅊣于爾百姓是乃爾之世讎也務専力也植德則務其滋長去惡則務絶根本兩句意亦古語喻紂為衆惡之本在所當去故我小子大以爾衆士而殄絶殱滅汝之世讎也迪蹈登成也殺敵為果致果為毅爾衆士其庶幾蹈行果毅以成汝君若功多則有厚賞非特一爵一級而已不迪果毅則有顯戮謂之顯戮則必肆諸市朝以示衆庶嗚呼惟我文考若日月之照臨光于四方顯于西土惟我有周誕受多方若日月照臨言其德之輝光也光于四方言其德之逺被也顯于西土言其德尤著于所發之地也文王之地止于百里文王之德逹于天下多方之受非周其誰受之文王之德實天命人心之所歸故武王于誓師之末歎息而言之豫克受非豫武惟朕文考無罪受克豫非朕文考有罪惟豫小子無良無罪猶言無過也無良猶言無善也商周之不敵久矣武王猶有勝負之慮恐為文王羞者聖人臨事而懼也如此牧誓牧地名在朝歌南即今衛州治之南也武王軍於牧野臨戰誓衆前既有泰誓三篇因以地名别之今文古文皆有纂疏孔氏曰紂近郊三十里地名牧陳氏曰禹征苗誓只數語甘誓湯誓則一篇武王誓至四篇世愈降而文愈繁也時甲子昧爽王朝至于商郊牧野乃誓王左杖黃鉞右秉白旄以麾曰逖矣西土之人甲子二月四日也昧冥爽明也昧爽將明未明之時也鉞斧也以黃金為飾王無自用鉞之理左杖以為儀耳旄軍中指麾白則見逺麾非右手不能故右秉白旄也案武成言癸亥陳于商郊則癸亥之日周師已陳牧野矣甲子昧爽武王始至而誓師焉曰者武王之言也逖逺也以其行役之逺而慰勞之也王曰嗟我友邦冢君御事司徒司馬司空亞旅師氏千夫長百夫長司徒司馬司空三卿也武王是時尚為諸侯故未備六卿唐孔氏曰司徒主民治徒庶之政令司馬主兵治軍旅之誓戒司空主土治壘壁以營軍亞次旅衆也大國三卿下大夫五人士二十七人亞者卿之二大夫是也旅者卿之屬士是也師氏以兵守門者猶周禮師氏王舉則從者也千夫長統千人之帥百夫長統百人之帥也纂疏孔氏曰同志為友言志同滅紂或曰友順之邦如友民及庸蜀羌髳微盧彭濮人左傳庸與百濮伐楚庸濮在江漢之南羌在西蜀髳微在巴蜀盧彭在西北武王伐紂不期㑹者八百國今誓師獨稱八國者蓋八國近周西都素所服役乃受約束以戰者若上文所言友邦冢君則泛指諸侯而誓者也纂疏陳氏曰八國西南夷與江漢之夷化行江漢八國來助舉逺則近者可知蘇氏曰庸上庸縣濮百濮楚伐羅羅與盧戎兩軍之蓋南蠻之屬楚者羌先零罕开之屬彭今屬武陽有彭亡髳微缺此數國皆西南之夷稱爾戈比爾干立爾矛豫其誓稱舉戈㦸干楯豫亦㦸之屬長二丈唐孔氏曰戈短人執以舉之故言稱楯則並以扞敵故言比矛長立之于地故言立器械嚴整則士氣精明然後能聼誓命王曰古人有言曰牝雞無晨牝雞之晨惟家之索索蕭索也牝雞而晨則隂陽反常是為妖孽而家道索矣將言紂惟婦言是用故先發此今商王受惟婦言是用昏弃厥肆祀弗答昏弃厥遺王父母弟不迪乃惟四方之多罪逋逃是崇是長是信是使是以為大夫卿士俾暴虐于百姓以姦宄于商邑肆陳答報也婦妲己也列女傳云紂好酒淫樂不離妲己妲己所舉者貴之所憎者誅之惟妲己之言是用故顛倒昏亂祭所以報本也紂以昏亂弃其所當陳之祭祀而不報昆弟先王之𦙍也紂以昏亂棄其王父母弟而不以道遇之廢宗廟之理無宗族之義乃惟四方多罪逃亡之人尊崇而信使之以為大夫卿士使暴虐于百姓姦宄于商邑蓋紂惑于妲己之嬖背常亂理遂至流毒如此也纂疏蘇氏曰祀所以報本故曰答愚謂厥遺王父母弟如左傳所謂先君之遺姑姊妹今豫發惟恭行天之罰今日之事不愆于六步七步乃止齊焉夫子朂哉愆過朂勉也步進趨也齊齊整也今日之戰不過六步七步乃止而齊此告之以坐作進退之法所以戒其輕進也不愆于四伐五伐六伐七伐乃止齊焉朂哉夫子伐擊刺也少不下四五多不過六七而齊此告之以攻殺擊刺之法所以戒其貪殺也上言夫子朂哉此言朂哉夫子者反覆成文以致其丁寧勸勉之意下倣此纂疏王氏炎曰步足法也伐手法也吕氏曰大司馬之法伍兩卒旅各有長止齊使部伍之長各自止齊之故戰時不失紀律萬衆如一人尚桓桓如虎如貔如熊如羆于商郊弗迓克奔以役西土朂哉夫子桓桓威武貌貔執夷也虎屬欲將士如四獸之猛而奮擊于商郊也迓迎也能奔來降者勿迎擊之以勞役我西土之人此勉其武勇而戒其殺降也纂疏陳氏大猷曰兵以節制為尚武勇為主慮其或拘故喻以四獸之勇又戒其殺降蓋慮其過于勇也爾所弗朂其于爾躬有戮弗朂謂不勉于前三者愚謂此篇嚴肅而溫厚與湯誓誥相表裏真聖人之言也泰誓武成一篇之中似非盡出于一人之口豈獨此為全書乎讀者其味之纂疏王氏曰前誓言功多厚賞此不再言獨言戮者軍事以嚴終亦威克厥愛之意董氏鼎曰此篇聲罪致討激將士以義也止齊戒殺降喻將士以仁也武成史氏記武王往伐歸獸祀羣神告羣后與其政事共為一書篇中有武成二字遂以名篇今文無古文有纂疏問武成篇編簡錯亂曰新有定本以程先生王介甫劉貢父李博士諸本推究甚詳問武成篇似不必改移亦自可讀曰恐須是有錯簡又漢書律歷志謂是嵗有閏亦是吕氏曰武成見武王有取商之規模有定商之規模取商以至公大義定商以常典成法秦晉隋能一天下而亡不旋踵無以定之也惟一月壬辰旁死魄越翼日癸巳王朝步自周于征伐商一月建寅之月不曰正而曰一者商建丑以十二月為正朔故曰一月也詳見太甲泰誓篇壬辰以泰誓戊午推之當是一月二日死魄朔也二日故曰旁死魄翼眀也先記壬辰旁死魄然後言癸巳伐商者猶後世言某日必先言某朔也周鎬京也在京兆鄠縣上林即今長安縣昆明池北鎬陂是也纂疏漢志引武成篇惟一月壬辰旁死魄若翌日癸巳武王乃朝步自周于征伐紂又曰越若來三月既死霸粵五日甲子咸劉商王紂又曰惟四月既旁生霸粵六日庚戌武王燎于周廟翌日辛亥祀于天位粵五日乙卯乃以庶國祀馘于周廟云云諸家推歷以為此年二月有閏四月丁未為十九日庚戌為二十二日若無閏則四月無丁未庚戌孔氏曰一月周之正月唐孔氏曰伐紂之年周正月辛卯朔其二日壬辰翌日癸巳王發鎬京東行其月二十八日戊午渡河泰誓一月戊午是也二月辛酉朔甲子殺紂牧誓甲子昧爽是也其年閏二月庚寅朔三月庚戌朔四月己丑朔四日哉生明其日辛卯丁未祀周廟四月十九日也越三日庚戌二十二日也正月始往伐四月告成功魄者形也謂月之輪郭無光處朔後明生而魄死望後明死而魄生律歷志云死魄朔也生魄望也顧命惟四月哉生魄傳云月十六日也月十六日為始生魄是一日為始死魄二日為近死魄也旁死魄無事而記之者與下日為發端猶今言日必先言朔也周去孟津千里以正月三日行二十八日渡孟津几二十五日每日四十許里師行三十里言其大法耳王氏日休曰翼輔也以此日為主則明日為輔翼此日者故以明日為翼日愚案蔡氏於泰誓上及此皆以孟春一月為建寅之月與二孔之說不合必證以前漢律厯志始尤明白志曰周師初發以殷十一月戊子亥月也後三日得周正月辛卯朔子月也明日壬辰至戊午渡孟津明日己未冬至正月二十九日庚申二月朔丑月也四日癸亥至牧野閏二月庚寅朔三月二日庚申驚蟄古以驚蟄為寅月中氣今云雨水四月己丑朔死霸死霸朔也生霸望也是月甲辰望乙巳旁之故武成曰惟四月既旁生霸粵六日庚戌武王燎于周廟以節氣證之則武成以周正紀月數而非夏正不辨而眀矣厥四月哉生眀王來自商至于豐乃偃武修文歸馬于華山之陽放牛于桃林之野示天下弗服哉始也始生明月三日也豐文王舊都也在京兆鄠縣即今長安縣西北靈臺豐水之上周先王廟在焉山南白陽桃林今華隂縣潼關也樂記曰武王勝商渡河而西馬散之華山之陽而弗復乘牛放之桃林之野而弗復服車甲釁而藏之府庫倒載干戈包以虎皮天下知武王之不復用兵也此當在萬姓悅服之下纂疏張氏曰朔日為死魄二日為旁死魄三日為哉生明吕氏曰但歸放伐紂之馬牛耳天子十二間與丘甸之賦自不廢也與晉武平吳而去武備唐穆平兩河而銷兵不同王氏曰軍行戰車用馬任載之車用牛服乘用也急於偃武如此見以兵定天下非本心也丁未祀于周廟邦甸侯衛駿奔走執豆籩越三日庚戌柴望大告武成駿爾雅曰速也周廟周祖廟也武王以克商之事祭告祖廟近而邦甸逺而侯衛皆駿奔走執事以助祭祀豆木豆籩竹豆祭器也既告祖廟燔柴祭天望祀山川以告武功之成由近而逺由親而尊也此當在百工受命于周之下纂疏陳氏曰歸馬放牛以下偃武之事祀周廟以下修文之事唐孔氏曰六服侯甸男采衛要此舉其要既生魄庶邦冢君暨百工受命于周生魄望後也四方諸侯及百官皆于周受命蓋武王新即位諸侯百官皆朝見新君所以正始也此當在示天下弗服之下纂疏問生明生魄曰日為魂月為魄魄是黯處魄死則明生哉生明是也老子所謂載營魄載如車載人之載月受日之光魂加于魄魄載魂也明之生時大盡則初二小盡則初三月受日之光常全人望在下却在側邉了故見其盈虧不同或云月形如餅非也筆談云月形如彈九其受光如粉塗一半月去日近則光露一屑漸逺則光漸大且如日在午月在酉則是近一逺三謂之弦至日月相望則去日逺矣故謂之望日在西而月在東人在下面得以望見其光之全月之中有影者蓋天包地外地形小日在地下月在天中日甚大從地四面光起其影則地影也地礙日之光所謂山河地影是也如星亦受日光凡天地之光皆是日光也自十六日生魄之後其光之逺近如前之弦謂之下弦至晦則月與日相疊月在日後光盡體伏矣愚案諸家多謂生魄望後也而不察既字以望與既望例之則哉生魄十六日既生魄十七日也夏氏又謂既盡也與舜典既月同謂盡此生魄以後之日殊不知此既字乃已然之辭與食之既既月不同其實十七日受命十九日丁未祀周廟簡倒耳所以云此當在示天下弗服之下而丁未祀周廟當在百工受命于周之下也王若曰嗚呼羣后惟先王建邦啓土公劉克篤前烈至于太王肇基王迹王季其勤王家我文考文王克成厥勳誕膺天命以撫方夏大邦畏其力小邦懷其德惟九年大統未集豫小子其承厥志羣后諸侯也先王后稷武王追尊之也后稷始封于邰故曰建邦啓土公劉后稷之曾孫史記云能修后稷之業太王古公亶父也避狄去邠居岐邠人仁之從之者如歸市詩曰居岐之陽實始翦商太王雖未始有翦商之志然太王始得民心王業之成實基於此王季能勤以繼其業至于文王克成厥功大受天命以撫安方夏大邦畏其威而不敢肆小邦懷其德而得自立自為西伯専征而威德益著于天下凡九年崩大統未集者非文王之德不足以受天下是時紂之惡未至於亡天下也文王以安天下為心故豫小子亦以安天下為心此當在大告武成之下纂疏問文王不稱王之說曰說文王不稱王固好但書中不合有惟九年大統未集一句不知所謂九年自甚時數起史記於梁惠王三十七年書襄王元年而竹書紀年以為後元年想得當時文王之事亦類此故先儒皆以為自虞芮質成為受命之元年問使文王更在十三四年將終事紂乎抑為牧野之舉乎曰看文王亦非安坐不做事底人如詩中言文王受命有此武功既伐于崇作邑于豐云云則武功都是文王做來詩載武王武功却少但卒其伐功耳觀文王一時氣勢如此度必不終竟休了一似果實文王待他十分黃熟自落下來武王却似生拍破一般詳考詩書則文武之心可見若使文王漠然無心於天下斂然終守臣節則三分之二亦不當有矣然此等處正夫子所謂未可與權者食肉不食馬肝未為不知味也又曰那時事勢自是要住不得後人把文王說得忒恁地却做一箇不做聲不做氣如此形容文王都沒情理以詩書考之全不是如此如伐崇侵阮這自大假施張了只當商之季七顛八倒上下崩頽忽於岐山下突出許多人也是誰當得陳氏曰大邦以力自强遇文王而力無所施故以文王為可畏而有以畏其力小邦以德望人遇文王而獲適所願故以文王為可懷而有以懷其德文王初無心於德力之辨也碧梧馬氏曰文王未崩九年之前已有伐紂之志矣然猶有所不忍遂遲遲至九年文王既崩紂惡日甚武王不可不承其志也愚案后稷稱先王如周語云昔我先王后稷又云我先王不窋韋昭注王之先祖故稱王商頌亦以契為𤣥王是也武王告諸侯謂周之基業自后稷公劉太王王季文王建之篤之基之勤之成之有自來矣我不過承先志而為之耳意謂十五六世數百千年積德纍功前作後述以有今日非一時之崛起以聳動諸侯之聼也亦是欲因祀廟追王先世故歷述之如此又案無逸言文王享國五十年而此曰九年大統未集世遂有文王九年稱王而終之說歐陽公力辨其不然佐證甚明其生不稱王信然矣九年之說當有折𠂻先儒以虞芮質成之年為元年一說也如蔡氏以自為西伯専征之年為元年又一說也二說必有一得之其稱後元年則梁惠漢文景皆然矣砥商之罪告于皇天后土所過名山大川曰惟有道曾孫周王發將有大正于商今商王受無道暴殄天物害虐蒸民為天下逋逃主萃淵藪豫小子既獲仁人敢祗承上帝以遏亂略華夏蠻貊罔不率俾底至也后土社也勾龍為后土周禮大祝云王過大山川則用事焉孔氏曰名山謂華大川謂河蓋自豐鎬往朝歌必道華涉河也曰者舉武王告神之語有道指其父祖而言周王二字史臣追增之也正即湯誓不敢不正之正萃聚也紂殄物害民為天下逋逃罪人之主如魚之聚淵如獸之聚藪也仁人孔氏曰太公周召之徒略謀略也俾廣韻曰從也仁人既得則可以敬承上帝而遏絶亂謀內而華夏外而蠻貊無不率從矣或曰太公歸周在文王之世周召周之懿親不可謂之獲此蓋仁人自商而來者愚謂獲者得之云爾即泰誓之所謂仁人非必自外來也不然經傳豈無傳乎此當在于征伐商之下纂疏復齊董氏曰曾孫主祭者之稱曲禮外事曰曽孫某侯某詩甫田曰曾孫不怒左傳蒯聵戰禱亦稱曽孫夏氏曰俾使也無不相率以為己使恭天成命肆豫東征綏厥士女惟其士女篚厥𤣥黃昭我周王天休震動用附我大邑周成命黜商之定命也篚竹器𤣥黃色幣也敬奉天之定命故我東征安其士女士女喜周之來筐篚盛其𤣥黃之幣明我周王之德者是蓋天休之所震動故民用歸附我大邑周也或曰𤣥黃天地之色篚厥𤣥黃者明我周王有天地之德也此當在其承厥志之下纂疏商人而曰我周王猶夏人曰徯我后陳氏經曰武王為西伯紂都在東故曰東征愚謂𤣥黃天地之德之說當刊惟爾有神尚克相豫以濟兆民無作神羞既戊午師逾孟津癸亥陳于商郊俟天休命甲子昧爽受率其旅若林㑹于牧野罔有敵于我師前徒倒戈攻于後以北血流漂杵一戎衣天下大定乃反商政政由舊釋箕子囚封比干墓式商容閭散鹿臺之財發巨橋之粟大賚于四海而萬姓悅服休命勝商之命也武王頓兵商郊雍容不迫以待紂師之至而克之史臣謂之俟天休命可謂善形容者矣若林即詩所謂其會如林者紂衆雖有如林之盛然皆無有肯敵我師之志紂之前徒倒戈反攻其在後之衆以走自相屠戮遂至血流漂杵史臣指其實而言之蓋紂衆離心離德特劫於勢而未敢動耳一旦因武王弔伐之師始乘機投隙奮其怨怒反戈相戮其酷烈遂至如此亦足以見紂積怨于民若是其甚而武王之兵則蓋不待血刃也此所以一被兵甲而天下遂大定乎乃者繼事之辭反紂之虐政由商先王之舊政也式車前橫木有所敬則俯而憑之商容商之賢人閭族居里門也賚豫也武王除殘去暴顯忠遂良賑窮賙乏澤及天下天下之人皆心悅而誠服之帝王世紀云殷民言王之於仁人也死者猶封其墓况生者乎王之於賢人也亡者猶表其閭况存者乎王之於財也聚者猶散之况其復籍之乎唐孔氏曰是為悅服之事此當在罔不率俾之下纂疏孟子緣當時戰鬭殘戮恐人以此為口實故說此然看上文不是武王殺他乃紂之人自蹂踐相殺荀子云殺之者非周人商人也武王興兵初無意于殺人觀不愆于六伐七伐乃止齊焉武王之心可見矣杵或作鹵楯也孟注孔氏曰待天休命謂夜雨止畢陳血流漂杵甚之言蔡氏元度曰詩云肆伐大商㑹朝清眀謂雨止清明也林氏曰雨止畢陳過論也周師未血刃而商衆自相屠人心叛商歸周如此是即天命去商佑周之驗也天之休命豈不昭然在此哉陳氏曰先驅商之平民陳後紂之惡黨怨之素深因此易向反攻之愚謂萬姓悅服總結乃反商政以下數句釋箕子至賚四海皆反商政之大者大學平天下章不過好惡財用二者與天下為公而已釋箕子以下好惡與民為公也散財以下財用與民為公也民之悅服豈徒悅其散財發粟哉列爵惟五分土惟三建官惟賢位事惟能重民五教惟食喪祭惇信眀義崇德報功垂拱而天下治列爵惟五公侯伯子男也分土惟三公侯百里伯七十里子男五十里之三等也建言惟賢不肖者不得進位事惟能不才者不得任五教君臣父子夫婦兄弟長幼五典之教也食以養生喪以送死祭以追逺五教三事所以立人紀而厚風俗聖人之所甚重焉者惇厚也厚其信明其義信義立而天下無不勵之俗有德者尊之以官有功者報之以賞官賞行而天下無不勸之善夫分封有法官使有要五教修而三事舉信義立而官賞行武王于此復何為哉垂衣拱手而天下自治矣史臣述武王政治之本末言約而事博也如此哉此當在大邑周之下而上猶有缺文案此篇編簡錯亂先後失序今考正其文于後纂疏祖道曰湯武也自别如湯放桀歸來猶做工夫如從諫弗咈改過不吝昧爽丕顯旁求俊彥刻盤銘修人紀如此之類不敢少縱武王伐紂歸來建國分土散財發粟後便只垂拱了且如西旅之獒費了太保許多氣以此見武王做工夫不及湯逺甚先生曰然王氏曰厚其信使人不趨于詐顯其義使人不狥于利林氏曰有德者尊以髙位有功者報以賞而已愚謂所重民食喪祭證以堯曰可見重五教而次以食則日用飲食遍為爾德否則君不君臣不臣雖有粟吾得而食諸食足矣則繼以慎終之喪報本之祭皆所以感發人之良心維持天下之教化也今考定武成惟一月壬辰旁死魄越翼日癸巳王朝步自周于征伐商砥商之罪告于皇天后土所過名山大川曰惟有道曽孫周王發將有大正于商今商王受無道暴殄天物􅊣虐蒸民為天下逋逃主萃淵藪豫小子既獲仁人敢祗承上帝以遏亂略華夏蠻貊罔不率俾惟爾有神尚克相豫以濟兆民無作神羞既戊午師逾孟津癸亥陳于商郊俟天休命甲子昧爽受率其旅若林㑹于牧野罔有敵于我師前徒倒戈攻于後以北血流漂杵一戎衣天下大定乃反商政政由舊釋箕子囚封比干墓式商容閭散鹿臺之財發巨橋之粟大賚于四海而萬姓悅服厥四月哉生眀王來自商至于豐乃偃武修文歸馬于華山之陽放牛于桃林之野示天下弗服既生魄庶邦冡君暨百工受命于周丁未祀于周廟邦甸侯衛駿奔走執豆籩越三日庚戌柴望大告武成王若曰嗚呼羣后惟先王建邦啓土公劉克篤前烈至于太王肇基王迹王季其勤王家我文考文王克成厥勳誕膺天命以撫方夏大邦畏其力小邦懷其德惟九年大統未集豫小子其承厥志恭天成命肆豫東征綏厥士女惟其士女篚厥𤣥黃昭我周王天休震動用附我大邑周列爵惟五分土惟三建官惟賢位事惟能重民五教惟食喪祭惇信眀義崇德報功垂拱而天下治案劉氏王氏程子皆有改正次序今參考定讀如此大略集諸家所長獨四月生魄丁未庚戌一節今以上文及漢志日辰推之其序當如此耳疑先儒以王若曰宜繫受命于周之下故以生魄在丁未庚戌之後蓋不知生魄之日諸侯百工雖來請命而武王以未祭祖宗未告天地未敢發命故且命以助祭乃以丁未庚戌祀于郊廟大告武功之成而後始告諸侯上下之交神人之序固如此也劉氏謂豫小子其承厥志之下當有缺文以今考之固所宜有而程子從恭天成命以下三十四字屬于其下則已得其一節而用附我大邑周之下劉氏所謂缺文猶當有十數語也蓋武王革命之初撫有區夏宜有退托之辭以示不敢遽當天命而求助于諸侯且以致其交相警敕之意略如湯誥之文不應但止自序其功而已也列爵惟五以下又史官之詞非武王之語讀者詳之洪範漢志曰禹治洪水錫洛書法而陳之洪範是也史記武王克殷訪問箕子以天道箕子以洪範陳之案篇內曰而曰汝者箕子告武王之辭意洪範發之于禹箕子推衍增益以成篇歟今文古文皆有纂疏洪範一篇首尾都歸皇極上去蓋人君以一身為至極之標凖最是不易又須斂是五福所以斂聚五福以為皇極之本又須敬五事順五行厚八政協五紀以結裹箇皇極又須乂三德使事物之接剛柔之辨須區處教合宜稽疑考之子神庶徵驗之於天五福體之於人這是維持這皇極讀洪範且各還他題目一則五行二則五事三則八政四則五紀五則皇極至其後庶徵五福六極乃權衡聖道而著其驗耳陳氏大猷曰箕子之陳洪範文王之演易皆當殷之末周之初也惟十有三祀王訪于箕子商曰祀周曰年此曰祀者因箕子之辭也箕子嘗言商其淪喪我罔為臣僕史記亦載箕子陳洪範之後武王封于朝鮮而不臣也蓋箕子不可臣武王亦遂其志而不臣之也訪就而問之也箕國名子爵也蘇氏曰箕子之不臣周也而曷為為武王陳洪範也天以是道畀之禹傳至于我不可使自我而絶以武王而不傳則天下無可傳者矣故為箕子之道者傳道則可仕則不可纂疏柯國材言武王伐殷序謂十有一年書謂十有三年序不足憑洪範謂十有三祀則十三年明矣必是當年初克商便釋箕子囚而問之若十一年釋了十三年方問他不應如此遲遲此說有理孔氏曰箕子稱祀不忘本陳氏經曰稱祀者存商之舊見箕子義當不屈也稱訪者就而見不敢屈而致見武王義當有所屈也箕子之不屈其守正不撓當如是也武王之有所屈其尊德樂道不如是不足與有為也愚謂不臣周所以正萬世君臣之大法陳洪範所以傳萬世天人之大法歟蔡西山元定有洪範說其辭多祖述之餘見後王乃言曰嗚呼箕子惟天隂騭下民相協厥居我不知其彞倫攸叙乃言者難辭重其問也箕子稱舊邑爵者方歸自商未新封爵也騭定協合彞常倫理也所謂秉彞人倫也武王之問蓋曰天于冥冥之中默有以安定其民輔相保合其居止而我不知其彞倫之所以叙者如何也纂疏愚案爾雅騭升也升之訓優于定如躋民仁夀之意天下之常理先後本末各有自然之序非人之所為乃天之所叙也斯民之生其上棟下宇羣居聚處是孰使之然哉天意之隂騭默相蓋存乎其間而常理即寓乎其間理或髙出乎無極太極之表而其實不離乎日用常行之間武王于隂騭相協而繼以彞倫之所以叙攸者所也即所以然之意武王其默識之矣姑退托于不知以問耳箕子乃言曰我聞在昔鯀陻洪水汨陳其五行帝乃震怒不畀洪範九疇彞倫攸斁鯀則殛死禹乃嗣興天乃錫禹洪範九疇彞倫攸叙乃者重其答也陻塞汨亂陳列畀與洪大範法疇類斁敗錫賜也帝以主宰言天以理言也洪範九疇治天下之大法其類有九即下文初一至次九者箕子之答蓋曰洪範九疇原出於天鯀逆水性汨陳五行故帝震怒不以與之此彞倫之所以敗也禹順水之性地平天成故天出書于洛禹别之以為洪範九疇此彞倫之所以叙也彞倫之叙即九疇之所叙者也案孔氏曰天與禹神龜負文而出列於背有數至九禹遂因而第之以成九類易言河出圖洛出書聖人則之蓋治水功成洛龜呈瑞如簫韶奏而鳯儀春秋成而麟至亦其理也世傳戴九履一左三右七二四為肩六八為足即洛書之數也纂疏便使而今天錫洛書若非天啓其心亦無人理會得鯀禹皆治水天不開發鯀而開發禹故言畀不畀要之洛書天下之至理鯀不順是理自無可得之道禹順是理自有可得之道畀不畀一歸之天者特言理之至公無私耳問鯀既殛禹又委質如何曰蓋前人之愆問非顯父之惡否曰且如今人其父打碎人一件家事其子買來填還此豈是顯父之惡劉氏歆曰河圖洛書相為經緯八卦九章相為表裏蘇氏洵曰五行一疇耳一汨而九不畀蓋五行綱九疇目綱壞而目廢也吕氏曰洪水陻而五行汨便見五行一源以堯舜之時法度彰禮樂著彞倫何嘗斁此只就鯀身上說自斁一身之彞倫耳史氏曰劉歆以初一曰至威用六極六十五字皆洛書本文豈知洛之所出者其數也禹之所叙者今之九疇也箕子所陳洪範則九疇之義疏也陳氏曰彞倫天下自然之理也聖人推之天下則為彞倫勒之於書則為洪範真氏曰龜所負者數耳大禹心與天通見其數而知其理因次之以為九類即今九疇是也愚謂帝即天也天者理而已水五行之首鯀乃陻之一行汨而餘皆汨是逆理而獲罪于天故天不畀以九疇謂洛不為之出書天錫禹九疇即洛出書也且天錫之惟有洛書之九數自禹則之則為洪範之九疇推道之大原出於天故謂之天錫禹云耳初一曰五行次二曰敬用五事次三曰農用八政次四曰協用五紀次五曰建用皇極次六曰乂用三德次七曰眀用稽疑次八曰念用庶徵次九曰嚮用五福威用六極此九疇之綱也在天惟五行在人惟五事以五事參五行天人合矣八政者人之所以因乎天五紀者天之所以示乎人皇極者君之所以建極也三德者治之所以應變也稽疑者以人而聽于天也庶徵者推天而徵之人也福極者人感而天應也五事曰敬所以誠身也八政曰農所以厚生也五紀曰協所以合天也皇極曰建所以立極也三德曰乂所以治民也稽疑曰明所以辨惑也庶徵曰念所以省驗也五福曰嚮所以勸也六極曰威所以懲也五行不言用無適而非用也皇極不言數非可以數明也本之以五行敬之以五事厚之以八政協之以五紀皇極之所以建也乂之以三德明之以稽疑驗之以庶徵勸懲之以福極皇極之所以行也人君治天下之法是孰有加於此哉纂疏問洪範諸事曰此是箇大綱目天下之事其大者大概備于此矣問皇極曰此是人君為治之心法周禮一書只是箇八政而已洛書本文只有四十五㸃班固云六十五字皆洛書本文此未是蓋皆以天道人事參互言之五行最急故第一五事參之于身故第二一身既修可推之于政故八政次之政既成又驗之于天道故五紀次之又繼之皇極居五蓋能推五行敬五事厚八政修五紀乃所以建極也六三德乃是權衡此皇極者也德既是修矣稽疑庶徴著其驗也又繼以福極其善惡之效至不可加矣有前四者方可以建極後四者却自皇極中出三德是皇極之權人君所嚮用五福所威用六極初一次二此讀音豆也全讀是以一二為次苐不見洛書本文又不見聖人法象之義故後人至以此章總為洛書本文皆為句讀不眀也五氣運行而人稟之以成形於是有五事故次二曰敬用五事用者人所有事也凡用皆主人君而言德雖應變無方而事有非人謀所能决者故當謀之龜筮民之有福君所當嚮民之有極君所當威孔氏曰此以上禹所第叙一五行以下箕子所陳陳氏大猷曰五氣運行于天地間未嘗停息故曰五行真氏曰五行者天之所生以養乎人者也其氣運於天而不息其材用於世而不匱其理則賦於人而為五常以天道言莫大於此故居九疇之首五事天之所賦而其於人者貌之恭至思之睿皆形色中天性之本然也必以敬用之則能保其本然之性不以敬用之則貌慢言悖視聼昏窒思慮粗淺而本然之性喪矣五者治心治身之要以人事言莫切於此故居五行之次張氏曰九疇雖多人君所守惟在敬用五事心敬則貌言視聼思極於肅乂哲謀聖其精神所運上而五行下而福極無不得其所洪範之要在於敬而已愚案無垢之說惜不貫五事歸皇極蓋建用皇極為九疇之宗主而敬用五事乃建用皇極之本根敬以用五事則身修而極建而天人之道備矣不敬以用五事則身不修而極不建而天人之道胥失之矣此九疇之樞在皇極而皇極之要在五事五事之要又在敬之一字也自嵗至歷數五者如綱之有紀天時所以相維者也故曰五紀民政既舉則欽天授民有不可後推步占驗以人合天故五紀居八政之次庶徵驗吾之得失於天也福極驗吾之得失於民也五事之得失極之所以建不建也何從而驗之觀諸天而已雨𤾉寒燠風皆時建極之驗也五者恆而不時不極之驗也此人君所當念念省察者也皇極建則舉世蒙其澤而五福應之此君所當嚮用以為勸者極不建則舉世蒙其祻而六極隨之此君所當威用以為懲者也嚮與威蓋君心所畏慕而兢業以制生民之命者故以福極終焉蘇氏曰威畏也古畏威通用張氏曰福極之柄以人主論之則在天以民論之則在人主徽菴程氏九疇圖說曰朱子曰洛書九數而五居中洪範九疇而皇極居五順五行敬五事以修其身厚八政協五紀以齊其政皇極之所以立也又謂成就此極權之以三德審之以卜筮驗其休咎於天考其禍福於人皇極之所以行也又謂維持此極竊謂在天為五行言其所自然在人為五事言其所當然厚乎人而為八政言其利不言其弊占乎天而為五紀言其常不言其變序其目於皇極之先者皆皇極之本也皇極建則乂之以三德而威福玉食出於上否則三德失其宜而威福玉食移於下矣皇極建則明之以稽疑而龜筮臣民從之而吉否則稽疑有不審而龜筮臣民逆之而凶矣皇極建則肅乂哲謀聖而卿士師尹舉其職庶民遂其生五氣順而四時和否則狂僣豫急蒙而卿士師尹失其職庶民傷其生五氣戾而四時乖矣皇極建則斂五福以錫民為夀富康寧好德考終命否則斂六極以厲民為凶短折疾憂貧惡弱矣序其目於皇極之後者皆皇極之驗也本之前四疇以立其體至嚴至密而無一毫之或失驗之後四疇以逹其用至寬至廣而無一物之或遺信乎天子作民父母以為天下王可以參天地而贊化育矣此大禹則龜文以叙九疇箕子本禹疇以陳洪範必以皇極為天地人之宗主歟一五行一曰水二曰火三曰木四曰金五曰土水曰潤下火曰炎上木曰曲直金曰從革土爰稼穡潤下作鹹炎上作苦曲直作酸從革作辛稼穡作甘此下九疇之目也水火木金土者五行之生序也天一生水地二生火天三生木地四生金天五生土唐孔氏曰萬物成形以微著為漸五行先後亦以微著為次五行之體水最微為一火漸著為二木形實為三金體固為四土質大為五潤下炎上曲直從革以性言也稼穡以德言也潤下者潤而又下也炎上者炎而又上也曲直者曲而又直也從革者從而又革也稼穡者稼而又穡也稼穡獨以德言者土兼五行無正位無成性而其生之德莫盛于稼穡故以稼穡言也稼穡不可以為性也故不曰曰而曰爰爰于也子是稼穡而已非所以名也作為也鹹苦酸辛甘者五行之味也五行有聲色氣味而獨言味者以其切於民用也纂疏自潤下而下皆二意水能潤能下火能炎能上金從而又能革從從所煆制革又可革而為他而其堅剛之質依舊自在故與曲直等皆成雙字炎上上字當上聲潤下下字當去聲金一從一革互相變而體不變且如銀打一盞便是從更要别作一件家事便是革依舊只是這物事所以云體不變或曰百果多酸雖甘者至乾壞亦無不酸孔氏曰種曰稼斂曰穡唐孔氏曰六府以土榖為二五行以土榖合為一徽菴程氏曰五行者八疇之體八疇者五行之用水陽稚火隂稚木陽盛金隂盛土冲氣以質而語其生之序也造物之初一濕一燥濕之流為水燥之鑠為火濕之融為木燥之凝為金其融結為土自輕清而重濁先天之五行其體也四時主相生六府主相尅後天之五行其用也其體對立其用循環蘇氏曰潤下至稼穡皆其德也水潤下則能生物故水以潤下為德火炎上則能熟物故火以炎上為德木不曲直不能棟宇故木以曲直為德金不變化不能成器故金以從革為德土無所不用不可以一德名而其德盛於稼穡不曰曰而曰爰爰於也曰者所以名之也土無成名無専氣無定位故曰于此稼穡而非所以名之也愚案蔡氏於稼穡獨以德言德字本蘇氏而上四者以性言則不本蘇氏遂覺德字突兀西山于此云土之性不可以一二名而其用盛于稼穡稼穡所以養民也却不用德字陳氏經曰洪範所言則五行生數必得地六天七地八天九地十成之然後隂陽各有匹配然五行之生一二三四五亦未始無其序蓋有生於無著生于微自無而有自微而著五行之體水為至微自無而始入有者也火則漸著故火次水木則性實故次于火金則體固故次于木土則質廣大故次于金夏氏曰五味必言作者水之發源未始鹹流而至海凝結既久而鹹之味成則鹹者潤下之所作火之始炎未始苦炎炎不已焦灼既久而苦之味成則苦者炎上之所作餘放此陳氏大猷曰物之生其初皆為水其終皆為土二五事一曰貌二曰言三曰視四曰聽五曰思貌曰恭言曰從視曰明聽曰聰思曰睿恭作肅從作乂眀作哲聰作謀睿作聖貌言視聽思者五事之叙也貌澤水也言揚火也視散木也聽收金也思通土也亦人事發見先後之叙人始生則形色具矣既生則聲音發矣既言而後能視而後能聽而後能思也恭從明聰睿者五事之德也恭者敬也從者順也明者無不見也聰者無不聞也睿者通乎微也肅乂哲謀聖者五德之用也肅者嚴整也乂者條理也哲者智也謀者度也聖者無不通也纂疏貌言視聽思皆只以次第相屬問貌如何屬水曰容貌光澤故屬水言發於氣故屬火曾見吳人傑說得順他云貌是水言是火視是木聽是金思是土將庶徵來說便都順問貌如何是水曰貌濕潤底便是水故其徵便是肅時雨若洪範是五行之書看得他都是以類配恭作肅恭屬水水有細潤意思人之舉動亦欲細潤聰作謀謀屬金金有靜密意思人之為謀亦貴靜密自外而言之則貌外於言自內而言之則聽內於視自貌言視聽言之則思所以為主於內故曰貌曰言曰視曰聽曰思彌逺者彌外彌近者彌內此其次序也五事以思為主不可見而行乎四者之間者也然操存之漸必自其可見而為之問老蘇洪範論不取五行傳東坡以為五行傳不可廢既廢則後世有忽天之心曰漢儒也穿鑿如五事一事錯則皆錯如何却云聽之不聰則某事應貌之不恭則某事應唐孔氏曰洪範五行傳曰貌屬木言屬金視屬火聽屬水思屬土伏生之書也蓋木有華葉之容故貌屬木言之斷决若金之斬割故言屬金火外觀故視屬火水內明故聽屬水土安靜而萬物生心思慮而萬事成故思屬土蘇氏洵曰經之次第五行以生數至于五事求之五行則相克何也從五常斯與相克合矣木性仁而事貌金性義而事言火性禮而事視水性智而事聽土性信而事思仁或失于弱故以義斷之義或失于剛故以禮節之禮或失于拘故以智通之智或失于詐故以信正之五常次第所以然五事從之所以亦然蘇氏轍曰人身蓄為五臟發為五事以應五行脾之發為貌而主土肺之發為言而主金肝之發為視而主木腎之發為聽而主水心之發為思而主火黃帝以來醫者捨此無以治病漢儒以言為金聽為水得之矣餘則不合徽菴程氏曰人之始生精與氣耳精之凝為貌氣之出為言精之顯為視氣之藏為聽其主宰為思洪範五事配五行與素問五行傳不合自西京以來說者不一牽合傅㑹莫能相通千有餘年至黃勉齊而後定其言曰配與屬不同配者比並之謂屬者管屬之謂嘗得其說而推之配者對峙而為體猶易之先天卦圖也屬者流行而為用猶易之後天卦圖也洪範之五事配水火木金土乃先天之五事言其體也黃帝素問書以脾屬土而主貌肺屬金而主言肝屬木而主視腎屬水而主聽心屬火而主思屬土金木水火而相生伏生五行傳以貌之蔚茂而屬木言之斷制而屬金視之外明而屬火聽之內明而屬水思為心之官而屬土屬木金火水土而相尅乃後天之五事言其用也配者為體屬者為用配與屬不相妨體與用不相悖千古之疑於是判矣愚案素問言相生亦有不合木水易置乃可五行傳言相克亦與六府之序自上克下者不同乃自下克上耳李氏把曰曰者自然之理作者用力充致之效亦與水曰潤下潤下作鹹相類貌之必恭以至思之必睿有物必有則也作肅以至作聖此修身之極功聖人而後可以踐形也愚謂五事皆當以敬用之能以敬為主則物循其則而貌言視聽思皆能盡性以踐形恭從明聰睿充而極于肅乂哲謀聖不以敬為主則物失其則性不盡而無以踐形矣盡性踐形之學貴乎內外夾持五事固以思為重而思必以貌言視聽為先貌言視聽在外而可見者思在內而不可見者也於外而可見者先致持守之功則百體各職其職于內而不可見者復致操存之力則百體于天各從其令一敬貫通內外夾持修身之功庶其無滲漏乎又案五事以思為終四勿不言思真氏曰勿云者正指思而言乃人心所以為主而勝私復禮之機也或曰動兼貌與思而言貌是動于外思是動于內引程子動針誠之于思守之于為以證之愚以為五事自五事四勿自四勿不必牽合强說也三八政一曰食二曰貨三曰祀四曰司空五曰司徒六曰司寇七曰賔八曰師食者民之所急貨者民之所資故食為首而貨次之食貨所以養生也祭祀所以報本也司空掌土所以安其居也司徒掌教所以成其性也司寇掌禁所以治其姦也賔者禮諸侯逺人所以往來交際也師者除殘禁暴也兵非聖人之得己故居末也纂疏陳氏經曰或言事或言官互見也陳氏大猷曰八政以緩急為序民可百年無貨不可一朝有飢養生莫急于食而貨次之養生矣當事死報本故次祀然皆貴安居故次司空不可逸居無教故次司徒教不從而刑之刑以弼教故次司寇內治舉而後外治興故次賔師賔諸侯而或不庭則不得已征之故師終焉吕氏曰衣食足則教以祀所以報本反始教已行乎其中矣司寇以上皆內治賔師為外治徽菴程氏曰食貨與土亦出于五行皇極之政必先有司三卿率庶官以理其政者也四五紀一曰嵗二曰月三曰日四曰星辰五曰歷數嵗者序四時也月者定晦朔也日者正躔度也星經星緯星也辰日月所㑹十二次也歷數者占步之法所以紀歲月日星辰也纂疏孔氏曰嵗所以紀四時月所以紀一月日紀一日二十八宿迭見以敘氣節十二辰以紀日月所㑹歷數節氣之度以為歷敬授民時唐孔氏曰五者為天時之經紀也陳氏曰五紀即堯典羲和所掌者徽菴程氏曰五紀四經而一緯五氣順布四時行焉嵗日月星辰經也歷數者推步嵗日月星辰之數以為歷者也歷象日月星辰敬授人時緯也與庶徵相通而不同彼以證王與卿士師尹庶民之得失此特主于授時愚案蔡傳謂日者正躔度也當云日者正甲乙也星辰方是正躔度五皇極皇建其有極斂時五福用敷錫厥庶民惟時厥庶民于汝極錫汝保極皇君建立也極猶北極之極至極之義標凖之名中立而四方之所取正焉者也言人君當盡人倫之至語父子則極其親而天下之為父子者于此取則焉語夫婦則極其别而天下之為夫婦者于此取則焉語兄弟則極其愛而天下之為兄弟者于此取則焉以至一事一物之接一言一動之發無不極其義理之當然而無一毫過不及之差則極建矣極者福之本福者極之效極之所建福之所集也人君集福于上非厚其身而已用敷其福以與庶民使人人觀感而化所謂敷錫也當時之民亦皆于君之極與之保守不敢失墜所謂錫保也言皇極君民所以相與者如此也纂疏皇極辨曰洛書九數而五居中洪範九疇而皇極居五自孔氏傳訓皇極為大中而諸儒皆祖其說豫獨以經之文義語脉求之而有以知其不然也蓋皇者君之稱也極者至極之義標凖之名常在物之中央而四外望之以取正焉者也故以極為在中之凖的則可而便訓極為中則不可若北辰之為天極脊棟之為屋極其義皆然而禮所謂民極詩所謂四方之極者于皇極之義為尤近顧今之說者既誤于此而并失于彼是以其說展轉迷謬而終不能以自明也即如舊說姑亦無問其他但即經文而讀皇為大讀極為中則夫所謂惟大作中大則受之為何等語乎今以豫說推之則人君以眇然之身履至尊之位四方輻輳面內而環向之自東而望者不過此而西也自南而望者不過此而北也此天下之至中者也既居天下之至中必有天下之絶德而後可以立至極之標凖故必順五行敬五事以修其身厚八政協五紀以齊其政然後至極之標凖卓然有以立乎天下之至中使夫面內而環觀者莫不于是而取則焉語其仁則極天下之仁而天下之為仁者莫能加也語其孝則極天下之孝而天下之為孝者莫能尚也是則所謂皇極者也由是而權之以三德審之以卜筮驗其休咎于天考其禍福于人如挈裘領豈有一毫之不順哉此洛書之數所以雖始于一終于九而必以五居其中洪範之疇所以雖本于五行究于福極而必以皇極為之主也若箕子之言曰皇建其有極者言人君以其一身立至極之標凖于天下也斂時五福用敷錫厥庶民者言人君能建其極則為五福之所聚而又有以使民觀感而化焉則是又能布此福而與其民也惟時厥庶民于汝極錫汝保極者言民視君以為至極之標凖而從其化則是復以此福還錫其君而使之長為至極之標凖也今人將皇極作大中解都不是皇是君極是人君建一箇表儀于上則五福備具推以與民民皆從其表儀又相與保其表儀下文凡厥庶民以下言人君建此表儀又須知天下有許多名色人須逐一做道理區處著始得于建是有念之受之錫之福之之類隨其人而區處之是立一箇表儀後又有廣大含容區處周遍底意思無偏無陂以下只是反覆歌詠若細碎解都不成道理皇指人君極指君身為天下做箇樣子但緣聖人做得樣子髙大人所難及而不可以此盡律天下之人故雖不協極者君亦受之自言好德者亦錫之福皇極不可以大中訓之只是前面五行五事八政五紀都載在人君之身包括盡了五行是發源處五事是操持處八政是修人事五紀是順天道就中以五事為主視眀聼聰便能建極三德亦只是就此道理上為之權衡或放髙或捺下是人事盡了稽疑又以卜筮參之若能建極則驗之于天皆為休徵推之于人皆享五福不能建極則在天為咎徴在人為六極其實都在人君身上又不過敬用五事而已此即篤恭而天下平之意以是觀之人君所任豈不重哉如此則九疇方貫通為一若以大中言之則九疇散而無統極有湊㑹之義所謂三十輻共為一轂斂福錫民聖人亦豈别有福以錫之只取則于此各正其身順理而行則為福也孟子謂君仁莫不仁亦此意人君先正其身故又有五事之說若以皇極為大中則與五事不相干漢儒如谷永書建大中正五事猶相通說極盡也先生指香卓四邉盡處是極所以謂之四極四邉視中央中央是極也如屋之極極髙之處四邉到此盡了去不得故謂之極宸極亦然皇有訓大處惟皇極之皇不可訓大皇只當作君所以說遵王之義導王之路直說到後面以為天下王其意可見蓋皇字下從王自皇建其有極以下是總說人君正心修身立大中至正之標凖以觀天下而天下化之之義無偏無陂以下乃是反覆贊嘆正說皇極體段曰皇極之敷言以下是推本結殺一章之大意林氏曰皇極居中可以包括上下馮氏當可曰皇極居中上總下貫與八疇為九徽菴程氏曰皇極者九疇之樞紐五行之統㑹愚謂五行之統㑹者五居中固合五行之數而極者仁義禮智信之至五性亦合五行之理五行散見諸疇中皇極一疇以五行之理統㑹之也皇建其有極者君尊為天子德為聖人能建實有之極以為天下標凖也有極當借無極對觀自至理之妙而無形可見者言之曰無極自至理之實有言之曰有極斂時五福五福即第九疇之五福九疇雖至五福而終五福實自皇極而出第九疇之五福豈捨皇極疇中所斂之五福而他有所謂福哉錫汝保極蔡西山曰民享君之福所以歸于君之極而與君保此極也九峯蓋用父說而略師說辨中不免析錫汝與保極為二義然語録一條又與蔡說合云凡厥庶民無有淫朋人無有比德惟皇作極淫朋邪黨也人有位之人比德私相比附也言庶民與有位之人而無淫朋比德者惟君為之極而使之有所取正耳重言君不可以不建極也纂疏民之所以能有是德者皆君之德有以為其至極之標凖也者愚案書之知人安民詩之宜民宜人皆以人為有位民為下民此亦當然證之三德疇人用側頗僻民用僭忒可見辨單言民大約言之耳民人所以然惟以君建極故也作有扶植振起之意建立作興大略相似不建不作則斯道廢墜矣凡厥庶民有猷有為有守汝則念之不協于極不罹于咎皇則受之而康而色曰豫攸好德汝則錫之福時人斯其惟皇之極此言庶民也有猷有謀慮者有為有施設者有守有操守者是三者君之所當念也念之者不忘之也帝念哉之念不協于極未合于善也不罹于咎不陷于惡也未合于善不陷于惡所謂中人也進之則可與為善棄之則流于惡君之所當受也受之者不拒之也歸斯受之之受念之受之隨其才而輕重以成就之也見於外而有安和之色發于中而有好德之言汝于是則錫之以福而是人斯其惟皇之極矣福者爵祿之謂或曰錫福即上文斂福錫民之福非自外來也曰祿亦福也上文指福之全體而言此則為福之一端而發苟謂非祿之福則于下文于其無好德汝雖錫之福其作汝用咎為不通矣纂疏凡厥庶民至受之者言君既立極于上而下之從化或有淺深緩速之不同其有謀者有材有德者人君固當念之而不忘其或未能盡合而未底乎大戾者亦當受之而不拒也而康而色至之極者言夫人有能革面從君而以好德自名則雖未必出于中心之實人君亦當因其自名而與之以善則是人者亦得以君為極而勉其至也辨孔氏曰汝當安汝顔色以謙下人又曰我所好者德汝即與之爵祿有為之士使進其所行王氏曰載色載笑匪怒伊教康色之謂也愚案而康而色辨𫝊皆作民言于兩而字未協而汝也盍依孔注皆指武王言汝康和汝色俯就誘掖之則人感發無隱于君曰我所好在德則君迎其善意而錫之福蓋攸好德為五福之一實福之本也無虐㷀獨而畏髙明㷀獨庶民之至微者也髙明有位之尊顯者也各指其甚者而言庶民之至微者有善則當勸勉之有位之尊顯者有不善則當懲戒之此結上章而起下章之義纂疏孔氏曰㷀單無兄弟獨無子愚謂㷀獨如云孤寒指民言髙明如云髙明之家指人言人之有能有為使羞其行而邦其昌凡厥正人既富方榖汝弗能使有好于而家時人斯其辜于其無好德汝雖錫之福其作汝用咎此言有位者也有能有才智者羞進也使進其行則官使者皆賢才而邦國昌盛矣正人者在官之人如康誥所謂惟厥正人者富祿之也榖善也在官之人有祿可仰然後可責其為善廩祿不繼衣食不給不能使其和好于而家則是人將陷于罪戾矣于其不好德之人而與之以祿則為汝用咎惡之人也此言祿以與賢不可及惡德也必富之而後責其善者聖人設教欲中人以上皆可能也纂疏無虐至其昌者言君之于民一視同仁凡有才能皆使進善則人才衆多而國賴以興也凡厥正人至用咎者言君之凡欲正人者必先有以富之然後可以納之于善不能使之有賴于其家則此人必將陷于不義至于無有好德之心而後始欲教之以修身勸之以求福則已無及于事而其起以報汝惟有惡而無善矣蓋人之氣稟或清或濁或純或駁有不可一律齊者是以聖人所以立極于上者至嚴至密而所以引接乎下者至寬至廣雖彼之所以化于此者淺深遲速其效或有不同而吾之所以應于彼者長養涵育其心未嘗不一也辨嘗疑正人正字只是中常之人此等人須是富方可與為善與無常産而有常心者異案此條與辨異愚案凡厥正人有四說引康誥惟厥正人以為官之長者為妥于人民之分及上下文理皆協汝則錫之福汝雖錫之福二福字只當與斂時五福一樣說蔡氏蓋用孔注爵祿之說也作汝用咎辨外添一報字蔡傳較優無好德則福之本已撥君雖錫之彼無以受之矣此疇首言建極錫福皆為民言至此則錫之福雖錫之福皆為有位之人言然于此三四節首以庶民與人對言繼而念之受之為民言也則錫雖錫為人言也雖若雜舉而實有條理大意欲君于建極之餘于民則隨才以成之于有位之人則隨才而祿之不特斂福以錫庶民且錫福于有位之人也使羞其行孔注行如字徐去聲無偏無陂遵王之義無有作好遵王之道無有作惡遵王之路無偏無黨王道蕩蕩無黨無偏王道平平無反無側王道正直會其有極歸其有極偏不中也陂不平也作好作惡好惡加之意也黨不公也反倍常也側不正也偏陂好惡己私之生于心也偏黨反側己私之見于事也王之義王之道王之路皇極之所由行也蕩蕩廣逺也平平平易也正直不偏邪也皇極正大之體也遵義遵道遵路㑹其極也蕩蕩平平正直歸其極也會者合而來也歸者來而至也此章蓋詩之體所以使人吟咏而得其情性者也夫歌詠以叶其音反復以致其義戒之以私而懲創其邪思訓之以極而感發其善性諷詠之間恍然而悟悠然而得忘其傾斜狹小之念逹乎公平廣大之理人欲消熄天理流行會極歸極有不知其所以然而然者其功用深切與周禮大師教以六詩者同一機而尤要者也後世此意不傳皇極之道其不明于天下也宜哉纂疏言天下之人不敢狥己之私以從乎上之化而㑹歸乎至極之標凖也蓋偏陂好惡者己私之生于心者也偏黨反側者己私之見于事者也王之義王之道王之路上之化也所謂皇極者也遵義遵道遵路方㑹其極也蕩蕩平平正直則已歸于極矣辨會歸字無甚異義只是重疊言之與既言無偏無黨又言無黨無偏無别說也吕氏曰此章只是反覆吟詠皇極㑹如㑹聚歸如歸宿有㑹然後有歸陳氏大猷曰此承上文言君能作成人故人皆趨極以申前凡厥庶民惟皇作極與斯其惟皇之極之意愚謂六王字即指皇極之君義路道即指皇極互辭協韻耳遵猶有不敢違之意至王道蕩蕩三句則自合乎王道無事于遵矣會合于君所建之有極結遵義六句歸宿于君所建之有極結蕩蕩六句二有極字與章首皇建其有極之有極相應實有之極亦君民同有之極也曰皇極之敷言是彞是訓于帝其訓曰起語辭敷言上文敷衍之言也言人君以極之理而反復推衍為言者是天下之常理是天下之大訓非君之訓也天之訓也蓋理出乎天言純乎天則天之言矣此贊敷言之妙如此纂疏言人君以身立極而布命于下則其所以為常為教者皆天之理而不異乎上帝之降衷也辨夏氏曰二曰字皆箕子更端之言蘇氏曰天錫禹九疇不能如是諄諄也粗有象數而已禹與箕子推而廣之至皇極尤詳曰此非皆帝之言也皇極之敷言也帝以象數告而我敷廣其言為彞訓爾與帝言無異故曰于帝其訓也西山蔡氏曰敷衍也皇極之敷言即上文無偏無陂以下之言也反覆推演故謂之敷言是天下之常經而古今之大訓皆天理之自然蓋天所錫禹者所謂于帝其訓也愚案蔡氏此條不宗師說而略用父說上文皆箕子敷衍之言下一節承上一節說豈箕子以其敷衍之言欲民即是訓是行乎切謂自此一節以上皆身教也凡民于皇極未易悟此一節箕子欲武王不以身教廢言教也凡厥庶民極之敷言是訓是行以近天子之光曰天子作民父母以為天下王光者道德之光華也天子之於庶民性一而已庶民于極之敷言是訓是行則可以近天子道德之光華也曰者民之辭也謂之父母者指其恩育而言親之之意謂之王者指其君長而言尊之之意言天子恩育君長乎我者如此其至也言民而不言人者舉小以見大也纂疏言天下之人于君所命皆能受其教而謹行之則是能不自絶逺而有以親被其道德之光華也曰天子作天下王言人君能立至極之標凖所以能作民父母而為天下之王也不然則有其位無其德不足以首出庶物統御人羣而居天下之極尊矣辨吕氏曰此彞此訓非我所自作乃帝之訓也庶民不可視為空言必當踐行此訓可也不言近皇極而言近天子之光天子既建極則天子即皇極也六三德一曰正直二曰剛克三曰柔克平康正直彊弗友剛克燮友柔克沉潜剛克髙明柔克克治友順燮和也正直剛柔三德也正者無邪直者無曲剛克柔克者威福豫奪抑揚進退之用也彊弗友者彊梗弗順者也燮友者和柔委順者也沉潜者沉深潜退不及中者也髙明者髙亢明爽過乎中者也蓋習俗之偏氣稟之過者也故平康正直無所事乎矯拂無為而治者也彊弗友剛克以剛克剛也燮友柔克以柔克柔也沉潜剛克以剛克柔也髙明柔克以柔克剛也正直之用一而剛柔之用四也聖人撫世酬物因時制宜三德乂用陽以舒之隂以斂之執其兩端用其中于民所以納天下民俗于皇極者蓋如此纂疏人資質沉潜者當以剛治之資質髙明者當以柔治之此說為勝王氏曰皇極立本三德趨時陳氏經曰皇極以體常三德以盡變林氏曰正直即王道正直是也不剛不柔為正直中德也剛克謂剛勝柔柔克謂柔勝剛一于剛則失之亢從而沉潜之蓋抑其過而歸于中一于柔則失之懦從而髙明之蓋引其不及而歸于中愚案下二句諸家多同林說於二克字缺通蔡云習俗之偏以强燮言氣稟之過以沉潜髙明言徽菴程氏曰三德一經而四權正直之用一經也剛柔之用四權也四權之中其二政以治之其二教之自治也又曰此疇柔克水木也正直土也剛克火金也惟辟作福惟辟作威惟辟玉食臣無有作福作威玉食福威者上之所以御下玉食者下之所以奉上也曰惟辟者戒其權不可下移曰無有者戒其臣不可上僣也纂疏唐氏聖任曰以德行權則威福不下移林氏曰三者人主之利勢所操以用夫三德者也名分謹嚴故能操縱以用三德權勢下移紀綱紊亂何以操縱三德而為皇極之用哉吳氏曰玉食非帝王所急足以見主威之不移也陳氏經曰三德之用莫易于正直莫難于剛柔君道主剛剛之失其過小柔之失其過大故又言威福玉食之柄在君唯恐失之柔而柄下移如漢元成也臣之有作福作威玉食其害于而家凶于而國人用側頗僻民用僣忒頗不平也僻不公也僣踰忒過也臣而僣上之權則大夫必害于而家諸侯必凶于而國有位者固側頗僻而不安其分小民者亦僣忒而踰越其常甚言人臣僣上之患如此纂疏愚謂此所謂臣大臣也大臣僣天子則次而邦君次而大夫次而小臣次而庶民皆效而僣踰無一安其分者夫皇極立本者也三德趨時者也皇極建則三德適時措之宜而權出于上皇極不建則三德失時措之宜而柄移于下矣七稽疑擇建立卜筮人乃命卜筮稽考也有所疑則卜筮以考之龜曰卜蓍曰筮蓍龜者至公無私故能紹天之明卜筮者亦必至公無私而後能𫝊蓍龜之意必擇是人而建立之然後使之卜筮也纂疏西山蔡氏曰皇極之君以人謀未免乎有心有心未免于有私此所以洗心齊戒以聼天命而無所容其心也擇建立卜筮人者非其人則不可非其職則不専必得其人而立之然後乃可命之卜筮定天下之吉凶成天下之亹亹非細事也曰雨曰霽曰蒙曰驛曰克此卜兆也雨者如雨其兆為水霽者開霽其兆為火蒙者蒙昧其兆為木驛者絡驛不屬其兆為金克者交錯有相勝之意其兆為土纂疏筮短龜長者龜惟鑽灼之易而筮有扐揲之煩龜兆一灼便成亦有自然之易洪範卜五即龜用二即蓍雨霽䝉驛克即是五行曰貞曰悔此占卦也內卦為貞外卦為悔左傳蠱之貞風其悔山是也又有以遇卦為貞之卦為悔國語貞屯悔豫皆八是也纂疏問貞悔不止一說如六十四卦則每卦內三畫為貞外三畫為悔如揲蓍成卦則正卦為貞之卦為悔如八卦之變則純卦一為貞變卦七為悔曰是如此問內卦為貞外卦為悔曰貞是正底便是體悔是過底動則有悔又問一貞八悔曰如乾夬大有大壯小畜需大畜泰內體皆乾是一貞外體八卦是八悔餘放此貞訓正事方正如此悔吝皆是事過後方有內卦之占是事正如此外卦之占是已如此二字有終始之意西山蔡氏曰內卦曰貞貞者事之幹也外卦曰悔悔者生乎動也六爻不動以內卦為貞外卦為悔見左傳蠱之貞風也其悔山也有動爻者以遇卦為貞之卦為悔見國語貞屯悔豫皆八是也凡七卜五占用二衍忒凡七雨霽蒙驛克貞悔也卜五雨霽蒙驛克也占二貞悔也衍推忒過也所以推人事之過差也纂疏衍疑是過多剩底意思忒是差錯了鄭𤣥曰忒變也王氏曰推衍以極其變也陳氏大猷曰七者卜筮之大凡而其變則無窮皆當推衍以極其變卜之變在經兆之體百有二十其頌千有二百體色墨坼方功義弓之類筮之變如老陽變隂老隂變陽一卦變為六十四卦六十四卦變為四千九十六卦之類引而伸之觸類而長之其變無終窮立時人作卜筮三人占則從二人之言凡卜筮必立三人以相𠫭考舊說卜有玉兆瓦兆原兆筮有連山歸藏周易者非是謂之三人非三卜筮也纂疏唐孔氏曰三人從二善鈞從衆也卜筮各有三人如金縢乃卜三龜儀禮士喪卜葬占者三人周禮太卜掌三兆之法杜注王兆顓帝之兆瓦兆堯之兆原兆周之兆西山曰知舊說非是者禹叙洛書時未有原兆周易也徽菴曰皇極雖建不敢自是國有大事參諸人謀鬼謀以决其疑人謀本隂陽五行之理鬼謀則以隂陽五行之象數參之一從一逆可以驗其得失矣然稽疑以卜筮為重而龜為尤重也汝則有大疑謀及乃心謀及卿士謀及庶人謀及卜筮汝則從龜從筮從卿士從庶民從是之謂大同身其康彊子孫其逢吉汝則從龜從筮從卿士逆庶民逆吉卿士從龜從筮從汝則逆庶民逆吉庶民從龜從筮從汝則逆卿士逆吉汝則從龜從筮逆卿士逆庶民逆作內吉作外凶龜筮共違于人用靜吉用作凶稽疑以龜筮為重人與龜筮皆從是之謂大同固吉也一人從而龜筮不違者亦吉龜從筮逆則可作內不可作外內謂祭祀等事外謂征伐等事龜筮共違則可靜不可作靜謂守常作謂動作也然有龜從筮逆而無筮從龜逆者龜尤聖人所重也故禮記大事卜小事筮傳謂筮短龜長是也自夫子贊易極著蓍卦之德蓍重而龜書不傳云纂疏陳氏大猷曰謀及卜筮處末者占法先蔽志後命于龜也心者人之神明其虛靈知覺無異鬼神蓍龜雖靈不踰于人故必以人謀為主然鬼神無心而人有欲人之謀慮未必能盡無適莫之私故又以龜筮為重張氏曰决疑主于蓍龜故進于卿士庶民之上龜筮從而臣民逆亦吉者以我心與鬼神合也我與民雖逆而亦吉者以卿士與龜筮同也我與卿士逆而亦吉者以庶民與龜筮同也王氏曰周官有大事衆庶得至外朝與羣臣以序進而天子親問焉髙氏曰有心未若無心之為公有情未若無情之為信故盤庚遷都成王東征皆以卜筮為主又曰舜之禪禹朕志先定詢謀僉同龜筮協從此大同也故歷數在汝夏祀四百成王宅洛周召營相四方和㑹卜惟洛食此大同也故卜世卜年卒過其歷吕氏曰五者之中三從二逆從之理多吉之所在也然三從之中必龜筮之從乃可蓋龜筮無心既已皆從卿士庶民或别有私心未可知也如盤庚遷都心已無疑卜稽如台獨臣民不欲遷何妨于吉汝與民逆而吉者如周公東征王既不知周公民又不靖惟在朝大臣及卜筮從故亦吉也林氏曰卜筮天所示也人事盡而後可以求之天故必皇極建三德乂至于有疑然後盡人謀而斷之卜筮苟人事不盡而惟卜筮是拘雖吉何補故稽疑必在皇極三德之後不可驟語也八庶徵曰雨曰𤾉曰燠曰寒曰風曰時五者來備各以其叙庶草蕃廡徵驗也廡豐茂所驗者非一故謂之庶徵雨𤾉燠寒風各以時至故曰時也備者無缺少也序者應節候也五者備而不失其序庶草且蕃廡矣則其他可知也雨屬水𤾉屬火燠屬木寒屬金風屬土吳仁傑曰易以坎為水北方之卦也又曰雨以潤之則雨為水矣離為火南方之卦也又曰日以烜之則𤾉為火矣小明之詩首章云我征徂西二月初吉三章云昔我往矣日月方燠夫以二月為燠則燠之為春為木明矣漢志引狐突金寒之言顔師古謂金行在西故謂之寒則寒之為秋為金明矣又案稽疑以雨屬水以霽屬火霽𤾉也則庶徵雨之為水𤾉之為火類例抑又甚明蓋五行乃生數自然之叙五事則本于五行庶徵則本于五事其條理次第相為貫通有秩然而不可紊亂者也纂疏問八庶徵曰時林氏取蔡氏元度說謂是嵗月日之時自五者來備以下所以申言雨𤾉寒燠風之義自王省惟嵗而下所以申言曰時之義竊謂此時字當如孔氏五者各以其時之說為長林氏徒見時字與雨𤾉等並列為六遂以此時字為贅古人之言如此類者多如仁義禮智是為四端加一信字則為五常非仁義禮智外别有所謂信也時之在庶徵猶信之在五常如何先生曰林氏說只與古說無異但謂有以嵗而論其時與不時者有以月而論其時與不時者有以日而論其時與不時者可更推之舊說謂五者以時至但下文休徵為時咎徵為恆下應獨舉休徵且方自庶徵何得遽言時耶問吳斗南說如何曰舊謂雨屬水𤾉屬金燠屬火寒屬水與五行相配皆錯亂了雨只屬水自分曉怎生屬得木問寒如何屬金曰他引金寒之證甚佳又曰貌言視聼思皆只以次第相屬林氏曰雨與𤾉對燠與寒對風行四者之間陳氏大猷曰隂陽之氣交則蒸而成雨散則開而成𤾉隂退陽進則成燠陽退隂進則成寒隂陽吹扇則成風雨𤾉風則逰氣之聚散飛揚者為之燠寒則二氣之循環往來者為之備謂皆有而不缺叙謂應期而不亂陳氏曰燠熱凉寒四時之氣也雨𤾉風佐四時之氣以生育者也止言燠寒者燠者熱之始寒者凉之極也徽菴曰庶徵之目六有氣與候之分雨𤾉燠寒風五行之氣也時五行之候也五者來備以下言庶徵之氣時謂嵗月日時之時王省惟嵗以下言庶徵之候氣以驗皇極之得失候則併驗卿士師尹庶民之得失也一得一失有則俱有氣候之以類應者亦如之不必如漢儒五行志之支離也愚案曰時有二說孔氏謂雨暘燠寒風五者各以其時但該後一半不著徽菴本林氏說以氣候分之其論遂濶大該貫然孔說亦當存之雨𤾉燠寒吳氏引證其屬水火木金甚當風之屬土獨缺其證當以莊子風生于土囊之口及大塊噫氣其名為風證之風之為土氣豈不章章甚明也哉一極備凶一極無凶極備過多也極無過少也唐孔氏曰雨多則潦雨少則旱是極備亦凶極無亦凶餘准是纂疏陳氏大猷曰五者來備至蕃廡即下文之休徵也極備極無之凶即下文之咎徵也曰休徵曰肅時雨若曰乂時𤾉若曰哲時燠若曰謀時寒若曰聖時風若曰咎徵曰狂恆雨若曰僣恆𤾉若曰豫恆燠若曰急恆寒若曰蒙恆風若狂妄僣差豫怠急迫蒙昧也在天為五行在人為五事五事修則休徵各以類應之五事失則咎徵各以類應之自然之理也然必曰某事得則某休徵應某事失則某咎徴應則亦膠固不通而不足與語造化之妙矣天人之際未易言也失得之機應感之微非知道者孰能識之哉纂疏今人讀書簏心大膽如何看得古人意思如說庶徴若不細心體識如何㑹見得肅時雨若肅是恭肅便自有滋潤底意思所以便說時雨順應之乂時𤾉若乂是整治便自有開明底意思所以便說時𤾉順應之哲時燠若哲是昭融便自有和暖底意思所以便說時燠順應之謀時寒若謀是藏密便自有寒結底意思所以便說時寒順應之聖時風若聖是通明便自有爽快底意思所以便說時風順應之符舜功云謀自有顯然著見之謀聖是不可知之妙不知于寒于風果相關否曰凡看文字且就地頭看不可將大底便來壓了箕子所指謀字只且說密謀意思聖只是說通明意思如何將大底來壓了便休洪範庶徴固不是必定如漢儒之說必以為有是事多雨之徴必推說是某時做某事不肅所以致此為此必然之說所以教人難盡信但古人意思精密只于五事上體察是有此理如荆公又却要一齊都不消說感應只把若字做如似字義說了做譬喻說了這也不得人主自當戒謹如漢儒必然之說固不可為荆公全不相關之說亦不可古人意思精密恐後世見未到耳人主行事與天地相流通故行有善惡則氣各以類應然感應之理交相貫通非謂行此一事即有此一應統而言之一德修則凡德必修一氣和則凡氣必和固不必曰肅自致雨無與于𤾉乂自致𤾉無與于雨分而言之則德各有方氣各有象肅者雨之類乂者𤾉之類求其所以然之故固各有所當也問休徴咎徴諸家多以義推說竊以為此猶易中取象但可以髣佛看而不可以十分親切求也庶徴雖五大抵不出隂陽二端雨寒隂也𤾉燠風陽也肅謀深而屬靜隂類也故時雨時寒應之乂哲聖發見而屬動陽類也故時𤾉時燠時風應之狂反于肅急失于謀故恆雨恆寒應之僣則不乂豫則不哲䝉則不聖故恆𤾉恆燠恆風應之如何曰大槩如此林氏曰肅乂哲謀聖者休之本五者之時休徴也狂僣豫急蒙者咎之本五者之恆咎徴也氣一失其和則必自省曰是吾之咎歟故思去其咎而反其休五者之咎聖人雖無之不可以不自省也陳氏大猷曰天地間有必然之理有或然之數周末無寒嵗秦亡無燠年理之常也堯九年之水湯七年之旱數之變也理者聖賢之所守氣非聖賢之所泥堯湯雖不能無此變而卒能銷其變或然之數終不能勝必然之理聖人所以回造化也李氏杞曰休咎之分皆起于人君一念之微愚謂庶徴疇之肅乂哲謀聖即五事疇之肅乂哲謀聖也五者得其時為休徵可驗君之肅乂哲謀聖矣五者恆而不時為咎徵可驗君之不肅而狂矣餘皆然本之天為五行修之君為五事始也順五行以敬五事在君為五事在天為庶徵今因敬五事而驗之五行也西山蔡氏曰君即五事之應以察吾五事之得失一事得則五事從休徵無不應矣一事失則五事違咎徵無不應矣鯀陻洪水水失其性耳而五行為之汨陳以是理也漢儒不得其意而肆為之說驗之古則鑿而不經推之將來則膠而不應將以防君之失適以啓君之惑矣曰王省惟嵗卿士惟月師尹惟日嵗月日以尊卑為徵也王者之失得其徵以嵗卿士之失得其徴以月師尹之失得其徴以日蓋雨𤾉燠寒風五者之休咎有係一嵗之利害有係一月之利害有係一日之利害各以其大小言也纂疏王所當省者一嵗之事卿士所當省者一月之事以下皆然林氏曰自五者來備以下申言曰雨至曰風之義自王省惟嵗以下申言曰時之義或以曰王省惟嵗以後為五紀疇之傳錯簡在此非也九疇雖别為九實更相經緯故庶徴有五事而皇極有五福愚謂引周禮太宰嵗終受百官之㑹而詔王廢置小宰月終受羣吏之要宰夫旬終正日成以證此章亦一說但王卿尹省休咎于嵗月日之時者所包甚大安止此哉曰字更端而言庶徴之候王之得失其徴以嵗故王所省察惟一嵗之時之休咎卿士得失其徴以月故卿士所省察惟一月之時之休咎師尹放此卿士不言省蒙上文也嵗統月月統日猶王統卿士卿士統師尹尊者所理大而要卑者所理小而詳也雨𤾉燠寒風之休咎實行乎嵗月日之中五者時若則嵗月日之時無易而休徴見矣五者恆若則月日嵗之時既易而咎徴見矣氣行乎候之中非氣自氣候自候也嵗月日時無易百榖用成乂用明俊民用章家用平康嵗月日三者雨𤾉燠寒風不失其時則其效如此休徴所感也日月嵗時既易百榖用不成乂用昏不眀俊民用微家用不寧日月嵗三者雨𤾉燠寒風既失其時則其害如此咎徴所致也休徴言嵗月日者總于大也咎徴言日月嵗者著其小也庶民惟星星有好風星有好雨日月之行則有冬有夏月之從星則以風雨民之麗乎土猶星之麗乎天也好風者箕星好雨者畢星漢志言軫星亦好雨意者星宿皆有所好也日有中道月有九行中道者黃道也北至東井去極近南至牽牛去極逺東至角西至婁去極中是也九行者黑道二出黃道北赤道二出黃道南白道二出黃道西青道二出黃道東并黃道為九行也日極南至于牽牛則為冬至極北至于東井則為夏至南北中東至角西至婁則為春秋分月立春春分從青道立秋秋分從白道立冬冬至從黑道立夏夏至從赤道所謂日月之行則有冬有夏也月行東北入于箕則多風月行西南入于畢則多雨所謂月之從星則以風雨也民不言省者庶民之休咎係乎上人之得失故但以月之從星以見所以從民之欲者如何爾夫民生之衆寒者欲衣飢者欲食鰥寡孤獨者之欲得其所此王政之所先而卿士師尹近民者之責也然星雖有好風好雨之異而日月之行則有冬有夏之常以月之常行而從星之異好以卿士師尹之常職而從民之異欲則其從民者非所以狥民矣言日月而不言嵗者有冬有夏所以成嵗功也言月而不言日者從星惟月為可見耳纂疏庶民衆多衆星之象庶民惟星本當在師尹惟日之下但其取徵不同故又發此義而續見星非有嗜好但氣類相感月亦非有順從但行度所次今曰好曰從乃假設以喻人猶隂陽和而風雨應也上言職分眀則至治成此言人心順則和氣應皆庶徴之事問庶民惟星并下文好風好雨意不貫曰家用不寧以上自結上文了下文却又說起星之意似是兩假箕是簸箕以其簸揚而鼓風故月宿之則風古語云月宿箕風揚沙畢是義網漉魚底義子亦謂之畢漉魚則其汁水淋漓而下若雨然畢星名義蓋取此今畢星上有一柄下開兩叉形象亦類畢故月宿之則雨漢書謂月行東北入軫若東南入箕則風者蓋箕是東南方屬巽巽為風所以好風恐未必然唐孔氏曰箕東方木宿畢西方金宿也詩云月離于畢俾滂沱矣經箕多風傳記無其事鄭氏引春秋緯云月離于箕則風揚沙西山蔡氏曰王卿尹其得失驗之嵗月日若庶民之得失則在君所謂百姓有過在豫一人故此以庶民省之于星以驗其安與不安而已漢志言日行陽道多風旱行隂道多雨水日象君之行不可指而知以正行言之冬則南夏則北然君行急則日行疾君行緩則日行遲疾則過乎中道遲則不及乎中道日之所行月之所隨也日失中道則月亦變行故去中道移而東北入于箕則多風為旱移而西入于畢則多雨為水所謂月之從星則以風雨也蓋民之安否省之于星星之風雨本之于日月月之九道本之于日故庶民惟星繼之以日月之行至風雨也雨𤾉燠寒風既徴于貌言視聼思又以所職大小别之于嵗月日又以民之安否參之于星于以見皇極之君視履考祥如此之周旋而不敢忽也愚案前漢五行志元光中天星盡搖上以問候星者對曰星搖者民勞也又云五星同色天下偃兵百姓安寧歌舞以行以此觀之則以庶民省之于星以驗其安否之說信矣沈氏括曰歷法天有黃赤二道日月有九道此皆强名非實有也亦如周天三百六十五度天何嘗有度以日行三百六十五日而一朞强謂之度以步日月五星行次而已日之所由謂之黃道南北極之中度最均處謂之赤道月行黃道之南謂之朱道行黃道之北謂之黑道黃道之東謂之青道黃道之西謂之白道黃道內外各四并黃道為九日月之行有遲有速難以一術御也故因其合散分為數段每段以一色名之欲以别算位而已如算法用赤籌黑籌以别正負之數歷家不知其義遂以為實有九道甚可嗤也九五福一曰壽二曰富三曰康寧四曰攸好德五曰考終命人有壽而後能享諸福故夀先之富者有廪祿也康寧者無患難也攸好德者樂其道也考終命者順受其正也以福之急緩為先後纂疏人主不以一身為福極而以天下為福極民皆仁壽堯舜之福也民皆鄙夭桀紂之極也五福以人所尤好者為先林氏曰唐李泌云天命他人皆可言惟君相不可言君相造命者也民命雖禀于天君實制之自五行至庶徴各得其叙則民歸于五福矣五福雖天所畀實自造命者嚮而致之也自五行至庶徴失其叙則民陷於六極矣欲民不陷于極亦造命者威而避之也使民享五福而不知六極治道之極功也故九疇以是終焉陳氏大猷曰人莫不好生壽則生之長者故五福壽為先雖壽不可無以養其生故富次之壽且富或不免于憂患則身心不安故康寧又次之形康心寧安之至也壽富康寧而不好德則老而不死為富不仁作僞心勞何足貴哉攸好德則心逸日休自求多福福之本實在此其為福大矣故好德又次之考成也諸福備矣必成其正命則全而歸之順受其正然後為福之至使年雖夀而死非正命雖夀何補故考終命終焉此五福即皇極疇之五福五福以攸好德為根本五福之目雖至第九疇而列五福之根已于第五疇而基曰豫攸好德汝則錫之福是也好德則必得其夀無德而夀罔之生也好德則得祿而富無德而富怨之府也好德則心廣體胖無入不自得無德則小人長戚戚非安也至考終命則未有不由德而能戰兢以全歸者諸福固必本于好德而好德又豈非本于建皇極哉右東齊說以愚說補足之徽菴曰君建其有極民是訓是行皆為嚮用五福否則為威用六極夀富康寧考終命者全五行之氣攸好德者全五行之理反之則為六極王氏曰福極不言貴賤者貴賤有常分使皆慕貴而不欲賤則淩犯篡竊何有終極顧氏臨曰不言貴雖以嚴分然貴未必為福賤未必為極故桀紂貴為天子而不得其死顔回原憲到今稱之六極一曰凶短折二曰疾三曰憂四曰貧五曰惡六曰弱凶者不得其死也短折者橫夭也禍莫大于凶短折故先言之疾者身不安也憂者心不寧也貧者用不足也惡者剛之過也弱者柔之過也以極之重輕為先後五福六極在君則係于極之建不建在民人則由于訓之行不行感應之理微矣纂疏五福六極也配得但是略有不齊問皇極五福即是此五福否曰便即是這五福如斂時五福用敷錫厥庶民斂砥即是盡得這五事以此錫庶民便是使民也盡得這五事盡得五事便有五福陳氏大猷曰六極以人所尤惡者為始凶者考終命之反短折者夀之反貧者富之反疾憂者康寧之反惡弱者好德之反陷于不善者惡也雖欲為善而不能自强者弱也王氏炎曰比干死刑仇牧死亂狼瞫死戰亦凶乎解揚曰下臣獲考死又何求死而合義雖不斃牖下非凶也惡者小人之剛自暴者也弱者小人之柔自棄者也吕氏曰弱人之大患不自强于善牽引入于惡而不能自拔皆弱故也故特以終六極董氏鼎曰自初一曰至用六極禹之本文九疇之經也自一五行至篇終箕子之叙論九疇之傳也先經以眀其綱後傳以詳其目洪範可得而讀矣蓋天地所以為造化隂陽五行而已天地以其氣生育民物而理默行乎其中聖人以其理修己治人而氣參合于其上一二三四皆經常之疇法天以治乎人者也六七八九皆權變之疇即人以驗諸天者也五皇極一疇則守常制變而幹八疇之樞者也伏羲本河圖以畫八卦八卦一隂陽神禹本洛書以叙九疇九疇一五行也然易不言五行範不言隂陽蓋五行一隂陽也隂陽一太極也河圖洛書相為經緯八卦九章相為表裏一而二二而一者也洪範法之大不出九疇外彛倫道之常即在九疇中矣捨是何以叙彛倫哉書集傳纂疏卷四上欽定四庫全書書集傳纂疏卷四下元陳櫟撰朱子訂定蔡氏集傳周書旅獒西旅貢獒召公以為非所當受作書以戒武王亦訓體也因以旅獒名篇今文無古文有纂疏近諸孫將旅獒來讀是時武王已八十餘嵗矣太保此書諄諄告之如教小兒相似若自後世言之為非所宜言不尊君矣惟克商遂通道于九夷八蠻西旅砥貢厥獒太保乃作旅獒用訓于王九夷八蠻多之稱也職方言四夷八蠻爾雅言九夷八蠻但言其非一而已武王克商之後威德廣被九州之外蠻夷戎狄莫不梯山航海而至曰通道云者蓋蠻夷來王則道路自通非武王有意于開四夷而斥大境土也西旅西方蠻夷國名犬髙四尺曰獒案說文曰犬知人心可使者公羊傳曰晋靈公欲殺趙盾盾躇階而走靈公呼獒而屬之獒亦躇階而從之則獒能曉解人意猛而善搏人者異于常犬非特以其髙大也太保召公奭也史記云與周同姓姬氏此旅獒之本序纂疏舉夷蠻以見其餘也子欲居九夷東方夷有九種八蠻今猶云然明堂位言六戎五狄職方言五戎六狄召地在岐邦內召公食采於召後封燕張氏曰當未克商王未必受此既克商于此受而不却王心亦少懈矣召公此訓若嚴父師訓子弟然非公髙識安能見微格非如此林氏曰公恐四夷聞之將爭以珍竒進也吕氏曰創業之君有一毫之失後世便有丘山之害此于王業已成則為謹終于示後嗣則為謹始以此為防後猶有求白狼白鹿如穆王者陳氏經曰武王非求之公諫之若其失德何也聖狂逺矣而根于一念之微流金爍石而一隂生寒于此始墮指折綿而一陽生暑于此萌諫于微則為力易待其著則難矣躇丑略反超遽不暇以次也曰嗚呼眀王慎德四夷咸賔無有逺邇畢獻方物惟服食器用謹德蓋一篇之綱領也方物方土所生之物明王謹德四夷咸賔其所貢獻惟服食器用而已言無異物也纂疏唐孔氏以器用為一或謂羽毛齒革等器也牛馬犬龜等用也愚謂一篇皆自明王慎德一句推廣之曰昭德之致曰惟德其物曰德盛不狎侮曰玩人喪德曰終纍大德德之一辭諄諄焉惟慎德所以自致貢物惟貢無異物所以見其慎德若竒玩則非當獻亦非當受一受之則怠荒之心生而慎德之初意失矣王乃昭德之致于異姓之邦無替厥服分寶玉于伯叔之國時庸展親人不易物惟德其物昭示也德之致謂上文所貢方物也昭示方物于異姓之諸侯使之無廢其職分寶玉于同姓之諸侯使之益厚其親如分陳以肅慎氏之矢分魯以夏后氏之璜之類王者以其德所致方物分賜諸侯故諸侯亦不敢輕易其物而以德視其物也纂疏展審視也易改易也言人不足以易物惟德足以易物德重而人輕也有人君之德則所錫豫之物斯足貴若無其德雖有至寶以錫諸侯亦不足貴也唐孔氏曰有德無德之王以物賜人一也不改易其物而貴賤異王氏曰人以王德所致故不敢易其物而德其物陳氏經曰豫異姓固昭德之致分同姓以寶玉亦德所致也以物視物則金玉輕如鴻毛以德視物雖一介重于九鼎林氏曰獒之為物小不可為服食大不可為器用踈不可昭德于異姓親不可展親于同姓吕氏曰聖人公天下為心天下之物與天下共之非如秦以千七百國獨奉一身而已然一視同仁中文理密察自親及踈非無等差待同姓必厚于待異姓非如墨氏兼愛也蘇氏曰展布親親之恩愚謂必服食器用之常物始足以見君德所致若異物適足彰君之不德耳物皆德所致則此物非徒物也即君之德也易字去聲為眀展親蘇說為優德盛不狎侮狎侮君子罔以盡人心狎侮小人罔以盡其力德盛則動容周旋皆中禮然後能無狎侮之心言謹德不可不極其至也德而未至則未免有狎侮之心狎侮君子則色斯舉矣彼必髙蹈逺引望望然而去安能盡其心狎侮小人雖其微賤畏威易役然至愚而神亦安能盡其力哉纂疏陳氏大猷曰德愈盛者禮愈恭德盛則心無限量自不狎侮人狎侮之形由德薄心隘而驕矜乘之也此因言慎德而推廣言之狎侮則非所以慎德矣愚謂君子人心所同歸狎侮之則惡人之所好失人心矣安能得人盡心小人以力事人狎侮之雖刑驅勢迫勉强用力耳安能得其盡力必如文王感民子來方為盡其力須玩味人與其字不役耳目百度惟貞貞正也不役于耳目之所好百為之度惟其正而已纂疏王氏炎曰心官為主而耳目從其令則非禮勿視聽百度正矣心不能為主宰而為耳日所役則物交物而為所引百度何由而正陳氏大猷曰受獒是役于耳目之所玩玩人喪德玩物喪志玩人則上文狎侮君子之事玩物即上文不役耳目之事德者已之所得志者心之所之纂疏王氏十朋曰玩人則以驕滅敬故喪德玩物則以欲勝剛故喪志愚謂喪志則亦必喪德未有溺志于物而可修德者受獒即玩物志以道寧言以道接道者所當由之理也己之志以道而寧則不至于妄發人之言以道而接則不至于妄受存乎中者所以應乎外制乎外者所以養其中古昔聖賢相授心法也纂疏陳氏大猷曰受獒則志動于物非以道寧矣獻獒必甘言求納亦必有言其可納者公言不當受乃逆耳之言以道揆之則知所從違矣吕氏曰既言玩好之害又言存養工夫志以道寧孟子所謂持志言以道接孟子所謂知言內外交養如此不作無益害有益功乃成不貴異物賤用物民乃足犬馬非其土性不畜珍禽竒獸不育于國不寶逺物則逺人格所寶惟賢則邇人安孔氏曰逰觀為無益竒巧為異物蘇氏曰周穆王得白狼白鹿而荒服因以不至此章凡三節至所寶惟賢則益切至矣纂疏陳氏經曰寶賢則天下安然其安自近始林氏曰漢文却千里馬光武以駕鼓車三代後能行召公之言二君是也虞寶璧乘故視宫之竒為路人齊寶四臣故視照乘之珠為土苴唐孔氏曰晉惠乘小駟旋濘見獲馬非土性故也趙簡子問王孫圉楚白珩在乎對曰楚所寶觀射父左史倚相也白珩先王所玩何寶焉知所寶矣嗚呼夙夜罔或不勤不矜細行終纍大德為山九仞功虧一簣或猶言萬一也吕氏曰此即謹德工夫或之一字最有意味一暫止息則非謹德矣矜矜持之矜八尺曰仞細行一簣指受獒而言也纂疏陳氏大猷曰細行猶言小節即畢命小物易庸行受獒雖小節所損甚大林氏曰孔子為山之譬蓋本諸此張氏曰受獒是一簣之虧也愚謂武王治定功成如此或受一獒遂纍大德而虧成功實深可惜此篇始以慎言終以勤言必無一息不勤始為慎德之至夙夜罔或不勤體天之行健而自强不息也一受獒是怠忽而勤息矣豈所以慎德哉允迪茲生民保厥居惟乃世王信能行此則生民保其居而王業可永也蓋人主一身實萬化之原苟于理有毫髮之不盡即遺生民無窮之害而非創業垂統可繼之道矣以武王之聖召公所以警戒之者如此後之人君可不深思而加念之哉纂疏王氏日休曰茲謂此一篇之言謂誠能行此言也金縢武王有疾周公以王室未安殷民未服根本易搖故請命三王欲以身代武王之死史録其冊祝之文并敘其事之始末合為一篇以其藏于金縢之匱編書者因以金縢名篇今文古文皆有唐孔氏曰發首至王李文王史叙將告神之事也史乃冊祝至屏璧與圭記告神之辭也自乃卜至乃廖記卜吉及王病瘳之事也自武王既喪已下記周公流言居東及成王迎歸之事也纂疏金縢之作在周公東征歸後以其記武王時事且備東征本末故敘之于此鄭氏曰藏書匱緘縢以金凡藏祕書皆然既克商二年王有疾弗豫記年見其克商之未久也弗豫不悅豫也纂疏蘇氏曰弗豫猶言不懌陳梅叟曰成王時生才五年二公曰我其為王穆卜二公太公召公也李氏曰穆者敬而有和意穆卜猶言共卜也愚謂古者國有大事卜則公卿百執事皆在誠一而和同以聼卜筮故名其卜曰穆卜下文成王因風雷之變王與大夫盡辨啓金縢之書以卜者是也先儒專以穆為敬而于所謂其勿穆卜則義不通矣纂疏陳氏大猷曰穆敬和而有深逺之意愚案共卜之訓恐未當證以昭穆有幽隂深逺之意周公曰未可以戚我先王戚憂惱之意未可以武王之疾而憂惱我先王也蓋郤二公之卜公乃自以為功為三壇同墠為壇于南方北面周公立焉植璧秉圭乃告太王王季文王功事也築土曰壇除地曰墠三壇三王之位皆南向三壇之南别為一壇北向周公所立之地也植置也圭璧所以禮神詩言圭璧既卒周禮祼圭以祀先王周公却二公之卜而乃自以為功者蓋二公不過卜武王之安否耳而周公愛兄之切危國之至忠誠懇懇于祖父之前如下文所云者有不得盡焉此其所以自以為功也又二公穆卜則必禱于宗廟用朝廷卜筮之禮如此則上下喧騰而人心搖動故周公不于宗廟而特為壇墠以自禱也纂疏孔氏曰公自以請命為己事鄭氏曰植古置字置璧于三王之壇以禮神秉圭公自執桓圭也林氏曰古者有事祖考當夫無廟與不得入廟則為壇以祭祀支子不得祭祖故周公不敢入廟而為壇也或曰金縢之禱不知命乎伊川曰周公誠心欲代其兄豈問命邪史乃冊祝曰惟爾元孫某遘厲虐疾若爾三王是有丕子之責于天以旦代某之身史太史也册祝如今祝版之類元孫某武王也遘遇厲惡虐暴也丕子元子也旦周公名也言武王遇惡暴之􅔂若爾三王是有元子之責于天蓋武王為天元子三王當任其保護之責于天不可令其死也如欲其死則請以旦代武王之身于天之下疑有缺文舊說謂天責取武王者非是詳下文豫仁若考能事鬼神等語皆主祖父人鬼為言至于乃命帝庭無墜天之降寶命則言天命武王如此之大而三王不可墜天之寶命文意可見乂案死生有命周公乃欲以身代武王之死或者疑之蓋方是時天下未安王業未固使武王死則宗社傾危生民塗炭變故有不可勝言者周公忠誠切至欲代其死以紓危急其精神感動故卒得命于三王今世之匹夫匹婦一念誠孝猶足以感格鬼神顯有應驗而況于周公之元聖乎是固不可謂無此理也豫仁若考能多才多藝能事鬼神乃元孫不若旦多材多藝不能事鬼神周公言我仁順祖考多材幹多藝能可任役使能事鬼神武王不如旦多材多藝不任役使不能事鬼神材藝但指服事役使而言乃命于帝庭敷佑四方用能定爾子孫于下地四方之民罔不祗畏嗚呼無墜天之降寶命我先王亦永有依歸言武王乃受命于上帝之庭布文德以佑助四方用能定爾子孫于下地使四方之民無不敬畏其任大其責重未可以死故又歎息申言三王不可墜失天降之寶命庶先王之祀亦永有所賴以存也寶命即帝庭之命也謂之寶者重其事也今我即命于元龜爾之許我我其以璧與圭歸俟爾命爾不許我我乃屏璧與圭即就也歸俟爾命俟武王之安也屏藏也屏璧與圭言不得事神也蓋武王喪則周之基業必墜雖欲事神不可得也其稱爾稱我無異人子之在膝下以語其親者此亦終身慕父母與不死其親之意以見公之逹孝也纂疏乃立壇墠一節分眀是對鬼神說有丕子之責于天先儒都解錯了只有朝以道說得好他解丕子之責如史傳中責其侍子之責蓋云上帝責三王之侍子侍子指武王也上帝責其來服事左右故周公乞代其死言三王若有侍子之責于天則不如以我代之我多材藝能事鬼神武王不若我不能事鬼神且留他在世上定你之子孫與四方之民伊川却疑公不應自說多材藝他止要代武王之死耳以身代武王此為周公誠意篤切以庶幾其萬一問代武王死亦有此理否曰聖人為之亦須有此理周公之意云設若三王欲得其子服事于彼則我多材藝可備使令且留武王以鎮天下也林氏曰册祝如今祝版自惟爾元孫某至屏璧與圭即册上所書祝辭全文本用武王名史代以某周人以諱事神諱名始于周自太王王季言則曰元孫自文王言則曰丕子元長丕大也皆指武王張氏曰武王若死事未可知大位者姦之窺危病者邪之伺異時三監之叛周公之先見微矣愚謂元孫不若旦非公自誇而貶武王蓋欲代其死故如此言命于元龜如云令龜歸俟爾命待死而璧圭所以事神也夫死生有命乃以死為可代世多疑之當此時王業未固使武王死變故不可勝言後來王崩于定商八年後三監武庚之變尚爾况方克商二年乎公忠誠懇切欲代兄死以紓危急蓋以武王一身宗社生民之身公之禱非獨弟為兄臣為君乃為先王禱為天下禱為萬世社稷禱也至聖至誠卒感通于先王而轉移乎造化烏可謂無此理哉蔡氏謂任保護之責于天故疑于天之下有缺文若依語録用朝說則二句文意渙然矣仁若考謂仁順祖考則不若旦却如何訓謂己仁如父元孫材藝不如旦文理甚明以敷為布文德亦恐無文德意何不只云敷廣佑助乎乃卜三龜一習吉啓籥見書乃并是吉卜筮必立三人以相參考三龜者三人所卜之龜也習重也謂三龜之兆一同開籥見卜筮之書乃并是吉纂疏或曰三王前各一龜卜之林氏曰習與習坎之習同舜亦曰卜不習吉公曰體王其罔害豫小子新命于三王惟永終是圖茲攸俟能念豫一人體兆之體也言視其卜兆之吉王疾其無所害我新受三王之命而永終是圖矣茲攸俟者即上文所謂歸俟也一人武王也言三王能念我武王使之安也詳此言新命于三王不言新命于天以見果非謂天責取武王也纂疏謝氏曰體與爾卜爾筮體無咎言之體同周禮占人云凡卜君占體大夫占色史占墨卜人占坼然證以詩語若看兆體上下可通言之愚案茲攸俟上下疑有缺誤公歸乃納册于金縢之匱中王翼日乃瘳冊祝册也匱藏卜書之匱金縢以金緘之也翼日公歸之明日也瘳愈也案金縢之匱乃周家藏卜筮書之物每卜則以告神之辭書于册既卜則納册于匱而藏之前後卜皆如此故前周公乃卜三龜一習吉啓籥見書者啓此匱也後成王遇風雷之變欲卜啓金縢者亦啓此匱也蓋卜筮之物先王不敢褻故金縢其匱而藏之非周公始為此匱藏此册祝為後來自解計也纂疏林氏曰請代武王死周公之本心也王瘳而公不死者天也非人之所能為也武王既喪管叔及其羣弟乃流言於國曰公將不利於孺子管叔名鮮武王弟周公兄也羣弟蔡叔度霍叔處也流言無根之言如水之流自彼而至此也孺子成王也商人兄死弟立者多武王崩成王幼周公攝政商人固已疑之又管叔于周公為兄尤所覬覦故武庚管蔡流言于國以危懼成王而動搖周公也史氏言管叔及其羣弟而不及武庚者所以深著三叔之罪也纂疏此以下記周公成王時事羣弟流言即大誥所謂三監及淮夷叛也意其稱兵舉事必以誅周公為辭若王敦之于劉隗刁協爾周公乃告二公曰我之弗辟我無以告我先王辟讀為避鄭氏詩傳言周公以管蔡流言辟居東都是也漢孔氏以為致辟于管叔之辟謂誅殺之也夫三叔流言以公將不利于成王周公豈容遽興兵以誅之邪且是時王方疑公公將請王而誅之邪將自誅之也請之固未必從不請自誅之亦非所以為周公矣我之弗辟我無以告我先王言我不避則于義有所不盡無以告先王于地下也公豈自為身計哉亦盡其忠誠而已矣纂疏孔氏曰辟法也不以法法三叔則無以告先王吕氏曰舜之封象所以為至仁周公以法法三叔所以為大義張氏行成曰仁人之于兄弟有怨于身則不宿獲罪于天下則必誅周公居東二年則罪人斯得居東居國之東也鄭氏謂避居東都未知何據孔氏以居東為東征非也方流言之起成王未知罪人為誰二年之後王始知流言之為管蔡斯得者遲之之辭也纂疏周公東征不必言用權自是王室至親與諸侯連衡背叛當國大臣豈有坐視之理征之乃是正義不待可與權者而後能馬鄭以為東行避謗乃鄙生腐儒不逹時務之說陳少南于經㫖多踈略不足據以為說來教所謂周公之志非為身謀為先王謀也以身任天下之重也此語極佳答徐元聘罪人斯得此處須著箇極廣大無物我底心胸看方得若有一毫私吝自愛惜避嫌疑之心則與聖人做處天地懸隔矣萬一成王終不悟周公更待罪幾年不知如何收殺答何叔京銖問弗辟馬鄭音避謂管蔡流言王既疑周公公乃避居東都二年以待成王之察及王遭風雷啓書迎公來返乃攝政始東征罪人斯得王得流言之罪人也陳少南吳才老從之而詆誅辟之說銖竊謂周公誅管蔡與伊尹放太甲皆聖人之變惟二公至誠無愧正大明白故行之不疑未可以淺俗之心窺之此辟字與致辟之辟同安得以為避使周公委政而去二年之久不幸王終不悟小人得乘閒而入禍可勝言哉公是時不知何以告我先王也觀公告二公曰我之弗辟至先王其言正大明白至誠惻怛則區區嫌疑有所不必避惟有此心無愧而先王可告也自潔其身而為匹夫之諒公豈為之哉答曰辟字當從古注說與蔡沉帖曰弗辟只從鄭氏為是向董叔重書亦辨此條一時答之謂當從古注後來思之不然時三叔方流言周公處兄弟骨肉之間豈應以片言半語便遽然興師以誅之聖人氣象大不如此又王方疑公公固不應不請而自誅之若請于王王亦未必從雖曰聖人之心公平正大區區嫌疑似不必避但舜避堯子禹避舜子自是合如此或又謂成王疑公故公居東不幸王終不悟不知公又如何處愚謂公亦惟盡其忠誠而已矣唐孔氏曰居東不言在何處王肅云東洛邑也詩言三年謂初去及來凡經三年也書云二年直數居東之年除其去年也張氏曰罪人之得在二年而周公之歸在三年初不相妨吕氏曰是時內則少主疑惑外則四國倡亂公何恃而敢出征二年蓋十亂尚有如二公者為太師太保而在內可以委付調護鎮定于其間故也後世權臣安敢輕去君側舉足左右變不旋踵矣于後公乃為詩以貽王名之曰鴟梟王亦未敢誚公鴟梟惡鳥也以其破巢取卵比武庚之敗管蔡及王室也誚讓也上文言罪人斯得則是時成王之疑十已去其四五矣纂疏吕氏曰王誚公而未敢未敢即悔過之根本也愚案我之弗辟朱子初主孔注甚力後改從鄭說特與九峯言之固宜其用師說而不敢違也然深思廣證之從孔注甚正大從鄭說實迂晦以經證經蔡仲之命曰羣叔流言乃致辟管叔于商致辟接流言下與此之弗辟接流言于國下一也在彼可以致辟為刑辟在此何不可乎如曰乃辟罔攸辟爾惟勿辟只一辟字便是施刑何待致字而後明我不致辟于彼則無以告先王辭甚眀白使云我若不避之如何接得我無以告我先王不審避之將何以告先王乎有辟字在上則居東便是屯駐以東征矣作鴟梟詩云既取我子便是謂武庚既敗我管蔡矣三年而歸便是成王因風雷之變迎公以歸也首尾關涉三年謂二年三年皆可如人居親喪三年實不過再期大祥豈必整三十六月方為三年乎朱子與蔡帖引避堯舜子為證與此大不同惜當時無再條此等意以質之文公者耳碧梧馬氏曰經云公居東二年則罪人斯得是東征而後得罪人也若是閒坐何以得罪人蔡氏知其未通以為得流言所自此強為說耳經直云罪人斯得初無他委曲今欲曲成鄭說乃為此迂回之語或謂伐柯諸篇言公歸公歸不避何以言歸程氏曰伐柯乃既得罪人後公遲遲未歸大夫以朝廷不知所以還公之道而作是詩也合詩書比而觀之定從孔氏刑辟之說其庶幾乎秋大熟未穫天大雷電以風禾盡偃大木斯拔邦人大恐王與大夫盡辨以啓金縢之書乃得周公所自以為功代武王之說王與大夫盡辨以發金縢之書將卜天變而偶得周公册祝請命之說也孔氏謂二公倡王啓之者非是案秋大熟係于二年之後則成王迎周公之歸蓋二年秋也東山之詩言自我不見于今三年則居東之非東征明矣蓋周公居東二年成王因風雷之變既親迎以歸三叔懷流言之罪遂脅武庚以叛成王命周公征之其東征往反首尾又自三年也二公及王乃問諸史與百執事對曰信噫公命句我勿敢言周公卜武王之疾二公未必不知之周公册祝之文二公蓋不知也諸史百執事蓋卜筮執事之人成王使卜天變者即前日周公使卜武王疾之人也二公及成王得周公自以為功之說因以問之故皆謂信有此事已而嘆息言此實周公之命而我勿敢言爾孔氏謂周公使之勿道者非是纂疏愚謂強分公命為句于勿字竟說不通王執書以泣曰其勿穆卜昔公勤勞王家惟豫沖人弗及知今天動威以彰周公之德惟朕小子其新逆我國家禮亦冝之新當作親成王啓金縢之書欲卜天變既得公册祝之文遂感悟執書以泣言不必更卜昔周公勤勞王室我幼不及知今天動威以眀周公之德我小子其親迎公以歸于國家禮亦宜也案鄭氏詩傳成王既得金縢之書親迎周公鄭氏學出於伏生而此篇則伏生所傳當以親為正親誤作新正猶大學新誤作親也纂疏馬融本新逆作親迎王出郊天乃雨反風禾則盡起二公命邦人凡大木所偃盡起而築之嵗則大熟國外曰郊王出郊者成王自往迎公即上文所謂親逆者也天乃反風感應如此之速洪範庶徵孰謂其不可信哉又案武王疾瘳四年而崩羣叔流言周公居東二年罪人既得成王迎周公以歸凡六年事也編書者附于金縢之末以見請命事之首末金縢書之顯晦也纂疏書中可疑諸篇若一齊不信恐倒了六經如金縢亦有非人情者雨反風禾盡起也是咤異林氏曰公尚欲以身代兄之死況肯奪兄子之位乎此成王所以感悟也出郊公至郊迎之耳孔氏以為郊天誤矣又謂木有偃拔起而立之亦非凡禾為木所仆可起者築之加人力焉築者築禾也愚謂王未知公天為之雷風偃禾既知公天為之反風起禾感應速如影響天不在君心外也林氏曰自公居東而下事迹皆在大誥後然實與公請死之事相終始故併載于此董氏鼎曰帝王之興自有天命必至于極而後見武王崩成王幼天下之重懸于周公公負謗而不遑自安王得詩而尚猶未悟文武之業危如一髮非天其孰警悟而扶持之故天之動威不特以彰周公之德實以表見三監之罪而顯相文武之業也如漢髙困于項籍而大風為之揚沙光武窘于王郎而河氷為之自合庸非天乎大誥武王克殷以殷餘民封受子武庚命三叔監殷武王崩成王立周公相之三叔流言公將不利於孺子周公避位居東後成王悟迎周公歸三叔懼遂與武庚叛成王命周公東征以討之大誥天下書言武庚而不言管叔者為親者諱也篇首有大誥二字編書者因以名篇今文古文皆有案此篇誥語多主卜言如曰寧王遺我大寶龜曰朕卜并吉曰豫得吉卜曰王害不違卜曰寧王惟卜用曰矧亦惟卜用曰豫曷其極卜曰矧今卜并吉至于篇終又曰卜陳惟若茲意邦君御事有曰艱大不可征欲王違卜故周公以討叛卜吉之義與天命人事之不可違者反復誥諭之也纂疏大誥一篇不可曉據周公在當時外則有武庚管蔡之叛內則有成王之疑周室方且岌岌然他作此書決不是悖禮苟且為之必欲以此聳動天下也而今大誥大意不過說周家辛苦做得這基業在此我後人不可不有以成就之而已其後人却專歸在卜上其意思緩而不切殊不可曉也當初紂暴虐天下胥怨無不欲誅之及武王既奉天下之心以誅紂于是天下之怨皆解而歸德于周矣然商之遺民及與紂同事之臣一旦見故主遭戮宗社為墟寧不動心茲固畔心所由生也蓋始于苦紂之暴而欲其亡及紂既死則怨已解而人心復有所不忍亦事勢人情之必然者又況商之流風善政畢竟尚有在人心者頑民感商恩意之深此其所以叛也後來樂毅伐齊亦是如此陳氏大猷曰武王以公義封武庚而不虞其怨以親愛用三叔而不料其反仁人之過也使舍武庚立微子三監雖欲叛而不從舍三叔任他人武庚雖欲反而不敢陳氏經曰使三叔監殷不如舜之封象使吏治其國之意讀泰牧誓而知武王取商之易讀大誥諸篇而知周家安商之難愚案傳避位之說蓋以照應金縢王若曰猷大誥爾多邦越爾御事弗弔天降割于我家不少延洪惟我幼沖人嗣無疆大歷服弗造哲迪民康矧曰其有能格知天命猷發語辭也猶虞書咨嗟之例案爾雅猷訓最多曰謀曰言曰已曰圖未知此何訓也弔恤也猶詩言不弔昊天之弔言我不為天所恤降害于我周家武王遂喪而不少待也沖人成王也歷歷數也服五服也哲眀哲也格格物之格言大思我幼沖之君嗣守無疆之大業弗能造明哲以𨗳民于安康是人事且有所未至而況言其能格知天命乎纂疏王若曰若字只是一似如此說底意思如漢書中帝意若曰之類蓋或宣道德意者敷演其說或記録者失其語而追其意如此書中弗弔只如字解者欲訓弔為至故音的非也其意只如詩中不弔昊天耳林氏曰公雖攝政而成王在上故必稱王命以告猷發語辭若二典之咨夏書之嗟意周時發語辭變而為猷故微子之命多士多方皆言王若曰猷越及也孔氏曰猷道也陳氏經曰如今人誥諭人多先言我說道理與汝也吕氏曰叛者三監武庚何必誥多方蓋天下初定人情未安三監煽禍恐亂之牽引不止此所以大誥諭之人心定則變無由生也真氏曰聖賢舉事必先誥多方者所以昭大公而一衆志非但防亂而已馬融讀不少延為句董氏曰幼謂年少沖童也陳氏大猷曰格知知之至也下文將言用龜紹天命故先謙言已不知天命也王氏安石曰大誥疑有脫誤其不可知者輒闕之而釋其可知者愚案朱子所以取荆公者在此此可為解盤誥諸篇之法已豫惟小子若涉淵水豫惟往求朕攸濟敷賁敷前人受命茲不忘大功豫不敢閉于天降威用已承上語詞已而有不能已之意若涉淵水者喻其心之憂懼求朕攸濟者冀其事之必成敷布賁飾也敷布者修眀其典章法度敷前人受命者增益開大前王之基業若此者所以不忘武王安天下之大功也今武庚不靖天固誅之豫豈敢閉抑天之威用而不行討乎纂疏因論㸃書曰人說荆公穿鑿只是好處也用還他如天降割于我家不少延用寧王遺我大寶龜皆非注家所及葉氏曰禮天子在喪稱豫小子詩閔豫小子是也陳氏大猷曰渡曰涉渡訖曰濟夏氏曰敷布賁飾之事以敷布恢張前人所受之命于此不忘前人之大功也真氏曰天以商有罪降之黜罰非我所敢閉也王者之威聼乎天耳天未降威不敢先文王是也天既降威不敢後武王是也愚謂若涉淵水畏之之深也往求攸濟濟之之道也知懼自强二者並行方能濟難不知畏者忽徒知畏者沮皆非也惟天惟祖宗所以付任我者甚重今日不敢不力不敷賁敷前人是不能繼志述事而忘祖宗之大功也不用兵伐罪而閉天威是不能奉行天討而忘上天之大命也威用為句無意味用字幾為長辭以屬下句方有著落用者用世傳之龜也寧王遺我大寶龜紹天眀即命曰有大艱于西土西土人亦不靜越茲蠢寧王武王也下文又曰寧考蘇氏曰當時謂武王為寧王以其克殷而安天下也蠢動而無知之貌寧王遺我大寶龜者以其可以紹介天眀以定吉凶曩嘗即龜所命而其兆謂將有大艱難之事于西土西土之人亦不安靜是武庚未叛之時而龜之兆蓋已預告矣及此果蠢蠢然而動其卜可驗如此將言下文伐殷卜吉之事故先發此以見卜之不可違也纂疏葉氏曰武王克殷安天下故曰寧王自成王而稱之曰寧考槩言之曰寧人以其在前曰前寧人皆稱武王也吕氏曰用寧王遺我大寶龜此一篇綱領也自始至終皆以卜為言林氏曰天之吉凶示人甚眀然其道幽冥無介紹以傳其意惟卜之以龜則天之眀曉然可見此所以即之而受命也薛氏曰即命與即命于元龜同意蘇氏曰曰有大艱于西土西土人亦不靜此龜所以告也及是三監果動史氏漸曰文武成三世大事三以卜決文王得太公以造周武王伐商朕夢協朕卜以興周成王東征賴朕卜并吉以定周三卜所係如此宜大龜世守以為寶也愚案曰字孔氏以為語更端不若以曰為龜告之辭武庚之亂在東非西土也孔注云四國作大難于京師意其指流言于國歟殷小腆誕敢紀其叙天降威知我國有疵民不康曰豫復反鄙我周邦腆厚誕大叙緒疵病也言武庚以小厚之國乃敢大紀其既亡之緒是雖天降威于殷然亦武庚知我國有三叔疵隙民心不安故敢言我將復殷業而欲反鄙邑我周邦也纂疏吕氏曰反鄙之鄙如子産曰鄭鄙邑也今蠢今翼日民獻有十夫豫翼以于敉寧武圖功我有大事休朕卜并吉于往敉撫武繼也謂今武庚蠢動今之眀日民之賢者十夫輔我以往撫定商邦而繼嗣武王所圖之功也大事戎事左傳云國之大事在祀與戎休美也言知我有戎事休美者以朕卜三龜而并吉也案上文即命曰有大艱于西土蓋卜于武王方崩之時此云朕卜并吉乃卜于將伐武庚之日先儒合以為一誤矣纂疏孔氏曰今天下蠢動今之眀日四國人賢者有十夫來佐我周撫安武事謀立其功言人事先應人謀既從卜又并吉所以為美林氏曰民之賢者有十夫來助豫往征以撫安武王所圖之功則得人心矣朕卜并吉則得天心矣天人俱應則我有必勝之理武庚有必亡之勢如之何不征民獻與黎獻同欒武子以三卿為主亦此從十夫之意曰艱大者雖衆皆不知天者也知天之十獻為主可謂衆矣惜十夫名氏不傳耳楊氏曰惟至誠能通天下之志誠而不疑其類自合時人心危疑惟公身任之而不疑故十夫豫翼此勿疑朋盍簮之謂也愚謂公之東征邦君御事皆疑民獻十夫先至故公表其人以誥天下蓋天之視聽在民而民之去就視賢蓍龜固可以紹天眀賢人尤可以占天意賢人人中之蓍龜也此章言東征必行惟決之賢與卜二者乃一篇大綱領也十夫馬融以為十亂非也十亂周公在中不應自言又有婦人焉亦不得稱十夫敉寧武圖功單以武字稱武王未見其例以武為繼亦恐未然并吉用鄭氏三龜并吉之說似未為穩不過如乃并是吉之并民獻知其吉而卜并吉也釋此一節孔氏為優肆豫告我友邦君越尹氏庶士御事曰豫得吉卜豫惟以爾庶邦于伐殷逋播臣此舉嘗以卜吉之故告邦君御事往伐武庚之辭也肆故也尹氏庶官之正也殷逋播臣者謂武庚及其羣臣本逋亡播遷之臣也爾庶邦君越庶士御事罔不反曰艱大民不靜亦惟在王宫邦君室越豫小子考翼不可征王害不違卜此舉邦君御事不欲征欲王違卜之言也邦君御事無不反曰艱難重大不可輕舉且民不靜雖由武庚然亦在于王之宫邦君之室謂三叔不睦之故實兆釁端不可不自反害曷也越我小子與父老敬事者皆謂不可征王曷不違卜而勿征乎纂疏愚案越豫小子考翼不可征據蔡氏則以小子為邦君等之自稱以考翼為父老所敬事者據諸說則以小子為成王自言接上文說來謂是在王之宫邦君之室及我小子之身當考成其翼敬以自反而已不可征也二說皆未為的當此考翼不可征與下文厥考翼其肯曰兩考翼能一樣說而皆通乃可耳大扺周誥聱牙又多訛缺不可强通姑解其大略而缺此等處可也他倣此肆豫沖人永思艱曰嗚呼允蠢鰥寡哀哉豫造天役遺大投艱于朕身越豫沖人不卭自恤義爾邦君越爾多士尹氏御事綏豫曰無毖于恤不可不成乃寧考圗功造為卬我也故我沖人亦永思其事之艱大歎息言信四國蠢動害及鰥寡深可哀也然我之所為皆天之所役使今日之事天實以其甚大者遺于我之身以其甚艱者投于我之身于我沖人固不暇自恤矣然以義言之于爾邦君于爾多士及官正治事之臣當安我曰無勞于憂誠不可不成武王所圖之功相與戮力致討可也此章深責邦君御事之避事纂疏愚謂以大任責己以大義責臣非不知遺我以大投我以艱而責不得辭也以義言之當如此反觀之則以艱大沮撓者其為不義大矣已豫惟小子不敢替上帝命天休于寧王興我小邦周寧王惟卜用克綏受茲命今天其相民矧亦惟卜用嗚呼天眀畏弼我丕丕基卜伐武庚而吉是上帝命伐之也上帝之命其敢廢乎昔天眷武王由百里而有天下其惟卜用所謂朕夢協朕卜襲于休祥是也今天相佑斯民避凶趨吉況亦惟卜是用是上而先王下而小民莫不用卜而我獨可廢卜乎故又歎息言天之眀命可畏如此是蓋輔成我丕丕基業其可違也天眀即上文所謂紹天眀者纂疏吕氏曰天之眀示威畏乃所以輔成我大業如言天將降大任必先苦其心志威之所以輔之也多難興邦殷憂啓聖此周公自强處即所以畏天命愚案小邦不必言百里此非文王也天眀畏與臯謨同亦與紹天眀不類王曰爾惟舊人爾丕克逺省爾知寧王若勤哉天閟毖我成功所豫不敢不極卒寧王圗事肆豫大化誘我友邦君天棐忱辭其考我民豫曷其不于前寧人圖功攸終天亦惟用勤毖我民若有疾豫曷敢不于前寧人攸受休畢當時邦君御事有武王之舊臣者亦憚征役上文考翼不可征是也故周公專呼舊臣而告之曰爾惟武王之舊人爾大能逺省前日之事爾豈不知武王若此之勤勞哉閟者否閉而不通毖者艱難而不易言天之所以否閉艱難國家多難者乃我成功之所在我不敢不極卒武王所圖之事也化者化其固滯誘者誘其順從輔也寧人武王之大臣當時謂武王為寧王因謂武王之大臣為寧人也民獻十夫以為可伐是天輔以誠信之辭考之民而可見矣我曷其不于前寧人而圗功所終乎勤毖我民若有疾者四國勤毖我民如人有疾必速攻治之我曷其不于前寧人所受休美而畢之乎案此三節謂不可不卒終畢寧王寧人事功休美之意言寧人則舊人之不欲征者亦可愧矣纂疏諸家棐字並作輔字訓更曉不得後讀漢書顔師古注云棐匪通用如書中棐字正合作匪字義忱諶字只訓信天棐忱如云天不可信唐孔氏曰三節文辭略同義不甚異林氏曰武庚之叛是天閟塞之而欲其毖慎蓋將使我操心危慮患深養其德慧術智于疢疾中正我戡定禍亂以成武功之所也天所以輔我以我諄諄化誘皆忱誠之辭非矯僞誣天也考于民而可見民獻豫翼民翼則天棐可見矣許氏月卿曰朱子謂棐匪通天非誠有言辭考之民可見天意欲征武庚非諄諄然命之民心所欲即天意也陳氏大猷曰圖事以所行言圖功以所成言休以受命言反覆諭之耳愚案以寧王寧人為文王固非以前寧人為武王舊臣亦未穩玩文意寧王寧人前寧人皆合指為武王棐忱辭許氏說甚眀順且不背朱子王曰若昔朕其逝朕言艱日思若考作室既底法厥子乃弗肯堂矧肯構厥父菑厥子乃弗肯播矧肯穫厥考翼其肯曰豫有後弗棄基肆豫曷敢不越卬敉寧王大命昔前日也猶孟子昔者之昔若昔我之欲往我亦謂其事之難而日思之矣非輕舉也以作室喻之父既底定廣狹髙下其子不肯為之堂基況肯為之造屋乎以耕田喻之父既反土而菑矣其子乃不肯為之播種況肯俟其成而刈穫之乎考翼父敬事者也為其子者如此則考翼其肯曰我有後嗣弗棄我之基業乎蓋武王定天下立經陳紀如作室之底法如治田之既菑今三監叛亂不能討平以終武王之業則是不肯堂不肯播況望其肯構肯穫而延綿國祚于無窮乎武王在天之靈亦必不肯自謂其有後嗣而不棄墜其基業矣故我何敢不及我身之存以撫存武王之大命乎案此三節申喻不可不終武功之意纂疏蘇氏曰如我昔者本意則已往矣其遲至今者言艱而日思之也若兄考乃有友伐厥子民養其勸弗救民養未詳蘇氏曰養厮養也謂人之臣僕大意言若父兄有友攻伐其子為之臣僕者其可勸其攻伐而不救乎父兄以喻武王友以喻四國子以喻百姓民養以喻邦君御事今王之四國毒害百姓而邦君臣僕乃憚于征役是長其患而不救其可哉此言民被四國之害不可不救援之意纂疏此假王氏張氏林氏皆云當闕疑真氏曰養如養寇之養友謂我所友愛之人以仇人伐吾子尚可言也以友愛伐吾子民其可容養之且勸我弗救乎友指三監本吾所親愛一旦至此孟子所謂涕泣道之者也伐厥子如詩既取我子民謂當時異論者實指邦君御事而託之民也若兄考指武王周公之兄成王之考也友謂管蔡子謂成王兄考之子也管叛周是伐兄考之子也兄考之子為友所伐爾民乃欲養禍而勸以弗救乎王曰嗚呼肆哉爾庶邦君越爾御事爽邦由哲亦惟十人迪知上帝命越天棐忱爾時罔敢易法矧今天降戾于周邦惟大艱人誕鄰胥伐于厥室爾亦不知天命不易肆放也欲其舒放而不畏縮也爽眀也爽厥師之爽桀昏德湯伐之故言爽師受昏德武王伐之故言爽邦言昔武王之眀大命于邦皆由眀智之士亦惟亂臣十人蹈知天命及天輔武王之誠以克商受爾于是時不敢違越武王法制憚于征役矧今武王死天降禍于周首大難之四國大近相攻于其室事危勢迫如此爾乃以為不可征爾亦不知天命之不可違越矣此以今昔互言責邦君御事之不知天命案先儒皆以十人為十夫然十夫民之賢者爾恐未可以為迪知帝命未可以為越天棐忱所謂迪知者蹈行真知之詞也越天棐忱天命已歸之詞也非亂臣佐武王以受天命者不足以當之況君奭之書周公歷舉虢叔閎天之徒亦曰迪知天威于受殷命亦曰若天棐忱詳周公前後所言則十人之為亂臣又何疑哉纂疏陳氏曰肆伐也詩是伐是肆林氏引王莾大誥肆哉顔注肆陳也勸令陳力一說敷陳辭意欲其聼也孔氏曰十人謂民獻十夫愚謂爽眀國事實由哲人爽邦猶言通達國體也十人即十夫所謂爽邦之哲人也亦惟此十人深知帝命及天之匪忱爾于常時尚不敢變易天命討之法矧今天降戻鄰胥伐骨月相仇事勢危迫如此爾乃以為不可征是爾亦不知天命之不可變矣以此解之豈不眀順蔡氏必以十人為十亂費辭辨之自爽邦至棐忱本無武王時之意也十夫十人前後相應周公十亂之一决不應自言之豫永念曰天惟喪殷若穡夫豫曷敢不終朕畝天亦惟休于前寧人天之喪殷若農之去草必絶其根本我何敢不終我之田畝乎我之所以終畝者是天亦惟欲休美于前寧人也豫曷其極卜敢弗于從率寧人有指疆土矧今卜并吉肆朕誕以爾東征天命不僭卜陳惟若茲我何敢盡欲用卜敢不從爾勿征蓋率循寧人之功當有指定先王疆土之理卜而不吉固將伐之況今卜而并吉乎故我犬以爾東征天命斷不僣差卜之所陳蓋如此案此篇專主卜言然其上原天命下述得人往推寧王寧人不可不成之功近指成王邦君御事不可不終之責諄諄乎民生之休戚家國之興喪懇惻切至不能自已而反復終始乎卜之一說以通天下之志以斷天下之疑以定天下之業非聰眀睿知神武而不殺者孰能與于此哉纂疏如周誥諸篇不過說周合代商之意是當時說話其間多有不可解者亦且觀其大意所在而已書亦難㸃如大誥語句甚長今人都碎讀了所以曉不得陳氏曰天喪殷若農夫治田去其稂莠絶其本根勿使有遺種方為終其事武庚叛而不討是不終朕畝也袁氏曰武王創業普天皆王土今當率循武王有指意之疆土使人得以僣竊而不全有其所覆豈寧王之指意乎真氏曰此章以豫永念發端下分三說天命喪殷我不可不終其事一也天降休命于武王凡今日所有疆土皆前人所區畫我可不率其舊如韓文惟天惟祖宗所以付任豫者在此豫曷敢不力二也下言今卜并吉是實天命我所不可違三也豫曷其極卜言不必窮極于卜也卜陳惟若茲言卜亦不能外于此也先以理斷而後以卜參之蓋不特不違卜亦本不專恃于卜也董氏鼎曰商之亡也格人元龜罔敢知吉周之東征也民獻于翼而卜又并吉參人以天證天以人蓋如此余氏芑舒曰寧考寧王寧人前寧人一意篇末休于前寧人寧人有指疆土文意尤眀愚案豫永念曰只當至卜陳惟若茲合為一章我深思言天喪殷若穡夫之除草我曷敢不終朕畝乎天亦惟降休命于武王我亦何待窮極于卜敢不惟天是從以率循武王指畫之疆土乎況今卜又并吉乎意謂東征之舉以天命與先王之責決之本不待卜況今卜又并吉故我大以爾東征天命討罪決不僣差卜之所陳蓋如此此總陳前諸章之意而結之以哲人與元龜知天意之當從前業之當終而決于東征也微子之命微國名子爵也成王既殺武庚封微子於宋以奉湯祀史録其誥命以為此篇今文無古文有纂疏吳氏曰武王克殷封武庚於殷墟封微子於宋樂記武王下車投殷後於宋是也及武庚叛成王殺之始即微子已封之宋建為上公以奉湯祀蓋申命之非至此始封之也凡䇿命諸侯必有初封之辭如乃命諸王邦之蔡此篇初無此等語史世家言周公既承王命誅武庚乃命微子代殷後奉其先祀作微子之命以申之其說為是林氏曰不曰宋公之命而曰微子之命周以賓待之非欲臣之也箕微雖歸周而未嘗臣周陳氏經曰當武庚叛後殷餘民猶思商以微子之賢處疑忌之地而命之之辭如此聖入寬大公平之用心也王氏炎曰紂之後可絶湯之祀不可絶愚謂殺武庚始命微子奉湯祀蓋紂以嫡子立武庚紂子實大宗子微子支子耳武庚在為殷後奉湯祀宗子責也微子不得與也武庚死殷命黜微子始得代之為殷後焉王若曰猷殷王元子惟稽古崇德象賢統承先王修其禮物作賔于王家與國咸休永世無窮元子長子也微子帝乙之長子紂之庶兄也崇德謂先聖王之有德者則尊崇而奉祀之也象賢謂其後嗣子孫有象先聖王之賢者則命之以主祀也言考古制尊崇成湯之德以微子象賢而奉其祀也禮典禮物文物也修其典禮文物不使廢壞以備一王之法也孔子曰夏禮吾能言之杞不足徵也殷禮吾能言之宋不足徴也文獻不足故也殷之典禮微子修之至孔子時已不足徵矣故夫子惜之賓以客禮遇之也振鷺言我客戾止左氏謂宋先代之後天子有事膰焉有喪拜焉者也吕氏曰先王之心公平廣大非若後世滅人之國惟恐苗裔之存為子孫害成王命微子方且撫助愛養欲其與國咸休永世無窮公平廣大氣象於此可見纂疏張氏曰本湯言之曰崇德自微子言之曰象賢王氏炎曰修禮物者自正朔外不用時王制度而用其舊儀吕氏曰象非正訓似曰象者欲其盛德之象形容長存而不泯也先王封先代之後欲存先代典禮者蓋以損益之理若循環然先代禮物不修後聖有作扶衰救弊何所稽乎孔子歎文獻不足與商頌僅得十二之五皆後世不能修禮物故也愚謂稽古崇德象賢一句為一篇之綱領自崇德象賢至作賔王家皆承稽古二字崇德象賢固稽古典為之修禮物作賔亦稽古典也如立堯後以作虞賔立夏後以修夏禮皆古人所已行稽古以下四句所以考之于既往與國永世二句所以期之于方來又象賢之賢獻也禮物文也文非獻不能修宋初所以能修禮物以有微子之賢也孔子時宋不足徵文之不足猶獻之不足也繼之者不能賢如微子故也故尤以象賢為重前日失之于武庚今日得之于微子所以下文深取其踐修厥猷恪慎孝恭有此賢德上可象湯德以繼前聖下可修禮物以俟後聖焉嗚呼乃祖成湯克齊聖廣淵皇天眷佑誕受厥命撫民以寬除其邪虐功加于時德垂後裔齊肅也齊則無不敬聖則無不通廣言其大淵言其深也誕大也皇天眷佑誕受厥命即伊尹所謂天監厥德用集大命者撫民以寬除其邪虐即伊尹所謂代虐以寬兆民允懷者功加于時言其所及者衆德垂後裔言其所傳者逺也後裔即微子也此崇德之意纂疏吕氏曰齊聖廣淵不可分當于此識湯德之全體愚謂齊誠一也齊如中庸惟天下至誠聖即惟天下至聖廣淵即溥博淵泉也湯之寬非縱弛之寬乃自齊聖廣淵聖德中流出總言之皆垂後裔之德之源也功加于時功即德之效德垂後裔德即功之本互言之耳湯之功德傳祀六百開闢以來莫加焉而可使之不祀乎此所以生下文意爾惟踐修厥猷舊有令聞恪慎克孝肅恭神人豫嘉乃德曰篤不忘上帝時歆下民祗協庸建爾于上公尹茲東夏猷道令善聞譽也微子踐履修舉成湯之道舊有善譽非一日也恪敬也恪謹克孝肅恭神人指微子實德而言抱祭器歸周亦其一也篤厚也我善汝德曰厚而不忘也歆饗庸用也王者之後稱公故曰上公尹治也宋亳在東故曰東夏此象賢之意纂疏唐孔氏曰左氏王命管仲曰謂篤不忘即曰篤不忘意王氏曰宋商後得郊天故曰上帝時歆記曰宋之郊也契也葉氏曰周制三公出封作伯九命謂之上公陳氏經曰鎬在西故以宋為東夏欽哉往敷乃訓慎乃服命率由典常以蕃王室𢎞乃烈祖律乃有民永綏厥位毗豫一人世世享德萬邦作式俾我有周無斁此因戒勉之也服命上公服命也宋王者之後成湯之廟當有天子禮樂慮有僣擬之失故曰謹其服命率由典常以戒之也𢎞大律範毗輔式法斁厭也即詩言在此無斁之意林氏曰逼生于僣僣生于疑非疑無僣非僣無逼謹其服命遵守典常安有逼僣之過哉魯實侯爵乃以天子禮樂祀周公亦既不謹矣其後遂用于羣公之廟甚至季氏僣八佾三家僣雍徹其源一開末流無所不至成王于宋謹慎如此必無賜周公以天子禮樂之事豈周室既衰魯竊僣用託為成王之賜伯禽之受乎纂疏孔氏曰謹汝祖服命數陳氏大猷曰服猶被服之服命即所告之命武庚以畔黜復命微子常情于此孰不暴白其罪眀黜殷之由今無一言及武庚事以傷微子之心蓋誥命賢者體當如此蘇氏曰武庚叛餘以新造之周侯前代未盡亡之賢子則微子蓋處可疑之地禁戒之辭隄防之具冝悉也乃命之曰上帝時歆曰𢎞乃烈祖曰萬邦作式此三代之事後世胡可及也吕氏曰殺武庚義也封微子仁也真氏曰武庚之罪當行天討微子之德當加天命非有一毫喜怒之心于此可見聖人之心矣愚謂慎乃服命不過如康誥之享明乃服命謂所服受之命令耳自二孔以上公服命無乖禮制為說而林氏祖述發揮之意深論竒然非此章本然之文意也必於此以為防其僣擬則于康誥復何以訓之乎此既言之勿替朕命又申言結之實皆指此篇誥命耳嗚呼往哉惟休無替朕命歎息言汝往之國當休美其政而無廢棄我所命汝之言也康誥康叔文王之子武王之弟武王誥命為衛侯今文古文皆有案書序以康誥為成王之書今詳本篇康叔于成王為叔父成王不應以弟稱之說者謂周公以成王命誥故曰弟然既謂之王若曰則為成王之言周公何遽自以弟稱之也且康誥酒誥梓材三篇言文王者非一而略無一語以及武王何邪說者又謂寡兄朂為稱武王尢為非義寡兄云者自謙之辭寡德之稱苟語他人猶之可也武王康叔之兄家人相語周公安得以武王為寡兄而告其弟乎或又謂康叔在武王時尚幼故不得封然康叔武王同母弟武王分封之時年已九十安有九十之兄同母弟尚幼不可封乎且康叔文王之子叔虞成王之弟周公東征叔虞已封于唐豈有康叔得封反在叔虞之後必無是理也又案汲冢周書克殷篇言王即位於社南羣臣畢從毛叔鄭奉眀水衛叔封傳禮召公奭贊采師尚父牽牲史記亦言衛康叔封布茲與汲書大同小異康叔在武王時非幼亦眀矣特序書者不知康誥篇首四十八字為洛誥脫簡遂因誤為成王之書是知書序果非孔子所作也康誥酒誥梓材篇次當在金縢之前纂疏胡氏於皇王大紀考究得康誥非周公成王時乃武王時寡兄如今人稱劣兄梓材一篇又不知何處得來此與他人言皆不領嘗與陳同父言陳曰每嘗讀亦不覺今思之誠然真氏讀書記載康誥首注云此篇胡氏以為武王之書朱子從之而蔡氏所辨尤力今姑從先儒之說以為周公書更當博考愚案朱子之說五峯唱之九峯和之聖人復起不易斯言矣真氏因仍阿合之說非事理之實不謂西山而有此也孔氏曰康圻內國名叔封字林氏曰康乃叔未受封時食采之地或曰康諡也鄭氏曰康叔初封衛至子孫而并弼鄘地惟三月哉生魄周公初基作新大邑于東國洛四方民大和㑹侯甸男邦采衛百工播民和見士于周周公咸勤乃洪大誥治三月周公攝政七年之三月也始生魄十六日也百工百官也士說文曰事也詩曰勿士行枚吕氏曰斧斤版築之事亦甚勞矣而民大和㑹悉來赴役即文王作靈臺庶民子來之意蘇氏曰此洛誥之文當在周公拜手稽首之上纂疏唐孔氏曰五服男居其中舉氏中則五服皆有邦可知林曰周九服㑹洛邑者惟內五服蠻夷鎮藩不與葉氏曰列國大夫入天子之國皆曰士春秋傳曰晉士起是也潘氏曰勤猶杕杜以勤歸之勤洪大也經言復者多王氏安石於此章無解愚謂初基定基址也鎬在西故曰東國洛見士朝而趨事也大和㑹人心本自和播民和因人心之和而敷宣其和也悅以使民民忘其勞也以召誥考之周公以三月十二日乙卯至洛先觀召公營洛規模十四日丁巳行郊禮十五日戊午行社禮十六日乙未初基作洛繼此五日內號召齊集計度區畫分配科派至二十一日甲子朝乃用書命庶殷諸侯丕作召誥所謂用書命丕作即此所謂洪大誥治也左氏昭二十二年晉士彌牟營成周計丈數云云以令役于諸侯用書誥治意亦類此參以召誥日月吻合洛誥冠以此九句方有頭緒强附于此全不相應其為洛誥脫簡章章明甚諸家阿附牽强解之今不取王若曰孟侯朕其弟小子封王武王也孟長也言為諸侯之長也封康叔名舊說周公以成王命誥康叔者非是纂疏吳氏曰先儒謂康叔受封時尚幼者以稱小子故武王周公康叔皆太姒之子安得尚幼今陜右之俗凡尊貴命卑賤雖長老者亦呼以小子表見相親愛也惟乃丕顯考文王克眀德慎罰左氏曰眀德謹罰文王所以造周也明德務崇之之謂謹罰務去之之謂眀德謹罰一篇之綱領不敢侮鰥寡以下文王眀德謹罰也汝念哉以下欲康叔眀德也敬眀乃罰以下欲康叔謹罰也爽惟民以下欲其以德行罰也封敬哉以下欲其不用罰而用德也終則以天命殷民結之纂疏林氏曰此篇多及刑罰者案左傳武王之母弟八人康叔為司寇則康叔以衛侯入繼蘇忿生為之故并告以詰姦刑暴事其曰外事外正以外言者治殷民于衛也以衛為外則王朝司寇內事也故于刑罰為詳陳氏大猷曰治不過德刑兩端德者人所同慕感化人心之本也文王則克眀之使民慕而入于德罰者人所同畏防範人心之具也文王則克謹之使民畏而不入于罰不敢侮鰥寡庸庸祗祗威威顯民用肇造我區夏越我一二邦以修我西土惟時怙冒聞于上帝帝休天乃大命文王殪戎殷誕受厥命越厥邦厥民惟時叙乃寡兄朂肆汝小子封在茲東土鰥寡人所易忽也于人易忽者而不忽焉以見聖人無所不敬畏也即堯不虐無告之意論文王之德而首發此非聖人不能也庸用也用其所當用敬其所當敬威其所當威言文王用能敬賢討罪一聼于理而已無與焉故德著于民用始造我區夏及我一二友邦漸以修治至罄西土之人怙之如父冒之如天眀德昭升聞于上帝帝用休美乃大命文王殪滅大殷大受其命萬邦萬民各得其理莫不時叙汝寡德之兄亦勉力不怠故爾小子封得以在此東土也吳氏曰殪戎殷武王之事也此稱文王者武王不敢以為己之功也又案東土云者武王克商分紂城朝歌以北為弼南為鄘東為衛意弼鄘為武庚之封而衛即康叔也漢書言周公善康叔不從管蔡之亂似地相比近之辭然不可考矣纂疏庸庸至顯民此等語既不可曉只得且用古注古注既用杜撰如今更别求說又杜撰不如他矣陳氏大猷曰不敢侮鰥寡仁民也庸庸使能祗祗尊賢也眀德之事威威懲惡也慎罰之事是是非非使民曉然知所好惡所以顯民也恐康叔以受封為當然故歷言文王之積纍汝兄之勉勵故汝得有此土庶其念所自之艱難而不敢忽也愚謂或訓戎為兵為寇皆未當詩念茲戎功戎大也諸家泥周公命康叔之說者謂公呼武王為寡有之兄言其德不羣也曲辭巧說豈事理各稱之實乎惟是武王自言故稱文王詳而自謂甚略只以一朂字見其自勉若周公之言豈論武王如此簡略乎且朂字惟自謙乃可言耳王曰嗚呼封汝念哉今民將在祗遹乃文考紹聞衣德言往敷求于殷先哲王用保乂民汝丕逺惟商耇成人宅心知訓别求聞由古先哲王用康保民𢎞于天若德裕乃身不廢在王命此下眀德也遹述衣服也今治民將在敬述文考之事繼其所聞而服行文王之德言也往之國也宅心處心也安汝止之意知訓知所以訓民也由行也曰保乂曰知訓曰康保經緯以成文爾武王既欲康叔祗遹文考又欲敷求商先哲王又丕逺惟商耇成人又别聞由古先哲王近述諸今逺稽諸古不一而足以見義理之無盡易曰君子多識前言往行以畜其德𢎞者廓而大之也天者理之所從出也康叔博學以聚之集義以生之真積力久衆理該通此心之天理之所從出者始恢廓而有餘用矣若是則心廣體胖動無違禮斯能不廢在王之命也吕氏曰康叔歷求聖賢問學至于𢎞于天德裕身可謂盛矣止能不廢王命才可免過而已此見人臣職分之難盡若欲為子必須如舜與曾閔方能不廢父命若欲為臣必須如舜與周公方能不廢君命纂疏林氏曰雖求老成法往古又當𢎞于天召誥則無遺壽耇其稽我古人之德又能稽謀自天即此意王曰嗚呼小子封恫瘝乃身敬哉天畏棐忱民情大可見小人難保往盡乃心無康好逸豫乃其乂民我聞曰怨不在大亦不在小惠不惠懋不懋恫痛瘝病也視民之不安如疾痛之在乃身不可不敬之也天命不常雖甚可畏然誠則輔之民情好惡雖大可見而小民至為難保汝往之國所以治之者非他惟盡汝心無自安而好逸豫乃其所以治民也古人言怨不在大亦不在小惟在順不順勉不勉耳順者順于理勉者勉于行即上文所謂往盡乃心無康好逸豫者也纂疏天畏棐忱猶曰天難諶問惠不惠懋不懋曰順其所不當順勉其所不當勉一說當順者不順當勉者不勉夏氏曰民之休戚汝之休戚也故曰恫瘝乃身敬哉下文即當敬之事吕氏曰侯爾非富貴之乃委痛病于汝身耳上則天難忱下則民難保非恫瘝乃身乎孔氏曰怨不在大起于小不在小小至于大當使不順者順不勉者勉林氏曰當順而不順當勉而不勉皆足以致怨必順于人而勉于己怨庶可弭吳氏曰惠鮮鰥寡惠所不惠也克勤小物懋所不懋也如是則可無怨張氏曰惠所不必惠無所不惠矣懋所不必懋無所不懋矣已汝惟小子乃服惟𢎞王應保殷民亦惟助王宅天命作新民服事應和也汝之事惟在廣上德意和保殷民使之不失其所以助王安定天命而作新斯民也此言眀德之終也大學言眀德亦舉新民終之纂疏鼓之舞之之謂作言振起其自新之民也鼓之舞之如擊鼓然自然使人跳舞踴躍然民所以感動由其本有此理上之人提撕警發之則下民觀聸感化各自有以興起其同然之善心而不能自已耳林氏曰應保者因人情而安之謂應其所欲也如人情莫不欲夀則生之而不傷人情莫不欲富則厚之而不困人情莫不欲安則扶之而不危所欲與聚所惡勿施皆所以應而保之陳氏大猷曰殷民者天命所視以去留人心所視以觀化保殷民所以助王宅天命而作新民也愚案此欲康叔法文王之眀德而極於新民也大學傳引康誥曰克眀德即截上文克眀德慎罰一句上三字引作新民即此章此一句也大學三綱領之二其源實出于康誥二帝夏商以來言眀德者有矣未有言新民者言克眀德作新民體用相對首見于康誥而大學祖述之謂康誥非大學之宗祖可乎釋應保之應為和未穩王曰嗚呼封敬眀乃罰人有小罪非眚乃惟終自作不典式爾有厥罪小乃不可不殺乃有大罪非終乃惟眚災適爾既道極厥辜時乃不可殺此下謹罰也式用適偶也人有小罪非過誤乃其固為亂常之事用意如此其罪雖小乃不可不殺即舜典所謂刑故無小也人有大罪非是故犯乃其過誤出于不幸偶爾如此既自稱道盡輸其情不敢隱匿罪雖大時乃不可殺即舜典所謂宥過無大也諸葛孔眀治蜀服罪輸情者雖重必釋其既道極厥辜時乃不可殺之意歟纂疏愚謂小罪不可不殺小罪怙終刑之可也殺之無乃過乎蓋敗常越禮其罪難小其情乃亂之原不殺則為害將甚大正以不典者敗倫紀亂綱常之事也宜於不典二字味之王曰嗚呼封有叙時乃大眀服惟民其勑懋和若有疾惟民其畢棄咎若保赤子惟民其康乂有叙者刑罰有次序也眀者眀其罰服者服其明也左氏曰乃大眀服已則不眀而殺人以逞不亦難乎勑戒勑也民其戒勑而勉于和順也若有疾者以去􅔂之心去惡也故民皆棄咎若保赤子者以保子之心保善也故民其安治纂疏張氏曰刑罰足以制人之形不足以服人之心必不紊刑之倫序時乃大眀刑罰而足以服其心宜民勑懋而且和也林氏曰若有疾若保赤子皆出于中心之誠然蓋人有疾欲去之有赤子欲保之此豈可以僞為舉斯心以加諸彼則無往非仁矣陳氏大猷曰去民之惡如去己疾則調治無不至必盡棄其咎矣保民如保己之赤子則愛護無不至民必康且乂矣先言有疾後言赤子蓋民棄咎然後可康乂也愚謂三言惟民其必加以後之二譬使民棄咎康乂而後可全其勑懋和也非汝封刑人殺人無或刑人殺人非汝封又曰劓刵人無或劓刵人刑殺者天之所以討有罪非汝封得以刑之殺之也汝無或以已而刑殺之刵截耳也刑殺刑之大者劓刵刑之小者兼舉小大以申戒之也又曰當在無或刑人殺人之下又案刵周官五刑所無吕刑以為苗民所制纂疏康叔為周司寇故一篇多說用刑須改其句非汝封刑人殺人則無或敢有刑人殺人者又曰非汝封劓刵人則無或敢有劓刵人者言用刑之權正在康叔不可不謹之意蘇氏破句讀之誤矣蘇氏以無或刑人殺人非汝封為句王曰外事汝陳時臬司師茲殷罰有倫外事未詳陳氏曰外事有司之事也臬法也為準限之意言汝于外事但陳列是法使有司師此殷罰之有倫者用之爾吕氏曰外事衛國事也史記言康叔為周司寇司寇王朝之官職任內事故以衛國對言為外事今案篇中言往敷求往盡乃心篇終曰往哉封皆令其之國之辭而未見其留王朝之意但詳此篇康叔蓋深于法者異時成王或舉以司寇之職而此則未必然也纂疏陳氏大猷曰上章蓋言用刑此專言衛國之刑故以外事别之猶下文言外庶子外正也臬門梱也有限準之義故以訓法猶謂法為律也汝陳列是掌臬法之有司當師此殷罰之有倫序者衛居殷墟殷法乃殷民所安也愚案左氏定四年曰武王之母弟八人周公為太宰康叔為司寇則康叔以諸侯入為王卿眀矣為司寇與即衛封兩不相妨往來朝廷邦國之間何往不可況衛事自有衛之有司如外庶子外正者付之陳列之法司身為司寇甚便吕陳內事外事之說甚當蔡氏疑之乃添異時成王或舉以任司寇一句今正闢成王封康叔之說乃自為反覆何也封以殷墟姑用殷罰乃與新國之民相安正是武王初得天下初分封時事若是後來天下已定法制通行何以師用殷罰為哉味師殷罰有倫句愈見得此為武王命康叔之辭司字屬下句未順又曰要囚服念五六日至于旬時丕蔽要囚要囚獄辭之要者也服念服膺而念之旬十日時三月為囚求生道也蔽斷也纂疏唐孔氏曰要囚取要辭于囚陳氏大猷曰要者結罪之辭與周禮卿士異其死刑之罪而要之之要同要囚謂結定其囚之罪也蔽要囚斷其所結定之囚猶今世引斷也今世大辟囚已結罪後猶有審覆經年者蘇氏曰服念為囚求生道也求之句時而終無生道乃可殺林氏曰唐太宗謂羣臣曰死者不可復生決囚得雖三覆奏頃刻之間何暇思慮自今宜五日一覆奏正康誥之意愚案歐陽公瀧岡墓表載其父崇公任獄官每為囚求生道嘗曰為之求生道而不得夫然後我與死者可以俱無憾矣正合此意王曰汝陳時臬事罰蔽殷彛用其義刑義殺勿庸以次汝封乃汝盡遜曰時叙惟曰未有遜事義宜也次次舍之次遜順也申言敷陳是法與事罰斷以殷之常法矣又慮其泥古而不通又謂其刑其殺必察其宜于時者而後用之既又慮其趨時而狥已又謂刑殺不可以就汝封之意既又慮其刑殺雖已當罪而矜喜之心乘之又謂使汝刑殺盡順于義雖曰是有次叙汝當惟謂未有順義之事蓋矜喜之心生乃怠惰之心起刑殺之所由以不中也可不戒哉纂疏陳氏大猷曰罰獨言則兼刑殺殷罰有倫是也與刑殺對言則罰輕刑重殺尤重也夏氏曰不可使法司觀望于汝遂屈法以就汝意愚謂雖盡遜而惟曰未遜心常不自足則虛眀公正之體不失而審慎矜恤之念常存刑罰之不中者鮮矣即吕刑所謂雖休勿休曽子所謂如得其情則哀矜而勿喜也已汝惟小子未其有若汝封之心朕心朕德惟乃知己者語辭之不能已也小子幼小之稱言年雖少而心獨善也爾心之善固朕知之朕心朕德亦惟爾知之將言用罰之事故先發其良心焉凡民自得罪寇攘姦宄殺越人于貨暋不畏死罔弗憝越顛越也盤庚云顛越不恭暋强憝惡也自得罪非為人誘陷以得罪也凡民自犯罪為盜賊姦宄殺人顛越人以取財貨强狠亡命者人無不憎惡之也用罰而加是人則人無不服以其出乎人之同惡而非即乎吾之私心也特舉此以眀用罰之當罪纂疏陳氏大猷曰此一節上下疑有缺文愚案此假實與上文不貫缺之是王曰封元惡大憝矧惟不孝不友子弗祗服厥父事大傷厥考心于父不能字厥子乃疾厥子于弟弗念天顯乃弗克恭厥兄兄亦不念鞠子哀大不友于弟惟弔茲不于我政人得罪天惟與我民彛大泯亂曰乃其速由文王作罰刑茲無赦大憝即上文之罔弗憝言寇攘姦宄固為大惡而大可惡矣况不孝不友之人而尤為可惡者當商之季禮義不眀人紀廢壞子不敬事其父大傷父心父不能愛子而乃疾惡其子是父子相夷也天顯猶孝經所謂天眀尊卑顯然之序也弟不念尊卑之序而不能敬其兄兄亦不念父母鞠養之勞而大不友其弟是兄弟相賊也父子兄弟至于如此苟不于我為政之人而得罪焉則天之與我民彛必大泯滅而紊亂矣曰者言如此則汝其速由文王作罰刑此無赦而懲戒之不可緩也纂疏蔡氏元度曰先責子之不孝然後及父之不慈先責弟之不恭然後及兄之不友周禮有不孝不弟之刑而無不慈不友之罪即此意也林氏曰弔讀如弔閔之弔閔其悖人倫也吕氏曰前言殷罰殷彛文此言文王作罰蓋殷罰常行用之父子兄弟之獄則用王之法經紂之惡人倫戕敗文武維持綱常而作罰刑如地官不孝不弟之刑之類故以殷罰治殷俗因人情之所安也以文王罰刑誅不孝不友撥殷亂之所在也愚謂前已告康叔眀德以作新民矣此言慎罰而速懲不孝友者蓋已致新民之化不率而後方嚴齊民之刑也此章孔注甚眀蔡傳從之不率大戞矧惟外庶子訓人惟厥正人越小臣諸節乃别播敷造民大譽弗念弗庸瘝厥君時乃引惡惟朕憝已汝乃其速由茲義率殺戞法也言民之不率教者固可大置之法矣況外庶子以訓人為職與庶官之長及小臣之有符莭者乃别布條教違道干譽弗念其君弗用其法以病君上是乃長惡于下我之所深惡也臣之不忠如此刑其可已乎汝其速由此義而率以誅戮之可也案上言民不孝不友則速由文王作罰刑茲無赦此言外庶子正人小臣背上立私則速由茲義率殺其曰刑曰殺若用法峻急者蓋殷之臣民化紂之惡父子兄弟之無其親君臣上下之無其義非繩之以法示之以威殷民孰知不孝不義之不可于哉周禮所謂刑亂國用重典者是也然曰速由文王曰速由茲義則其刑其罰亦仁厚而已矣纂疏孔氏曰戞常也民不率大常之教猶刑之無赦吕氏曰然叔不以身率之則亦大戞戞乎其難哉真氏曰吕說似得之與下假相應蓋戞者二物相擊之謂或曰戞擊也承上文如此而猶不率從乃大戞擊以痛懲也上文寇攘殺越乃不待教而誅者此則教之不改而後誅之者也愚案不率大戞或以屬上文或以屬下文不勝異說孔訓戞為常固非訓為法亦未見所本後一說庶幾焉然此句合缺之林氏曰況汝衛國之臣如庶子者與衆官之長及諸小臣皆當分别善惡以播敷教化而造成斯民善譽始無曠職苟不念此不用此以病其君是乃長于為惡朕亦將惡之矣率殺案法殺之也王氏日休曰前言由文王罰刑此言由茲義率殺其即文王之義刑義殺乎亦惟君惟長不能厥家人越厥小臣外正惟威惟虐大放王命乃非德用乂君長指康叔而言也康叔而不能齊其家不能訓其臣惟威惟虐大廢棄天子之命乃欲以非德用治是康叔且不能用上命矣亦何以責其臣之瘝厥君也哉纂疏林氏曰不能厥家人越厥云云如左傳不能其大夫至于君祖母以及國人也汝亦罔不克敬典乃由裕民惟文王之敬忌乃裕民曰我惟有及則豫一人以懌汝罔不能敬守國之常法由是而求裕民之道惟文王之敬忌敬則有所不忽忌則有所不敢期裕其民曰我惟有及于文王則豫一人以悅懌矣此言謹罰之終也穆王訓刑亦曰敬忌云纂疏林氏曰典者天叙之典即父子兄弟之常道敬典敬敷五教也裕民即在寬也愚謂前言速由文王罰刑速由茲義率殺兩言速由何其急速也此言乃由裕民乃裕民兩言乃裕又何其寬緩也始欲其以刑齊民以懲戒人之惡習終欲其以身率人以容養人之善心其急其緩並行而不相悖也陳氏大猷曰此上三節疑有錯簡王曰封爽惟民迪吉康我時其惟殷先哲王德用康乂民作求矧今民罔迪不適不迪則罔政在厥邦此下欲其以德用罰也求等也詩曰世德作求言眀思夫民當開導之以吉康我亦時其惟殷先哲王之德用以安治其民為等匹于商先王也迪即迪吉康之迪況今民無導之而不從者苟不有以導之則為無政于國矣迪言德而政言刑也前既嚴之民又嚴之臣又嚴之康叔此則武王之自嚴畏也纂疏林氏曰我今其惟殷先哲王之德可用以康乂民者作起而求之求如敏以求之之求真氏曰欲導民于吉康其何以哉惟于殷先哲王之德用以康乂民者作而求之而已殷先王之所為無非導民吉康之道導以仁義而民趨于仁義導以孝弟而民趨于孝弟此所謂迪吉康也政所以正民不能導民俾知所適尚何政之有古之政合教化而言後之政離教化而言愚案作求真廣林說為優王曰封豫惟不可不監告汝德之說于罰之行今惟民不靜未戾厥心迪屢未同爽惟天其罰殛我我其不怨惟厥罪無在大亦無在多矧曰其尚顯聞于天戻止也又言民不安靜未能止其心之狠戾迪之者雖屢而未能使之上同乎治明思天其殛罰我我何敢怨乎惟民之罪不在大亦不在多苟為有罪即在朕躬況曰今庶羣腥穢之德其尚顯聞于天乎纂疏愚謂此章之意謂我惟不可不監視古義即指文王明德慎罰之義告汝以德之說于罰之行之時蓋欲以德行罰也今惟民不安靜未定其心迪之雖屢而猶未協同民之未靜未同天將不罪民而罪導民者故爽眀惟天其將罰殛我矣我其不當怨也惟其罪不在大與多一亳不盡且為有罪況曰其已上顯聞于天而欲逭天之罰殛可乎爽惟與爽惟民疑當時語此王責已以勵康叔也要之此篇語言多不可强解而解者缺眀反益甚之王曰嗚呼封敬哉無作怨勿用非謀非彛蔽時忱丕則敏德用康乃心顧乃德逺乃猷裕乃以民寧不汝瑕殄此欲其不用罰而用德也歎息言汝敬哉毋作可怨之事毋用非善之謀非常之法惟斷以是誠大法古人之敏德用以安汝之心省汝之德逺汝之謀寬裕不迫以待民之自安若是則不汝瑕疵而棄絶矣纂疏陳氏經曰用非謀非常皆致怨之道也蔽如一言以蔽之蔽惟斷以至誠則不惑于非謀非彛矣陳氏大猷曰大法古人之敏德如法文王之眀德作求殷先哲王德是也慮其悠悠故以敏德言又恐其欲速故以安汝心言安則恐其警省不至故又以回顧汝德言顧又恐其察慮太迫故又以宏逺汝謀寬裕安民言民必不瑕絶汝矣真氏曰為善未至于優裕皆勉强也與前德裕乃身之裕同至此則不言用罰而純言用德矣王曰嗚呼肆汝小子封惟命不于常汝念哉無我殄享明乃服命髙乃聽用康乂民肆未詳惟命不于常善則得之不善則失之汝其念哉毋我殄絶所享之國也明汝侯國服命髙其聼不可卑忽我言用安治爾民也纂疏爾雅肆今也董氏曰肆語辭如肆徂肆往皆語辭也陳氏大猷曰無使我所與爾之爵土殄絶而不能享也服命即所服受之誥命髙乃聼猶曰尊所聞蘇氏曰告以文考先哲王所聼豈為不髙王若曰往哉封勿替敬典聽朕告汝乃以殷民世享勿廢其所敬之常法聼我所命而服行之乃能以殷民而世享其國也世享對上文殄享而言纂疏李氏杞曰康誥一篇始終以敬哉敬典為言致敬之道乃修身治民之本康叔所以化商民之綱要莫大于此愚謂商民不孝不友化之之本在于敬五典耳勿替所當敬之典即前所謂罔不克敬典篇終復申言之大學引惟命不于常而斷之曰道善則得之不善則失之矣弗念弗克則殄享不善而失之也敬典聼告則世享善而得之也武王封康叔拳拳反覆於文王眀德慎罰之家法無慮數百言末復以天命之無常享國之難必者警戒之康叔乃能敬聼而力行焉衛之享國卒與周家相為長久吁豈偶然哉酒誥商受酗酒天下化之妹土商之都邑其染惡尤甚武王以其地封康叔故作書誥教之云今文古文皆有按吳氏曰酒誥一書本是兩書以其皆為酒而誥故誤合而為一自王若曰明大命于妹邦以下武王告受故都之書也自王曰封我西土棐徂邦君以下武王告康叔之書也書之體為一人而作則首稱其人為衆人而作則首稱其衆為一方而作則首稱一方為天下而作則首稱天下君奭書首稱君奭君陳書首稱君陳為一人而作也甘誓首稱六事之人湯誓首稱格汝衆此為衆人而作也湯誥首稱萬方有衆大誥首稱大誥多邦此為天下而作也多方書為四國而作則首稱四國多士書為多士而作則首稱多士乃今酒誥為妹邦而作故首言眀大命于妹邦其自為一書無疑案吳氏分篇引證固為眀甚但既謂專誥毖妹邦不應有乃穆考文王之語意酒誥專為妹邦而作而妹邦在康叔封圻之內則眀大命之責康叔實任之故篇首專以妹邦為稱至中篇始名康叔以致誥其曰尚克用文王教者亦申言首章文王誥毖之意其事則主于妹邦其書則付之康叔雖若二篇而實為一書雖若二事而實相首尾反復參究蓋自為書之一體也纂疏問揚子雲言酒誥之篇俄空焉曰孔書以巫蠱事不曽傳漢儒不曾見者多如鄭康成晉杜預皆然想得揚子雲亦不曾見林氏曰紂以酒亡國餘習猶存酒誥所以作也愚謂此篇初以酗酒戒妹土之人不專為康叔言但責之康叔使眀戒酒之命于國人後方名呼康叔以丁寧之末云矧汝剛制于酒則專戒康叔之身欲康叔以身率國人也王若曰眀大命于妹邦妹邦即詩所謂沫鄉篇首稱妹邦者誥命專為妹邦發也纂疏孔氏曰妹地紂所都朝歌以北是薛氏曰妹古沫字沫水名因水名地愚謂大命即下文是乃穆考文王肇國在西土厥誥毖庶邦庶士越少正御事朝夕曰祀茲酒惟天降命肇我民惟元祀穆敬也詩曰穆穆文王是也上篇言文王眀德則曰顯考此篇言文王告毖則曰穆考言各有當也或曰文王世次為穆亦通毖戒謹也少正官之副二也文王朝夕敕戒之曰惟祭祀則用此酒天始令民作酒者為大祭祀而已西土庶邦逺去商邑文王誥毖亦諄諄以酒為戒則商邑可知矣文王為西伯故得告毖庶邦云纂疏唐孔氏曰世本云儀狄造酒又云杜康本人以意為之今言天降命蓋人為亦天所使也林氏曰非大祀而用酒則非天所以降命之本意矣愚謂昭穆之穆與左傳合此不易之論以穆考為穆穆之考則詩稱武王曰率見昭考昭字將何以訓之邪傳首四十字可刪天降威我民用大亂喪德亦罔非酒惟行越小大邦用喪亦罔非酒惟辜酒之禍人也而以為天降威者禍亂之成是亦天爾箕子言受酗酒亦曰天毒降災正此意也民之喪德君之喪邦皆由于酒喪德故言行喪邦故言辜纂疏朱子謂南軒張氏酒誥解天降命降威處誠千百年儒者所不及其說曰酒之為物本以奉祭祀供賔客此即天之降命也而人以酒之故至于喪身失德即天之降威也釋氏本惡天之降威者乃併與天之降命者去之吾儒則不然去其降威者而已降威者去而降命者自在如飲食而至于暴殄天物釋氏惡之必欲茹蔬果吾儒則不至于暴殄而已衣物至于窮極奢侈釋氏惡之必欲衣壞包之衣吾儒則去其奢侈而已至於惡淫慝而絶夫婦吾儒則去淫慝而已釋氏本惡人欲并與天理之公者去之吾儒去人欲所謂天理昭然矣譬之水焉釋氏惡泥沙之濁而窒以土不知土之既窒則無水可飲吾儒不然澄其泥沙而水之清者可酌此儒釋之分也葉紹翁四朝聞見録吕氏曰天降命所以使民置酒者以祭祀無酒無以薦馨香非以資人之酣飲也後人失其本意乃以酒得禍而亦曰天降者天理不在人心外民為酒所困即天之降威也林氏曰酒人所為人以酒喪德喪邦皆自作孽而以為天降威蓋古人于事之成敗未嘗不歸之天天雖髙髙在上人之起居動靜未有不與之俱者則人之所為孰非天之所為哉陳氏曰朝夕曰之下文王誥毖庶邦庶士之辭史氏漸曰衛人服酒誥之訓何其能世守于無窮也始也商俗淫湎武王以酒誥戒之逮幽王時上下沈湎衛武公作賔之初筵以自戒見衛人非特一時聞訓不敢自越于禁防又能以此禁防傳為子孫法焉愚謂天降命與天降威相對設酒初意本為祭祀乃天之降命也酒之流生禍亦天之降威也酒一而已用以祀者此酒也喪德喪邦者亦此酒也天理人欲同行異情人之于酒能于祭祀而知其本于降命之天又能于燕飲而凛然知降威之天則天理行而人欲窒方無酒禍矣文王誥教小子有正有事無彛酒越庶國飲惟祀德將無醉小子少子之稱以其血氣未定尤易縱酒喪德故文王専誥教之有正有官守者有事有職業者無毋同彛常也毋常于酒其飲惟于祭祀之時然亦必以德將之無至于醉也纂疏陳氏大猷曰此文王又告教庶邦庶士之小子林氏曰禁于未發之謂豫發然後禁則扞格而難勝故湯訓蒙士文王教小子穆王告幼子童孫與易養蒙一也陳氏曰有正者有正人之官以治之有事民各有業也有官則不敢飲有事則不暇飲惟祀飲福受胙也愚謂以德將之不至于醉天理足以制人欲也及亂而燕喪威儀無德以將之故耳惟曰我民迪小子惟土物愛厥心臧聰聽祖考之彛訓越小大德小子惟一文王言我民亦常訓導其子孫惟土物之愛勤稼穡服田畝無外慕則心之所守者正而善日生為子孫者亦當聰聼其祖父之常訓不可以謹酒為小德小德大德小子惟一視之可也纂疏薛氏曰糜穀為酒非愛土物也吕氏曰縱酒者多不事稼穡勤稼心臧者必不暇縱酒聼貴聰不聰則誨諄諄聼藐藐矣時縱酒者必以為小德無害于事但于大德用力足矣殊不知以酒為小德正病之根源也以為小而不戒必至縱而不止不可分彼為大德此為小德當合為一以一體視之真氏曰惟土物是愛故其心臧一溺于酒必旁求珍異以自奉其欲廣其心蠧矣是時為子孫者亦各聰聼祖考常訓訓之常則入于耳者熟聼之聰則志于心也恪故于小大德視之惟一不以謹酒為小焉以謹酒為小德則湎酒亦小過乎妹土嗣爾股肱純其藝黍稷奔走事厥考厥長肇牽車牛逺服賈用孝養厥父母厥父母慶自洗腆致用酒此武王教妹土之民也嗣續純大肇敏服事也言妹土民當嗣續汝四肢之力無有怠惰大修農工服勞田畝奔走以事其父兄或敏于貿易牽車牛逺事賈以孝養其父母父母喜慶然後可自洗腆致用酒洗以致其潔腆以致其厚也薛氏曰或大修農功或逺服商賈以養父母父母慶則汝可以用酒也纂疏孔氏曰今往當使妹土之人繼汝股肱之教為純一之行勤種黍稷奔走事其父兄農功既畢始牽車牛載其所有求易所無逺行賈賣用其所得珍異孝養其父母其父母善子之行子乃自潔厚致用酒養也王氏曰肇者既種黍稷始牽車牛也民以農為本賈為末真氏曰此土之民久染沉酣之俗繼自今宜純用股肱之力以從事于農商以養其父母兼農商言之于理為長吕氏曰前禁酒如此之嚴此復教之致用酒者教至于斷人情則不行所以閉其飲酒之門者多矣故開其一而使之有節但不可踰此節耳余氏曰惟天不畀純侵戎我國家純皆純字絶句此乃以純字屬下句何邪葵初王氏希旦曰肇訓敏不如從孔民只訓始肇修肇造皆然愚案訓純為大亦不如從孔氏訓為一此以下武王通教妹土之民與臣及康叔也何以見其用心之純以先藝黍稷後逺服賈無非續其股肱之力而其用心惟在于事考長養父母未嘗分心于他適也先用心于黍稷餘力始從事於服賈見急于務本而不急于逐末亦風俗之厚也服田者務本固惟以考養為心服賈者易逐末亦惟以孝養為心尚奚暇于縱酒哉庶士有正越庶伯君子其爾典聽朕教爾大克羞耇惟君爾乃飲食醉飽丕惟曰爾克永觀省作稽中德爾尚克羞饋祀爾乃自介用逸茲乃允惟王正事之臣茲亦惟天若元德永不忘在王家此武王教妹上之臣也伯長也曰君子者賢之也典常也羞養也言其大能養老也惟君未詳丕惟曰者大言也介助也用逸者用以宴樂也言爾能常常反觀內省使念慮之發營為之際悉稽乎中正之德而無過不及之差則德全于身而可以交於神眀矣如是則庶幾能進饋祀爾亦可自副而用晏樂也如此則信為王治事之臣如此亦惟天順元德而永不忘在王家矣案上文父母慶則可飲酒克修耇則可飲酒羞饋祀則可飲酒本欲禁絶其飲今乃反開其端者不禁之禁也聖人之教不迫而民從者此也孝養羞耇饋祀皆因其良心之發而利導之人果能盡此三者且為成德之士矣而何憂其湎酒也哉纂疏孔氏曰汝大能進老成人之道則為君矣如此汝乃飲食醉飽能稽中德則汝庶幾能進饋食于祖考矣王氏曰非耇老不敢醉飽陳氏大猷曰惟君上下疑有缺文林氏曰大能進德至于耇老則爾得以飲食醉飽蓋先王養老之禮執醬執爵割牲奉俎凡以致其醉飽耳作而稽于中德未嘗過差則庶幾能進饋食于祖考乃自助而用逸也喪德喪邦皆以為天之降威則永觀省稽中德者天安得不若其元德哉呂氏曰開人飲酒之門不過奉親養老祭祀三節皆自其良心發見處開之也陳氏經曰中者無過之謂無故而縱飲與絶人飲皆非中也惟祭祀養老孝養之時飲酒他時不得飲則不至于縱亦不至于拘此乃中德也自非觀省為逺慮安能如此縱飲一時而忘後患禁之太甚而難久行皆非永觀省也能如是則下文云云皆其效也愚謂羞耇之羞訓養羞饋祀之羞訓進不若孔注皆訓為進自介之介訓大與助皆未穩當介剛介以自守也當如介如石不以三公易其介之介自介以用逸則以介然自守之節操用之于歡然自逸之宴樂以介用逸非以逸為逸雖逸而不過矣豈至于縱酒哉此數句以稽中德為主能稽中德則無過不及飲惟見于羞饋祀而非祀不飲逸必持之以介而非介不逸以此乃可為王正事之臣中則無不正也以此天亦若其元德由中德可充之為大德也德之一字為酒誥一篇之綱領譬之數千丈渾之一寸膠也前之德將無醉後之經德德顯德馨與此之稽中德若元德實前後互相照應云王曰封我西土棐徂邦君御事小子尚克用文王教不腆于酒故我至于今克受殷之命徂往也輔佐文王往日之邦君御事小子也言文王毖酒之教其大如此纂疏真氏曰有司之不腆酒于天命何預乃以克受殷命為職此之由何也但觀幽厲陳隋之朝上下沈酣以致墜失天命則謹酒而受天命復何疑哉吳氏曰凡稱我皆武王自謂愚按蔡訓棐徂本孔注然當闕疑三篇為武王書觀故我至于今克受殷命一句可以無疑矣上文言邦君以下用文王教故武王即以我受殷命承之若以為周公之言則是用文王教之下略無一字及武王周公敢自謂我克受殷命邪我受殷命武王可自言周公不可言不待眀者而後知也王曰封我聞惟曰在昔殷先哲王迪畏天顯小民經德秉哲自成湯咸至于帝乙成王畏相惟御事厥棐有恭不敢自暇自逸矧曰其敢崇飲以商君臣之不暇逸者告康叔也殷先哲王湯也迪畏者畏之而見于行也畏天之眀命畏小民之難保經其德而不變所以處已也秉其哲而不惑所以用人也湯之垂統如此故自湯至于帝乙賢聖之君六七作雖世代不同而皆能成就君德敬畏輔相故當時御事之臣亦皆盡忠輔翼而有責難之恭自暇自逸猶且不敢況曰其敢尚飲乎纂疏唐孔氏曰周受命于殷兼衛居殷地故舉殷代以酒興亡為戒陳氏大猷曰經德秉哲乃畏天畏民之實王氏炎曰御事猶言治事凡經言御事兼小大之臣皆可稱也真氏曰此章乃一篇之根本凡人敬則不縱欲縱欲則不敬商之君臣既一于敬舉天下之物欲不足以動之况荒敗于酒乎此正天理人欲相為消長之幾也愚謂上文言周受殷命故舉殷之以酒興亡以為戒此先言殷先王以不湎酒而興也迪畏以下數句與崇飲相反迪畏天民則常若上帝之臨汝常見小人之難保敢縱酒乎一縱酒則玩而不知畏天顯雖可畏酣飲則不暇顧小民雖可畏酣飲則不暇恤矣常其德持其哲則有守而不昏必不縱酒一縱酒則酗于酒德而所守變荒迷于酒而所見昏矣畏相棐恭不暇不逸則有敬畏無暇逸必不縱酒一縱酒則君臣淪胥醺酣之場而荒鴆逸豫不暇顧矣商人以尚敬為法尚飲為戒曰畏曰恭皆尚敬之謂也尚敬則百善成尚飲則百邪生越在外服侯甸男衛邦伯越在內服百僚庶尹惟亞惟服宗工越百姓里居罔敢湎于酒不惟不敢亦不暇惟助成王德顯越尹人祗辟自御事而下在外服則有侯甸男衛諸侯與其長伯在內服則有百僚庶尹惟亞惟服宗工國中百姓與夫里居者亦皆不敢沈湎于酒不惟不敢亦不暇不敢者有所畏不暇者有所勉惟欲上以助成君德而使之昭著下以助尹人祗辟而使之益不怠耳成王顧上文成王而言祗辟顧上文有恭而言呂氏曰尹人者百官諸侯之長也指上文御事而言纂疏陳氏大猷曰越及也內服畿內庶尹衆官之正樂正酒正之類亞次大夫服奔走服事之人下士府史之屬宗工尊官及百官族姓不仕居里者朝廷邦國君臣風化如此不敢者畏而不敢縱耳不暇則有職者勤于職無職者勤于德縱之為亦不為也祇辟敬君也陳氏經曰商先王以迪畏為心已之所行此畏子孫之所遵此畏羣臣之所效法無非此畏不惟王朝御事為然外服之諸侯內服之百官里居之百姓莫不然君臣上下內外無一不在敬畏中不惟不敢飲亦不暇飲所以不暇者何事上以輔成君德之顯眀下以盡正人之道而自敬其法而已矣愚謂此一節當合上一節為一章言商先王之前後君臣內外一皆以敬畏修德為心故不暇湎酒而興欲康叔法其所以興也我聞亦惟曰在今後嗣王酣身厥命罔顯于民祗保越怨不易誕惟厥縱淫泆于非彛用燕喪威儀民罔不衋傷心惟荒腆于酒不惟自息乃逸厥心疾狠不克畏死辜在商邑越殷國滅無罹弗惟德馨香祀登聞于天誕惟民怨庶羣自酒腥聞在上故天降喪于殷罔愛于殷惟逸天非虐惟民自速辜以商受荒腆于酒者告康叔也後嗣王受也受沈酣其身昏迷于政命令不著于民其所祗保者惟在于作怨之事不肯悛改大惟縱淫泆于非彛泰誓所謂竒技淫巧也燕安也用安逸而喪其威儀史記受為酒池肉林使男女祼而相逐其威儀之喪如此此民所以無不痛傷其心悼國之將亡也而受方且荒怠益厚于酒不思自息其逸力行無度其心疾狠雖殺身而不畏也辜在商邑雖滅國而不憂也弗事上帝無馨香之德以格天大惟民怨惟羣酗腥穢之德以聞于上故上天降喪于殷無有眷愛之意者亦惟受縱逸故也天豈虐殷惟殷人酗酒自速其辜爾曰民者猶曰先民君臣之通稱也纂疏蘇氏曰祗適也愚謂此言紂以湎酒而亡欲康叔戒其所以亡也此章與前多相反以相應前曰祀茲酒此言弗惟德馨香祀庶羣自酒腥聞于上設酒初意本以祭祀今不用于祭祀而惟用于羣飲無馨香之聞而惟腥穢之聞不亡何待前曰天降喪小大邦用喪罔非酒惟辜此曰天降喪于殷惟民自速辜前乃泛言其理此専指殷亡之事以實其說也前曰自介用逸繼曰不敢自逸此又曰不惟自息乃逸罔愛于殷惟逸自介用逸以介用逸也自息乃逸惟逸以逸為逸也使不以剛介之介訓之而但曰大曰助則與此所云逸者何以異哉王曰封豫不惟若茲多誥古人有言曰人無於水監當於民監今惟殷墜厥命我其可不大監撫于時我不惟如此多言所以言湯言受如此其詳者古人謂人無于水監水能見人之妍醜而已當于民監則其得失可知今殷民自速辜既墜厥命矣我其可不以殷民之失為大監戒以撫安斯時乎纂疏愚謂此總結上文殷先王後嗣王兩章欲今日監之以起下章之意豫惟曰汝劼毖殷獻臣侯甸男衛矧太史友內史友越獻臣百宗工矧惟爾事服休服采矧惟若疇圻父薄違農父若保宏父定辟矧汝剛制于酒劼用力也汝當用力戒謹殷之賢臣與鄰國之侯甸男衛使之不湎于酒也毖殷獻臣侯甸男衛與文王毖庶邦庶士同義殷之賢臣諸侯固欲知所謹矣況太史掌六典八法八則內史掌八柄之法汝之所友者及其賢臣百寮大臣可不謹於酒乎太史內史獻臣百宗工固欲知所謹矣況爾之所事服休坐而論道之臣服采起而作事之臣可不謹于酒乎曰友曰事者國君有所友有所事也然盛德有不可友者故孟子曰古之人曰事之云乎豈曰友之云乎服休服采固欲知所謹矣況爾之疇匹而位三卿者若圻父迫逐違命者乎若農父之順保萬民者乎若宏父之制其經界以定法者乎皆不可不謹于酒也圻父政官司馬也主封圻農父教官司徒也主農宏父事官司空也主廓地居民謂之父者尊之也先言圻父者制殷人湎酒以政為急也圻父農父宏父固欲知所謹矣況汝之身所以為一國之視效者可不謹于酒乎故曰矧汝剛制于酒剛制亦劼毖之意剛果用力以制之也此章自逺而近自卑而尊等而上之則欲其自康叔之身始以是為治孰能禦之而況毖于酒德也哉纂疏因論㸃書曰人說荆公穿鑿只是好處也用還他且如矧惟若疇止定辟古注從父字絶句荆公從違保辟絶句敻出諸儒之表王氏曰殷獻臣謂嘗仕商而今里居者侯甸男衛諸侯接於衛者服休以德為事謂在位者服采以事為事謂在職者戒康叔劼毖所賔所友所事之人相與以毖于酒林氏曰康叔為諸侯長故及侯甸男衛獻臣百宗工此周賢臣之致仕里居者薛氏曰二史掌邦法在王朝則二冢宰在侯國則居賔友之地陳氏傅良曰諸侯有大史無內史內史惟天子有之此內史商故臣叔所當視為友者也王氏雱曰服休以德為事休德也作德日休是也服采以事為事采事也若豫采是也蘇氏曰酒非剛者不能制吕氏曰剛制二字最有力時酒之為害深泛泛悠悠則不能制愚謂剛制亦劼毖之意而用力加重焉亦自介意也此章四矧字一節重於一節所任愈重則所戒愈嚴劼毖以上所戒敕言剛制以已所檢制言在羣臣則當謹上之戒在康叔則當防已之欲嚴於身以率其下也厥或誥曰羣飲汝勿佚盡執拘以歸于周豫其殺羣飲者商民羣聚而飲為姦惡者也佚失也其者未定辭也蘇氏曰豫其殺者未必殺也猶今法曰當斬者皆具獄以待命不必死也然必立法者欲人畏而不敢犯也羣飲蓋亦當時之法有羣聚飲酒謀為大姦者其詳不可得而聞矣如今之法有曰夜聚曉散者皆死罪蓋聚而為妖逆者也使後世不知其詳而徒聞其名凡民夜相過者輒殺之可乎纂疏孔氏曰我其擇最重者而殺之劉氏􅡃曰此書不責商民之湎淫而責在位之躬化自矧太史友以下皆康叔之百官有司也曰羣飲指此等也使民為羣飲康叔以國君治之何所不可而何必歸于京師乎執歸于周恐叔之專殺豫其殺嚴為之刑而未必殺也忠厚之意寓于嚴厲之言為一篇始終皆以在位者為言解者盡以民言之過矣又惟殷之迪諸臣惟工乃湎于酒勿庸殺之姑惟教之殷受導迪為惡之諸臣百工雖湎于酒未能遽革而非羣聚為姦惡者無庸殺之且惟教之纂疏董氏鼎曰殷臣湎酒者勿殺而姑教之以其染惡深而被化淺也有斯眀享乃不用我教辭惟我一人弗恤弗蠲乃事時同于殺有者不忘之也斯此也指教辭而言享上享下之享言殷諸臣百工不忘教辭不湎于酒我則眀享之其不用我教辭惟我一人不恤于汝弗潔汝事時則同汝于羣飲誅殺之罪矣纂疏吕氏曰明享彰眀使享祿位示勸也夏氏曰有此酒將以眀潔為享祀用非為羣飲設也如文王毖庶邦謂祀茲酒也如此教之乃不用我教辭時則可與羣飲者同殺矣愚謂有斯如左傳所謂君若辱有寡君此三節若嚴刻而實無所不用其忠厚也王曰封汝典聼朕毖勿辨乃司民湎于酒辨治也乃司有司也即上文諸臣百工之類言康叔不治其諸臣百工之湎酒則民之湎酒者不可禁矣纂疏孔氏曰辨使也勿使汝所司之民沉湎于酒唐孔氏曰勿使汝所司民之吏沉湎于酒吏當正身以率民也愚謂汝當常主于聼我毖慎之言也酒誥一篇終始以毖慎言始曰厥誥毖庶邦庶士將終曰劼毖殷獻臣篇終又曰汝典聼朕毖毖之一辭一篇三致意又提其要以致諄切之訓云末八字恐有脫誤不若缺之梓材亦武王誥康叔之書諭以治國之理欲其通上下之情寬刑辟之用而篇中有梓材二字比稽田作室為雅故以為簡編之别非有他義也今文古文皆有案此篇多不類自今王惟曰以下若人臣進戒之辭以書例推之曰今王惟曰者猶洛誥之今王即命曰也肆王惟德用者猶召誥之肆惟王其疾敬德王其德之用也已若茲監者猶無逸嗣王其監于茲也惟王子子孫孫永保民者猶召誥惟王受命無疆惟休也反覆參考與周公召公進戒之言若出一口意者此篇得于簡編斷爛之中文既不全而進戒爛簡有用眀德之語編書者以與罔厲殺人等意合又武王之誥有曰王曰監云者而進戒之書亦有曰王曰監云者遂以為文意相屬編次其後而不知前之所謂王者指先王而言非若今王之為自稱也後之所謂監者乃監視之監而非啓監之監也其非命康叔之書亦眀矣讀書者優遊涵泳沉潜反覆繹其文義審其語脉一篇之中前則尊諭卑之辭後則臣告君之語蓋有不可得而强合者矣纂疏吳才老考究得梓材只前面是告戒臣下其後恐别是一篇不應王告臣下不稱朕豫而自稱王斷簡殘編無從考正只得子言語句讀中有不曉者缺之又曰梓材後半篇又不知何處録得來此與他人言皆不領嘗與陳同父言陳曰每嘗讀亦不覺今思之誠然吳才老辨梓材後半截不是梓材乃臣告君之辭未嘗如前一半稱王曰又稱汝為上告下之辭亦有此理又說梓材是洛誥中書甚好其他文字亦有錯亂而移易得好者然無如才老此樣處恰恰好王曰封以厥庶民暨厥臣逹大家以厥臣逹王惟邦君大家巨室也孟子曰為政不難不得罪於巨室孔氏曰卿大夫及都家也以厥庶民暨厥臣逹大家則下之情無不通矣以厥臣逹王則上之情無不通矣王言臣而不言民者率土之濵莫非王臣也邦君上有天子下有大家能通上下之情而使之無間者惟邦君也纂疏陳氏大猷曰大家如晉六卿魯三家齊諸田楚昭屈景之屬左氏載封康叔以殷民七族陶氏至終葵氏即衛之大家也大家之情與國君常踈與國之臣民常親蓋臣民素服屬于大家而大家之强阻亦臣民擁助之國君能撫其臣民由臣民以逹其情于天子而邦君之責盡矣吕氏曰自康叔言則有臣民大家三等自王言之則率土皆王臣但言厥臣皆在其中矣愚謂邦君處上下之間逹王必自逹大家始通上下之情其機括在大家得罪于大家巨室者不公正而無以服其心也此難以强力服而可以公心化以邦君一人公正之心能通乎一國臣民千萬人之心由之以通乎大家之心則以其下逹者而上逹其流通無滯礙也必矣汝若恆越曰我有師師司徒司馬司空尹旅曰豫罔厲殺人亦厥君先敬勞肆徂厥敬勞肆往姦宄殺人歷人宥肆亦見厥君事戕敗人宥恆常也師師以官師為師也尹正官之長旅衆大夫也敬勞恭敬勞來也徂往也歷人者罪人所過律所謂知情藏匿資給也戕敗者毁傷四肢面目漢律所謂疻也此章文多未詳纂疏書康誥梓材洛誥諸篇有不可曉者今人都强解去伯恭亦是如此說書自首至尾皆無一字理會不得如亦厥君先敬勞至戕敗人宥之類都不成文理不可曉愚案此一節自當闕之今姑采合諸說解之曰汝若常發越謂羣臣言我有交相師師之三卿與正長之尹衆大夫之旅我意言我欲無虐殺人耳亦以其君先恭敬勞來其民為臣者遂往效君以敬勞遂與往日為姦宄者殺人者罪人所經歷者今皆寬宥與之為新羣臣遂亦見其君之事凡戕傷人毁敗人物者亦寬宥之矣君宥其大者臣亦宥其小者大意欲康叔率其臣以戒虐殺施寬宥也王啓監厥亂為民曰無胥戕無胥虐至于敬寡至于屬婦合由以容王其效邦君越御事厥命曷以引養引恬自古王若茲監罔攸辟監三監之監康叔所封亦受畿內之民當時亦謂之監故武王以先王啓監意而告之也言王者所以開置監國者其治本為民而已其命監之辭蓋曰無相與戕殺其民無相與虐害其民人之寡弱者則哀敬之使不失其所婦之窮獨者則聨屬之使有所歸保合其民率由是而容蓄之也且王所以責效邦君御事者其命何以哉亦惟欲其引掖斯民於生養安全之地而已自古王者之命監若此汝今為監其無所用乎刑辟以戕虐人可也纂疏陳氏大猷曰周禮建牧立伯以維邦國立左右監自黃帝已然監乃諸侯之長也康叔孟侯衛亦方伯連率故稱效之為監案陳說勝受畿內民之說吕氏曰效如效馬羊致也致之邦君愚謂三篇意相承而相濟康叔又為司寇故命之多及于刑康誥于眀德慎罰悉矣不得已而云速由文王罰刑速由茲義率殺酒誥又懲羣飲而曰豫其殺同于殺皆非得已也逮梓材告戒終矣慮康叔因前二篇屢及于殺而或輕于刑也故此篇惟以尚寬宥無刑辟為言仁哉武王其舜刑期無刑之心歟惟曰若稽田既勤敷菑惟其陳修為厥疆畎若作室家既勤垣墉惟其塗塈茨若作梓材既勤朴斫惟其塗丹雘稽治也敷菑廣去草棘也疆畔也畎通水渠也塗塈泥飾也茨蓋也梓良材可為器者雘采色之名敷菑以喻除惡垣墉以喻立國朴斫以喻制度武王之所已為也疆畎塈茨丹雘則望康叔以成終云爾纂疏梓材有可疑者如稽田垣墉之喻却與無胥戕無胥虐之類不相似欲至於萬年惟王子子孫孫永保民却又似洛誥之文陳氏大猷曰敷開墾也爾雅田一嵗曰菑菑始去草也周禮廣尺深尺曰畎馬氏曰卑曰垣髙曰墉說文塈仰塗也范寧曰茨茅蓋屋也陳氏曰具粗曰朴致巧曰斫唐孔氏曰雘采色名有青有朱丹雘則朱色者就愚謂三者之譬謂武王既盡勞以始之叔當因舊成潤飾以終之不可變成規而隳前功也今王惟曰先王既勤用眀德懷為夾庶邦享作兄弟方來亦既用眀德后式典集庶邦丕享先王文王武王也夾近也懷逺為近也兄弟言友愛也泰誓曰友邦冢君方來者方方而來也既盡也先王盡勤用眀德而懷來于上諸侯亦盡用眀德而視效于下也后後王也式用也典舊典也集和輯也此章以後若臣下進戒之辭疑簡脫誤于此纂疏唐孔氏曰夾者人左右而夾之故言近夾音協左氏以夾輔周室音甲陳氏曰人心尊君親上之天惟用眀德足以感動之愚謂自此以後朱子既以為他書錯簡誤綴在此則解說者不當復以為武王命康叔只云臣告君可也皇天既付中國民越厥疆土于先王越及也皇天既付中國民及其疆土于先王也纂疏尚書句讀有長者如皇天既付中國民越厥疆土于先王是一句肆王惟德用和懌先後迷民用懌先王受命肆今也德用用眀德也和懌和悅之也先後勞來之也迷民迷惑染惡之民也命天命也用慰悅先王之克受天命者也纂疏陳氏大猷曰迷民未率故王惟用德以和之使不乖懌之使不怨先以引于前後以助于後不惟以悅民心亦所以悅先王受命之心愚案訓肆為今不若云肆故也遂也朱子謂為承上起下之辭書中肆字在句首者如肆類于上帝肆嗣王丕承基緒肆惟王其疾敬德與上文肆往姦宄肆亦見厥君事皆故與遂之意耳舊讀肆字連上句者尤非又眀德者人心虗靈不昧之理無上下之間亦無前後之間先王所勤用以懷諸侯諸侯所既用以享天子均用此眀德也何上下之間乎王惟德用德即所謂眀德後王所用以懌迷民及用以懌受命亦無非用此眀德也何前後之間乎已若茲監惟曰欲至于萬年惟王子子孫孫永保民已語辭監視也此人臣祈君永命之辭也案梓材有自古王若茲監罔攸辟之言而編書者誤以監為句讀而爛簡適有已若茲監之語以為語意相類合為一篇而不知其句讀之本不同文意之本不類也孔氏依阿其說于篇意無所發眀王氏謂成王自言必稱王者以覲禮考之天子以正遏諸侯則稱王亦强釋難通獨吳氏以為誤簡者為得之但謂王啓監以下即非武王之誥則未必然也纂疏愚謂曰萬年惟王若止于長有天下曰子子孫孫永保民則欲世王之久安天下也意實公天下而非私于王家人臣祈天永命忠愛無窮之心歟此篇只以殘編錯簡讀之庶免穿鑿書集傳纂疏卷四下
