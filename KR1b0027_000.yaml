body:
  text: 尚書集傳纂疏書類提要臣等謹案尚書集傳纂疏六卷元陳櫟撰櫟字夀翁號定宇休寧人宋亡之後隐居三十八年至延祐甲寅年六十三復出應試中浙江鄉試以病不及㑹試越二年上書干執政不報遂終於家年八十有三事迹具元史儒學傳董鼎書傳纂註所稱新安陳氏即其人也是編以疏通蔡傳之意故命曰䟽以纂輯諸家之説故命曰纂又以蔡傳本出朱子指授故第一卷特標朱子訂正之目每條之下必以朱子之説冠於諸家之前間附己意則題曰愚謂以别之考櫟别有書説折衷成於此書之前今已散佚惟其序尚載定宇集中稱朱子説書通其可通不强通其所難通而蔡氏於難通罕闕焉宗師説者固多異之者亦不少予因訓子遂掇朱子大㫖及諸家之得經本義者句釋於下異同之説低一字折衷之則櫟之説書亦未嘗株守蔡傳而是書之作乃於蔡傳有所増補無所駁正與其舊説迥殊自序稱聖朝科舉興行諸經四書一是以朱子為宗書宗蔡傳固亦宜然云云蓋延祐設科以後功令如斯故不敢有所出入也乾隆四十四年六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:e3bcd62699d889cfde0abcee789ebd31f4043579616e7ceff96988d8e921b74d
